# omp models.yml — cloud-only via local Ollama proxy
# Provider: local Ollama daemon (localhost:11434), authenticated to the user's
# Ollama account — :cloud model IDs route to Ollama Cloud, no key needed here
# (nothing sensitive is versioned in this public repo).
# Mirrors the Hefesto Hermes profile: default=glm-5.3, minions=glm-5.3-flash,
# architect/planner=kimi-k3.

providers:
  ollama:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-completions
    auth: none
    models:
    - id: glm-5.3:cloud
      name: GLM 5.3
      description: >-
        GLM 5.3 — senior programmer model. Same role as Hefesto's main
        model: implementation, routine debugging, test writing.
      reasoning: true
      input:
      - text
      contextWindow: 1048576
      maxTokens: 32768
      thinking:
        mode: effort
        efforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
    - id: glm-5.3-flash:cloud
      name: GLM 5.3 Flash
      description: >-
        GLM 5.3 Flash — fast, cheap, vision-capable. The minion model:
        exploratory scans, boilerplate, parallel subtasks. Same model as
        the Hermes default profile.
      reasoning: true
      input:
      - text
      - image
      contextWindow: 1048576
      maxTokens: 32768
      thinking:
        mode: effort
        efforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
    - id: kimi-k3:cloud
      name: Kimi K3
      description: >-
        Kimi K3 — frontier reasoner, the Master Architect. Plan critique,
        design review, gnarly cross-module debugging. Expensive — reserve
        for high-stakes planning (see config.yml roles).
      reasoning: true
      input:
      - text
      - image
      contextWindow: 1048576
      maxTokens: 32768
      thinking:
        mode: effort
        efforts:
        - minimal
        - low
        - medium
        - high
        - xhigh