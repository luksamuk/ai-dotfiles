# omp config.yml — roles mirroring the Hefesto Hermes profile
# default = GLM 5.3 (senior programmer, same as Hefesto's main model)
# plan/advisor/slow = Kimi K3 (Master Architect — expensive, used for critique)
# everything else = GLM 5.3 Flash (minion model — fast, cheap, vision)

setupVersion: 1
defaultThinkingLevel: medium
modelRoles:
  default: ollama/glm-5.3:cloud
  smol: ollama/glm-5.3-flash:cloud
  slow: ollama/kimi-k3:cloud
  vision: ollama/glm-5.3-flash:cloud
  plan: ollama/kimi-k3:cloud
  designer: ollama/glm-5.3-flash:cloud
  commit: ollama/glm-5.3-flash:cloud
  tiny: ollama/glm-5.3-flash:cloud
  task: ollama/glm-5.3-flash:cloud
  advisor: ollama/kimi-k3:cloud
compaction:
  strategy: context-full
task:
  maxConcurrency: 1
  batch: false
  maxRecursionDepth: 1