[model]
default = "lfm2.5-24b-a2b"

[model.query]
model = "bonsai2-9b"
tools = true

[model.chat]
model = "lfm2.5-24b-a2b"
tools = true

[model.summarize]
model = "lfm2.5-24b-a2b"
thinking = false
tools = false

[model.translate]
model = "translategemma-4b"
thinking = false
tools = false

# --- CODE MODE ---
[model.code]
model = "ornith-1.5-35b"
thinking = true
tools = true

# --- VISION MODE ---
[model.vision]
model = "lfm2.5-vl-3b"
tools = false

[model.ocr]
model = "glm-ocr"
tools = false

[tools]
blacklist = []

[output]
plain_default = false
verbosity = "normal"

[display]
skin = "dark"
show_tool_calls = true

# This one should be deprecated!
[led]
ip = "192.168.3.21"
port = 80

[facts]
auto_extract = true
auto_extract_notify = true
max_facts = 3
semantic_threshold = 0.70

[feedback]
access_reinforcement = true
access_reinforcement_boost = 0.001
content_decay = true
content_prune_threshold = 0.05
decay_half_life_bad = 7
decay_half_life_correction = 14
decay_half_life_good = 30
enabled = true
implicit_capture = true
llm_feedback_weight = 0.3

[retrieval]
keyword_weight = 0.4
semantic_weight = 0.6

[thinking_trace]
enabled = false

# =============================================================================
# INDEXING CONFIGURATION (W2 #121 — REQUIRED)
# =============================================================================

[indexing]
# Embedding model alias (key in models.toml [models.*]). Required.
# The alias must be declared with `embeddings = true` and
# `dimensions = N` in models.toml. The provider is inferred from
# the alias — no provider override here.
# 06/10/2026: trocado de nemotron-3-embed-1b (2048d) p/ embeddinggemma-2 (768d MRL).
# A/B 06/10: MRR 1.0/1.0, STS rho .94/.94, query CPU 23ms vs 104ms. Diffs .bak-20261006-eg2.
model = "embeddinggemma-2"

# Prefix prepended to each text before embedding.
# eg2 usa task-steering DIFERENTE p/ query vs doc ("task: search result |
# query:" vs "title: t | text: c") — o sprach tem UM prefix global só.
# README: omitir o prefix "works but reduces precision". Com prefix único
# global, "" é o menos errado (não etiqueta documento como query nem vice-versa).
prefix = ""

# Probe /v1/embeddings at startup to verify the model is served.
# When true (default), sprach makes 1 POST /v1/embeddings call.
# The probe does NOT pass `dimensions` in the request body
# (adaptive — some providers reject it); the response's vector
# dim count is compared against the alias's declared `dimensions`.
# Mismatch is a fatal error.
probe = true

# RRF weights (moved from the old [retrieval] section).
keyword_weight = 0.4
semantic_weight = 0.6
