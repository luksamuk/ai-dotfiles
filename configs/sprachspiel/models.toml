# models.toml — aliases de modelo do sprachspiel
# SYNC FROTA 08/11: fonte da verdade = llama-swap /v1/models (grupos listed;
# lanes 'unlisted: true' = GGUF deletado nao contam). Clouds verificados com
# `ollama list` no mesmo dia. Samplers: sprachspiel so envia temperature/top_p
# (top_k/repeat_penalty sairam do schema); lanes com stripParams de temp/top_p
# os descartam, entao entradas sem sampler = samplers pinados no server.

[provider."ollama"]
kind = "openai"
base_url = "http://127.0.0.1:11434/v1"
read_timeout_secs = 900
stream_idle_timeout_secs = 900

[provider."llama-swap"]
kind = "openai"
base_url = "http://localhost:12434/v1"
read_timeout_secs = 900
stream_idle_timeout_secs = 900

# --- CHAT / DEFAULT / QUERY / SUMMARIZE (decreto do dono 08/11) ---

# Spark X2.6 4B (agentic de fabrica, 42-44 t/s @131K). Lane pin enable_thinking
# true (o modo thinking-none do card responde em chines — sempre pensa).
# Samplers pinados no server (0.7/0.95): stripParams temp/top_p/top_k.
# NOTA de esforco: o sprachspiel nao tem campo de effort (envia reasoning_effort
# fixo "medium" so quando thinking=true no role) — summarize segue thinking=false
# no config.toml e pega o default da lane.
[models."spark-x2.6-4b"]
provider = "llama-swap"
model_id = "spark-x2.6-4b"
num_ctx = 114688
thinking = true
tools = true

# --- GROOT 19B A3B (GrootTeam MoE 19B/3B ativos, descendente Qwen3.6-35B-A3B) ---
# Think pinado na lane (presence 1.5; samplers 1.0/0.95/top_k 20 no server).

[models."groot-19b-a3b"]
provider = "llama-swap"
model_id = "groot-19b-a3b"
num_ctx = 262144
thinking = true
tools = true

[models."groot-19b-a3b-fast"]
provider = "llama-swap"
model_id = "groot-19b-a3b-fast"
num_ctx = 131072
thinking = true
tools = true

# --- S5-NANO (Maritaca, pt-BR nativo, placar BR 83.74; ik, 131K) ---
# Always-think (lane --reasoning on). Tools ENGATAM no fio mas SEM prova
# agêntica real — manter false ate o catalogo virar.
[models."s5-nano"]
provider = "llama-swap"
model_id = "s5-nano"
num_ctx = 131072
thinking = true
tools = false

# --- LFM3 1.7B (tri-hybrid, decensurado, dual-mode, 75 t/s decode) ---
# Samplers do vendor pinados na lane (0.1/50/1.1). O dual-mode do vendor e via
