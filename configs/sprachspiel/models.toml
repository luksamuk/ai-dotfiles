# --- EMBEDDINGS ---
# ATENCAO: o index do DB (config.toml [embeddings]) e o embeddinggemma-2 (768d);
# so reindexar com o MESMO modelo. ColBERT e reranker (MaxSim; OAI endpoint
# entregue 128d mean-pool — dimensoes/ctx menores: NAO usar para o index).

[models."embeddinggemma-2"]
