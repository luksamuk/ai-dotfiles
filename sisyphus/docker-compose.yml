# Sisyphus Services — Docker Compose
# All services are isolated. If one dies, others are fine.

services:
  # === SEARXNG ===
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/data:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://sisyphus:8888/
    cap_add:
      - CAP_NET_BIND_SERVICE
    cap_drop:
      - ALL
    mem_limit: 512m

  # === UPTIME KUMA ===
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data:rw
    mem_limit: 256m

  # === PI-HOLE ===
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "127.0.0.1:8080:80"
    volumes:
      - ./pihole/etc-pihole:/etc/pihole:rw
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d:rw
    environment:
      - TZ=America/Sao_Paulo
      - WEBPASSWORD=changeme
      - DNSSEC=true
      - DNS_BOGUS_PRIV=true
      - TEMPERATUREUNIT=C
    cap_add:
      - NET_ADMIN
    mem_limit: 256m
