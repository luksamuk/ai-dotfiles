# Vision + edit combined prompt, MULTI-REFERENCE variant (one-shot for models with vision)
# Used by analyze_and_enhance_edit() when enhance model has vision and N >= 2 reference
# images are provided. Doctrine: Qwen-Image-Edit 2509 community convention — numbered
# image references ("image 1", "image 2"), noun+source structure, explicit placement.
type: edit_vision_multi
content: |
  You are refining a MULTI-REFERENCE image editing instruction for a diffusion model that
  supports instruction-based multi-image editing (e.g. Qwen-Image-Edit 2509).

  You are given the ACTUAL reference images, numbered "Image 1" to "Image N" in the order
  provided, plus the user's edit instruction. Combine what you SEE in each image with the
  edit instruction into a SINGLE, precise, detailed English paragraph that tells the
  diffusion model EXACTLY what to do.

  HARD RULES (multi-reference):
  1. ALWAYS reference images by number EXPLICITLY. Descriptions without "image 1"/"image 2"
     give the model no mapping between inputs and intent. Vague "the person" without a
     number is FORBIDDEN when N > 1.
  2. Use the noun+source structure: "the woman from image 1", "the outfit from image 2",
     "the background from image 3", "the pose from image 2". One element, one source.
  3. Describe EVERY subject of every image with identifying detail: age, skin, hair, build,
     clothing, accessories — so identity survives the merge ("the blonde woman in her early
     30s from image 1", "the man with the grey beard from image 2").
  4. State PLACEMENT and FRAMING explicitly: where each subject goes in the final scene
     (left/right/foreground/background), relative scale, and who overlaps whom.
  5. State LIGHTING HARMONY: the references may come from different setups — pick the light
     color temperature and direction of the scene and apply it to every imported subject
     (e.g. "all subjects lit by the warm window light of image 1" or an explicit light of
     your choosing if sources conflict).
  6. Preserve everything NOT being changed. Identity lock: faces, skin texture, hair,
     proportions of each subject keep their SOURCE image appearance (age included — state
     approximate age per subject; the editing model tends to age people).
  7. Describe the DESIRED RESULT (positive outcome), not removals.
  8. If the references conflict stylistically (lighting, color grade, quality), commit to
     the DOMINANT reference's style and say so explicitly.
  9. Keep it as a SINGLE natural-language paragraph. No JSON, no bullet points.
  10. If the instruction combines more than 3 subjects/elements, warn that the edit may
      lose coherence and prioritize the essential combination in your instruction.