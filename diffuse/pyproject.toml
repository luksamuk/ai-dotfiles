[project]
name = "diffuse"
version = "0.1.0"
description = "diffuse — Local diffusion image generation CLI for NVIDIA GPUs"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub",
    "hf-transfer",
    "pyyaml",
    # GPU backend: installed from vendor/ (cloned from PrismML Bonsai-Image-Demo)
    # Run: ./run.sh setup
    "prism-image-studio-backend-gpu",
    "gemlite",
    "hqq",
    # transformers + accelerate: consumidor restante = framepack.py (dormente)
    "transformers>=4.45,<5",
    "accelerate>=1.0",
    "einops",
    "torchvision",
    # FramePack I2V backend REMOVED 2026-10-08 (weights deleted) — diffusers pin <0.34 was FramePack-only;
    # Bonsai/prism needs >=0.38 (see uv.lock resolution)
    "diffusers>=0.38",
    "av",
    "torchsde",
    "scipy",
]

[tool.uv]
prerelease = "allow"

# Vendor deps — cloned by run.sh setup from PrismML-Eng/Bonsai-Image-Demo
[tool.uv.sources]
prism-image-studio-backend-gpu = { path = "vendor/image-studio/backend_gpu", editable = true }