- id: agent-default-model
  config:
    provider: llama-swap
    model: cyber-tiel-coder
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    fetchProvider: http
    searchProvider: searxng
- id: web-deepseek-api
  disabled: true
- insert:
  - id: mcp-craft
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: craft
      transport: stdio
      command: /home/alchemist/.var/app/ai.storyteller.artcraft-launcher/config/ArtCraft/mcp/bin/craft-ai-mcp
      args: [--stdio]
      failOnStartupError: true

- insert:
  - id: mcp-cua
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: cua
      transport: stdio
      command: cua-driver
      args: [mcp]
      env:
        CUA_DRIVER_RS_ENABLE_WAYLAND: '1'
      failOnStartupError: true

- insert:
  - id: mcp-pesquisarr
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: pesquisarr
      transport: streamable-http
      url: http://100.72.245.16:8895/api/mcp
      failOnStartupError: true
