# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      ollama:
        displayName: Ollama
        api: openai-responses
        baseURL: http://localhost:11434/v1
        models:
        - id: deepseek-v4.1-flash:cloud
          name: DeepSeek v4.1 Flash
        - id: glm-5.3:cloud
          name: GLM 5.3
        - id: glm-5.3-flash:cloud
          name: GLM 5.3 Flash
        - id: kimi-k3:cloud
          name: Kimi K3
        - id: glm-5.2:cloud
          name: GLM 5.2
        - id: kimi-k2.7-code:cloud
          name: Kimi K2.7 Code
        - id: nemotron-3-ultra:cloud
          name: Nemotron 3 Ultra
        - id: minimax-m3:cloud
          name: MiniMax M3
        - id: deepseek-v4-pro:cloud
          name: DeepSeek v4 Pro
        - id: kimi-k2.6:cloud
          name: Kimi K2.6
        - id: nemotron-3-nano:30b-cloud
          name: Nemotron 3 Nano 30B
        - id: gemma4:31b-cloud
          name: Gemma 4 31B
        - id: minimax-m2.7:cloud
          name: MiniMax M2.7
        - id: nemotron-3-super:cloud
          name: Nemotron 3 Super
        apiKeyEnv: OLLAMA_API_KEY
      llama-swap:
        displayName: Llama-Swap
        api: openai-responses
        baseURL: http://localhost:12434
        models:
        - id: sensenova-loop-9b
          contextWindow: 16384
        - id: cyber-tiel-coder
          reasoningEfforts:
            off: off
            low: low
            medium: medium
            high: high
            xhigh: xhigh
          input:
          - text
          - image
          contextWindow: 200000
        - id: cyber-tiel-coder-fast
          reasoningEfforts:
            off: off
            low: low
            medium: medium
            high: high
            xhigh: xhigh
          input:
          - text
          - image
          contextWindow: 262144
        apiKeyEnv: LLAMA_SWAP_API_KEY
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: light
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: ollama
    model: glm-5.3:cloud
- insert:
  - id: mcp-pesquisarr
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: pesquisarr
      transport: streamable-http
      url: http://100.72.245.16:8895/api/mcp
      failOnStartupError: true
