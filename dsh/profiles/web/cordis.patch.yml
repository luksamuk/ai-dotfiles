# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      llama-swap:
        api: openai-completions
        baseURL: http://127.0.0.1:12434/v1
        streamIdleTimeoutMs: 7200000
        compat: { supportsDeveloperRole: false, maxTokensField: max_tokens }
        apiKeyEnv: LLAMASWAP_LOCAL_KEY
        models:
          - id: ornith-1.5-9b-heretic
            contextWindow: 65536
            input:
              - text
              - image
              - image
          - id: lfm3-1.7b
            contextWindow: 65536
          - id: minicpm-v-4.7-35b
            contextWindow: 131072
            input:
              - text
              - image
              - image
          - id: lfm3-vl-2b
            contextWindow: 131072
            input:
              - text
              - image
              - image
          - id: lfm3-omni-2b-pollard
            contextWindow: 32768
            input:
              - text
              - image
              - image
          - id: ornith-1.5-35b-heretic
            contextWindow: 200000
            input:
              - text
              - image
              - image
          - id: ornith-1.5-35b-heretic-fast
            contextWindow: 131072
            input:
              - text
              - image
              - image
          - id: spark-x2.6-4b
            contextWindow: 114688
            reasoningEfforts:
              low: low
              high: high
          - id: translategemma-4b
            contextWindow: 131072
          - id: inkling-2-mini
            contextWindow: 73728
            reasoningEfforts:
              off: 'none'
              low: low
              medium: medium
              high: high
              xhigh: xhigh
            input:
              - text
              - image
          - id: cyber-tiel-coder
            contextWindow: 200000
            reasoningEfforts:
              off: off
              low: low
              medium: medium
              high: high
              xhigh: xhigh
            input:
              - text
              - image
              - image
          - id: groot-19b
            contextWindow: 200000
          - id: groot-19b-fast
            contextWindow: 262144
          - id: cyber-tiel-coder-fast
            contextWindow: 262144
            reasoningEfforts:
              off: off
              low: low
              medium: medium
              high: high
              xhigh: xhigh
            input:
              - text
              - image
              - image
      ollama:
        displayName: Ollama
        api: openai-responses
        baseURL: http://localhost:11434/v1
        models:
          - id: deepseek-v4.1-flash:1017-cloud
