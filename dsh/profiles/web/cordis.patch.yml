- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: dark
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: llama-swap
    model: cyber-tiel-coder
    reasoningEffort: medium
- insert:
    - id: mcp-pesquisarr
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pesquisarr
        transport: streamable-http
        url: http://100.72.245.16:8895/api/mcp
        failOnStartupError: true

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: false
  config:
    modelPolicies:
      - provider: llama-swap
        model: inkling-2-mini
        summarizationProvider: ollama
        summarizationModel: minimax-m3.1-flash:cloud

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  disabled: false
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
