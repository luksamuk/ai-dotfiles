# -------------------------------------------
# TRANSLATEGEMMA 4B — Google translation model
# Gemma 3-based, 55 languages, translation-focused
# Arch: gemma3 — supported in upstream llama.cpp
# Q4_K_M ~2.7GB (mradermacher/TranslateGemma-4B-GGUF)
# NOTE: Native Jinja template uses custom content types
#   (source_lang_code, target_lang_code) which crash
#   llama.cpp chat template parser. Use --no-jinja
#   with gemma template instead. Sprachspiel sends
#   plain text prompts, so this works fine.
# Recommended params from Ollama: temp=0.2, top_k=40, repeat_penalty=1.1
# -------------------------------------------
  "translategemma-4b":
    name: "TranslateGemma 4B"
    description: "Open translation models built on Gemma 3, helping people communicate across 55 languages. The 4B variant is optimized for mobile and edge devices."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/translategemma-4b/translategemma-4b-it.Q4_K_M.gguf
      --no-jinja
      --chat-template gemma
      --fit on
      --parallel 1
      --ctx-size ${small_model_max_ctx}
      --temp 0.2
      --top-p 0.9
      --top-k 40
      --repeat-penalty 1.1
      --cache-type-k ${small_cache_k}
      --cache-type-v ${small_cache_v}
      --flash-attn on
      --metrics
    health_check_timeout: 300
    ttl: 60
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: "~2.4 GB (Q4_K_M)"
      context: "32K-128K (dynamic)"
      vram_usage: "~3.5GB (model + cache)"
      source: "mradermacher/translategemma-4b-it-GGUF (Q4_K_M, from google/translategemma-4b-it)"
      kv_cache: "q8_0 + attn_rot"
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma3
      parameters: 3880000000
      context_length: 131072
      embedding_length: 2560
      quantization: Q4_K_M
      caveats:
        - "Native Jinja template crashes llama.cpp — must use --no-jinja --chat-template gemma"
        - "Needs explicit translation prompt (Sprachspiel format works)"
      note: "Translation model. Sprachspiel translate mode default. 55 languages."
# -------------------------------------------
# UNLIMITED-OCR - UPSTREAM BACKEND (mmproj required)
# Baidu Unlimited-OCR: DeepSeek-OCR architecture (SAM+CLIP vision tower + DeepSeek-V2 MoE text decoder)
# 3B params, specialized in one-shot long-horizon document parsing
# mmproj required: SAM+CLIP vision projector (F16, 774 MiB)
# Supports: document->markdown, plain OCR, bounding boxes, figure/chart parsing
# Prompt vocabulary: "document parsing.", "Free OCR.", "Describe this image in detail."
# Add <|grounding|> prefix for bounding box output
# Architecture: deepseek-ocr / unlimited-ocr — supported in upstream llama.cpp (#24969, #24717)
# Temperature 0 for OCR, --temp 0 for deterministic output
# KV cache: f16 (vision models need precision)
# -------------------------------------------
  "unlimited-ocr":
    name: "Unlimited OCR"
    description: "Baidu Unlimited-OCR: 3B vision-language OCR model for long-horizon document parsing. DeepSeek-OCR architecture with SAM+CLIP vision tower. Outputs structured markdown with optional bounding boxes."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/unlimited-ocr/Unlimited-OCR-Q4_K_M.gguf
      --mmproj ${models_dir}/unlimited-ocr/mmproj-Unlimited-OCR-F16.gguf
      --jinja
      --media-path ${media_path}
      -ngl 99
      --ctx-size 32768
      --parallel 1
      --temp 0
      --top-p 1.0
      --repeat-penalty 1.0
      --reasoning off
      --cache-type-k q4_0
      --cache-type-v q4_0
      --metrics
    ttl: 60
    capabilities:
      in:
        - 'text'
        - 'image'
      out:
        - 'text'
      tools: false
      reranker: false
      context: 32768
    metadata:
      architecture: deepseek-ocr
      parameters: 3000000000
      context_length: 32768
      embedding_length: 2048
      quantization: Q4_K_M
      size: "~1.9 GB (Q4_K_M) + ~774 MB mmproj (F16)"
      vram_usage: "~3.5GB (model + mmproj + f16 cache)"
      source: "sahilchachra/Unlimited-OCR-GGUF (Q4_K_M + mmproj F16)"
      kv_cache: "f16"
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      note: "Specialized OCR/document parsing model. Prompts: 'document parsing.', 'Free OCR.', '<|grounding|>Convert the document to markdown.' for bounding boxes. NOT a general chat model."
# Hooks: ações na inicialização do llama-swap
# preload: carrega modelos síncronamente antes de aceitar requests
# Ideal para vLLM (startup lento = 30-90s sem warm-up)
# NOTA: preloads desabilitados temporariamente — ocupam GPU e bloqueiam swap pra SGLang
# Para reabilitar: descomente as linhas preload abaixo
hooks:
  on_startup:
    preload: []
      # - "qwen3.5-0.8b-vllm"
      # - "lfm2.5-1.2b-vllm"

# ============================================
# SWAP MATRIX (v202+)
# ============================================
# O solver determina automaticamente qual combinação de modelos
# pode rodar simultaneamente e quais descarregar quando necessário.
#
# ⚠️ REGRA CRÍTICA DE COEXISTÊNCIA:
# Embedding e reranker (nomic, lfmemb, lfmcol) são CPU-only (~0.5GB total)
# e NÃO consomem VRAM. Devem coexistir com QUALQUER LLM — leve ou pesado.
# Todos os sets que agrupam LLMs DEVEM incluir as vars de embedding/reranker
# no & (AND). Se uma var de embedding falta de um set, o solver trata
# o embedding e o LLM como mutuamente exclusivos, causando ping-pong
# de eviction (embedding evicta LLM cost 9+, LLM evicta embedding cost 1).
#
# Exemplo: heavy: "(qw36 | orn35) & (nomic | lfmemb | lfmcol)"
# Veja references/new-model-workflow.md §6 para detalhes completos.
# ============================================

matrix:
  vars:
    # Modelos pequenos
    q4: qwen3.5-4b
    # m5a: minicpm5-1b-agentic  # disabled
    lfm8: lfm2.5-8b-a1b
    lfm26: lfm2.5-2.6b
    nb42: nanbeige4.2-3b
    # Portal 2 personality cores (conversational, Q8_0)
    # inst: instella-moe-16b  # disabled
    # Vision
    ocr: glm-ocr
    uocr: unlimited-ocr
    qwvl: qwen3-vl-4b
    # Modelos médios
    q9: qwen3.5-9b
    g4: gemma4-e2b
    # Pesados (offload)
    aw: agentworld-35b
    orn35: ornith-1.0-35b
    glm: glm-4.7-flash
    # Bonsai 1-bit reativado Jul 2026 — Q1_0 CUDA no upstream, ngram-mod spec decode
    bonsai1: bonsai-27b-1bit
    # Tradução
    tg: translategemma-4b
    # Português jurídico (Qwen3.5-9B LoRA, instruct)
    # athenas: athenas-symbiote-9b  # disabled
    # Audio
    # asr: qwen3-asr-0.6b  # disabled
    ttsext: qwen3-tts
    # Embedding
    nomic: nomic-embed-text-v2-moe
    lfmemb: lfm2.5-embedding-350m
    # Reranker (late-interaction, CPU-only)
    lfmcol: lfm2.5-colbert-350m

  sets:
    # LLM pequeno + Vision + Embedding
    small_vision: "(q4 | lfm8 | lfm26) & (nomic | lfmemb | lfmcol)"

    # LLM pequeno + Embedding (sem vision)
    small_embed: "(q4 | lfm8 | lfm26) & (nomic | lfmemb | lfmcol)"

    # LLM pequeno sozinho (sem vision, sem embedding obrigatório)
    small_only: "q4 | lfm8 | lfm26 | nb42"

    # Vision models (sozinhos ou com embedding/reranker)
    vision_only: "ocr | uocr | qwvl"
    vision_embed: "(ocr | uocr | qwvl) & (nomic | lfmemb | lfmcol)"

    # Modelos médios + Embedding/Reranker
    medium: "(q9 | g4) & (nomic | lfmemb | lfmcol)"

    # Modelos pesados (offload) + Embedding/Reranker
    heavy: "(orn35 | aw | glm | bonsai1) & (nomic | lfmemb | lfmcol)"

    # Tradução (leve, cabe com embedding/reranker)
    # translate_embed removed (hmt uninstalled)
    translate_only: "tg"

    # External TTS (separate process, same GPU)
    tts_external: "ttsext"

    # Embedding/Reranker sozinho (RAG indexing, semantic search, reranking)
    embed_only: "nomic & lfmemb & lfmcol"

    # Reranker sozinho (late-interaction reranking, CPU-only)
    rerank_only: "lfmcol"

    # Reranker + Embedding (two-stage retrieval: dense → rerank)
    rerank_embed: "lfmcol & (nomic | lfmemb)"

  # Custo de eviction (modelos mais caros pra recarregar = prioridade pra ficar)
  evict_costs:
    aw: 9
    orn35: 9
    glm: 9
    bonsai1: 7
    q9: 4
    g4: 3
    ttsext: 4
    ocr: 3
    uocr: 3
    qwvl: 3
    q4: 2
    lfm8: 2
    lfm26: 2
    nb42: 2
    nomic: 1
    lfmemb: 1
    lfmcol: 1
    tg: 2
