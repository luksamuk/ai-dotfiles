# -------------------------------------------
# ORNITH-1.5-35B-A3B - MoE AGENTIC CODING + VISION (ONYX compact + MTP, DEFAULT)
# MoE 35B params, ~3B ativo por token. 256 experts, 8+1 active.
# Self-improving RL: extends Ornith-1.0 self-scaffolding into full self-improvement loop
# (task generation + scaffold construction + solution rollouts).
# Same qwen35moe architecture as Ornith-1.0 and Qwen3.6-35B-A3B.

# PROMOTED 2026-09-02 after A/B vs APEX Compact (N=3, same prompt/samplers):
#   ONYX compact + MTP:  45.1 tok/s mean (46.1/44.8/44.5), VRAM 4646 MiB (75.6%)
#   APEX Compact + ngram: 40.6 tok/s mean (40.2/40.7/40.9), VRAM 4232 MiB (68.9%)
#   MTP acceptance 85-93% (head well calibrated on this base).
#   +11.1% throughput for +414 MiB VRAM. User decision: speed wins.

# ONYX (el4) = APEX evolution: dynamic layer sensitivity + router-weighted
# imatrix (crushes cold MoE experts, protects hot ones in-tensor).
# ONYX PRESERVES MTP head (blk.40.nextn.* Q8_0, verified via GGUFReader:
# nextn_predict_layers=1, 4 nextn tensors). --spec-type mtp is SAFE here.
# (OOM pitfall applies only to GGUFs with 0 nextn layers — see
# references/mtp-speculative-decoding.md)

# Vision: mmproj.gguf (899MB, CLIP-based, shared with APEX — same encoder).
#   --no-mmproj-offload keeps it in RAM to preserve VRAM for weights.
# ik_llama backend: --fit, --defer-experts, hadamard KV, pinned memory.
# --fit-margin 1024: moderate headroom for context-shift + KV cache near full ctx

# Samplers (from model card):
#   General tasks: temp=0.6, top_p=0.95, top_k=20
#   Benchmarks: temp=1.0

# --ctx-size 131072: same safe ceiling (model supports 262K, YaRN extends to 1M)
# Dual mode: base (chat, no think) and :think (reasoning)
# --reasoning-budget 8192: caps thinking tokens at 8192 when :think is active.
#   Base mode is unaffected (template injects closed think block, budget never triggers).
# --reasoning-budget-message: smooth transition when budget is exhausted.
# Uses qwen-fixed-chat-template.jinja — embedded GGUF template lacks
# tool-call format instructions, causing leakage without the fixed template.

# Benchmark (Sep 2026 A/B, RTX 3050 6GB, N=3 same prompt):
#   ONYX compact + MTP: 45.1 tok/s, VRAM 4646 MiB, accept 85-93% — DEFAULT
#   APEX Compact + ngram-mod: 40.6 tok/s, VRAM 4232 MiB (_disabled, GGUF deleted
#   2026-09-02 — re-download from mudler/Ornith-1.5-35B-A3B-APEX-GGUF to revert)
# -------------------------------------------
