healthCheckTimeout: 300
logLevel: info
logTimeFormat: rfc3339
logToStdout: proxy
captureBuffer: 0
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0
macros:
  models_dir: ${env.HOME}/.llama-models
  media_path: ${env.HOME}/testfiles/vision
  templates_dir: ${env.HOME}/git/ai-dotfiles/llama-swap/templates
  llama_server: ${env.HOME}/git/llama.cpp/build/bin/llama-server
  fork_server: ${env.HOME}/git/xhtoken-llama.cpp/build-cuda/bin/llama-server
  ik_llama_server: ${env.HOME}/git/ik_llama.cpp/build/bin/llama-server
  ik2_llama_server: ${env.HOME}/git/kassane-ik_llama.cpp/build/bin/llama-server
  cafe_server: ${env.HOME}/git/cafe-llama.cpp/build/bin/llama-server
  sd_server: ${env.HOME}/git/stable-diffusion.cpp/build/bin/sd-server
  prism_llama_server: ${env.HOME}/git/prism-llama.cpp/llama-prism-b10685-7dffb15/llama-server
  sensenova_server: ${env.HOME}/git/llama.cpp-sensenova-loop/build/bin/llama-server
  sensenova_vision_server: ${env.HOME}/git/llama.cpp-sn-vision/build/bin/llama-server
  vllm_bin: ${env.HOME}/.vllm/bin/vllm
  default_temp: '0.7'
  default_top_p: '0.9'
  default_top_k: '20'
  default_min_p: '0.01'
  default_repeat_penalty: '1.05'
  code_temp: '0.6'
  code_top_p: '0.85'
  code_top_k: '40'
  code_min_p: '0.02'
  code_repeat_penalty: '1.05'
  think_temp: '0.6'
  think_top_p: '0.9'
  think_top_k: '20'
  think_min_p: '0.0'
  think_repeat_penalty: '1.0'
  small_model_min_ctx: '65536'
  small_model_max_ctx: '131072'
  completion_ctx: '32768'
  large_model_min_ctx: '65536'
  large_model_max_ctx: '131072'
  vram_margin: '512'
  small_cache_k: q8_0
  small_cache_v: q8_0
  large_cache_k: q4_0
  large_cache_v: q4_0
  gemma_cache_k: q4_0
  gemma_cache_v: q4_0
models:
  spark-x2.6-4b:
    name: Spark X2.6 4B
    description: 'XHToken 4B denso na arch Spark 2.5 com spec-decode DSpark (draft Q8_0 no binario FORK xhtoken): 135 t/s de decode @32K medidos (3,3x do baseline 41 t/s, aceitacao 94,9%, mean 7,50/8) + o prefill king da frota. Thinking budget controlavel (template enable_thinking). Lane @64K: o draft custa ~0.63 GB+KV e @131K nao cabe de jeito nenhum.'
    cmd: '${fork_server} --port ${PORT}

      --model ${models_dir}/spark-x2.6-4b/Spark-X2.6-4B-Q4_K_M.gguf

      -md ${models_dir}/spark-x2.6-4b/Spark-X2.6-4B-DSpark-Q8_0.gguf

      --spec-type draft-dspark

      --spec-draft-sampling greedy

      --spec-draft-n-max 7

      --spec-draft-p-min 0

      -ngld 999

      --jinja

      --parallel 1

      --ctx-size 65536

      -ngl 99

      -b 256 -ub 64

      --flash-attn on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --temp 1.0

      --top-p 0.95

      --top-k 0

      --repeat-penalty 1.0

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 0.95
          top_k: 0
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 0.95
          top_k: 0
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 65536
    metadata:
      size: ~3.54 GB (Q4_K_M) + 0.63 GB draft DSpark (Q8_0; o BF16 1.2 GB foi descartado — OOM de pp buffer na 6GB com desktop)
      context: 65536
      vram_usage: '~5.7 GB pico ESTIMADO @64K (A/B 01/11 @32K mediu 5322 MiB TOTAL com desktop 1070 — a lane ~4.2 GB; SEM --fit: OOM se o desktop engordar)'
      source: XHToken/Spark-X2.6-4B-GGUF (Q4_K_M) + XHToken/Spark-X2.6-4B-DSpark-GGUF (draft; Q8_0 quantizado local com llama-quantize --pure, 01/11)
      kv_cache: q4_0 + q4_0; draft f16 ~20MB fixo (SWA 512)
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: spark2_5
      parameters: 4000000000
      context_length: 1048576
      embedding_length: 2560
      quantization: Q4_K_M
      note: 'ADOTADO 01/11/2026: lane spec-decode @64K no binario FORK xhtoken (macro fork_server = ~/git/xhtoken-llama.cpp/build-cuda/bin/llama-server, build 01/11 com patch local de uma linha: #include <algorithm> em src/llama-context.cpp — bug de compile do fork). A/B @32K: 135.0/136.0 t/s vs 41.0/40.7 baseline = 3.3x (o card reclama 2x mas mediu com sampling probabilistico; este teste e greedy/temp 0); acceptance 0.9485 (221/233), mean len 7.50/8 no teto. BF16 draft = CRASH pp buffers (descartado). Prefill king intacto (1607 t/s @30K era o X2.5; este 4B herda a arch). GATE DE VOLTA pro upstream: PR ggml-org/llama.cpp#31372 (Septend-fun, DSpark draft tensor support, OPEN, up 31/10) MERGEADO => trocar ${fork_server} por ${llama_server} no cmd (o tracker Spark vigia o PR; o ctx fica 64K — com draft, @131K nao cabe de jeito nenhum). HISTORICO: smoke 24/10 @131K sem draft: 41,9-43,0 t/s, tool calling OK, funcao Python OK; smoke via llama-swap: 36-38 t/s pico 88,9%. X2.6 = post-training do X2.5 (agentico, tool use); o irmao X2.5 REPROVADO (snake v2 colisao + timeout bench agentico 03) — regua pendente pro X2.6 tb. Base E :think SAO AMBOS thinking-ON (24/10: thinking-none respondeu EM CHINES a uma saudacao curta — o default do vendor eh ligado e o none nao serve). Samplers do proprio GGUF (temp 1.0, top_p 0.95, top_k -1, repeat 1.0) — hardcoded, nao usar macro.'
      fork_note: 'FORK ISOLADO (doutrina fork): ~/git/xhtoken-llama.cpp = upstream + PR #31372 (ainda nao mergeado; master 22c0ae1 de 30/10). O binario NUNCA substitui a frota; mas o checkout vive PROPOSITADAMENTE (a lane prod aponta pra ele) ate o merge do 31372, quando: flip ${fork_server} -> ${llama_server} + APAGAR o checkout inteiro (o build-cuda vira lixo). Se ficar vivo semanas, re-syncar com o upstream master (fork master base de 30/10 envelhece).'
  qwen2.5-coder-1.5b-pollard:
    name: Qwen2.5 Coder 1.5B Pollard
    description: Qwen2.5-Coder-1.5B-Instruct memory-fit for code completion. FIM native, CPU-only serving with zero VRAM.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/qwen2.5-coder-1.5b-pollard-new/Qwen2.5-Coder-1.5B-Pollard-v2-IQ4XS-class.gguf

      --jinja

      --parallel 1

      --ctx-size ${completion_ctx}

      --temp 0.7

      --top-p 0.8

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --batch-size 512

      --ubatch-size 128

      --spec-type ngram-mod

      --spec-ngram-mod-n-match 24

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-max 64

      --no-webui

      --metrics

      '
    env:
    - CUDA_VISIBLE_DEVICES=
    filters:
      stripParams: temperature, top_p
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~824 MB (Pollard IQ4_XS + imatrix)
      context: 32768
      vram_usage: 0 (CPU-only)
      source: PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: true
        audio: false
        image: false
      architecture: qwen2
      parameters: 1540000000
      context_length: 32768
      embedding_length: 1536
      quantization: Pollard IQ4_XS
      note: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct. IQ4_XS with imatrix on mixed prose+code. FIM native (Qwen2.5-Coder tokens). CPU-only, coexists with GPU MoE. ngram-mod enabled.
  qwen3.6-35b-a3b-heretic:
    name: Qwen 3.6 35B Heretic
    description: Qwen's 35B-A3B MoE generalist, abliterated (heretic TPE). 131K context, single slot.
    cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

      --model ${models_dir}/qwen36-heretic-apex-mini/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Mini.gguf

      --mmproj ${models_dir}/qwen36-heretic-apex-mini/mmproj.gguf

      --ctx-size 131072

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --no-mmproj-offload

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      -cmoe

      -ngl 99

      -b 512

      -ub 128

      --temp ${code_temp}

      --top-p ${code_top_p}

      --top-k ${code_top_k}

      --min-p ${code_min_p}

      --repeat-penalty ${code_repeat_penalty}

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~14.66 GB (APEX-I-Compact, heretic)
      context: 131072
      vram_usage: ~5.1 GB VRAM + ~15 GB RAM pinned
      source: SC117/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-GGUF (I-Compact) + mmproj unsloth Q8
      kv_cache: q4_0/q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 34660000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX I-Compact
      note: 'vram detalhe: ~5.1 GB VRAM (turbo4 KV) + ~15 GB pinned RAM (hmoe) | turbo4 KV; hmoe experts pinned Produção Sep 24: café herdou o posto do ik-131K (menor pressão de VRAM/RAM, 262K nativo). Heretic KL 0.0015 (88% menos recusas). Sem MTP @262K (draft KV não cabe). Smoke 200 OK (7s). KV turbo4 = WHT-rotated, FA-fused (IK TurboQuant); source do mmproj: unsloth Q8.'
  lfm2.5-colbert-350m:
    name: LFM2.5 ColBERT 350M
    description: Liquid AI ColBERT reranker for RAG retrieval pipelines. CPU-only serving.
    env:
    - CUDA_VISIBLE_DEVICES=
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/lfm2.5-embed/LFM2.5-ColBERT-350M-Q8_0.gguf\n--embeddings\n--pooling mean\n--ctx-size 4096\n--cont-batching\n--parallel 1\n--cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
    ttl: 300
    capabilities:
      in:
      - text
      out: []
      tools: false
      reranker: true
      embeddings: true
      context: 4096
    metadata:
      architecture: lfm2-bidir
      parameters: 353000000
      context_length: 4096
      embedding_length: 128
      quantization: Q8_0
      size: ~378 MB (Q8_0)
      vram_usage: CPU-only
      source: LiquidAI/LFM2.5-ColBERT-350M-GGUF (Q8_0)
      kv_cache: f16
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: true
        insert: false
        audio: false
        image: false
      note: 'vram detalhe: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only) | -ngl 0, ~0.1GB CUDA ctx overhead apenas Late-interaction model. OAI-compatible /v1/embeddings uses mean-pooled 128-dim vectors. For true MaxSim reranking, use raw /embedding endpoint for per-token vectors and compute MaxSim client-side. Asymmetric prompts from config_sentence_transformers.json. 11 languages. Higher accuracy than dense (0.605 vs 0.577 NDCG@10) but larger index (per-token vectors).'
  embeddinggemma-2:
    name: EmbeddingGemma 2
    description: EmbeddingGemma 2 is Google DeepMind's 740M multimodal embedding model, mapping text, images, audio, and video into a single 768-dimension space. It supports 100+ languages with MRL flexible dimensions.
    env:
    - CUDA_VISIBLE_DEVICES=
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/embeddinggemma-2/embeddinggemma-2-Q8_0.gguf\n--mmproj ${models_dir}/embeddinggemma-2/mmproj-embeddinggemma-2-Q8_0.gguf\n--embeddings\n--pooling mean\n--ctx-size 8192\n--cont-batching\n--parallel 1\n--cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
    ttl: 300
    capabilities:
      in:
      - text
      - image
      - audio
      out: []
      tools: false
      reranker: false
      embeddings: true
      context: 8192
    metadata:
      architecture: gemma-embedding2
      parameters: 740000000
      context_length: 8192
      embedding_length: 768
      quantization: Q8_0
      size: ~0.8 GB (Q8_0) + ~0.5 GB mmproj
      vram_usage: CPU-only
      source: ggml-org/embeddinggemma-2-GGUF (Q8_0 + mmproj Q8_0)
      kv_cache: f16
      features:
        completion: false
        tools: false
        thinking: false
        vision: true
        embedding: true
        insert: false
        audio: true
        image: false
      note: 'vram detalhe: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only) | Text-steered: queries ''task: {tarefa} | query:'' e docs ''title: {t} | text: {conteudo}'' (title: none se sem titulo); media SEM prefixo. Multimodal via mmproj (vision 212 tensors + audio 751 tensors no mmproj). MRL: truncate + re-normalizar client-side (768/512/256 perde pouco; 128 valida antes). Smoke 06/10/2026: MRR=1.0 retrieval 8q pt-BR, STS spearman 0.94 (par-a-par com nemotron-3-embed, 23ms vs 104ms query CPU). mmproj carrega vision+audio: aceita imagem/audio como input (vision tag = input, image false = nao gera). Lançamento 06/10/2026, GGUF oficial ggml-org; build 2796+ do llama.cpp necessita (arch gemma-embedding2, PR #30054).'
  julia-1:
    name: Julia-1
    description: System One decision model (ModernBERT 144M BF16). Serves POST /v1/systemone for laya-snake judge. Not a chat model.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/decision-models/Julia-1-GGUF/Julia-1-BF16.gguf

      --ctx-size 8192

      --batch-size 512

      --ubatch-size 512

      --parallel 1

      --no-webui

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k, min_p, repeat_penalty
    ttl: 3600
    health_check_timeout: 60
    capabilities:
      in:
      - text
      out:
      - decisions
      tools: false
      reranker: false
      context: 8192
    metadata:
      size: ~303 MB (BF16)
      context: 8192
      vram_usage: ~0.3 GB VRAM
      source: 'ggml-org/Julia-1-GGUF (BF16, official #29818 conversion)'
      kv_cache: n/a
      features:
        decision: true
        completion: false
        tools: false
        thinking: false
        vision: false
        image: false
        embedding: false
        insert: false
        audio: false
      architecture: modern-bert
      parameters: 144000000
      context_length: 8192
      embedding_length: 384
      quantization: BF16
      note: 'vram detalhe: ~0.3 GB VRAM (model 303MB + compute) | model 303MB BF16 + compute Decision model (/v1/systemone: noul/choice/score). llama-swap v262+ roteia /v1/systemone nativo (issue #1195 fechada). Lightest judge: 144M, sub-5ms per question expected on GPU.'
  minicpm-ocr-1.0:
    unlisted: true
    name: MiniCPM-OCR 1.0
    description: OpenBMB's 1.3B document parsing model - text, tables, formulas, charts and seals for EN/zh documents and PDFs via fixed prompts (Text/Table/Formula Recognition:).
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/minicpm-ocr-1.0/MiniCPM-OCR-1_0-Q8_0.gguf

      --mmproj ${models_dir}/minicpm-ocr-1.0/mmproj-model-f16-4x.gguf

      --model-draft ${models_dir}/minicpm-ocr-dspark/dspark-MiniCPM-OCR-1_0-Q8_0.gguf

      --spec-type draft-dspark

      -ngld 99

      --jinja

      --no-webui

      --fit on

      # 3072 (e nao ${vram_margin}): o fit NAO mede o draft dflash ("dflash requires

      # ctx_other" — warning normal durante fitting) e planeja a VRAM so do principal;

      # com margem padrao, o draft (-ngld 99) estoura e o boot morre em OOM de

      # compute buffers. 3 GB de margem deixam o espaco do draft dentro do plano,

      # boot medido OK em ~0.9 GB VRAM total usada (28/out/2026).

      --fit-target 3072

      --fit-ctx ${small_model_min_ctx}

      --ctx-size ${small_model_max_ctx}

      --temp 0

      --cache-type-k f16

      --cache-type-v f16

      --flash-attn on

      --metrics

      '
    ttl: 60
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: ~0.81 GB backbone (Q8_0) + ~0.90 GB mmproj (F16) + ~0.33 GB DSpark draft (Q8_0)
      context: 64K-128K (fit dinamico; nativo 262K)
      vram_usage: ~3.5 GB (backbone + mmproj + draft + cache f16)
      source: openbmb/MiniCPM-OCR-1.0-gguf + openbmb/MiniCPM-OCR-1.0-DSpark-gguf
      kv_cache: f16
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 752000000
      context_length: 262144
      embedding_length: 1024
      quantization: Q8_0
      note: Thinking ja vem desabilitado no chat template embutido do GGUF (enable_thinking nao reativa; conversion propria exige --chat-template-kwargs enable_thinking:false). llama-mtmd-cli nao aceita draft - draft-dspark so com llama-cli ou llama-server. Para PDFs/pipeline completo, a SDK deles (minicpmvocr parse) encadeia layout + recon + Jev + DSpark; aqui fica o elemento isolado por decisao do dono.
  minicpm-ocr-jev:
    unlisted: true
    name: MiniCPM-OCR Jev
    description: OpenBMB's 2B OCR quality scorer (Jev-style decision model) - scores text/formula/table OCR candidates 0-1 in a single pass by comparing the source image with the render.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/minicpm-ocr-jev/MiniCPM-OCR-Jev-Q8_0.gguf

      --mmproj ${models_dir}/minicpm-ocr-jev/mmproj-model-f16.gguf

      --ctx-size 16384

      --batch-size 512

      --ubatch-size 512

      --parallel 1

      --no-webui

      --cache-type-k q8_0

      --cache-type-v q8_0

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k, min_p, repeat_penalty
    ttl: 3600
    health_check_timeout: 90
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 16384
    metadata:
      size: ~2.01 GB (Q8_0) + 0.67 GB mmproj (F16)
      context: 16384
      vram_usage: ~0 GB VRAM (CPU-only, doutrina decision da casa); ~3 GB RAM
      source: openbmb/MiniCPM-OCR-Jev-gguf
      kv_cache: q8_0
      features:
        decision: true
        completion: false
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 1900000000
      context_length: 262144
      embedding_length: 2048
      quantization: Q8_0
      note: 'Decision exclusivo, FORA dos sets (padrao julia) - nao disputa VRAM. Scoring = um forward pass so, sem geracao de tokens. Contrato da request (/v1/systemone): "state" = STRING com o texto OCR reconhecido da regiao (nao objeto); "questions" = UMA pergunta fixa, so "choice" com criteria exatamente {"0": null, "1": null} ou "noul" (scores de 0-1 saem do modelo, as opcoes sao nomeadas 0=reprovado/1=aprovado pelo template do GGUF); as duas imagens vao em "images" (alias "files") como data URLs (data:image/...;base64,...), ordem: original primeiro, depois a render. O harness do pipeline OCR (layout -> recon -> Jev) fica na SDK/cript do dono - aqui o elemento fica separado no fleet de proposito.'
  parakeet-tdt-0.6b-v3:
    name: Parakeet TDT 0.6B v3
