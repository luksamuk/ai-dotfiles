# preload: carrega modelos síncronamente antes de aceitar requests
# Ideal para vLLM (startup lento = 30-90s sem warm-up)
# NOTA: preloads desabilitados temporariamente — ocupam GPU e bloqueiam swap pra SGLang
# Para reabilitar: descomente as linhas preload abaixo
hooks:
  on_startup:
    preload: []
      # - "qwen3.5-0.8b-vllm"
      # - "lfm2.5-1.2b-vllm"

# ============================================
# SWAP MATRIX (v202+)
# ============================================
# O solver determina automaticamente qual combinação de modelos
# pode rodar simultaneamente e quais descarregar quando necessário.
#
# ⚠️ REGRA CRÍTICA DE COEXISTÊNCIA:
# Embedding e reranker (nomic, lfmemb, lfmcol) são CPU-only (~0.5GB total)
# e NÃO consomem VRAM. Devem coexistir com QUALQUER LLM — leve ou pesado.
# Todos os sets que agrupam LLMs DEVEM incluir as vars de embedding/reranker
# no & (AND). Se uma var de embedding falta de um set, o solver trata
# o embedding e o LLM como mutuamente exclusivos, causando ping-pong
# de eviction (embedding evicta LLM cost 9+, LLM evicta embedding cost 1).
#
# Exemplo: heavy: "(qw36 | orn35) & (nomic | lfmemb | lfmcol)"
# Veja references/new-model-workflow.md §6 para detalhes completos.
# ============================================

matrix:
  vars:
    # Modelos pequenos
    # q4: qwen3.5-4b  # removed Oct 11 2026 — qwen3.5-4b aposentado por decreto user (agents-a1-4b assume como padrão); handle órfão crasha config
    # a1: agents-a1-4b  # OUTROU em Oct 12 2026 — régua disk N=5 fechada 124.4 (std 12.66; 03 zerado 1x, 01 tool_use 0 nas 5) — neohorse assumiu o trono 4B com dados (137.8)
    # neo4: neohorse-1-4b  # APOSENTADO 21/out 2026 — sem uso na fleet; GGUF deletado, fragment em _removed/. (voltou 1x em Oct 12 e não pegou)
    # q4x: qwen3.5-4b-262k  # disabled Sep 20 2026 — user: cafe fica pros MoEs, 4B segue no prod upstream/ik; ctx alto não importa nesse modelo
    # m5a: minicpm5-1b-agentic  # disabled
    # lfm8: lfm2.5-8b-a1b  # REMOVED Sep 10 2026 — GGUF deleted (bench 16/105, user confia no 2.6b); fragment em _removed/
    # lfm26: lfm2.5-2.6b  # APOSENTADO 21/out 2026 — GGUF deletado, fragment em _removed/
    # nb42: nanbeige4.2-3b  # APOSENTADO 21/out 2026 — GGUF deletado, fragment em _removed/
    # Especialista logica formal (webAI, base Granite 4.2-3B da IBM) — lane nova, nao substitui
    twp: twil-lm3-pro
    # Empero Qwen3.8 distillations REMOVED Sep 10 2026 — GGUFs deleted (eq2: sem caso de uso; eq4: nunca surpreendeu), fragments em _removed/
    # Pollard memory-fit Qwen2.5-Coder-1.5B (FIM, imatrix, CPU-only)
    qpfim: qwen2.5-coder-1.5b-pollard  # reativado 16/out — FIM CPU-only (k2fim/k2p/k2 _disabled: GGUFs deletados no aperto SSD; restore: mv _disabled → models + vars)
