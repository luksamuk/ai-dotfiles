    # qw38p: qwen3.8-27b-pollard  # removed Aug 30 2026 — 2.75 tok/s, superseded by bonsai-27b (10x faster, same class)
    # Qwen3.8-27B GSQ-RCO IQ2_S-mtp removed Sep 20 2026 — 3.6 t/s ainda lento demais pro uso; GGUF deleted; fragment em _disabled/
    # q38g: qwen3.8-27b-gsq
    # Bonsai removed Sep 20 2026 — user nunca usa; GGUF deleted; fragment em _disabled/
    # bonsai: bonsai-27b
    # Tradução
    tg: translategemma-4b
    # Português jurídico (Qwen3.5-9B LoRA, instruct)
    # athenas: athenas-symbiote-9b  # disabled
    # Audio
    # asr: qwen3-asr-0.6b  # disabled
    ttsext: qwen3-tts
    # Embedding
    # nomic: nomic-embed-text-v2-moe  # REMOVED Sep 10 2026 — obsoleto vs nemotron-3-embed (2048 dims); fragment em _removed/
    lfmemb: lfm2.5-embedding-350m
    nemb: nemotron-3-embed-1b
    # Multimodal embedding (Google, 740M, texto+img+audio+video, 768d MRL, Apache 2.0)
    eg2: embeddinggemma-2
    # Reranker (late-interaction, CPU-only)
    lfmcol: lfm2.5-colbert-350m
    # Decision models (System One scorers, /v1/systemone) — exclusive no
    # matrix (fora de sets); judge do laya-snake; routing #1195 pending
