# EMPERO QWEN3.8-2B - ik_llama.cpp BACKEND
# Empero distillation of Qwen3.8-2.4T-A95B into Qwen3.5-2B architecture.
# Full-parameter SFT on ~30K curated teacher CoT traces.
# MMLU CoT 0.283 -> 0.548 (+0.265). GSM8K 0.330 -> 0.640 (+0.310).
