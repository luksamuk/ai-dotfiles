#   MMQ fix #25778 — all present in build 2026-08-25+ (recompiled 08-30 for #28000).
# 3.80 GB on disk, ~3.9 GB deployed. Fits entirely in RTX 3050 6GB VRAM.
# 89.5% of FP16 intelligence retained (76.11 avg, 15 benchmarks).

# Aug 2026 redeploy notes (differs from Jul deploy):
#   - ctx 131072 (user preference) with --no-kv-offload: weights fully in VRAM,
#     KV cache kept in host RAM. Hybrid backbone grows full-attn KV on only
#     16/64 layers -> RAM bandwidth hit is minor at 128K.
#   - MEASURED (Aug 30, upstream b9723942ad, browser open ~595MiB VRAM):
#       131K KV-host: 10.95 tok/s (VRAM 4436 MiB / 72%)
