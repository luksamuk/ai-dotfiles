#   reativar). Teto empírico c/ desktop limpa: -ngl 56 = 2.94 tok/s decode,
#   pp 134; 57-63 OOM; 54 = 2.47. Serve confirmado: ngl 56 + ctx 32K +
#   --no-kv-offload (KV q4_0 na RAM) = 5635MiB VRAM total.
# DEGRADAÇÃO SABIDA: ngl baixo = ping-pong mata (48 = 1.66 t/s); CPU-only
#   decode 0.53-0.64 t/s (unpack trits sem VNNI). Deploy é p/ teste de
