# llama-swap configuration for RTX 3050 Laptop (6GB VRAM)
# Configuração otimizada para uso com --fit automático + attn_rot (KV cache quantizado)
# Dual binary: llama.cpp for dense models, ik_llama.cpp for MoE models (pinned memory, better expert offload)
#
# Repositório: ~/git/ai-dotfiles/llama-swap/
# Modelos: ~/.llama-models/
# Requer: llama-swap v212+ (Prometheus metrics, SIGHUP reload, reasoning UI, race fix, zstd captures)
# Requer: llama.cpp build b9563+ (mtmd audio/TTS/video, 6 audio preprocessors: whisper/conformer/granite_speech/gemma4a/gemma4ua/qwen3a, LFM2.5 reasoning fix, Gemma4 MTP, Granite4 Vision, KV cache optimizations)
# Requer: ik_llama.cpp v4566+ (bf16 graph reduce fix, threads-mtmd, mtmd checkpoint save/restore)
# Requer: cafe-llama.cpp (fork quimmedes/Ark) — Turbo KV (turbo2/3/4) para contexto longo
#   (>131K) em MoE, MoE offload (-hmoe pinned RAM / -ssd streaming do NVMe), safetensors
#   nativo. Substituiu o beellama.cpp (removido Set/2026); upstream já tinha removido o
#   TurboQuant/TCQ original em v0.4.0 (renomeado KVarN).
#
# OTIMIZAÇÕES ik_llama.cpp (modelos MoE e dense offloaded):
#   --k-cache-hadamard / --v-cache-hadamard (-khad/-vhad): Hadamard transform no K/V cache
#     antes da quantização → qualidade muito mais próxima do f16 com cache q4_0/q8_0.
#     Especialmente útil em 6GB VRAM onde q4_0 é necessário para contexto longo.
#   --flash-attn auto: desliga FA automaticamente em contextos curtos (economia em MoE offloaded)
#   --defer-experts: defere mmap de experts no Linux → carregamento mais rápido de modelos MoE

# Schema para validação (VS Code)

healthCheckTimeout: 300
logLevel: info
logTimeFormat: "rfc3339"
logToStdout: "proxy"
captureBuffer: 0   # capturas OFF (user 31/10: prompts NÃO guardados, privacidade; era 15 em memória — nada ia pra disco sem store.persistCaptures)
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0

# Macros reutilizáveis
macros:
  "models_dir": "${env.HOME}/.llama-models"
  "media_path": "${env.HOME}/testfiles/vision"
  "templates_dir": "${env.HOME}/git/ai-dotfiles/llama-swap/templates"

  # Caminho para o llama-server compilado com CUDA (--fit disponível)
  # Build local em ~/git/llama.cpp/build/bin/llama-server
  "llama_server": "${env.HOME}/git/llama.cpp/build/bin/llama-server"
    # Build local em ~/git/ik_llama.cpp/build/bin/llama-server
  "ik_llama_server": "${env.HOME}/git/ik_llama.cpp/build/bin/llama-server"

  # ik_llama.cpp fork do kassane (branch k2-horizon) — suporte a arquitetura k2-horizon
  # Build local em ~/git/kassane-ik_llama.cpp/build/bin/llama-server
  "ik2_llama_server": "${env.HOME}/git/kassane-ik_llama.cpp/build/bin/llama-server"

  # Fork do fabricante KRAFTON (branch raon-1-nano-preview) — arch raon1nano
  # (upstream e ik não têm o nano; ik tem só o raon1 do mini, upstream rejeitou o PR)
  # Build local em ~/git/krafton-llama.cpp/build/bin/llama-server (shallow, commit 4d72ff0)
  "krafton_llama_server": "${env.HOME}/git/krafton-llama.cpp/build/bin/llama-server"

  # bee_server REMOVIDO Sep 20 2026 — fork beellama.cpp deletado; cafe-llama.cpp
  # (turbo4 KV + hmoe/ssd MoE offload) cobre esse papel daqui em diante (user decision)

  # Caminho para o llama-server do fork cafe-llama.cpp (quimmedes/Ark)
  # Turbo KV cache (turbo2/3/4, FA-fused), safetensors nativo, -hmoe/-ssd MoE offload
  # Único backend que carrega qwen35moe @262K ctx na RTX 3050 6GB (turbo4 KV)
  # Build local em ~/git/cafe-llama.cpp/build/bin/llama-server (commit 0fbc13f, set/2026)
  "cafe_server": "${env.HOME}/git/cafe-llama.cpp/build/bin/llama-server"

  # Caminho para o sd-server do stable-diffusion.cpp (Anima — 30/10/2026)
  # OpenAI-compatible /v1/images/generations; arch anima nativa no build
  # Build local em ~/git/stable-diffusion.cpp/build/bin/sd-server
  "sd_server": "${env.HOME}/git/stable-diffusion.cpp/build/bin/sd-server"

  # Caminho para o llama-server do fork PrismML (Bonsai-2 ternary, runtime Hadamard)
  # Binário prebuilt em ~/git/prism-llama.cpp/llama-prism-b10685-7dffb15/
  "prism_llama_server": "${env.HOME}/git/prism-llama.cpp/llama-prism-b10685-7dffb15/llama-server"

  # Caminho para o llama-server do fork guideboardlabs (sensenova_loop + mHC fundido)
  # Build VULKAN (o fork implementa ggml_mhc_route/merge em CPU e Vulkan — sem CUDA);
  # NVIDIA serve via Vulkan igualmente. Upstream ggml-org ainda SEM o arch (PR pendente).
  "prism2_llama_server": "${env.HOME}/git/prismml-eng-llama.cpp/build/bin/llama-server"
  # Build local em ~/git/llama.cpp-sensenova-loop/build/bin/llama-server (31/out/2026)
  "sensenova_server": "${env.HOME}/git/llama.cpp-sensenova-loop/build/bin/llama-server"

  # Caminho para o llama-server do runtime COMUNITARIO com visao (sensenova_loop via
  # classe qwen35 + mHC + patches notfakerv/annelo: clover PR 31306 + native, base ff0d396e3)
  # Build CUDA; o mmproj ride a maquinaria qwen3vl do upstream. Visao verificada 31/out.
  "sensenova_vision_server": "${env.HOME}/git/llama.cpp-sn-vision/build/bin/llama-server"
  # Caminho para o vLLM (installed in ~/.vllm venv)
  "vllm_bin": "${env.HOME}/.vllm/bin/vllm"

  # ===========================================
  # PARÂMETROS DE INFERÊNCIA (baseados no Unsloth)
  # ===========================================
  # Qwen3.5: temp 0.6-0.7, top_p 0.8-0.9, top_k 20-40

  # Gemma: temp 0.7, top_p 0.9
  # Referência: https://unsloth.ai/docs/models/qwen3.5
  # ===========================================
  # Parâmetros padrão (uso geral)
  "default_temp": "0.7"
  "default_top_p": "0.9"
  "default_top_k": "20"
  "default_min_p": "0.01"
  "default_repeat_penalty": "1.05"

  # Parâmetros para código/tool-calling (mais determinístico)
  "code_temp": "0.6"
  "code_top_p": "0.85"
  "code_top_k": "40"
  "code_min_p": "0.02"
  "code_repeat_penalty": "1.05"

  # Parâmetros para thinking/reasoning
  "think_temp": "0.6"
  "think_top_p": "0.9"
  "think_top_k": "20"
  "think_min_p": "0.0"
  "think_repeat_penalty": "1.0"

  # Qwen3.8-27B samplers removed Aug 2026 — model disabled
  # Contexto para modelos pequenos (cabem inteiros na VRAM)
  # fit-ctx: mínimo garantido, ctx-size: máximo teto
  "small_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "small_model_max_ctx": "131072"  # 128K máximo
  # Contexto para completion models (sem agente, sem tool-calling)
  "completion_ctx": "32768"      # 32K — code completion não precisa de mais
  # Contexto para modelos grandes (requerem offload)
  "large_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "large_model_max_ctx": "131072"  # 128K máximo
  # Margem de segurança para VRAM (MiB) - usada pelo --fit-target
  "vram_margin": "512"

  # ===========================================
  # KV CACHE QUANTIZADO + ATTN_ROT
  # ===========================================
  # attn_rot é ativado AUTOMATICAMENTE quando o cache é quantizado
  # (q4_0/q8_0) e n_embd_head % 64 == 0
  # Reduz degradação de velocidade em contextos longos (~37% → ~10%)
  # NOTA: Gemma4 iSWA attn_rot bug FIXED (commit 4eb19514d, b8815+). q4_0 cache works now!
  # ===========================================
  #
  # Compatibilidade attn_rot por modelo:
  #   Qwen3.5-4B/9B   ✅ head_k=256 (256%64==0)
  #   Qwen3-14B        ✅ head_k=128 (128%64==0)
  #   Qwen3.6-35B-A3B  ✅ head_k=128
    #   Nemotron-3-Nano  ✅ head_k=128 (REMOVED — poor quality)
  #   Nemotron-Omni-30B ✅ head_k=128 (NOT added — ik_llama lacks nemotron_h_moe arch, NOT i-quants. ik_llama supports IQ2_XXS/IQ3_XXS/IQ4_XS natively)
  #   Gemma-4 E2B/E4B  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   Gemma-4 26B-MoE  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   LFM2.5-1.2B       ✅ head_k=64 (64%64==0) — dense hybrid
  #   LFM2-24B-A2B     ✅ head_k=128 (128%64==0) — MoE hybrid
  #   LFM2.5-VL-450M   ❌ vision model, manter f16
  #
  # Tipos de cache:
  #   q8_0: ~47% economia vs f16, perda mínima
  #   q4_0: ~72% economia vs f16, mais compressão
  #
  # Escolha: modelos pequenos (fit VRAM) usam q8_0 (saldo perf/mem)
  #          modelos grandes (offload) usam q4_0 (maximizar contexto)
  "small_cache_k": "q8_0"
  "small_cache_v": "q8_0"
  "large_cache_k": "q4_0"
  "large_cache_v": "q4_0"
  "gemma_cache_k": "q4_0"
  "gemma_cache_v": "q4_0"
models:
  spark-x2.6-4b:
    name: Spark X2.6 4B
    description: Spark-X2.6-4B is XHToken's 4B dense model on the Spark 2.5 architecture, with controllable thinking budget (none/low/high), 1M native context and strong agentic/tool-calling gains over X2.5.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/spark-x2.6-4b/Spark-X2.6-4B-heretic-Q4_K_M.gguf

      --jinja

      --parallel 1

      --ctx-size 114688

      -ngl 99

      -b 256 -ub 64

      --flash-attn on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --temp 1.0

      --top-p 0.95

      --top-k 0

      --repeat-penalty 1.0

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 0.95
          top_k: 0
    ttl: 0
    health_check_timeout: 300
    capabilities:
      in:
        - text
      out:
        - text
      tools: true
      reranker: false
      context: 114688
    metadata:
      size: ~2.48 GB (Q4_K_M)
      context: 114688
      vram_usage: '~5.6 GB @112K'
      source: daydreamwarrior/Spark-X2.6-4B-heretic (self-quant Q4_K_M do BF16 oficial, sha256 0312b17c...; base XHToken/Spark-X2.6-4B)
      kv_cache: q4_0 + q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: spark2_5
      parameters: 4000000000
      context_length: 1048576
      embedding_length: 2560
      quantization: Q4_K_M
      note: 'Smoke 24/10/2026 (upstream, arch spark2_5 presente no llama.cpp e no cafe; ausente no ik). Medido @131K: 41,9-43,0 t/s, tool calling OK (finish=tool_calls com argumento certo), funcao Python OK. @65K fica em 77,6% e 42-44 t/s. Acima de 131K nao cabe: KV q8_0 estoura a 3050. Samplers do proprio GGUF (temp 1.0, top_p 0.95, top_k -1, repeat 1.0) — hardcoded, nao usar macro. Thinking: template enable_thinking. BASE E :think SAO AMBOS thinking-ON (24/10): o modo thinking-none respondeu em CHINES a uma saudacao curta, nao chamou ferramenta (finish=stop sem tool_calls) e errou 17x23 numa amostra — o default do vendor eh thinking ligado e o "none" nao serve. Smoke via llama-swap: 36-38 t/s, tool calling OK, pico 88,9% (5461 MiB). X2.6 mantem a arch do X2.5: os ganhos sao de pos-treino (agentico, tool use, contexto longo). Irmon X2.5 reprovou snake v2 (bug de colisao) e estourou o bench agentico 03 — regua pendente. DROP-IN HERETIC v2 05/nov (RETRIAL por decreto do dono): a ''degradacao'' que derrubou a v1 era CONFIG DO HARNESS (dsh com web_search quebrado: ''multiple usable web providers'', flails de tool) — nao o quant. Heretic Q4_K_M self-quant refeito (mesma receita: BF16 oficial byte-exato -> llama-quantize, 2474 MiB / 5.05 BPW), ctx 114688 como o deploy. v1: Q6_K do autor nao coube a 114688 (compute buffer Q6, OOM medido). KL do fine-tune 0.0097, refusals 1/100 vs 100/100. Sem branding heretic (decreto: identidade segue ''Spark X2.6 4B''; procedencia aqui e no source). A REGUA AGORA E O USO REAL no dsh com o harness CONSERTADO — o dono e o juiz. Snake 1-shot via Pi (11/nov/2026, prompt idêntico pro raon, sem ciclo externo de bugfix): 9.4KB HTML+HUD, visual bem-acabado; self-review pegou 2 bugs próprios (typo GRGID, timing do step) — MAS o timing refeito roda 1 step POR FRAME na velocidade inicial (~60 steps/s; o modelo confundiu steps/s com frames) → a cobra atravessa o board de 24 células em ~0.3s = insta-game-over, reproduzível a cada restart. Parse OK; gameplay REPROVADO 1-shot. V2 (bug report externo): timing reconstruído com accumulator (step a cada 1/speed segundos, cap 8 steps/s) + canvas corrigido pra 576x576; self-review re-checou loop/restart antes de fechar; Parse OK. Gameplay v2 pendente do dono.'
      reasoningEfforts:
        low: low
        high: high
  raon-1-nano:
    name: Raon-1 nano
    description: KRAFTON's Raon-1 nano is a dense conversational model with 1.5B effective parameters (3.1B counting the per-layer embedding table) and a 262,144-token context window, built for faithful Korean and English chat. Designed for assistant work, it keeps conversational context and calls tools natively.
    cmd: '${krafton_llama_server} --port ${PORT}

      --model ${models_dir}/raon-1-nano/raon-1-nano-Q4_K_M.gguf

      --jinja

      --parallel 1

      --ctx-size 262144

      -ngl 99

      --flash-attn on

      --temp 0.1

      --presence-penalty 1.5

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          presence_penalty: 1.5
    ttl: 0
    health_check_timeout: 300
    capabilities:
      in:
        - text
      out:
        - text
      tools: true
      reranker: false
      context: 262144
    metadata:
      size: ~2.08 GB (Q4_K_M)
      context: 262144
      vram_usage: '~3.9 GB VRAM'
      source: KRAFTON/Raon-1-nano-gguf (GGUF oficial do vendor, Q4_K_M non-MTP; fork raon-1-nano-preview commit 4d72ff0)
      kv_cache: f16
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: raon1nano
      parameters: 3100000000
      context_length: 262144
      embedding_length: 1536
      quantization: Q4_K_M
      note: 'Arch raon1nano (KRAFTON Raon-1): dense "MoE-to-dense" — 3.1B total (1.5B efetivo; a diferença é a tabela de per-layer embedding 256d do vocab 259.840). Hibrido: 18 layers Raon Delta Attention (gated delta-rule, estado fixo — família DeltaNet) + 6 Gated MLA layers (kv_lora_rank 512, ~7 KiB/token total). Raon-mHC 4 streams, NoPE, tied embeddings. Fork proprio do vendor (github.com/krafton-ai/llama.cpp, branch raon-1-nano-preview): upstream NÃO TEM o arch (PR comunitário #31107 fechado sem merge, era só o mini 30B), ik_llama tem só o raon1 (mini), nada de nano. MTP vendor existe (variante _MTP dos GGUFs, commit nextn do fork) — house decision: non-MTP primeiro, A/B de MTP depois se o dono pedir (dense = MTP pode acelerar, decisão conservadora só se aplicava a MoE). _sampling vendor (card "Sampling parameters"): thinking é DEFAULT e desabilitar não é recomendado — plain handle pins enable_thinking true, :think fica como alias compatível com os mesmos pins. General: temp 0.1 + presence_penalty 1.5; Agentic/code: temp 1.0 + pp 0 (não há terceiro handle por política da frota — quem usa agentic sobrescreve no cliente). _Smoke 11/nov/2026 (swap, fork krafton-llama.cpp b1-4d72ff0, shallow clone raon-1-nano-preview): 77.5 t/s decode (swap timings @ctx 262144, Q4_K_M ngl 99), prompt 674 t/s; VRAM 3937/6144 MiB (64%) com o residido carregado no ctx total — sobra ~2.2GB. Tool calling OK no 1º request (finish=tool_calls, get_weather com city correto). Reasoning: template emite thinking por default; reasoning_content presente nos 3 smokes. CLI CPU-only: 29.6 t/s. GGUF header: arch raon1nano, ctx 262144, pre=raon, NFC. MTP vendor existe (variante _MTP dos GGUF, nextn fork commit 11/nov) —      Snake 1-shot via Pi (11/nov/2026, prompt idêntico pro spark, sem ciclo externo de bugfix): entregou 2 arquivos em ~50s (effort medium), mas o HTML quebra no PARSE (ternário do keydown sem valor final) e o draw multiplica cell 2x (snake em pixels xcell) → tela preta, jogo inoperante. Autorevisão: zero — velocidade sem verificação. A/B de speedup pendente de go do dono. V2 (bug report externo): consertou o parse (if/else) + as unidades do draw (part.x direto); Parse OK — MAS o jogo ficou turn-based: move() só roda em keydown/click, sem setInterval/rAF, speed decorativo. Gameplay v2 pendente do dono.'
# -------------------------------------------
# GROOT-19B - cafe-llama.cpp (-cmoe) — REVIVAL 15/nov/2026 da lane aposentada (era UD-IQ2 ~12 GB, lenta demais).
# Agora MiniPlus IsValorum: 8.42 GB (qwen35moe, 19B-A3B distill da GrootTeam — metodo de escala undisclosed).
# MTP EMBED (blk.40.nextn): --spec-type draft-mtp; o autor NAO benchmarkou o spec — medir aceitacao no smoke,
#   se degradar, remover o --spec-type (quickstart do card mostra com e sem).
# Vision mmproj q8_0 (0.61 GB) — NAO re-avaliada pos-quant pelo autor; --no-mmproj-offload = custo zero.
# Always-think (comeca em thinking; enable_thinking:false por request desliga) — SEM reasoningEfforts (classe Fara).
# Samplers OFICIAIS do card (precise coding): temp 0.6 / top-p 0.95 / top-k 20 / min-p 0.0 / repetition_penalty 1.0.
# Card manda llama.cpp b12017+ (build da frota e a frente disso).
# Escada: 200000 estreia (espelho da familia; escada 262144 quando medir).
# -------------------------------------------
  groot-19b:
    name: Groot-19B-A3B
    description: GrootTeam 19B-A3B MoE distill (qwen35moe), uncensored multipurpose agent; MiniPlus quant, MTP-capable, vision optional.
    cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

      --model ${models_dir}/groot-19b/Groot-19B-A3B-261023.APEX-I-MiniPlus-V2.1.gguf

      --mmproj ${models_dir}/groot-19b/mmproj-GrootTeam_Groot-19B-A3B-261023-q8_0.gguf

      --no-mmproj-offload

      --spec-type draft-mtp

      --jinja

      --parallel 1

      --ctx-size 200000

      --temp 0.6

      --top-p 0.95

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.0

      --reasoning-budget 8192

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      -cmoe

      -ngl 99

      -b 512

      -ub 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: true
    ttl: 0
    health_check_timeout: 900
    capabilities:
      in:
        - text
        - image
      out:
        - text
      tools: true
      reranker: false
      context: 200000
    metadata:
      size: ~8.42 GB + 0.61 GiB mmproj q8_0
      context: 200000
      vram_usage: ~4 GB VRAM estimado (19B dense menor; medir no smoke)
      source: IsValorum/Groot-19B-A3B-261023-APEX-I-MiniPlus-V2.1-GGUF (base GrootTeam/Groot-19B-A3B-261023)
      kv_cache: q4_0/q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 19000000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX-I-MiniPlus
      note: 'Card s/ auditoria de PPL (base self-reportado da GrootTeam); vision pos-quant nao re-avaliada; scaling method undisclosed. MTP nao benchmarkado (medir no smoke). Sem reasoningEfforts (always-think).'
  qwen2.5-coder-1.5b-pollard:
    name: Qwen2.5 Coder 1.5B Pollard
    description: Qwen2.5-Coder-1.5B-Instruct memory-fit for code completion. FIM native, CPU-only serving with zero VRAM.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/qwen2.5-coder-1.5b-pollard-new/Qwen2.5-Coder-1.5B-Pollard-v2-IQ4XS-class.gguf

      --jinja

      --parallel 1

      --ctx-size ${completion_ctx}

      --temp 0.7

      --top-p 0.8

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --batch-size 512

      --ubatch-size 128

      --spec-type ngram-mod

      --spec-ngram-mod-n-match 24

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-max 64

      --no-webui

      --metrics

      '
    env:
      - CUDA_VISIBLE_DEVICES=
    filters:
      stripParams: temperature, top_p
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - text
      out:
        - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~824 MB (Pollard IQ4_XS + imatrix)
      context: 32768
      vram_usage: 0 (CPU-only)
      source: PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: true
        audio: false
        image: false
      architecture: qwen2
      parameters: 1540000000
      context_length: 32768
