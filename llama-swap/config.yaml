# llama-swap configuration for RTX 3050 Laptop (6GB VRAM)
# Configuração otimizada para uso com --fit automático + attn_rot (KV cache quantizado)
# Dual binary: llama.cpp for dense models, ik_llama.cpp for MoE models (pinned memory, better expert offload)
#
# Repositório: ~/git/ai-dotfiles/llama-swap/
# Modelos: ~/.llama-models/
# Requer: llama-swap v212+ (Prometheus metrics, SIGHUP reload, reasoning UI, race fix, zstd captures)
# Requer: llama.cpp build b9563+ (mtmd audio/TTS/video, 6 audio preprocessors: whisper/conformer/granite_speech/gemma4a/gemma4ua/qwen3a, LFM2.5 reasoning fix, Gemma4 MTP, Granite4 Vision, KV cache optimizations)
# Requer: ik_llama.cpp v4566+ (bf16 graph reduce fix, threads-mtmd, mtmd checkpoint save/restore)
# Requer: cafe-llama.cpp (fork quimmedes/Ark) — Turbo KV (turbo2/3/4) para contexto longo
#   (>131K) em MoE, MoE offload (-hmoe pinned RAM / -ssd streaming do NVMe), safetensors
#   nativo. Substituiu o beellama.cpp (removido Set/2026); upstream já tinha removido o
#   TurboQuant/TCQ original em v0.4.0 (renomeado KVarN).
#
# OTIMIZAÇÕES ik_llama.cpp (modelos MoE e dense offloaded):
#   --k-cache-hadamard / --v-cache-hadamard (-khad/-vhad): Hadamard transform no K/V cache
#     antes da quantização → qualidade muito mais próxima do f16 com cache q4_0/q8_0.
#     Especialmente útil em 6GB VRAM onde q4_0 é necessário para contexto longo.
#   --flash-attn auto: desliga FA automaticamente em contextos curtos (economia em MoE offloaded)
#   --defer-experts: defere mmap de experts no Linux → carregamento mais rápido de modelos MoE

# Schema para validação (VS Code)

healthCheckTimeout: 300
logLevel: info
logTimeFormat: "rfc3339"
logToStdout: "proxy"
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0

# Macros reutilizáveis
macros:
  "models_dir": "${env.HOME}/.llama-models"
  "media_path": "${env.HOME}/testfiles/vision"
  "templates_dir": "${env.HOME}/git/ai-dotfiles/llama-swap/templates"

  # Caminho para o llama-server compilado com CUDA (--fit disponível)
  # Build local em ~/git/llama.cpp/build/bin/llama-server
  "llama_server": "${env.HOME}/git/llama.cpp/build/bin/llama-server"

  # Caminho para ik_llama.cpp — fork otimizado para MoE (pinned memory, faster expert offload)
  # Build local em ~/git/ik_llama.cpp/build/bin/llama-server
  "ik_llama_server": "${env.HOME}/git/ik_llama.cpp/build/bin/llama-server"

  # ik_llama.cpp fork do kassane (branch k2-horizon) — suporte a arquitetura k2-horizon
  # Build local em ~/git/kassane-ik_llama.cpp/build/bin/llama-server
  "ik2_llama_server": "${env.HOME}/git/kassane-ik_llama.cpp/build/bin/llama-server"

  # bee_server REMOVIDO Sep 20 2026 — fork beellama.cpp deletado; cafe-llama.cpp
  # (turbo4 KV + hmoe/ssd MoE offload) cobre esse papel daqui em diante (user decision)

  # Caminho para o llama-server do fork cafe-llama.cpp (quimmedes/Ark)
  # Turbo KV cache (turbo2/3/4, FA-fused), safetensors nativo, -hmoe/-ssd MoE offload
  # Único backend que carrega qwen35moe @262K ctx na RTX 3050 6GB (turbo4 KV)
  # Build local em ~/git/cafe-llama.cpp/build/bin/llama-server (commit 0fbc13f, set/2026)
  "cafe_server": "${env.HOME}/git/cafe-llama.cpp/build/bin/llama-server"

  # Caminho para o llama-server do fork PrismML (Bonsai-2 ternary, runtime Hadamard)
  # Binário prebuilt em ~/git/prism-llama.cpp/llama-prism-b10685-7dffb15/
  "prism_llama_server": "${env.HOME}/git/prism-llama.cpp/llama-prism-b10685-7dffb15/llama-server"
  # Caminho para o vLLM (installed in ~/.vllm venv)
  "vllm_bin": "${env.HOME}/.vllm/bin/vllm"

  # ===========================================
  # PARÂMETROS DE INFERÊNCIA (baseados no Unsloth)
  # ===========================================
  # Qwen3.5: temp 0.6-0.7, top_p 0.8-0.9, top_k 20-40

  # Gemma: temp 0.7, top_p 0.9
  # Referência: https://unsloth.ai/docs/models/qwen3.5
  # ===========================================
  # Parâmetros padrão (uso geral)
  "default_temp": "0.7"
  "default_top_p": "0.9"
  "default_top_k": "20"
  "default_min_p": "0.01"
  "default_repeat_penalty": "1.05"

  # Parâmetros para código/tool-calling (mais determinístico)
  "code_temp": "0.6"
  "code_top_p": "0.85"
  "code_top_k": "40"
  "code_min_p": "0.02"
  "code_repeat_penalty": "1.05"

  # Parâmetros para thinking/reasoning
  "think_temp": "0.6"
  "think_top_p": "0.9"
  "think_top_k": "20"
  "think_min_p": "0.0"
  "think_repeat_penalty": "1.0"

  # Qwen3.8-27B samplers removed Aug 2026 — model disabled
  # Contexto para modelos pequenos (cabem inteiros na VRAM)
  # fit-ctx: mínimo garantido, ctx-size: máximo teto
  "small_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "small_model_max_ctx": "131072"  # 128K máximo
  # Contexto para completion models (sem agente, sem tool-calling)
  "completion_ctx": "32768"      # 32K — code completion não precisa de mais
  # Contexto para modelos grandes (requerem offload)
  "large_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "large_model_max_ctx": "131072"  # 128K máximo
  # Margem de segurança para VRAM (MiB) - usada pelo --fit-target
  "vram_margin": "512"

  # ===========================================
  # KV CACHE QUANTIZADO + ATTN_ROT
  # ===========================================
  # attn_rot é ativado AUTOMATICAMENTE quando o cache é quantizado
  # (q4_0/q8_0) e n_embd_head % 64 == 0
  # Reduz degradação de velocidade em contextos longos (~37% → ~10%)
  # NOTA: Gemma4 iSWA attn_rot bug FIXED (commit 4eb19514d, b8815+). q4_0 cache works now!
  # ===========================================
  #
  # Compatibilidade attn_rot por modelo:
  #   Qwen3.5-4B/9B   ✅ head_k=256 (256%64==0)
  #   Qwen3-14B        ✅ head_k=128 (128%64==0)
  #   Qwen3.6-35B-A3B  ✅ head_k=128
    #   Nemotron-3-Nano  ✅ head_k=128 (REMOVED — poor quality)
  #   Nemotron-Omni-30B ✅ head_k=128 (NOT added — ik_llama lacks nemotron_h_moe arch, NOT i-quants. ik_llama supports IQ2_XXS/IQ3_XXS/IQ4_XS natively)
  #   Gemma-4 E2B/E4B  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   Gemma-4 26B-MoE  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   LFM2.5-1.2B       ✅ head_k=64 (64%64==0) — dense hybrid
  #   LFM2-24B-A2B     ✅ head_k=128 (128%64==0) — MoE hybrid
  #   LFM2.5-VL-450M   ❌ vision model, manter f16
  #
  # Tipos de cache:
  #   q8_0: ~47% economia vs f16, perda mínima
  #   q4_0: ~72% economia vs f16, mais compressão
  #
  # Escolha: modelos pequenos (fit VRAM) usam q8_0 (saldo perf/mem)
  #          modelos grandes (offload) usam q4_0 (maximizar contexto)
  "small_cache_k": "q8_0"
  "small_cache_v": "q8_0"
  "large_cache_k": "q4_0"
  "large_cache_v": "q4_0"
  "gemma_cache_k": "q4_0"
  "gemma_cache_v": "q4_0"
models:
  spark-x2.6-4b:
    name: Spark X2.6 4B
    description: Spark-X2.6-4B is XHToken's 4B dense model on the Spark 2.5 architecture, with controllable thinking budget (none/low/high), 1M native context and strong agentic/tool-calling gains over X2.5.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/spark-x2.6-4b/Spark-X2.6-4B-Q4_K_M.gguf

      --jinja

      --parallel 1

      --ctx-size 131072

      -ngl 99

      -b 256 -ub 64

      --flash-attn on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --temp 1.0

      --top-p 0.95

      --top-k 0

      --repeat-penalty 1.0

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 0.95
          top_k: 0
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 0.95
          top_k: 0
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - text
      out:
        - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~3.54 GB (Q4_K_M)
      context: 131072
      vram_usage: ~5.4 GB pico medido 5449 MiB = 88,7% da 3050 (ctx 131K, KV q4_0, -b 256 -ub 64)
      source: XHToken/Spark-X2.6-4B-GGUF (Q4_K_M, repo oficial)
      kv_cache: q4_0 + q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: spark2_5
      parameters: 4000000000
      context_length: 1048576
      embedding_length: 2560
      quantization: Q4_K_M
      note: 'Smoke 24/10/2026 (upstream, arch spark2_5 presente no llama.cpp e no cafe; ausente no ik). Medido @131K: 41,9-43,0 t/s, tool calling OK (finish=tool_calls com argumento certo), funcao Python OK. @65K fica em 77,6% e 42-44 t/s. Acima de 131K nao cabe: KV q8_0 estoura a 3050. Samplers do proprio GGUF (temp 1.0, top_p 0.95, top_k -1, repeat 1.0) — hardcoded, nao usar macro. Thinking: template enable_thinking. BASE E :think SAO AMBOS thinking-ON (24/10): o modo thinking-none respondeu em CHINES a uma saudacao curta, nao chamou ferramenta (finish=stop sem tool_calls) e errou 17x23 numa amostra — o default do vendor eh thinking ligado e o "none" nao serve. Smoke via llama-swap: 36-38 t/s, tool calling OK, pico 88,9% (5461 MiB). X2.6 mantem a arch do X2.5: os ganhos sao de pos-treino (agentico, tool use, contexto longo). Irmon X2.5 reprovou snake v2 (bug de colisao) e estourou o bench agentico 03 — regua pendente.'
  nemotron-bolt-e4b:
    name: Nemotron 3.5 Bolt E4B
    description: NVIDIA's Nemotron 3.5 Bolt E4B is a post-training of Gemma 4 E4B (8B total, 4B effective) tuned for multi-turn tool use, instruction following and input grounding in fast local voice/device assistants. 64K context, text-only in this release.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/nemotron-bolt-e4b/NVIDIA-Nemotron-3.5-Bolt-E4B-UD-Q4_K_XL.gguf

      --jinja

      --parallel 1

      --ctx-size 49152

      -ngl 99

      -b 512 -ub 128

      --flash-attn on

      --cache-type-k q8_0

      --cache-type-v q4_0

      --spec-type draft-dflash

      --model-draft ${models_dir}/nemotron-bolt-e4b/dflash-NVIDIA-Nemotron-3.5-Bolt-E4B-Q8_0.gguf

      --spec-draft-n-max 4

      --temp 1.0

      --top-p 0.95

      --top-k 64

      --repeat-penalty 1.0

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 1.0
          top_p: 0.95
          top_k: 64
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 0.95
          top_k: 64
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - text
      out:
        - text
      tools: true
      reranker: false
      context: 49152
    metadata:
      size: ~5.06 GB (UD-Q4_K_XL)
      context: 49152
      vram_usage: pico medido 5296 MiB = 86,2% da 3050 (ctx 48K + DFlash, KV q8_0/q4_0)
      source: unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF (UD-Q4_K_XL)
      kv_cache: q8_0 + q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma4
      parameters: 8000000000
      context_length: 49152
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: 'DFLASH LIGADO 24/10 (pedido do dono) em 48K: DFlash @48K mediu 62,4 e 58,3 t/s em respostas longas (524 e 388 tokens), draft 307/864 (35,5%) e 215/688 (31,2%), pico 5296 MiB = 86,2%. Contra 29,6 t/s AR: ~2x. A aceitacao cai em relacao aos 65% vistos @65K numa resposta de codigo — acceptance depende do conteudo, e 33% ainda paga o drafter com folga. Em 65K o DFlash nao cabe (pico 91,2%). Smoke 24/10: upstream, ik NAO serve (compute buffer de gemma4 denso estoura acima de 16K). Tool calling OK (finish=tool_calls com argumento certo) e coerencia PT-BR OK. 131K NAO cabe em Q4 (93% projetado); com UD-Q3_K_XL mediu-se 38,5-39,9 t/s e 74% em 131K — numeros guardados, nao usados. Sliding window 512 em padrao 5 local : 1 global (7 camadas globais de 42) — eh o que encarece o KV em contexto longo. Card declara entrada texto-only: vision/audio existem no peso e NAO estao validados (nao anunciar vision).'
  qwen2.5-coder-1.5b-pollard:
    name: Qwen2.5 Coder 1.5B Pollard
    description: Qwen2.5-Coder-1.5B-Instruct memory-fit for code completion. FIM native, CPU-only serving with zero VRAM.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/qwen2.5-coder-1.5b-pollard-new/Qwen2.5-Coder-1.5B-Pollard-v2-IQ4XS-class.gguf

      --jinja

      --parallel 1

      --ctx-size ${completion_ctx}

      --temp 0.7

      --top-p 0.8

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --batch-size 512

      --ubatch-size 128

      --spec-type ngram-mod

      --spec-ngram-mod-n-match 24

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-max 64

      --no-webui

      --metrics

      '
    env:
      - CUDA_VISIBLE_DEVICES=
    filters:
      stripParams: temperature, top_p
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - text
      out:
        - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~824 MB (Pollard IQ4_XS + imatrix)
      context: 32768
      vram_usage: 0 (CPU-only)
      source: PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: true
        audio: false
        image: false
      architecture: qwen2
      parameters: 1540000000
      context_length: 32768
      embedding_length: 1536
      quantization: Pollard IQ4_XS
      note: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct. IQ4_XS with imatrix on mixed prose+code. FIM native (Qwen2.5-Coder tokens). CPU-only, coexists with GPU MoE. ngram-mod enabled.
  qwen3.6-35b-a3b-heretic:
    name: Qwen 3.6 35B Heretic
    description: Qwen's 35B-A3B MoE generalist, abliterated (heretic TPE). 131K context, single slot.
    cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

      --model ${models_dir}/qwen36-heretic-apex-mini/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Mini.gguf

      --mmproj ${models_dir}/qwen36-heretic-apex-mini/mmproj.gguf

      --ctx-size 131072

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --no-mmproj-offload

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      -cmoe

      -ngl 99

      -b 512

      -ub 128

      --temp ${code_temp}

      --top-p ${code_top_p}

      --top-k ${code_top_k}

      --min-p ${code_min_p}

      --repeat-penalty ${code_repeat_penalty}

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
        - text
        - image
      out:
        - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~14.66 GB (APEX-I-Compact, heretic)
      context: 131072
      vram_usage: ~5.1 GB VRAM + ~15 GB RAM pinned
      source: SC117/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-GGUF (I-Compact) + mmproj unsloth Q8
      kv_cache: q4_0/q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 34660000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX I-Compact
      note: 'vram detalhe: ~5.1 GB VRAM (turbo4 KV) + ~15 GB pinned RAM (hmoe) | turbo4 KV; hmoe experts pinned Produção Sep 24: café herdou o posto do ik-131K (menor pressão de VRAM/RAM, 262K nativo). Heretic KL 0.0015 (88% menos recusas). Sem MTP @262K (draft KV não cabe). Smoke 200 OK (7s). KV turbo4 = WHT-rotated, FA-fused (IK TurboQuant); source do mmproj: unsloth Q8.'
  lfm2.5-vl-3b:
    name: LFM2.5-VL 3B
    description: Liquid AI VLM with native grounding, OCR with layout annotation, and SigLIP2 NaFlex vision. 3B params, 32K context, 16 languages.
    tags:
      - vision
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-vl-3b/LFM2.5-VL-3B-Q6_K.gguf

      --mmproj ${models_dir}/lfm2.5-vl-3b/mmproj-LFM2.5-VL-3B-Q8_0.gguf

      --media-path ${media_path}

      --jinja

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 8192

      --ctx-size 32768

      --parallel 1

      --temp 0.3

      --top-p 0.9

      --top-k 40

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --flash-attn on

      --metrics

      '
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - text
        - image
      out:
        - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~2.22 GB (Q6_K) + 583 MB mmproj (Q8_0)
      context: 32768
      vram_usage: ~3.5 GB VRAM
      source: LiquidAI/LFM2.5-VL-3B-GGUF (Q6_K + mmproj Q8_0)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2_vl
      parameters: 3000000000
      context_length: 32768
      embedding_length: 2048
      quantization: Q6_K
      note: 'vram detalhe: ~3.5 GB (model 2.22GB + mmproj 583MB + cache + compute) | model 2.22GB Q6_K + mmproj 583MB + cache + compute VLM with SigLIP2 NaFlex (native resolution, 512x512 patches + thumbnail). Better grounding + OCR with layout than 1.6B. Single-turn high-throughput: object detection, OCR, translation. 16 languages incl Portuguese.'
  twil-lm3-pro:
    name: TwIL-LM3-Pro
    description: Twil LM3 Pro is webAI's 3.66B dense reasoning specialist, built on IBM Granite 4.2-3B. It targets formal logic and mathematical reasoning, with a 131K context window.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/twil-lm3-pro/TwIL-LM3-Pro-Q6_K.gguf

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 131072

      --ctx-size 131072

      --parallel 1

      --jinja

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty 1.0

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 1.0
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.0
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - text
      out:
        - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.80 GB (Q6_K)
      context: 131072
      vram_usage: ~4.5 GB VRAM
      source: webAI-Official/TwIL-LM3-Pro (Q6_K)
      kv_cache: q4_0/q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: granite
      parameters: 3659737600
      context_length: 131072
      embedding_length: 2560
      quantization: Q6_K
