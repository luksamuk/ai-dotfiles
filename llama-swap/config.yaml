      - Só o contrato OpenAI de transcrição (multipart field 'file'; response_format json|text)
      - Converte o upload com ffmpeg - sem ffmpeg no PATH a transcrição falha com 500
      - Não é TTS e não serve /v1/audio/speech
      - CPU-only por desenho (a VRAM da casa é escassa, 6 GB) - troque PARAKEET_DEVICE=cuda se quiser
