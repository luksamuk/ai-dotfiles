healthCheckTimeout: 300
logLevel: info
logTimeFormat: rfc3339
logToStdout: proxy
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0
macros:
  models_dir: ${env.HOME}/.llama-models
  media_path: ${env.HOME}/testfiles/vision
  templates_dir: ${env.HOME}/git/ai-dotfiles/llama-swap/templates
  llama_server: ${env.HOME}/git/llama.cpp/build/bin/llama-server
  ik_llama_server: ${env.HOME}/git/ik_llama.cpp/build/bin/llama-server
  bee_server: ${env.HOME}/git/beellama.cpp/build/bin/llama-server
  vllm_bin: ${env.HOME}/.vllm/bin/vllm
  default_temp: '0.7'
  default_top_p: '0.9'
  default_top_k: '20'
  default_min_p: '0.01'
  default_repeat_penalty: '1.05'
  code_temp: '0.6'
  code_top_p: '0.85'
  code_top_k: '40'
  code_min_p: '0.02'
  code_repeat_penalty: '1.05'
  think_temp: '0.6'
  think_top_p: '0.9'
  think_top_k: '20'
  think_min_p: '0.0'
  think_repeat_penalty: '1.0'
  small_model_min_ctx: '65536'
  small_model_max_ctx: '131072'
  completion_ctx: '32768'
  large_model_min_ctx: '65536'
  large_model_max_ctx: '131072'
  vram_margin: '512'
  small_cache_k: q8_0
  small_cache_v: q8_0
  large_cache_k: q4_0
  large_cache_v: q4_0
  gemma_cache_k: q4_0
  gemma_cache_v: q4_0
models:
  qwen3.5-4b:
    name: Qwen3.5 4B
    description: Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Uses hadamard KV cache for maximum context efficiency and ngram speculative decoding.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.8 GB (UD-Q4_K_XL)
      context: 64K-128K (dynamic)
      vram_usage: ~4.5GB VRAM (model 2.8GB + q8_0/q4_0 hadamard cache + compute)
      source: unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: ik_llama.cpp with hadamard KV cache + --fit for dynamic context. Ngram spec decode via ik syntax. Uses qwen-fixed-chat-template.jinja for tool-call instructions. Formerly qwen3.5-4b-mtp, consolidated Jul 2026.
  qwen3.5-4b-abliterated:
    name: Qwen3.5 4B Abliterated
    description: Qwen 3.5 is a family of open-source multimodal models that delivers exceptional utility and performance. Abliterated variant with refusal behaviors removed for adversarial testing and NSFW prompt enhancement.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.5-4b-abliterated/Huihui-Qwen3.5-4B-abliterated.Q4_K_M.gguf

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --fit

      --fit-margin 512

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: Q4_K_M
      size: ~2.71 GB (Q4_K_M)
      context: 64K-128K (dynamic)
      vram_usage: ~4.5GB VRAM (model 2.71GB + q4_0/q4_0 hadamard cache + compute)
      source: mradermacher/Huihui-Qwen3.5-4B-abliterated-GGUF (Q4_K_M)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      note: Abliterated variant — refusal behaviors removed via Abliterix. Parameters aligned to qwen3.5-4b normal (Aug 2026). Uses Huihui-Qwen3.5-4B-abliterated (renamed from Qwen3.5-4B-abliterated-i1).
  qwen3.5-9b:
    name: Qwen3.5 9B
    description: Qwen 3.5 is a family of open-source multimodal models that delivers exceptional utility and performance, integrating breakthroughs in multimodal learning, architectural efficiency, and reinforcement learning.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/Qwen3.5-9B-MoQ-3.6.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~3.75 GB (MoQ-3.6)
      context: 64K-128K (dynamic)
      vram_usage: ~4.8GB VRAM (text-only, ik with hadamard cache)
      source: w-ahmad/Qwen3.5-9B-GGUF-MoQ (MoQ-3.6)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 8950000000
      context_length: 262144
      embedding_length: 4096
      quantization: MoQ-3.6
      note: 'MoQ-3.6 replaces UD-Q4_K_XL: same speed (12.2 tok/s), equal+ quality (21/25 vs 20/25 Snake), 32% smaller (3.75 vs 5.55 GB). MTP OOM on 6GB VRAM. OOM fix: q4_0 K cache (was q8_0), ctx-checkpoints=0, batch-size=512, ubatch=128 — prevents CUDA OOM at ~92K tokens on RTX 3050 6GB. --spec-type ngram-mod removed (spec decode buffers compete for VRAM with context checkpoints, aggravating OOM).'
  gemma4-e2b:
    name: Gemma 4 E2B
    description: Gemma 4 E2B QAT — Unsloth Dynamic 2.0 (UD-Q4_K_XL). Higher accuracy and smaller than Google Q4_0.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf

      --no-mmproj

      --fit on

      --fit-target 1024

      --fit-ctx ${small_model_min_ctx}

      --ctx-size ${small_model_max_ctx}

      --parallel 4

      --temp 0.7

      --top-p 0.9

      --top-k 40

      --min-p 0.01

      --repeat-penalty 1.0

      --reasoning on

      --cache-type-k ${gemma_cache_k}

      --cache-type-v ${gemma_cache_v}

      --flash-attn on

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.5 GB (UD-Q4_K_XL)
      context: 32K-128K (dynamic)
      vram_usage: ~2.5GB
      source: unsloth/gemma-4-E2B-it-qat-GGUF
      kv_cache: q4_0 + attn_rot
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma4
      parameters: 4650000000
      context_length: 131072
      embedding_length: 1536
      quantization: UD-Q4_K_XL
      note: Unsloth Dynamic 2.0 QAT. Better accuracy than Google Q4_0 (Top-1 98.16% vs 89.29%), 22% smaller. Upstream only — NOT compatible with ik_llama.
  lfm2.5-1.2b:
    name: LFM 2.5 1.2B
    description: Liquid AI on-device instruct model. 1.2B dense hybrid with 128K context. Smallest LFM2.5 — ideal for edge deployment and lightweight agents. DSpark speculative decoding for up to 2.87x speedup.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-1.2b/LFM2.5-1.2B-Instruct-QAD-Q4_0.gguf

      --fit on

      --fit-ctx 131072

      --ctx-size 131072

      --parallel 1

      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja

      --temp 0.1

      --top-p 0.9

      --top-k 50

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      --jinja

      -md ${models_dir}/lfm2.5-1.2b/LFM2.5-1.2B-Instruct-DSpark-Draft-v1-F16.gguf

      --spec-type draft-dspark

      --spec-draft-n-max 10

      --spec-draft-n-min 0

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: ~696 MB (QAD Q4_0) + 567 MB DSpark draft
      context: 64K-128K (dynamic)
      vram_usage: ~1.5GB VRAM (model + draft + KV)
      source: LiquidAI/LFM2.5-1.2B-Instruct-GGUF (QAD Q4_0)
      kv_cache: q4_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 1200000000
      context_length: 131072
      embedding_length: 2048
      quantization: QAD Q4_0
      note: Smallest LFM2.5. Dense hybrid (22 conv + 8 GQA). Instruct variant (no reasoning tag). 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. QAD Q4_0 recovers ~97% of BF16 quality. DSpark F16 draft sidecar (567MB) adds up to 2.87x speedup on-device. Ideal for edge/embedded or as lightweight agent.
  lfm2.5-2.6b:
    name: LFM 2.5 2.6B
    description: Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-QAD-Q4_0.gguf

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 131072

      --ctx-size 131072

      --parallel 1

      --reasoning on

      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja

      --temp 0.1

      --top-p 0.9

      --top-k 50

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      --jinja

      -md ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-DSpark-Draft-v1-F16.gguf

      --spec-type draft-dspark

      --spec-draft-n-max 10

      --spec-draft-n-min 0

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.1
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~1.55 GB (QAD Q4_0)
      context: 64K-128K (dynamic)
      vram_usage: ~3.9GB VRAM (model 1.55GB + q4_0 KV 131K + compute)
      source: LiquidAI/LFM2.5-2.6B-GGUF (QAD Q4_0)
      kv_cache: q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: QAD Q4_0
      note: Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. Only 8/30 layers are attention (GQA), KV cache is tiny - q4_0 fits 131K full VRAM in 6GB. QAD (Quantization-Aware Distillation) recovers ~97% of BF16 quality vs native Q4_0. DSpark speculative decoding via F16 draft sidecar (633MB) — up to 2.27x speedup on-device, 57% latency reduction for function calling.
  qwen2.5-coder-1.5b-pollard:
    name: Qwen2.5 Coder 1.5B Pollard
    description: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct, CPU-only. IQ4_XS with imatrix. FIM native. Code completion on CPU, zero VRAM, coexists with GPU MoE.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/qwen2.5-coder-1.5b-pollard/Qwen2.5-Coder-1.5B-Instruct-Pollard-IQ4_XS.gguf

      --jinja

      --parallel 1

      --ctx-size ${completion_ctx}

      --temp 0.7

      --top-p 0.8

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --batch-size 512

      --ubatch-size 128

      --spec-type ngram-mod

      --spec-ngram-mod-n-match 24

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-max 64

      --no-webui

      --metrics

      '
    env:
    - CUDA_VISIBLE_DEVICES=
    filters:
      stripParams: temperature, top_p
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~824 MB (Pollard IQ4_XS + imatrix)
      context: 32K (completion)
      vram_usage: 0 (CPU-only)
      source: PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: true
        audio: false
        image: false
      architecture: qwen2
      parameters: 1540000000
      context_length: 32768
      embedding_length: 1536
      quantization: Pollard IQ4_XS (imatrix-guided, role/depth-aware)
      note: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct. IQ4_XS with imatrix on mixed prose+code. FIM native (Qwen2.5-Coder tokens). CPU-only, coexists with GPU MoE. ngram-mod enabled.
  ornith-1.5-35b:
    name: Ornith 1.5 35B
    description: Ornith-1.5 is a family of open-source LLMs trained with end-to-end self-improvement — the model proposes new tasks, generates task-specific scaffolds, and produces solution rollouts for RL, continuously creating new learning experiences. APEX Compact quantization with vision support.
    cmd: "${ik_llama_server} --port ${PORT}\n--model ${models_dir}/ornith-1.5-35b/Ornith-1.5-35B-A3B-APEX-Compact.gguf\n--mmproj ${models_dir}/ornith-1.5-35b/mmproj.gguf\n--no-mmproj-offload\n--fit\n--fit-margin 1024\n--ctx-size 131072\n--temp 0.6\n--top-p 0.95\n--top-k 20\n--min-p ${code_min_p}\n--repeat-penalty ${code_repeat_penalty}\n--reasoning on\n--reasoning-budget 8192\n--reasoning-budget-message \"Let me conclude my reasoning and provide the answer.\"\n--jinja\n--chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja\n--parallel 1\n--parallel-tool-calls\n--cache-type-k ${large_cache_k}\n--cache-type-v ${large_cache_v}\n--k-cache-hadamard\n--v-cache-hadamard\n--flash-attn auto\n--defer-experts\n--prefetch-experts\n--spec-type ngram-mod:n_max=64,n_min=48,ngram_size_n=24\n  --metrics\n"
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~16.5 GB (APEX Compact) + 899 MB mmproj
      context: 1K-131K (safe max, model supports 262K)
      vram_usage: ~4.7GB VRAM + ~15GB pinned RAM (ik pinned memory, ~36 tok/s ngram-mod)
      source: mudler/Ornith-1.5-35B-A3B-APEX-GGUF
      kv_cache: q4_0 + attn_rot + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX Compact (no MTP)
      note: APEX Compact without MTP draft head. Saves ~500MB VRAM vs MTP variant. Uses ngram-mod for speculative decoding (~36 tok/s vs 45 with MTP). Vision via mmproj with --no-mmproj-offload. Same quality as MTP variant — MTP only affects speed, not quality. Lower VRAM pressure allows running alongside IDE/other GPU processes.
  qwen3-vl-4b:
    name: Qwen3-VL 4B
    description: Qwen3-VL dense 4B vision-language model with native 2D/3D grounding, OCR in 32 languages, visual agent GUI, and video understanding.
    tags:
    - vision
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/qwen3-vl-4b/Qwen3VL-4B-Instruct-Q4_K_M.gguf\n--mmproj ${models_dir}/qwen3-vl-4b/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf\n--media-path ${media_path}\n--jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx 8192\n--ctx-size 32768\n--parallel 1\n--temp 0.7\n--top-p 0.8\n--top-k 20\n--min-p 0.0\n--repeat-penalty 1.0\n--presence-penalty 1.5\n--cache-type-k ${small_cache_k}\n--cache-type-v ${small_cache_v}\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: 2.5 GB (Q4_K_M) + 454 MB mmproj
      context: 8K-256K (dynamic)
      vram_usage: ~4 GB (model + mmproj + cache)
      source: Qwen/Qwen3-VL-4B-Instruct-GGUF (Q4_K_M + mmproj Q8_0)
      note: 'Native grounding: bbox_2d [x1,y1,x2,y2] in 0-1000 scale. repeat_penalty 1.0 mandatory.'
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: qwen3vl
      parameters: 4000000000
      context_length: 256000
      embedding_length: 2560
      quantization: Q4_K_M
  lfm2.5-vl-3b:
    name: LFM2.5-VL 3B
    description: Liquid AI VLM with native grounding, OCR with layout annotation, and SigLIP2 NaFlex vision. 3B params, 32K context, 16 languages.
    tags:
    - vision
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-vl-3b/LFM2.5-VL-3B-Q6_K.gguf

      --mmproj ${models_dir}/lfm2.5-vl-3b/mmproj-LFM2.5-VL-3B-Q8_0.gguf

      --media-path ${media_path}

      --jinja

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 8192

      --ctx-size 32768

      --parallel 1

      --temp 0.3

      --top-p 0.9

      --top-k 40

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --flash-attn on

      --metrics

      '
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~2.22 GB (Q6_K) + 583 MB mmproj (Q8_0)
      context: 8K-32K (dynamic)
      vram_usage: ~3.5 GB (model 2.22GB + mmproj 583MB + cache + compute)
      source: LiquidAI/LFM2.5-VL-3B-GGUF (Q6_K + mmproj Q8_0)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: lfm2_vl
      parameters: 3000000000
      context_length: 32768
      embedding_length: 2048
      quantization: Q6_K
      note: 'VLM with SigLIP2 NaFlex (native resolution, 512x512 patches + thumbnail). Better grounding + OCR with layout than 1.6B. Single-turn high-throughput: object detection, OCR, translation. 16 languages incl Portuguese.'
