      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
      --repeat-penalty ${default_repeat_penalty}
      --reasoning on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --no-graph-reuse
      --ctx-checkpoints 0
      --ctx-checkpoints-interval 0
      --batch-size 512
      --ubatch-size 128
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: Q4_K_M
      size: "~2.71 GB (Q4_K_M)"
      context: "64K-128K (dynamic)"
      vram_usage: "~4.5GB VRAM (model 2.71GB + q4_0/q4_0 hadamard cache + compute)"
      source: "mradermacher/Huihui-Qwen3.5-4B-abliterated-GGUF (Q4_K_M)"
      kv_cache: "q4_0/q4_0 + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      note: "Abliterated variant — refusal behaviors removed via Abliterix. Parameters aligned to qwen3.5-4b normal (Aug 2026). Uses Huihui-Qwen3.5-4B-abliterated (renamed from Qwen3.5-4B-abliterated-i1)."
# -------------------------------------------
# QWEN3.5-9B - ik BACKEND (Hadamard KV cache)
# Dense 9B params, MoQ-3.6 ~3.75GB.
# MoQ-3.6: replaced UD-Q4_K_XL (~5.55GB) — same speed (12.2 tok/s),
# equal+ quality (21/25 Snake vs 20/25), 32% smaller.
# ik with hadamard cache gives near-fp16 quality at smaller memory footprint.
# --flash-attn auto: disables FA on short contexts for MoE/offload savings
# --parallel-tool-calls: enables multiple tool calls in single response
# Dual mode: base (chat, no think) and :think (reasoning)
# MTP tested but OOM on RTX 3050 6GB with --multi-token-prediction
# Bee backup: _disabled/qwen3.5-9b-bee.yaml (seg fault with turbo3_tcq)
# -------------------------------------------
  "qwen3.5-9b":
    name: "Qwen3.5 9B"
    description: "Qwen 3.5 is a family of open-source multimodal models that delivers exceptional utility and performance, integrating breakthroughs in multimodal learning, architectural efficiency, and reinforcement learning."
    cmd: |
      ${ik_llama_server} --port ${PORT}
      --model ${models_dir}/Qwen3.5-9B-MoQ-3.6.gguf
      --fit
      --fit-margin 512
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --ctx-size ${small_model_max_ctx}
      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
      --repeat-penalty ${default_repeat_penalty}
      --reasoning on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --no-graph-reuse
      --ctx-checkpoints 0
      --ctx-checkpoints-interval 0
      --batch-size 512
      --ubatch-size 128
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~3.75 GB (MoQ-3.6)"
      context: "64K-128K (dynamic)"
      vram_usage: "~4.8GB VRAM (text-only, ik with hadamard cache)"
      source: "w-ahmad/Qwen3.5-9B-GGUF-MoQ (MoQ-3.6)"
      kv_cache: "q4_0/q4_0 + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 8950000000
      context_length: 262144
      embedding_length: 4096
      quantization: MoQ-3.6
      note: "MoQ-3.6 replaces UD-Q4_K_XL: same speed (12.2 tok/s), equal+ quality (21/25 vs 20/25 Snake), 32% smaller (3.75 vs 5.55 GB). MTP OOM on 6GB VRAM. OOM fix: q4_0 K cache (was q8_0), ctx-checkpoints=0, batch-size=512, ubatch=128 — prevents CUDA OOM at ~92K tokens on RTX 3050 6GB. --spec-type ngram-mod removed (spec decode buffers compete for VRAM with context checkpoints, aggravating OOM)."
# -------------------------------------------
# GEMMA-4-E2B - Unsloth UD-Q4_K_XL (Dynamic 2.0 QAT)
# Unsloth Dynamic 2.0 quantization of Google QAT weights.
# Better accuracy than naive Q4_0: Top-1 98.16% vs 89.29%, 22% smaller.
# Uses UD-Q4_K_XL format — upstream llama.cpp only (NOT ik_llama).
# Text-only — no mmproj (vision handled by dedicated VLMs in fleet).
# -------------------------------------------
  "gemma4-e2b":
    name: "Gemma 4 E2B"
    description: "Gemma 4 E2B QAT — Unsloth Dynamic 2.0 (UD-Q4_K_XL). Higher accuracy and smaller than Google Q4_0."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      --no-mmproj
      --fit on
      --fit-target 1024
      --fit-ctx ${small_model_min_ctx}
      --ctx-size ${small_model_max_ctx}
      --parallel 4
      --temp 0.7
      --top-p 0.9
      --top-k 40
      --min-p 0.01
      --repeat-penalty 1.0
      --reasoning on
      --cache-type-k ${gemma_cache_k}
      --cache-type-v ${gemma_cache_v}
      --flash-attn on
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~2.5 GB (UD-Q4_K_XL)"
      context: "32K-128K (dynamic)"
      vram_usage: "~2.5GB"
      source: "unsloth/gemma-4-E2B-it-qat-GGUF"
      kv_cache: "q4_0 + attn_rot"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma4
      parameters: 4650000000
      context_length: 131072
      embedding_length: 1536
      quantization: UD-Q4_K_XL
      note: "Unsloth Dynamic 2.0 QAT. Better accuracy than Google Q4_0 (Top-1 98.16% vs 89.29%), 22% smaller. Upstream only — NOT compatible with ik_llama."
# -------------------------------------------
# LFM2.5-1.2B-Instruct - Liquid AI on-device instruct model (dense hybrid)
# 1.2B params, 30 layers (22 double-gated short conv + 8 GQA)
# 128K context, 128K vocab, 16 languages incl Portuguese
# ChatML-like format, same as LFM2.5-2.6B and 8B-A1B
# GGUF has NO chat_template - requires --chat-template-file
# Backend: upstream llama.cpp (lfm2 arch, dense model)
# QAD Q4_0 = 696 MB - fits entirely in VRAM with room for context
# DSpark: F16 draft sidecar (567 MB), block size 9, up to 2.87x speedup on-device
# Smallest LFM2.5 model — good for edge/embedded or as lightweight agent
# -------------------------------------------
  lfm2.5-1.2b:
    name: "LFM 2.5 1.2B"
    description: "Liquid AI on-device instruct model. 1.2B dense hybrid with 128K context. Smallest LFM2.5 — ideal for edge deployment and lightweight agents. DSpark speculative decoding for up to 2.87x speedup."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/lfm2.5-1.2b/LFM2.5-1.2B-Instruct-QAD-Q4_0.gguf
      --fit on
      --fit-ctx 131072
      --ctx-size 131072
      --parallel 1
      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja
      --temp 0.1
      --top-p 0.9
      --top-k 50
      --min-p 0.0
      --repeat-penalty 1.1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      -md ${models_dir}/lfm2.5-1.2b/LFM2.5-1.2B-Instruct-DSpark-Draft-v1-F16.gguf
      --spec-type draft-dspark
      --spec-draft-n-max 10
      --spec-draft-n-min 0
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: "~696 MB (QAD Q4_0) + 567 MB DSpark draft"
      context: "64K-128K (dynamic)"
      vram_usage: "~1.5GB VRAM (model + draft + KV)"
      source: "LiquidAI/LFM2.5-1.2B-Instruct-GGUF (QAD Q4_0)"
      kv_cache: "q4_0"
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 1200000000
      context_length: 131072
      embedding_length: 2048
      quantization: QAD Q4_0
      note: "Smallest LFM2.5. Dense hybrid (22 conv + 8 GQA). Instruct variant (no reasoning tag). 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. QAD Q4_0 recovers ~97% of BF16 quality. DSpark F16 draft sidecar (567MB) adds up to 2.87x speedup on-device. Ideal for edge/embedded or as lightweight agent."
# -------------------------------------------
# LFM2.5-2.6B - Liquid AI agentic on-device model (dense hybrid, text-only)
# 2.69B params, 30 layers (22 double-gated short conv + 8 GQA)
# Pre-trained on ~34T tokens, 128K context, 128K vocab
# 16 languages including Portuguese
# Reasoning model: always thinks before answering (tag 205)
# ChatML-like format, same as LFM2.5-8B-A1B
# GGUF has NO chat_template - requires --chat-template-file
# Backend: upstream llama.cpp (lfm2 arch supported, dense model)
# Model card params: temp=0.1, top_k=50, repeat_penalty=1.1
# Agentic RL post-training: trained inside Hermes Agent, OpenClaw, Pi
# Strong tool calling (ToolSandbox 77.83, ahead of Qwen3.5-9B at 76.44)
# Q8_0 = 2.87 GB - fits entirely in VRAM with room for context
# Only 8/30 layers are attention (GQA), KV cache is tiny - keep f16 (q8_0 is pure dequant overhead)
# -------------------------------------------
  lfm2.5-2.6b:
    name: "LFM 2.5 2.6B"
    description: "Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-QAD-Q4_0.gguf
      --fit on
      --fit-target ${vram_margin}
      --fit-ctx 131072
      --ctx-size 131072
      --parallel 1
      --reasoning on
      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja
      --temp 0.1
      --top-p 0.9
      --top-k 50
      --min-p 0.0
      --repeat-penalty 1.1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      -md ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-DSpark-Draft-v1-F16.gguf
      --spec-type draft-dspark
      --spec-draft-n-max 10
      --spec-draft-n-min 0
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.1
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~1.55 GB (QAD Q4_0)"
      context: "64K-128K (dynamic)"
      vram_usage: "~3.9GB VRAM (model 1.55GB + q4_0 KV 131K + compute)"
      source: "LiquidAI/LFM2.5-2.6B-GGUF (QAD Q4_0)"
      kv_cache: "q4_0"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: QAD Q4_0
      note: "Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. Only 8/30 layers are attention (GQA), KV cache is tiny - q4_0 fits 131K full VRAM in 6GB. QAD (Quantization-Aware Distillation) recovers ~97% of BF16 quality vs native Q4_0. DSpark speculative decoding via F16 draft sidecar (633MB) — up to 2.27x speedup on-device, 57% latency reduction for function calling."
# -------------------------------------------
# ORNITH-1.5-35B-A3B - MoE AGENTIC CODING + VISION (APEX, no MTP)
# MoE 35B params, ~3B ativo por token. 256 experts, 8+1 active.
# Self-improving RL: extends Ornith-1.0 self-scaffolding into full self-improvement loop
# (task generation + scaffold construction + solution rollouts).
# Same qwen35moe architecture as Ornith-1.0 and Qwen3.6-35B-A3B.

# APEX Compact ~16.5GB — APEX mixed-precision, no MTP draft head.
# No MTP: saves ~500MB VRAM vs MTP variant. Uses ngram-mod for speculative decoding.
# Vision: mmproj.gguf (899MB, CLIP-based) — --no-mmproj-offload keeps it in RAM
#   to preserve VRAM for model weights.
# ik_llama backend: --fit, --defer-experts, hadamard KV, pinned memory.
# --fit-margin 1024: moderate headroom for context-shift + KV cache near full ctx

# Samplers (from model card):
#   General tasks: temp=0.6, top_p=0.95, top_k=20
#   Benchmarks: temp=1.0

# --ctx-size 131072: same safe ceiling (model supports 262K, YaRN extends to 1M)
# Dual mode: base (chat, no think) and :think (reasoning)
# --reasoning-budget 8192: caps thinking tokens at 8192 when :think is active.
#   Base mode is unaffected (template injects closed think block, budget never triggers).
# --reasoning-budget-message: smooth transition when budget is exhausted.
# Uses qwen-fixed-chat-template.jinja — embedded GGUF template lacks
# tool-call format instructions, causing leakage without the fixed template.

# Benchmark (Aug 2026, RTX 3050 6GB, ik_llama v4840):
#   Text: ~36 tok/s (ngram-mod), VRAM ~4.7GB (vs 5.2GB with MTP Compact)
#   vs MTP Compact: 36 vs 45 tok/s, but ~500MB less VRAM
# -------------------------------------------
  "ornith-1.5-35b":
    name: "Ornith 1.5 35B"
    description: "Ornith-1.5 is a family of open-source LLMs trained with end-to-end self-improvement — the model proposes new tasks, generates task-specific scaffolds, and produces solution rollouts for RL, continuously creating new learning experiences. APEX Compact quantization with vision support."
    cmd: |
      ${ik_llama_server} --port ${PORT}
      --model ${models_dir}/ornith-1.5-35b/Ornith-1.5-35B-A3B-APEX-Compact.gguf
      --mmproj ${models_dir}/ornith-1.5-35b/mmproj.gguf
      --no-mmproj-offload
      --fit
      --fit-margin 1024
      --ctx-size 131072
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p ${code_min_p}
      --repeat-penalty ${code_repeat_penalty}
      --reasoning on
      --reasoning-budget 8192
      --reasoning-budget-message Let me conclude my reasoning and provide the answer.
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --cache-type-k ${large_cache_k}
      --cache-type-v ${large_cache_v}
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --defer-experts
      --prefetch-experts
      --spec-type ngram-mod:n_max=64,n_min=48,ngram_size_n=24
        --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
        - 'text'
        - 'image'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~16.5 GB (APEX Compact) + 899 MB mmproj"
      context: "1K-131K (safe max, model supports 262K)"
      vram_usage: "~4.7GB VRAM + ~15GB pinned RAM (ik pinned memory, ~36 tok/s ngram-mod)"
      source: "mudler/Ornith-1.5-35B-A3B-APEX-GGUF"
      kv_cache: "q4_0 + attn_rot + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX Compact (no MTP)
      note: "APEX Compact without MTP draft head. Saves ~500MB VRAM vs MTP variant. Uses ngram-mod for speculative decoding (~36 tok/s vs 45 with MTP). Vision via mmproj with --no-mmproj-offload. Same quality as MTP variant — MTP only affects speed, not quality. Lower VRAM pressure allows running alongside IDE/other GPU processes."
