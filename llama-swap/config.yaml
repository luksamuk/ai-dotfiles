    # Papel query do sprach: sem set o solver trata bonsai2-9b como exclusivo e ele
    # evicta o embedding a cada request de RAG (ping-pong → HTTP 500).
    bs2_embed: "bs2 & (lfmcol | eg2) & pkstt" # k2/k2p/k2fim _disabled 16/out (pesos deletados); q36 REMOVED Oct 8 2026 — aposentado; orn15 merged no heretic

    # Tradução (leve, cabe com embedding/reranker)
    # translate_embed removed (hmt uninstalled)
    translate_only: "tg"

    # External TTS (separate process, same GPU)
    tts_external: "ttsext"

    # Embedding/Reranker sozinho (RAG indexing, semantic search, reranking)
    # AND entre todos os CPU-only: coexistem (zero VRAM) — OR evitaria em ping-pong
    embed_only: "lfmemb & lfmcol & eg2 & pkstt"

    # Reranker sozinho (late-interaction reranking, CPU-only)
    rerank_only: "lfmcol"

    # Reranker + Embedding (two-stage retrieval: dense → rerank)
    rerank_embed: "lfmcol & (lfmemb | eg2) & pkstt"

