  granite-4.2-8b:
    name: Granite 4.2 8B
    description: IBM Granite 4.2 8B — dense reasoning model with native thinking, agentic RL training, and tool calling. Purpose-built for enterprise agentic workflows.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/granite-4.2-8b-IQ4_XS.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/granite-4.2-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp 1.0

      --top-p 0.95

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 1.0
          top_p: 0.95
        ${MODEL_ID}:high:
          chat_template_kwargs:
            enable_thinking: true
            low_effort: false
          temperature: 1.0
          top_p: 0.95
        ${MODEL_ID}:low:
          chat_template_kwargs:
            enable_thinking: true
            low_effort: true
          temperature: 1.0
          top_p: 0.95
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~4.6 GB (IQ4_XS)
      context: 128K native (512K extended)
      vram_usage: ~5.2GB VRAM (text-only, ik with hadamard cache)
      source: ibm-granite/granite-4.2-8b (IQ4_XS, self-quantized)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: granite
      parameters: 8000000000
      context_length: 131072
      embedding_length: 4096
      quantization: IQ4_XS
      note: '3 thinking modes: base (non-thinking), :high (full CoT), :low (low-effort). IBM-recommended samplers: temp=1.0, top_p=0.95. Agentic RL trained. Apache 2.0. IQ4_XS self-quantized — 4.42 BPW.'
  lfm2.5-8b-a1b:
    name: LFM 2.5 8B
    description: Liquid AI MoE hybrid — 8.3B total, 1.5B active per token. Built for fast, reliable tool calling on consumer hardware.
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/lfm2.5-8b-a1b/LFM2.5-8B-A1B-APEX-I-Compact.gguf\n--fit on\n--fit-ctx 16384\n--ctx-size 131072\n--parallel 1\n--no-cont-batching\n--reasoning-format deepseek-legacy\n--reasoning on\n--chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja\n--temp 0.2\n--top-p 0.8\n--top-k 40\n--min-p 0.15\n--repeat-penalty 1.05\n--cache-type-k q8_0\n--cache-type-v q4_0\n--flash-attn on\n--n-predict -1\n--jinja\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.2
          min_p: 0.15
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.3
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~4.2 GB (APEX I-Compact)
      context: 128K
      vram_usage: ~5.2GB VRAM (4.2 GB model + KV)
      source: mudler/LFM2.5-8B-A1B-APEX-GGUF
      kv_cache: q8_0 + q4_0 hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2moe
      parameters: 8470000000
      context_length: 128000
      embedding_length: 2048
      quantization: APEX I-Compact
      note: 'MoE 1.5B active, hybrid conv+GQA. Reasoning + tool calling. APEX I-Compact: 13% smaller than Q4_0, imatrix v1.3 calibrated. Uses upstream (BeeLlama segfaults on LFM2.5). GGUF has empty chat_template — requires --chat-template-file + --reasoning-format deepseek.'
  qwen3-tts:
    name: Qwen3-TTS 0.6B
    description: Text-to-speech with voice cloning. 8 Portuguese voices. OpenAI-compatible /v1/audio/speech endpoint with voice profiles from voiceclone-tui.
    tags:
    - tts
    proxy: http://127.0.0.1:8880
    checkEndpoint: /v1/audio/voices
    cmd: '${env.HOME}/projects/ai/tts-api/.venv/bin/python ${env.HOME}/projects/ai/tts-api/tts_server.py --port 8880 --host 127.0.0.1

      '
    cmdStop: pkill -f tts_server.py
    health_check_timeout: 300
    ttl: 300
    capabilities:
      in:
      - text
      out:
      - audio
      tools: false
      reranker: false
      context: 0
    metadata:
      size: ~600MB (Qwen3-TTS-12Hz-0.6B-Base, torch-direct)
      context: N/A (TTS generation, not LLM context)
      vram_usage: ~2GB VRAM (torch-direct, separate GPU allocation)
      source: Qwen/Qwen3-TTS-12Hz-0.6B-Base (HuggingFace)
      kv_cache: N/A
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: true
        image: false
      architecture: qwen3-tts
      parameters: 600000000
      context_length: 0
      embedding_length: 0
      quantization: torch-direct (no GGUF)
      caveats:
      - External FastAPI server on port 8880 (not llama.cpp)
      - Must install qwen_tts and dependencies in ~/projects/ai/tts-api/.venv
      - Voice profiles loaded from ~/.config/voiceclone-tui/voices.json
      - Supports voice cloning with reference audio samples
      - Portuguese (pt-BR) voices with accent control
  translategemma-4b:
    name: TranslateGemma 4B
    description: Open translation models built on Gemma 3, helping people communicate across 55 languages. The 4B variant is optimized for mobile and edge devices.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/translategemma-4b/translategemma-4b-it.Q4_K_M.gguf

      --no-jinja

      --chat-template gemma

      --fit on

      --parallel 1

      --ctx-size ${small_model_max_ctx}

      --temp 0.2

      --top-p 0.9

      --top-k 40

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --flash-attn on

      --metrics

      '
    health_check_timeout: 300
    ttl: 60
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: ~2.4 GB (Q4_K_M)
      context: 32K-128K (dynamic)
      vram_usage: ~3.5GB (model + cache)
      source: mradermacher/translategemma-4b-it-GGUF (Q4_K_M, from google/translategemma-4b-it)
      kv_cache: q8_0 + attn_rot
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma3
      parameters: 3880000000
      context_length: 131072
      embedding_length: 2560
      quantization: Q4_K_M
      caveats:
      - Native Jinja template crashes llama.cpp — must use --no-jinja --chat-template gemma
      - Needs explicit translation prompt (Sprachspiel format works)
      note: Translation model. Sprachspiel translate mode default. 55 languages.
hooks:
  on_startup:
    preload: []
