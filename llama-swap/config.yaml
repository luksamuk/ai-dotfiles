healthCheckTimeout: 300
logLevel: info
logTimeFormat: rfc3339
logToStdout: proxy
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0
macros:
  models_dir: ${env.HOME}/.llama-models
  media_path: ${env.HOME}/testfiles/vision
  templates_dir: ${env.HOME}/git/ai-dotfiles/llama-swap/templates
  llama_server: ${env.HOME}/git/llama.cpp/build/bin/llama-server
  ik_llama_server: ${env.HOME}/git/ik_llama.cpp/build/bin/llama-server
  vllm_bin: ${env.HOME}/.vllm/bin/vllm
  default_temp: '0.7'
  default_top_p: '0.9'
  default_top_k: '20'
  default_min_p: '0.01'
  default_repeat_penalty: '1.05'
  code_temp: '0.6'
  code_top_p: '0.85'
  code_top_k: '40'
  code_min_p: '0.02'
  code_repeat_penalty: '1.05'
  think_temp: '0.6'
  think_top_p: '0.9'
  think_top_k: '20'
  think_min_p: '0.0'
  think_repeat_penalty: '1.0'
  small_model_min_ctx: '65536'
  small_model_max_ctx: '131072'
  large_model_min_ctx: '65536'
  large_model_max_ctx: '131072'
  vram_margin: '512'
  small_cache_k: q8_0
  small_cache_v: q8_0
  large_cache_k: q4_0
  large_cache_v: q4_0
  gemma_cache_k: q4_0
  gemma_cache_v: q4_0
models:
  qwen3.5-4b:
    name: Qwen3.5 4B
    description: Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Uses hadamard KV cache for maximum context efficiency and ngram speculative decoding.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.8 GB (UD-Q4_K_XL)
      context: 64K-128K (dynamic)
      vram_usage: ~4.5GB VRAM (model 2.8GB + q8_0/q4_0 hadamard cache + compute)
      source: unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: ik_llama.cpp with hadamard KV cache + --fit for dynamic context. Ngram spec decode via ik syntax. Uses qwen-fixed-chat-template.jinja for tool-call instructions. Formerly qwen3.5-4b-mtp, consolidated Jul 2026.
  qwen3.5-4b-abliterated:
    name: Qwen3.5 4B Abliterated
    description: Qwen 3.5 is a family of open-source multimodal models that delivers exceptional utility and performance. Abliterated variant with refusal behaviors removed for adversarial testing and NSFW prompt enhancement.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.5-4b-abliterated/Huihui-Qwen3.5-4B-abliterated.Q4_K_M.gguf

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --fit

      --fit-margin 512

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: Q4_K_M
      size: ~2.71 GB (Q4_K_M)
      context: 64K-128K (dynamic)
      vram_usage: ~4.5GB VRAM (model 2.71GB + q4_0/q4_0 hadamard cache + compute)
      source: mradermacher/Huihui-Qwen3.5-4B-abliterated-GGUF (Q4_K_M)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      note: Abliterated variant — refusal behaviors removed via Abliterix. Parameters aligned to qwen3.5-4b normal (Aug 2026). Uses Huihui-Qwen3.5-4B-abliterated (renamed from Qwen3.5-4B-abliterated-i1).
  qwen3.5-9b:
    name: Qwen3.5 9B
    description: Qwen 3.5 is a family of open-source multimodal models that delivers exceptional utility and performance, integrating breakthroughs in multimodal learning, architectural efficiency, and reinforcement learning.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/Qwen3.5-9B-MoQ-3.6.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~3.75 GB (MoQ-3.6)
      context: 64K-128K (dynamic)
      vram_usage: ~4.8GB VRAM (text-only, ik with hadamard cache)
      source: w-ahmad/Qwen3.5-9B-GGUF-MoQ (MoQ-3.6)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 8950000000
      context_length: 262144
      embedding_length: 4096
      quantization: MoQ-3.6
      note: 'MoQ-3.6 replaces UD-Q4_K_XL: same speed (12.2 tok/s), equal+ quality (21/25 vs 20/25 Snake), 32% smaller (3.75 vs 5.55 GB). MTP OOM on 6GB VRAM. OOM fix: q4_0 K cache (was q8_0), ctx-checkpoints=0, batch-size=512, ubatch=128 — prevents CUDA OOM at ~92K tokens on RTX 3050 6GB. --spec-type ngram-mod removed (spec decode buffers compete for VRAM with context checkpoints, aggravating OOM).'
  gemma4-e2b:
    name: Gemma 4 E2B
    description: Gemma 4 E2B QAT — Unsloth Dynamic 2.0 (UD-Q4_K_XL). Higher accuracy and smaller than Google Q4_0.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf

      --no-mmproj

      --fit on

      --fit-target 1024

      --fit-ctx ${small_model_min_ctx}

      --ctx-size ${small_model_max_ctx}

      --parallel 4

      --temp 0.7

      --top-p 0.9

      --top-k 40

      --min-p 0.01

      --repeat-penalty 1.0

      --reasoning on

      --cache-type-k ${gemma_cache_k}

      --cache-type-v ${gemma_cache_v}

      --flash-attn on

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.5 GB (UD-Q4_K_XL)
      context: 32K-128K (dynamic)
      vram_usage: ~2.5GB
      source: unsloth/gemma-4-E2B-it-qat-GGUF
      kv_cache: q4_0 + attn_rot
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma4
      parameters: 4650000000
      context_length: 131072
      embedding_length: 1536
      quantization: UD-Q4_K_XL
      note: Unsloth Dynamic 2.0 QAT. Better accuracy than Google Q4_0 (Top-1 98.16% vs 89.29%), 22% smaller. Upstream only — NOT compatible with ik_llama.
  lfm2.5-2.6b:
    name: LFM 2.5 2.6B
    description: Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-Q6_K.gguf

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 131072

      --ctx-size 131072

      --parallel 1

      --reasoning on

      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja

      --temp 0.1

      --top-p 0.9

      --top-k 50

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      --jinja

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.1
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.22 GB (Q6_K)
      context: 64K-128K (dynamic)
      vram_usage: ~4.6GB VRAM (model 2.22GB + q4_0 KV 131K + compute)
      source: LiquidAI/LFM2.5-2.6B-GGUF (Q6_K)
      kv_cache: q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: Q6_K
      note: Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. Only 8/30 layers are attention (GQA), KV cache is tiny - q4_0 fits 131K full VRAM in 6GB.
  ornith-1.0-35b:
    name: Ornith 1.0 35B
    description: Ornith-1.0 is a family of open-source LLMs specialized for agentic coding, trained with a novel self-scaffolding reinforcement learning approach that jointly optimizes the scaffold and the solution.
    cmd: "${ik_llama_server} --port ${PORT}\n--model ${models_dir}/ornith-1.0-35b/Ornith-1.0-35B-APEX-I-Compact.gguf\n--fit\n--fit-margin 1024\n--ctx-size 131072\n--temp 1.0\n--top-p 1.0\n--top-k ${code_top_k}\n--min-p ${code_min_p}\n--repeat-penalty ${code_repeat_penalty}\n--reasoning on\n--jinja\n--chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja\n--parallel 1\n--parallel-tool-calls\n--cache-type-k ${large_cache_k}\n--cache-type-v ${large_cache_v}\n--k-cache-hadamard\n--v-cache-hadamard\n--flash-attn auto\n--defer-experts\n--prefetch-experts\n--spec-type ngram-mod:n_max=64,n_min=48,ngram_size_n=24\n  --metrics\n"
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 1.0
          top_p: 1.0
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 1.0
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~16.5 GB (APEX I-Compact)
      context: 1K-131K (safe max)
      vram_usage: ~5.4GB VRAM + ~12GB pinned RAM (ik pinned memory, estimated 33-34 t/s)
      source: mudler/Ornith-1.0-35B-APEX-GGUF
      kv_cache: q4_0 + attn_rot + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: I-Compact
      note: 'Post-trained Qwen 3.5 35B MoE. Self-scaffolding RL for agentic coding. 256 experts, 8+1 active, ~3B active/token. APEX I-Compact: 22% smaller than Q4_K_M, imatrix v1.3 calibrated. Expected 33-34 t/s matching Qwen 3.6 APEX. Uses qwen-fixed-chat-template.jinja — embedded GGUF template lacks tool-call format instructions, causing <|mask_start|>/<tool_code> leakage.'
  bonsai-27b-1bit:
    name: Bonsai 27B 1-bit
    description: PrismML's 1-bit 27B reasoning model — Qwen3.6-27B with 1.125-bit weights, full thinking/reasoning at 3.9 GB. 89.5% of FP16 intelligence. Fits entirely in 6GB VRAM. Now on upstream llama.cpp with ngram-mod speculative decoding.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/bonsai-27b-1bit/Bonsai-27B-Q1_0.gguf

      --jinja

      --reasoning on

      -ngl 99

      --ctx-size 32768

      --temp 0.7

      --top-p 0.95

      --top-k 20

      --min-p 0

      --repeat-penalty 1.0

      --parallel 1

      --cache-type-k ${large_cache_k}

      --cache-type-v ${large_cache_v}

      --flash-attn on

      --spec-type ngram-mod

      --spec-ngram-mod-n-max 64

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-match 24

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k, min_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 32768
    metadata:
      size: ~3.9 GB (Q1_0 binary 1.125 bpw)
      context: 32K (full GPU offload, RTX 3050 6GB — experimental/bisturi)
      vram_usage: ~4.8 GB (model + KV cache q4_0, fits entirely in GPU)
      source: prism-ml/Bonsai-27B-gguf (Q1_0)
      kv_cache: q4_0 + attn_rot
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen3
      parameters: 27300000000
      context_length: 262144
      embedding_length: 3584
      quantization: Q1_0 (binary 1.125 bpw)
      note: Reativado Jul 2026 — Q1_0 CUDA kernels merged upstream (b9867+), sem fork. ngram-mod speculative decoding para ~20-31 tok/s em RTX 3050 6GB. 48K ctx é o sweet spot de full-GPU offload.
  qwen3-vl-4b:
    name: Qwen3-VL 4B
    description: Qwen3-VL dense 4B vision-language model with native 2D/3D grounding, OCR in 32 languages, visual agent GUI, and video understanding.
    tags:
    - vision
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/qwen3-vl-4b/Qwen3VL-4B-Instruct-Q4_K_M.gguf\n--mmproj ${models_dir}/qwen3-vl-4b/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf\n--media-path ${media_path}\n--jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx 8192\n--ctx-size 32768\n--parallel 1\n--temp 0.7\n--top-p 0.8\n--top-k 20\n--min-p 0.0\n--repeat-penalty 1.0\n--presence-penalty 1.5\n--cache-type-k ${small_cache_k}\n--cache-type-v ${small_cache_v}\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: 2.5 GB (Q4_K_M) + 454 MB mmproj
      context: 8K-256K (dynamic)
      vram_usage: ~4 GB (model + mmproj + cache)
      source: Qwen/Qwen3-VL-4B-Instruct-GGUF (Q4_K_M + mmproj Q8_0)
      note: 'Native grounding: bbox_2d [x1,y1,x2,y2] in 0-1000 scale. repeat_penalty 1.0 mandatory.'
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: qwen3vl
      parameters: 4000000000
      context_length: 256000
      embedding_length: 2560
      quantization: Q4_K_M
  lfm2.5-vl-3b:
    name: LFM2.5-VL 3B
    description: Liquid AI VLM with native grounding, OCR with layout annotation, and SigLIP2 NaFlex vision. 3B params, 32K context, 16 languages.
    tags:
    - vision
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-vl-3b/LFM2.5-VL-3B-Q6_K.gguf

      --mmproj ${models_dir}/lfm2.5-vl-3b/mmproj-LFM2.5-VL-3B-Q8_0.gguf

      --media-path ${media_path}

      --jinja

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 8192

      --ctx-size 32768

      --parallel 1

      --temp 0.3

      --top-p 0.9

      --top-k 40

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --flash-attn on

      --metrics

      '
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~2.22 GB (Q6_K) + 583 MB mmproj (Q8_0)
      context: 8K-32K (dynamic)
      vram_usage: ~3.5 GB (model 2.22GB + mmproj 583MB + cache + compute)
      source: LiquidAI/LFM2.5-VL-3B-GGUF (Q6_K + mmproj Q8_0)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: lfm2_vl
      parameters: 3000000000
      context_length: 32768
      embedding_length: 2048
      quantization: Q6_K
      note: 'VLM with SigLIP2 NaFlex (native resolution, 512x512 patches + thumbnail). Better grounding + OCR with layout than 1.6B. Single-turn high-throughput: object detection, OCR, translation. 16 languages incl Portuguese.'
  nanbeige4.2-3b:
    name: Nanbeige 4.2 3B
    description: Compact agentic model with Looped Transformer architecture. 3B non-embedding params delivering solid performance on general-agent and code-agent tasks, outperforming larger models like Qwen3.5-9B and Gemma4-12B on agentic benchmarks.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/nanbeige4.2-3b/nanbeige4.2-3b-Q4_K_M.gguf

      --jinja

      --fit on

      --parallel 1

      --ctx-size 65536

      --temp 0.6

      --top-p 0.95

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.05

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn auto

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
          top_k: 20
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
          temperature: 1.0
          top_p: 0.95
          top_k: 20
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 65536
    metadata:
      size: ~2.4 GB (Q4_K_M)
      context: 65K (262K max, but 44 effective layers double KV cache — 65K sweet spot on 6GB with q4_0)
      vram_usage: ~2.4 GB model + ~2.9 GB q4_0 KV @ 65K + compute
      source: owao/Nanbeige4.2-3B-GGUF (Q4_K_M)
      kv_cache: q4_0/q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: nanbeige
      parameters: 4000000000
      context_length: 262144
      embedding_length: 3072
      quantization: Q4_K_M
      note: 'Looped Transformer (22 layers x2 loops = 44 effective). Upstream llama.cpp (PR #25994). Multi-turn tool calling FIXED vs 4.1 (#22684). Thinking toggle via enable_thinking.'
  glm-4.7-flash:
    name: GLM 4.7 Flash
    description: GLM-4.7-Flash is a 30B Mixture-of-Experts model with Multi-head Latent Attention (MLA), 64 experts with 4 active per token. Built for fast, efficient conversational AI and tool calling.
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/glm-4.7-flash/GLM-4.7-Flash-APEX-I-Compact.gguf\n--fit on\n--fit-target 128\n--ctx-size 131072\n--temp 0.7\n--top-p 1.0\n--top-k -1\n--min-p 0.01\n--repeat-penalty 1.0\n--jinja\n--parallel 1\n--cache-type-k q4_0\n--cache-type-v q4_0\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 1.0
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 1.0
    ttl: 300
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~14.6 GB (APEX I-Compact)
      context: 1K-131K (MLA enables full context, 24 t/s at 131K)
      vram_usage: ~5GB VRAM + ~10GB pinned RAM (upstream llama.cpp, 30 tok/s at 128K with q4_0+FA)
      source: mudler/GLM-4.7-Flash-APEX-GGUF
      kv_cache: q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: deepseek2
      parameters: 30000000000
      context_length: 131072
      embedding_length: 2048
      quantization: I-Compact
      note: 30B MoE with MLA (Multi-head Latent Attention, DeepSeek-V2 style). 64 experts, 4 active, ~2B active/token. Smallest 35B-class in fleet (14.6GB). MLA compresses KV cache internally — no hadamard transform needed. Apache-2.0.
  glm-ocr:
    name: GLM-OCR
    description: Multimodal OCR model for complex document understanding, built on the GLM-V encoder-decoder architecture integrating CogViT visual encoder with a GLM-0.5B language decoder.
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/GLM-OCR-Q8_0.gguf\n--mmproj ${models_dir}/mmproj-GLM-OCR-Q8_0.gguf\n--jinja\n--media-path ${media_path}\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx ${small_model_min_ctx}\n--ctx-size ${small_model_max_ctx}\n--temp 0.1\n--top-p 0.9\n--top-k 40\n--repeat-penalty 1.0\n--reasoning off\n--cache-type-k f16\n--cache-type-v f16\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    ttl: 60
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 131072
    metadata:
      architecture: glm4
      parameters: 940000000
      context_length: 131072
      embedding_length: 2048
      quantization: Q8_0
      size: ~0.95 GB (Q8_0) + ~0.48 GB mmproj (Q8_0)
      vram_usage: ~2GB (model + mmproj + cache)
      source: ggml-org/GLM-OCR-GGUF (Q8_0 + mmproj Q8_0)
      kv_cache: f16
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      note: Specialized OCR model — use prompts like 'OCR', 'OCR markdown', 'Table Recognition:'. NOT a general VLM. Complements LFM2.5-VL-450M (general vision) for document extraction.
  lfm2.5-8b-a1b:
    name: LFM 2.5 8B
    description: Liquid AI MoE hybrid — 8.3B total, 1.5B active per token. Built for fast, reliable tool calling on consumer hardware.
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/lfm2.5-8b-a1b/LFM2.5-8B-A1B-APEX-I-Compact.gguf\n--fit on\n--fit-ctx 16384\n--ctx-size 131072\n--parallel 1\n--no-cont-batching\n--reasoning-format deepseek-legacy\n--reasoning on\n--chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja\n--temp 0.2\n--top-p 0.8\n--top-k 40\n--min-p 0.15\n--repeat-penalty 1.05\n--cache-type-k q8_0\n--cache-type-v q4_0\n--flash-attn on\n--n-predict -1\n--jinja\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.2
          min_p: 0.15
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.3
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~4.2 GB (APEX I-Compact)
      context: 128K
      vram_usage: ~5.2GB VRAM (4.2 GB model + KV)
      source: mudler/LFM2.5-8B-A1B-APEX-GGUF
      kv_cache: q8_0 + q4_0 hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2moe
      parameters: 8470000000
      context_length: 128000
      embedding_length: 2048
      quantization: APEX I-Compact
      note: 'MoE 1.5B active, hybrid conv+GQA. Reasoning + tool calling. APEX I-Compact: 13% smaller than Q4_0, imatrix v1.3 calibrated. Uses upstream (BeeLlama segfaults on LFM2.5). GGUF has empty chat_template — requires --chat-template-file + --reasoning-format deepseek.'
  lfm2.5-colbert-350m:
    name: LFM2.5 ColBERT 350M
    description: Liquid AI late-interaction reranker with best-in-class multilingual performance. Per-token 128-dim vectors matched via MaxSim. Higher accuracy than dense embedders across 11 languages.
    env:
    - CUDA_VISIBLE_DEVICES=
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/LFM2.5-ColBERT-350M-Q8_0.gguf\n--embeddings\n--pooling mean\n--ctx-size 512\n--cont-batching\n--cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
    ttl: 300
    capabilities:
      in:
      - text
      out: []
      tools: false
      reranker: true
      context: 512
    metadata:
      architecture: lfm2-bidir
      parameters: 353000000
      context_length: 512
      embedding_length: 128
      quantization: Q8_0
      size: ~378 MB (Q8_0)
      vram_usage: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only)
      source: LiquidAI/LFM2.5-ColBERT-350M-GGUF (Q8_0)
      kv_cache: f16
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: true
        insert: false
        audio: false
        image: false
      note: Late-interaction model. OAI-compatible /v1/embeddings uses mean-pooled 128-dim vectors. For true MaxSim reranking, use raw /embedding endpoint for per-token vectors and compute MaxSim client-side. Asymmetric prompts from config_sentence_transformers.json. 11 languages. Higher accuracy than dense (0.605 vs 0.577 NDCG@10) but larger index (per-token vectors).
  lfm2.5-embedding-350m:
    name: LFM2.5 Embed 350M
    description: Liquid AI dense bi-encoder for fast multilingual retrieval. Single 1024-dim vector per document. Best-in-class dense embedder at 350M scale across 11 languages.
    env:
    - CUDA_VISIBLE_DEVICES=
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/LFM2.5-Embedding-350M-Q8_0.gguf\n--embeddings\n--pooling cls\n--ctx-size 512\n--cont-batching\n--cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
    ttl: 300
    capabilities:
      in:
      - text
      out: []
      tools: false
      reranker: false
      context: 512
    metadata:
      architecture: lfm2-bidir
      parameters: 354000000
      context_length: 512
      embedding_length: 1024
      quantization: Q8_0
      size: ~379 MB (Q8_0)
      vram_usage: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only)
      source: LiquidAI/LFM2.5-Embedding-350M-GGUF (Q8_0)
      kv_cache: f16
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: true
        insert: false
        audio: false
        image: false
      note: 'Embedding-only model. Use /v1/embeddings endpoint. Asymmetric prompts: ''query: '' for queries, ''document: '' for passages. 11 languages. Dense bi-encoder — one 1024-dim vector per document.'
  nomic-embed-text-v2-moe:
    name: Nomic Embed v2
    description: Multilingual MoE text embedding model that excels at multilingual retrieval, supporting ~100 languages with state-of-the-art performance at the 300M parameter scale.
    env:
    - CUDA_VISIBLE_DEVICES=
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/nomic-embed-text-v2-moe-Q4_K_M.gguf\n--embeddings\n--pooling mean\n--ctx-size 512\n--cont-batching\n--cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
    ttl: 300
    capabilities:
      in:
      - text
      out: []
      tools: false
      reranker: false
      context: 512
    metadata:
      architecture: nomic-bert
      parameters: 475000000
      context_length: 512
      embedding_length: 768
      quantization: Q4_K_M
      size: ~0.33 GB (Q4_K_M)
      vram_usage: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only)
      source: nomic-ai/nomic-embed-text-v2-moe-GGUF (Q4_K_M)
      kv_cache: f16
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: true
        insert: false
        audio: false
        image: false
      note: 'Embedding-only model. Use /v1/embeddings endpoint. Prefix inputs with ''search_query: '' or ''search_document: ''. 100+ languages. Matryoshka → 256 dims.'
  qwen3-tts:
    name: Qwen3-TTS 0.6B
    description: Text-to-speech with voice cloning. 8 Portuguese voices. OpenAI-compatible /v1/audio/speech endpoint with voice profiles from voiceclone-tui.
    tags:
    - tts
    proxy: http://127.0.0.1:8880
    checkEndpoint: /v1/audio/voices
    cmd: '${env.HOME}/projects/ai/tts-api/.venv/bin/python ${env.HOME}/projects/ai/tts-api/tts_server.py --port 8880 --host 127.0.0.1

      '
    cmdStop: pkill -f tts_server.py
    health_check_timeout: 300
    ttl: 300
    capabilities:
      in:
      - text
      out:
      - audio
      tools: false
      reranker: false
      context: 0
    metadata:
      size: ~600MB (Qwen3-TTS-12Hz-0.6B-Base, torch-direct)
      context: N/A (TTS generation, not LLM context)
      vram_usage: ~2GB VRAM (torch-direct, separate GPU allocation)
      source: Qwen/Qwen3-TTS-12Hz-0.6B-Base (HuggingFace)
      kv_cache: N/A
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: true
        image: false
      architecture: qwen3-tts
      parameters: 600000000
      context_length: 0
      embedding_length: 0
      quantization: torch-direct (no GGUF)
      caveats:
      - External FastAPI server on port 8880 (not llama.cpp)
      - Must install qwen_tts and dependencies in ~/projects/ai/tts-api/.venv
      - Voice profiles loaded from ~/.config/voiceclone-tui/voices.json
      - Supports voice cloning with reference audio samples
      - Portuguese (pt-BR) voices with accent control
  translategemma-4b:
    name: TranslateGemma 4B
    description: Open translation models built on Gemma 3, helping people communicate across 55 languages. The 4B variant is optimized for mobile and edge devices.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/translategemma-4b/translategemma-4b-it.Q4_K_M.gguf

      --no-jinja

      --chat-template gemma

      --fit on

      --parallel 1

      --ctx-size ${small_model_max_ctx}

      --temp 0.2

      --top-p 0.9

      --top-k 40

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --flash-attn on

      --metrics

      '
    health_check_timeout: 300
    ttl: 60
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: ~2.4 GB (Q4_K_M)
      context: 32K-128K (dynamic)
      vram_usage: ~3.5GB (model + cache)
      source: mradermacher/translategemma-4b-it-GGUF (Q4_K_M, from google/translategemma-4b-it)
      kv_cache: q8_0 + attn_rot
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma3
      parameters: 3880000000
      context_length: 131072
      embedding_length: 2560
      quantization: Q4_K_M
      caveats:
      - Native Jinja template crashes llama.cpp — must use --no-jinja --chat-template gemma
      - Needs explicit translation prompt (Sprachspiel format works)
      note: Translation model. Sprachspiel translate mode default. 55 languages.
  unlimited-ocr:
    name: Unlimited OCR
    description: 'Baidu Unlimited-OCR: 3B vision-language OCR model for long-horizon document parsing. DeepSeek-OCR architecture with SAM+CLIP vision tower. Outputs structured markdown with optional bounding boxes.'
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/unlimited-ocr/Unlimited-OCR-Q4_K_M.gguf

      --mmproj ${models_dir}/unlimited-ocr/mmproj-Unlimited-OCR-F16.gguf

      --jinja

      --media-path ${media_path}

      -ngl 99

      --ctx-size 32768

      --parallel 1

      --temp 0

      --top-p 1.0

      --repeat-penalty 1.0

      --reasoning off

      --cache-type-k q4_0

      --cache-type-v q4_0

      --metrics

      '
    ttl: 60
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      architecture: deepseek-ocr
      parameters: 3000000000
      context_length: 32768
      embedding_length: 2048
      quantization: Q4_K_M
      size: ~1.9 GB (Q4_K_M) + ~774 MB mmproj (F16)
      vram_usage: ~3.5GB (model + mmproj + f16 cache)
      source: sahilchachra/Unlimited-OCR-GGUF (Q4_K_M + mmproj F16)
      kv_cache: f16
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      note: 'Specialized OCR/document parsing model. Prompts: ''document parsing.'', ''Free OCR.'', ''<|grounding|>Convert the document to markdown.'' for bounding boxes. NOT a general chat model.'
hooks:
  on_startup:
    preload: []
matrix:
  vars:
    q4: qwen3.5-4b
    q4a: qwen3.5-4b-abliterated
    lfm8: lfm2.5-8b-a1b
    lfm26: lfm2.5-2.6b
    nb42: nanbeige4.2-3b
    ocr: glm-ocr
    uocr: unlimited-ocr
    qwvl: qwen3-vl-4b
    lfmvl3: lfm2.5-vl-3b
    q9: qwen3.5-9b
    g4: gemma4-e2b
    orn35: ornith-1.0-35b
    glm: glm-4.7-flash
    bonsai1: bonsai-27b-1bit
    tg: translategemma-4b
    ttsext: qwen3-tts
    nomic: nomic-embed-text-v2-moe
    lfmemb: lfm2.5-embedding-350m
    lfmcol: lfm2.5-colbert-350m
  sets:
    small_vision: (q4 | q4a | lfm8 | lfm26) & (nomic | lfmemb | lfmcol)
    small_embed: (q4 | q4a | lfm8 | lfm26) & (nomic | lfmemb | lfmcol)
    small_only: q4 | q4a | lfm8 | lfm26 | nb42
    vision_only: ocr | uocr | qwvl | lfmvl3
    vision_embed: (ocr | uocr | qwvl | lfmvl3) & (nomic | lfmemb | lfmcol)
    medium: (q9 | g4) & (nomic | lfmemb | lfmcol)
    heavy: (orn35 | glm | bonsai1) & (nomic | lfmemb | lfmcol)
    translate_only: tg
    tts_external: ttsext
    embed_only: nomic & lfmemb & lfmcol
    rerank_only: lfmcol
    rerank_embed: lfmcol & (nomic | lfmemb)
  evict_costs:
    orn35: 9
    glm: 9
    bonsai1: 7
    q9: 4
    g4: 3
    ttsext: 4
    ocr: 3
    uocr: 3
    qwvl: 3
    lfmvl3: 3
    q4: 2
    q4a: 2
    lfm8: 2
    lfm26: 2
    nb42: 2
    nomic: 1
    lfmemb: 1
    lfmcol: 1
    tg: 2
