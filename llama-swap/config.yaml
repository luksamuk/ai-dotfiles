#     expected markov_w1/w2 + dflash.target_layers). PrismML format is fork-only.
#     GGUF deleted; ngram-mod is the only spec type on this box.
#   - Upstream #28000 (2026-08-30) fixes NVFP4 scales in dflash path —
#     recompiled before measuring dspark.
