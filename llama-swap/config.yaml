    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/LFM2.5-ColBERT-350M-Q8_0.gguf
      --embeddings
      --pooling mean
      --ctx-size 512
      --cont-batching
      --parallel 4
      --cache-type-k f16
      --cache-type-v f16
      -ngl 0
        --metrics
    ttl: 300
    capabilities:
      in:
        - 'text'
      out: []
      tools: false
      reranker: true
      context: 512
    metadata:
      architecture: lfm2-bidir
      parameters: 353000000
      context_length: 512
      embedding_length: 128
      quantization: Q8_0
      size: "~378 MB (Q8_0)"
      vram_usage: "~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only)"
      source: "LiquidAI/LFM2.5-ColBERT-350M-GGUF (Q8_0)"
      kv_cache: "f16"
      features:
        completion: false
        tools: false
