healthCheckTimeout: 300
logLevel: info
logTimeFormat: rfc3339
logToStdout: proxy
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0
macros:
  models_dir: ${env.HOME}/.llama-models
  media_path: ${env.HOME}/testfiles/vision
  templates_dir: ${env.HOME}/git/ai-dotfiles/llama-swap/templates
  llama_server: ${env.HOME}/git/llama.cpp/build/bin/llama-server
  ik_llama_server: ${env.HOME}/git/ik_llama.cpp/build/bin/llama-server
  ik2_llama_server: ${env.HOME}/git/kassane-ik_llama.cpp/build/bin/llama-server
  bee_server: ${env.HOME}/git/beellama.cpp/build/bin/llama-server
  prism_llama_server: ${env.HOME}/git/prism-llama.cpp/llama-prism-b10685-7dffb15/llama-server
  vllm_bin: ${env.HOME}/.vllm/bin/vllm
  default_temp: '0.7'
  default_top_p: '0.9'
  default_top_k: '20'
  default_min_p: '0.01'
  default_repeat_penalty: '1.05'
  code_temp: '0.6'
  code_top_p: '0.85'
  code_top_k: '40'
  code_min_p: '0.02'
  code_repeat_penalty: '1.05'
  think_temp: '0.6'
  think_top_p: '0.9'
  think_top_k: '20'
  think_min_p: '0.0'
  think_repeat_penalty: '1.0'
  small_model_min_ctx: '65536'
  small_model_max_ctx: '131072'
  completion_ctx: '32768'
  large_model_min_ctx: '65536'
  large_model_max_ctx: '131072'
  vram_margin: '512'
  small_cache_k: q8_0
  small_cache_v: q8_0
  large_cache_k: q4_0
  large_cache_v: q4_0
  gemma_cache_k: q4_0
  gemma_cache_v: q4_0
models:
  qwen3.5-4b:
    name: Qwen3.5 4B
    description: Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Uses hadamard KV cache for maximum context efficiency and ngram speculative decoding.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.8 GB (UD-Q4_K_XL)
      context: 64K-128K (dynamic)
      vram_usage: ~4.5GB VRAM (model 2.8GB + q8_0/q4_0 hadamard cache + compute)
      source: unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: ik_llama.cpp with hadamard KV cache + --fit for dynamic context. Ngram spec decode via ik syntax. Uses qwen-fixed-chat-template.jinja for tool-call instructions. Formerly qwen3.5-4b-mtp, consolidated Jul 2026.
  lfm2.5-2.6b:
    name: LFM 2.5 2.6B
    description: Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-QAD-Q4_0.gguf

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 131072

      --ctx-size 131072

      --parallel 1

      --reasoning on

      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja

      --temp 0.1

      --top-p 0.9

      --top-k 50

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      --jinja

      -md ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-DSpark-Draft-v1-F16.gguf

      --spec-type draft-dspark

      --spec-draft-n-max 10

      --spec-draft-n-min 0

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.1
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~1.55 GB (QAD Q4_0)
      context: 64K-128K (dynamic)
      vram_usage: ~3.9GB VRAM (model 1.55GB + q4_0 KV 131K + compute)
      source: LiquidAI/LFM2.5-2.6B-GGUF (QAD Q4_0)
      kv_cache: q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: QAD Q4_0
      note: Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. Only 8/30 layers are attention (GQA), KV cache is tiny - q4_0 fits 131K full VRAM in 6GB. QAD (Quantization-Aware Distillation) recovers ~97% of BF16 quality vs native Q4_0. DSpark speculative decoding via F16 draft sidecar (633MB) — up to 2.27x speedup on-device, 57% latency reduction for function calling.
  qwen2.5-coder-1.5b-pollard:
    name: Qwen2.5 Coder 1.5B Pollard
    description: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct, CPU-only. IQ4_XS with imatrix. FIM native. Code completion on CPU, zero VRAM, coexists with GPU MoE.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/qwen2.5-coder-1.5b-pollard-new/Qwen2.5-Coder-1.5B-Pollard-v2-IQ4XS-class.gguf

      --jinja

      --parallel 1

      --ctx-size ${completion_ctx}

      --temp 0.7

      --top-p 0.8

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --batch-size 512

      --ubatch-size 128

      --spec-type ngram-mod

      --spec-ngram-mod-n-match 24

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-max 64

      --no-webui

      --metrics

      '
    env:
    - CUDA_VISIBLE_DEVICES=
    filters:
      stripParams: temperature, top_p
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~824 MB (Pollard IQ4_XS + imatrix)
      context: 32K (completion)
      vram_usage: 0 (CPU-only)
      source: PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: true
        audio: false
        image: false
      architecture: qwen2
      parameters: 1540000000
      context_length: 32768
      embedding_length: 1536
      quantization: Pollard IQ4_XS
      note: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct. IQ4_XS with imatrix on mixed prose+code. FIM native (Qwen2.5-Coder tokens). CPU-only, coexists with GPU MoE. ngram-mod enabled.
  qwen3.6-35b-a3b:
    name: Qwen 3.6 35B
    description: Qwen3.6 delivers substantial upgrades in agentic coding and thinking preservation. Built on direct community feedback for a more intuitive, responsive, and productive coding experience. Vision enabled Sep 10 at full 131K context (needs ~20GB free host RAM; 32K fallback under memory pressure).
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-APEX-MTP-I-Compact.gguf

      --mmproj ${models_dir}/qwen3.6-35b-a3b/mmproj_qwen36_F16.gguf

      --no-mmproj-offload

      --no-graph-reuse

      --fit

      --fit-margin 1024

      --ctx-size 131072

      --temp ${code_temp}

      --top-p ${code_top_p}

      --top-k ${code_top_k}

      --min-p ${code_min_p}

      --repeat-penalty ${code_repeat_penalty}

      --reasoning on

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --cache-type-k ${large_cache_k}

      --cache-type-v ${large_cache_v}

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --defer-experts

      --prefetch-experts

      --spec-type mtp:n_max=1,p_min=0.0

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~17.3 GB (APEX-MTP I-Compact) + 899 MB mmproj F16
      context: 1K-131K (vision ON, RAM limpa; fallback 32K sob pressão de RAM)
      vram_usage: ~5.6 GB VRAM estimado + ~14GB pinned RAM (MTP ~+414MiB, padrão ornith Sep 2026)
      source: mudler/Qwen3.6-35B-A3B-APEX-MTP-GGUF (I-Compact) + mmproj unsloth (F16)
      kv_cache: q4_0 + attn_rot + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 34660000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX-MTP I-Compact
      note: 'Sep 09: reactivated com APEX-MTP I-Compact (MTP heads baked in, nextn=1; o APEX plain ignorava --multi-token-prediction silenciosamente — audit May 2026). --spec-type mtp:n_max=1,p_min=0.0 = receita ornith-1.5 (42.6 tok/s medido Sep 10, accept 85-93%). VISION re-ativada 10/09 c/ ctx FULL 131K (RAM limpa: VRAM 5.4/6.1GB estável em smokes; fallback 32K sob pressão — regra Jul 2026). mmproj unsloth F16, verificado tensor-a-tensor vs ornith (qwen3vl_merger, proj_dim 2048). Sep 10: alinhado ao ornith — --no-mmproj-offload + --prefetch-experts + top_p 0.95 nos dois modos.'
  ornith-1.5-35b:
    name: Ornith 1.5 35B
    description: Ornith-1.5 is a family of open-source LLMs trained with end-to-end self-improvement — the model proposes new tasks, generates task-specific scaffolds, and produces solution rollouts for RL, continuously creating new learning experiences. ONYX quantization (el4, APEX evolution) with MTP speculative decoding and vision support.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/ornith-1.5-35b/Ornith-1.5-35B-A3B-ONYX-compact.gguf

      --mmproj ${models_dir}/ornith-1.5-35b/mmproj.gguf

      --no-mmproj-offload

      --fit

      --fit-margin 1024

      --ctx-size 131072

      --temp 0.6

      --top-p 0.95

      --top-k 20

      --min-p ${code_min_p}

      --repeat-penalty ${code_repeat_penalty}

      --reasoning on

      --reasoning-budget 8192

      --reasoning-budget-message "Let me conclude my reasoning and provide the answer."

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --cache-type-k ${large_cache_k}

      --cache-type-v ${large_cache_v}

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --defer-experts

      --prefetch-experts

      --spec-type mtp:n_max=1,p_min=0.0

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~16.4 GB (ONYX compact) + 899 MB mmproj
      context: 1K-131K (safe max, model supports 262K)
      vram_usage: ~4.6GB VRAM measured + ~16GB pinned RAM (45 tok/s with MTP, accept 85-93%)
      source: el4/Ornith-1.5-35B-A3B-ONYX-GGUF (compact tier)
      kv_cache: q4_0 + attn_rot + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: ONYX compact
      note: 'Default since Sep 2026 A/B: 45.1 vs 40.6 tok/s (APEX+ngram), MTP accept 85-93%, +414MiB VRAM (75.6% total). ONYX = APEX evolution (dynamic layer sensitivity + router-weighted imatrix), MTP head preserved. Old APEX Compact: _disabled/ornith-1.5-35b-apex.yaml, GGUF deleted Sep 2026 (re-download from mudler repo if reverting).'
  bonsai-27b:
    name: Bonsai 27B 1-bit
    description: PrismML's 1-bit 27B reasoning model — Qwen3.6-27B with true 1.125-bit binary weights, full thinking/reasoning at ~3.9 GB. 89.5% of FP16 intelligence. Full GPU offload on RTX 3050 6GB. Upstream llama.cpp with ngram-mod/dspark speculative decoding.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/bonsai-27b/Bonsai-27B-Q1_0.gguf

      --mmproj ${models_dir}/bonsai-27b/Bonsai-27B-mmproj-Q8_0.gguf

      --no-mmproj-offload

      --jinja

      -ngl 99

      --ctx-size 131072

      --no-kv-offload

      --temp 0.7

      --top-p 0.95

      --top-k 20

      --min-p 0

      --repeat-penalty 1.0

      --parallel 1

      --cache-type-k ${large_cache_k}

      --cache-type-v ${large_cache_v}

      --flash-attn on

      --spec-type ngram-mod

      --spec-ngram-mod-n-max 64

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-match 24

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k, min_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~3.9 GB (Q1_0 binary 1.125 bpw) + 0.63 GB mmproj
      context: 131072 (KV on host via --no-kv-offload); 64K-262K native
      vram_usage: ~4.4 GB VRAM (Q1_0 weights + compute; mmproj in RAM, KV in host RAM)
      source: prism-ml/Bonsai-27B-gguf (Q1_0 + dspark-Q4_1 sidecar + mmproj Q8_0)
      kv_cache: q4_0 (host RAM)
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: qwen35
      parameters: 27300000000
      context_length: 262144
      embedding_length: 5120
      quantization: Q1_0
      note: '1-bit binary 1.125 bpw, Qwen3.6-27B base. Full GPU resident. Aug 30 2026: canonical 128K ctx via --no-kv-offload (KV in host RAM), 10.95 tok/s; speed mode 48K KV-GPU, 22.91 tok/s; mmproj-RAM; dspark sidecar incompatible, deleted. Jul 2026 measurements: 32K=27 tok/s, 48K=20 tok/s with ngram-mod.'
  bonsai2-27b:
    name: Bonsai 2 27B
    description: PrismML Bonsai 2 — ternário real 1.75 bpw sobre Qwen3.8-27B (híbrido ~75% atenção linear). 98.2% do FP16 (84.78 avg) em 5.95 GB. Tools nativas, thinking xhigh/medium. Text-only na Navi (mmproj em disco). Requer fork PrismML.
    cmd: '${prism_llama_server} --port ${PORT}

      --model ${models_dir}/bonsai2-27b/Ternary-Bonsai-2-27B-PTQ1_0.gguf

      --jinja

      -ngl 56

      --ctx-size 32768

      --no-kv-offload

      --temp 1.0

      --top-p 0.95

      --top-k 20

      --min-p 0

      --presence-penalty 0.0

      --repeat-penalty 1.0

      --parallel 1

      --cache-type-k ${large_cache_k}

      --cache-type-v ${large_cache_v}

      --flash-attn on

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k, min_p, presence_penalty
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.8
          top_k: 20
          min_p: 0
          presence_penalty: 1.5
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
            reasoning_effort: xhigh
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0
          presence_penalty: 0.0
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 32768
    metadata:
      size: ~5.95 GB (PTQ1_0 ternário 1.75 bpw); mmproj Q8_0 em disco, não carregado
      context: 32768 (KV q4_0 em host RAM via --no-kv-offload); 262144 nativo
      vram_usage: ~5.64 GB (ngl 56 + compute) — 5635MiB medido em serve, desktop limpa
      source: prism-ml/Ternary-Bonsai-2-27B-gguf (PTQ1_0 + mmproj Q8_0)
      kv_cache: q4_0 (host RAM)
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 27360000000
      context_length: 262144
      embedding_length: 5120
      quantization: PTQ1_0
      note: 'Deploy QUALIDADE (17/09): user pediu pra testar qualidade do output. Teto Navi: ngl 56 (2.94 t/s decode, pp 134 c/ desktop limpa); 57-63 OOM; ngl 48 = 1.66 t/s (ping-pong); CPU-only decode 0.53-0.64 t/s. Full offload OOM por ~100-200MiB. Velocidade NÃO é o objetivo aqui — 98.2% FP16 é. Vision Tower desligada por VRAM (regra: texto+ctx cheio > visão c/ ctx estrangulado); reativar mmproj = re-adicionar --mmproj + --no-mmproj-offload (custa ~0.63GB RAM). Re-teste em GPU 8GB+ ou fork otimizando unpack AVX2. Gen-1 1-bit (bonsai-27b) segue sendo o Bonsai rápido da casa.'
  neohorse-1-4b:
