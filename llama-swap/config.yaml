      embedding_length: 3072
      quantization: Q4_K_M
      note: 'vram detalhe: ~2.4 GB model + ~2.9 GB q4_0 KV @ 65K + compute | model 2.4GB Q4_K_M + q4_0 KV ~2.9GB @65K + compute Looped Transformer (22 layers x2 loops = 44 effective). Upstream llama.cpp (PR #25994). Multi-turn tool calling FIXED vs 4.1 (#22684). Thinking toggle via enable_thinking.'
