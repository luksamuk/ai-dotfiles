      --ctx-size ${small_model_max_ctx}
      --temp 0.1
      --top-p 0.9
      --top-k 40
      --repeat-penalty 1.0
      --reasoning off
      --cache-type-k f16
      --cache-type-v f16
      --flash-attn on
      --spec-type ngram-mod
        --spec-ngram-mod-n-match 24
        --spec-ngram-mod-n-min 48
        --spec-ngram-mod-n-max 64
        --metrics
