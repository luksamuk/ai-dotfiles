healthCheckTimeout: 300
logLevel: info
logTimeFormat: rfc3339
logToStdout: proxy
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0
macros:
  models_dir: ${env.HOME}/.llama-models
  media_path: ${env.HOME}/testfiles/vision
  templates_dir: ${env.HOME}/git/ai-dotfiles/llama-swap/templates
  llama_server: ${env.HOME}/git/llama.cpp/build/bin/llama-server
  ik_llama_server: ${env.HOME}/git/ik_llama.cpp/build/bin/llama-server
  ik2_llama_server: ${env.HOME}/git/kassane-ik_llama.cpp/build/bin/llama-server
  cafe_server: ${env.HOME}/git/cafe-llama.cpp/build/bin/llama-server
  prism_llama_server: ${env.HOME}/git/prism-llama.cpp/llama-prism-b10685-7dffb15/llama-server
  vllm_bin: ${env.HOME}/.vllm/bin/vllm
  default_temp: '0.7'
  default_top_p: '0.9'
  default_top_k: '20'
  default_min_p: '0.01'
  default_repeat_penalty: '1.05'
  code_temp: '0.6'
  code_top_p: '0.85'
  code_top_k: '40'
  code_min_p: '0.02'
  code_repeat_penalty: '1.05'
  think_temp: '0.6'
  think_top_p: '0.9'
  think_top_k: '20'
  think_min_p: '0.0'
  think_repeat_penalty: '1.0'
  small_model_min_ctx: '65536'
  small_model_max_ctx: '131072'
  completion_ctx: '32768'
  large_model_min_ctx: '65536'
  large_model_max_ctx: '131072'
  vram_margin: '512'
  small_cache_k: q8_0
  small_cache_v: q8_0
  large_cache_k: q4_0
  large_cache_v: q4_0
  gemma_cache_k: q4_0
  gemma_cache_v: q4_0
models:
  qwen3.5-4b:
    name: Qwen3.5 4B
    description: Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Hadamard KV cache; Alibaba-recommended sampling per mode (thinking 1.0/0.95, instruct 0.7/0.8).
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp 1.0

      --top-p 0.95

      --top-k 20

      --min-p 0

      --repeat-penalty 1.0

      --presence-penalty 1.5

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.8
          top_k: 20
          presence_penalty: 1.5
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          presence_penalty: 1.5
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.8 GB (UD-Q4_K_XL)
      context: 131072
      vram_usage: ~4.5 GB VRAM
      source: unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: 'vram detalhe: ~4.5 GB VRAM | model 2.8GB UD-Q4_K_XL + q8_0/q4_0 hadamard cache + compute ik_llama.cpp with hadamard KV cache + --fit for dynamic context. Sampling = Alibaba card (thinking 1.0/0.95/pres 1.5; instruct 0.7/0.8/pres 1.5). repeat_penalty DESATIVADO (1.0, anti-loop oficial = presence_penalty). Config errada Jul-out 2026 (temp 0.7+rep 1.05 geravam loop no thinking) corrigida 07/10; runs anteriores removidas (estaca zero). Uses qwen-fixed-chat-template.jinja for tool-call instructions. Formerly qwen3.5-4b-mtp, consolidated Jul 2026.'
  lfm2.5-2.6b:
    name: LFM 2.5 2.6B
    description: Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size.
    cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/llama.cpp/build/bin ${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-QAD-Q4_0.gguf

      --fit on

      --fit-target ${vram_margin}

      # server: vanilla 0.6.0 (b2796 = abeada335, build 06/10) — build na mesma pasta que o cafe 0.74

      --fit-ctx 131072

      --ctx-size 131072

      --parallel 2

      --reasoning on

      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja

      --temp 0.1

      --top-p 0.9

      --top-k 50

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      --jinja

      # spec-dspark REMOVIDO 07/10 — build pos-d81235049 (rebuild 06/10) quebra o fit com draft: # fit mede sem o draft ("dflash requires ctx_other" e normal no fitting) -> pp buffer OOM -> SIGABRT -> 500 --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.1
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~1.55 GB (QAD Q4_0)
      context: 131072
      vram_usage: ~3.9 GB VRAM
      source: LiquidAI/LFM2.5-2.6B-GGUF (QAD Q4_0)
      kv_cache: q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: QAD Q4_0
      note: 'vram detalhe: ~3.9GB VRAM (model 1.55GB + q4_0 KV 131K + compute) | model 1.55GB QAD-Q4_0 + q4_0 KV @131K + compute Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. Only 8/30 layers are attention (GQA), KV cache is tiny - q4_0 fits 131K full VRAM in 6GB. QAD (Quantization-Aware Distillation) recovers ~97% of BF16 quality vs native Q4_0. DSpark draft REMOVIDO 07/10: fit quebra c/ draft no build 06/10 (mede sem o draft -> pp buffer OOM -> SIGABRT). Baseline no-draft: 88.5 t/s.'
  qwen2.5-coder-1.5b-pollard:
    name: Qwen2.5 Coder 1.5B Pollard
    description: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct, CPU-only. IQ4_XS with imatrix. FIM native. Code completion on CPU, zero VRAM, coexists with GPU MoE.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/qwen2.5-coder-1.5b-pollard-new/Qwen2.5-Coder-1.5B-Pollard-v2-IQ4XS-class.gguf

      --jinja

      --parallel 1

      --ctx-size ${completion_ctx}

      --temp 0.7

      --top-p 0.8

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --batch-size 512

      --ubatch-size 128

      --spec-type ngram-mod

      --spec-ngram-mod-n-match 24

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-max 64

      --no-webui

      --metrics

      '
    env:
    - CUDA_VISIBLE_DEVICES=
    filters:
      stripParams: temperature, top_p
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: ~824 MB (Pollard IQ4_XS + imatrix)
      context: 32768
      vram_usage: 0 (CPU-only)
      source: PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: true
        audio: false
        image: false
      architecture: qwen2
      parameters: 1540000000
      context_length: 32768
      embedding_length: 1536
      quantization: Pollard IQ4_XS
      note: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct. IQ4_XS with imatrix on mixed prose+code. FIM native (Qwen2.5-Coder tokens). CPU-only, coexists with GPU MoE. ngram-mod enabled.
  qwen3.6-35b-a3b-heretic:
    name: Qwen 3.6 35B Heretic
    description: Qwen's 35B-A3B MoE generalist, abliterated (heretic TPE). 131K context, single slot.
    cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

      --model ${models_dir}/qwen36-heretic-apex-mini/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Mini.gguf

      --mmproj ${models_dir}/qwen36-heretic-apex-mini/mmproj.gguf

      --ctx-size 131072

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --no-mmproj-offload

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      -cmoe

      -ngl 99

      -b 512

      -ub 128

      --temp ${code_temp}

      --top-p ${code_top_p}

      --top-k ${code_top_k}

      --min-p ${code_min_p}

      --repeat-penalty ${code_repeat_penalty}

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~14.66 GB (APEX-I-Compact, heretic)
      context: 131072
      vram_usage: ~5.1 GB VRAM + ~15 GB RAM pinned
      source: SC117/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-GGUF (I-Compact) + mmproj unsloth Q8
      kv_cache: q4_0/q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 34660000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX I-Compact
      note: 'vram detalhe: ~5.1 GB VRAM (turbo4 KV) + ~15 GB pinned RAM (hmoe) | turbo4 KV; hmoe experts pinned Produção Sep 24: café herdou o posto do ik-131K (menor pressão de VRAM/RAM, 262K nativo). Heretic KL 0.0015 (88% menos recusas). Sem MTP @262K (draft KV não cabe). Smoke 200 OK (7s). KV turbo4 = WHT-rotated, FA-fused (IK TurboQuant); source do mmproj: unsloth Q8.'
  laguna-xs-2.1:
    name: Laguna XS 2.1
    description: Poolside's 33B/3B MoE agentic coding model with mixed SWA+global attention and native interleaved reasoning. 131K context, -cmoe expert offload.
    cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

      --model ${models_dir}/laguna-xs-2.1/Laguna-XS-2.1-Q4_K_M.gguf

      --jinja

      --parallel 1

      --ctx-size 131072

      --cache-type-k q4_0

