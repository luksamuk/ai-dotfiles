# llama-swap configuration for RTX 3050 Laptop (6GB VRAM)
# Configuração otimizada para uso com --fit automático + attn_rot (KV cache quantizado)
# Dual binary: llama.cpp for dense models, ik_llama.cpp for MoE models (pinned memory, better expert offload)
#
# Repositório: ~/git/ai-dotfiles/llama-swap/
# Modelos: ~/.llama-models/
# Requer: llama-swap v212+ (Prometheus metrics, SIGHUP reload, reasoning UI, race fix, zstd captures)
# Requer: llama.cpp build b9563+ (mtmd audio/TTS/video, 6 audio preprocessors: whisper/conformer/granite_speech/gemma4a/gemma4ua/qwen3a, LFM2.5 reasoning fix, Gemma4 MTP, Granite4 Vision, KV cache optimizations)
# Requer: ik_llama.cpp v4566+ (bf16 graph reduce fix, threads-mtmd, mtmd checkpoint save/restore)
# Requer: BeeLlama.cpp v0.3.1+ (DFlash speculative decoding, TurboQuant KV cache, Gemma4 audio fixes)
#
# OTIMIZAÇÕES ik_llama.cpp (modelos MoE e dense offloaded):
#   --k-cache-hadamard / --v-cache-hadamard (-khad/-vhad): Hadamard transform no K/V cache
#     antes da quantização → qualidade muito mais próxima do f16 com cache q4_0/q8_0.
#     Especialmente útil em 6GB VRAM onde q4_0 é necessário para contexto longo.
#   --flash-attn auto: desliga FA automaticamente em contextos curtos (economia em MoE offloaded)
#   --defer-experts: defere mmap de experts no Linux → carregamento mais rápido de modelos MoE

# Schema para validação (VS Code)

healthCheckTimeout: 300
logLevel: info
logTimeFormat: "rfc3339"
logToStdout: "proxy"
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0

# Macros reutilizáveis
macros:
  "models_dir": "${env.HOME}/.llama-models"
  "media_path": "${env.HOME}/testfiles/vision"
  "templates_dir": "${env.HOME}/git/ai-dotfiles/llama-swap/templates"

  # Caminho para o llama-server compilado com CUDA (--fit disponível)
  # Build local em ~/git/llama.cpp/build/bin/llama-server
  "llama_server": "${env.HOME}/git/llama.cpp/build/bin/llama-server"

  # Caminho para ik_llama.cpp — fork otimizado para MoE (pinned memory, faster expert offload)
  # Build local em ~/git/ik_llama.cpp/build/bin/llama-server
  "ik_llama_server": "${env.HOME}/git/ik_llama.cpp/build/bin/llama-server"

  # Caminho para o vLLM (installed in ~/.vllm venv)
  "vllm_bin": "${env.HOME}/.vllm/bin/vllm"

  # ===========================================
  # PARÂMETROS DE INFERÊNCIA (baseados no Unsloth)
  # ===========================================
  # Qwen3.5: temp 0.6-0.7, top_p 0.8-0.9, top_k 20-40

  # Gemma: temp 0.7, top_p 0.9
  # Referência: https://unsloth.ai/docs/models/qwen3.5
  # ===========================================
  # Parâmetros padrão (uso geral)
  "default_temp": "0.7"
  "default_top_p": "0.9"
  "default_top_k": "20"
  "default_min_p": "0.01"
  "default_repeat_penalty": "1.05"

  # Parâmetros para código/tool-calling (mais determinístico)
  "code_temp": "0.6"
  "code_top_p": "0.85"
  "code_top_k": "40"
  "code_min_p": "0.02"
  "code_repeat_penalty": "1.05"

  # Parâmetros para thinking/reasoning
  "think_temp": "0.6"
  "think_top_p": "0.9"
  "think_top_k": "20"
  "think_min_p": "0.0"
  "think_repeat_penalty": "1.0"

  # Contexto para modelos pequenos (cabem inteiros na VRAM)
  # fit-ctx: mínimo garantido, ctx-size: máximo teto
  "small_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "small_model_max_ctx": "131072"  # 128K máximo
  # Contexto para modelos grandes (requerem offload)
  "large_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "large_model_max_ctx": "131072"  # 128K máximo
  # Margem de segurança para VRAM (MiB) - usada pelo --fit-target
  "vram_margin": "512"

  # ===========================================
  # KV CACHE QUANTIZADO + ATTN_ROT
  # ===========================================
  # attn_rot é ativado AUTOMATICAMENTE quando o cache é quantizado
  # (q4_0/q8_0) e n_embd_head % 64 == 0
  # Reduz degradação de velocidade em contextos longos (~37% → ~10%)
  # NOTA: Gemma4 iSWA attn_rot bug FIXED (commit 4eb19514d, b8815+). q4_0 cache works now!
  # ===========================================
  #
  # Compatibilidade attn_rot por modelo:
  #   Qwen3.5-4B/9B   ✅ head_k=256 (256%64==0)
  #   Qwen3-14B        ✅ head_k=128 (128%64==0)
  #   Qwen3.6-35B-A3B  ✅ head_k=128
    #   Nemotron-3-Nano  ✅ head_k=128 (REMOVED — poor quality)
    # Nemotron-Omni-30B ✅ head_k=128 (NOT added — upstream-only, ik doesn't support nemotron_h_moe)
  #   Gemma-4 E2B/E4B  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   Gemma-4 26B-MoE  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   LFM2.5-1.2B       ✅ head_k=64 (64%64==0) — dense hybrid
  #   LFM2-24B-A2B     ✅ head_k=128 (128%64==0) — MoE hybrid
  #   LFM2.5-VL-450M   ❌ vision model, manter f16
  #
  # Tipos de cache:
  #   q8_0: ~47% economia vs f16, perda mínima
  #   q4_0: ~72% economia vs f16, mais compressão
  #
  # Escolha: modelos pequenos (fit VRAM) usam q8_0 (saldo perf/mem)
  #          modelos grandes (offload) usam q4_0 (maximizar contexto)
  "small_cache_k": "q8_0"
  "small_cache_v": "q8_0"
  "large_cache_k": "q4_0"
  "large_cache_v": "q4_0"
  "gemma_cache_k": "q4_0"
  "gemma_cache_v": "q4_0"
models:
# -------------------------------------------
# QWEN3.5-4B - ik_llama.cpp BACKEND
# Dense 4B params, UD-Q4_K_XL ~2.8GB.
# ik_llama.cpp with hadamard KV cache + --fit for dynamic context.
# Ngram speculative decoding via ik syntax.
# qwen-fixed-chat-template.jinja for tool-call instructions.
# Tool calling: --parallel-tool-calls.
# Thinking: reasoning_content field, separate from content.
# Dual mode: base (chat, no think) and :think (reasoning)
# NOTE: Formerly "qwen3.5-4b-mtp" — consolidated as canonical qwen3.5-4b (Jul 2026)
#   Old upstream+Q4_K_M variant moved to _disabled/qwen3.5-4b-upstream.yaml
# -------------------------------------------
  "qwen3.5-4b":
    name: "Qwen3.5 4B"
    description: "Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Uses hadamard KV cache for maximum context efficiency and ngram speculative decoding."
    cmd: |
      ${ik_llama_server} --port ${PORT}
      --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf
      --fit
      --fit-margin 512
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --ctx-size ${small_model_max_ctx}
      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
      --repeat-penalty ${default_repeat_penalty}
      --reasoning on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --no-graph-reuse
      --ctx-checkpoints 0
      --ctx-checkpoints-interval 0
      --batch-size 512
      --ubatch-size 128
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~2.8 GB (UD-Q4_K_XL)"
      context: "64K-128K (dynamic)"
      vram_usage: "~4.5GB VRAM (model 2.8GB + q8_0/q4_0 hadamard cache + compute)"
      source: "unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)"
      kv_cache: "q4_0/q4_0 + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: "ik_llama.cpp with hadamard KV cache + --fit for dynamic context. Ngram spec decode via ik syntax. Uses qwen-fixed-chat-template.jinja for tool-call instructions. Formerly qwen3.5-4b-mtp, consolidated Jul 2026."
# -------------------------------------------
# QWEN3.5-9B - ik BACKEND (Hadamard KV cache)
# Dense 9B params, MoQ-3.6 ~3.75GB.
# MoQ-3.6: replaced UD-Q4_K_XL (~5.55GB) — same speed (12.2 tok/s),
# equal+ quality (21/25 Snake vs 20/25), 32% smaller.
# ik with hadamard cache gives near-fp16 quality at smaller memory footprint.
# --flash-attn auto: disables FA on short contexts for MoE/offload savings
# --parallel-tool-calls: enables multiple tool calls in single response
# Dual mode: base (chat, no think) and :think (reasoning)
# MTP tested but OOM on RTX 3050 6GB with --multi-token-prediction
# Bee backup: _disabled/qwen3.5-9b-bee.yaml (seg fault with turbo3_tcq)
# -------------------------------------------
  "qwen3.5-9b":
    name: "Qwen3.5 9B"
    description: "Qwen 3.5 is a family of open-source multimodal models that delivers exceptional utility and performance, integrating breakthroughs in multimodal learning, architectural efficiency, and reinforcement learning."
    cmd: |
      ${ik_llama_server} --port ${PORT}
      --model ${models_dir}/Qwen3.5-9B-MoQ-3.6.gguf
      --fit
      --fit-margin 512
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --ctx-size ${small_model_max_ctx}
      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
      --repeat-penalty ${default_repeat_penalty}
      --reasoning on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --no-graph-reuse
      --ctx-checkpoints 0
      --ctx-checkpoints-interval 0
      --batch-size 512
      --ubatch-size 128
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~3.75 GB (MoQ-3.6)"
      context: "64K-128K (dynamic)"
      vram_usage: "~4.8GB VRAM (text-only, ik with hadamard cache)"
      source: "w-ahmad/Qwen3.5-9B-GGUF-MoQ (MoQ-3.6)"
      kv_cache: "q4_0/q4_0 + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 8950000000
      context_length: 262144
      embedding_length: 4096
      quantization: MoQ-3.6
      note: "MoQ-3.6 replaces UD-Q4_K_XL: same speed (12.2 tok/s), equal+ quality (21/25 vs 20/25 Snake), 32% smaller (3.75 vs 5.55 GB). MTP OOM on 6GB VRAM. OOM fix: q4_0 K cache (was q8_0), ctx-checkpoints=0, batch-size=512, ubatch=128 — prevents CUDA OOM at ~92K tokens on RTX 3050 6GB. --spec-type ngram-mod removed (spec decode buffers compete for VRAM with context checkpoints, aggravating OOM)."
# -------------------------------------------
# GEMMA-4-E2B - Unsloth UD-Q4_K_XL (Dynamic 2.0 QAT)
# Unsloth Dynamic 2.0 quantization of Google QAT weights.
# Better accuracy than naive Q4_0: Top-1 98.16% vs 89.29%, 22% smaller.
# Uses UD-Q4_K_XL format — upstream llama.cpp only (NOT ik_llama).
# Text-only — no mmproj (vision handled by dedicated VLMs in fleet).
# -------------------------------------------
  "gemma4-e2b":
    name: "Gemma 4 E2B"
    description: "Gemma 4 E2B QAT — Unsloth Dynamic 2.0 (UD-Q4_K_XL). Higher accuracy and smaller than Google Q4_0."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      --no-mmproj
      --fit on
      --fit-target 1024
      --fit-ctx ${small_model_min_ctx}
      --ctx-size ${small_model_max_ctx}
      --parallel 4
      --temp 0.7
      --top-p 0.9
      --top-k 40
      --min-p 0.01
      --repeat-penalty 1.0
      --reasoning on
      --cache-type-k ${gemma_cache_k}
      --cache-type-v ${gemma_cache_v}
      --flash-attn on
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~2.5 GB (UD-Q4_K_XL)"
      context: "32K-128K (dynamic)"
      vram_usage: "~2.5GB"
      source: "unsloth/gemma-4-E2B-it-qat-GGUF"
      kv_cache: "q4_0 + attn_rot"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma4
      parameters: 4650000000
      context_length: 131072
      embedding_length: 1536
      quantization: UD-Q4_K_XL
      note: "Unsloth Dynamic 2.0 QAT. Better accuracy than Google Q4_0 (Top-1 98.16% vs 89.29%), 22% smaller. Upstream only — NOT compatible with ik_llama."
# -------------------------------------------
# LFM2.5-2.6B - Liquid AI agentic on-device model (dense hybrid, text-only)
# 2.69B params, 30 layers (22 double-gated short conv + 8 GQA)
# Pre-trained on ~34T tokens, 128K context, 128K vocab
# 16 languages including Portuguese
# Reasoning model: always thinks before answering (tag 205)
# ChatML-like format, same as LFM2.5-8B-A1B
# GGUF has NO chat_template - requires --chat-template-file
# Backend: upstream llama.cpp (lfm2 arch supported, dense model)
# Model card params: temp=0.1, top_k=50, repeat_penalty=1.1
# Agentic RL post-training: trained inside Hermes Agent, OpenClaw, Pi
# Strong tool calling (ToolSandbox 77.83, ahead of Qwen3.5-9B at 76.44)
# Q8_0 = 2.87 GB - fits entirely in VRAM with room for context
# Only 8/30 layers are attention (GQA), KV cache is tiny - keep f16 (q8_0 is pure dequant overhead)
# -------------------------------------------
  lfm2.5-2.6b:
    name: "LFM 2.5 2.6B"
    description: "Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-Q6_K.gguf
      --fit on
      --fit-target ${vram_margin}
      --fit-ctx 131072
      --ctx-size 131072
      --parallel 1
      --reasoning on
      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja
      --temp 0.1
      --top-p 0.9
      --top-k 50
      --min-p 0.0
      --repeat-penalty 1.1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.1
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~2.22 GB (Q6_K)"
      context: "64K-128K (dynamic)"
      vram_usage: "~4.6GB VRAM (model 2.22GB + q4_0 KV 131K + compute)"
      source: "LiquidAI/LFM2.5-2.6B-GGUF (Q6_K)"
      kv_cache: "q4_0 (8/30 layers attention, 131K full VRAM in 6GB)"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: Q6_K
      note: "Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja."
# -------------------------------------------
# ORNITH-1.0-35B - MoE AGENTIC CODING (text-only)
# MoE 35B params, ~3B ativo por token. 256 experts, 8+1 active.
# Post-trained Qwen 3.5 35B MoE (self-scaffolding agentic coding RL).
# Same qwen35moe architecture as Qwen3.6-35B-A3B.
# APEX I-Compact ~16.5GB — 22% smaller than Q4_K_M (21.2GB), imatrix v1.3 calibrated.
# ik_llama backend: --fit, --defer-experts, hadamard KV, pinned memory.
# --fit-margin 1024: moderate headroom for context-shift + KV cache near full ctx
# --ctx-size 131072: same safe ceiling as Qwen 3.6
# Dual mode: base (chat, no think) and :think (reasoning)
# Identity: base Qwen 3.5 — should identify as Qwen, not Google (unlike 9B Gemma 4 base)
# -------------------------------------------
  "ornith-1.0-35b":
    name: "Ornith 1.0 35B"
    description: "Ornith-1.0 is a family of open-source LLMs specialized for agentic coding, trained with a novel self-scaffolding reinforcement learning approach that jointly optimizes the scaffold and the solution."
    cmd: |
      ${ik_llama_server} --port ${PORT}
      --model ${models_dir}/ornith-1.0-35b/Ornith-1.0-35B-APEX-I-Compact.gguf
      --fit
      --fit-margin 1024
      --ctx-size 131072
      --temp 1.0
      --top-p 1.0
      --top-k ${code_top_k}
      --min-p ${code_min_p}
      --repeat-penalty ${code_repeat_penalty}
      --reasoning on
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --cache-type-k ${large_cache_k}
      --cache-type-v ${large_cache_v}
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --defer-experts
      --prefetch-experts
      --spec-type ngram-mod:n_max=64,n_min=48,ngram_size_n=24
        --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 1.0
          top_p: 1.0
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 1.0
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~16.5 GB (APEX I-Compact)"
      context: "1K-131K (safe max)"
      vram_usage: "~5.4GB VRAM + ~12GB pinned RAM (ik pinned memory, estimated 33-34 t/s)"
      source: "mudler/Ornith-1.0-35B-APEX-GGUF"
      kv_cache: "q4_0 + attn_rot + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: I-Compact
      note: "Post-trained Qwen 3.5 35B MoE. Self-scaffolding RL for agentic coding. 256 experts, 8+1 active, ~3B active/token. APEX I-Compact: 22% smaller than Q4_K_M, imatrix v1.3 calibrated. Expected 33-34 t/s matching Qwen 3.6 APEX. Uses qwen-fixed-chat-template.jinja — embedded GGUF template lacks tool-call format instructions, causing <|mask_start|>/<tool_code> leakage."
# -------------------------------------------
# QWEN-AGENTWORLD-35B-A3B — Native Language World Model

# Architecture: qwen35moe (Gated DeltaNet + MoE) — same as Qwen3.6-35B-A3B
#   - 35B total params, 3B active per forward pass (8/256 experts)
#   - 40 layers, hybrid attention (full every 4th, linear/Mamba otherwise)
#   - 262K native context, thinking mode (reasoning before state prediction)
#   - Trained: CPT -> SFT -> RL on 10M+ real-world interaction trajectories

# 7 domains: MCP, Search, Terminal, SWE, Android, Web, OS
#   World model predicts next environment state given action + history
#   Agent foundation model: LWM warm-up transfers to agentic tasks

# Backend: ik_llama.cpp (supports qwen35moe since PR #1288)
#   Same architecture as Qwen3.6 — all ik optimizations apply

# Quant: APEX I-Compact (16.5 GB) — imatrix calibrated, from mudler
#   Same APEX pipeline as Qwen3.6/Ornith/Agents-A1 — 22% smaller than Q4_K_M
#   Previous: groxaxo Q4_K_M (20 GB), switched to mudler APEX Jul 2026

# Performance expectations (RTX 3050 6GB, ik_llama.cpp):
#   ~33-34 tok/s text generation (APEX I-Compact, same as Qwen3.6/Ornith)
#   Cold start: 30-60s (loading 16.5 GB + mmap)
#   VRAM: ~5.4GB VRAM + ~12GB pinned RAM (ik pinned memory)
#   Thinking mode adds latency but improves simulation fidelity

# ik_llama flags:
#   --fit + --fit-margin (auto offload to CPU)
#   --defer-experts (load MoE experts on demand)
