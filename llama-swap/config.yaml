healthCheckTimeout: 300
logLevel: info
logTimeFormat: rfc3339
logToStdout: proxy
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0
macros:
  models_dir: ${env.HOME}/.llama-models
  media_path: ${env.HOME}/testfiles/vision
  templates_dir: ${env.HOME}/git/ai-dotfiles/llama-swap/templates
  llama_server: ${env.HOME}/git/llama.cpp/build/bin/llama-server
  ik_llama_server: ${env.HOME}/git/ik_llama.cpp/build/bin/llama-server
  vllm_bin: ${env.HOME}/.vllm/bin/vllm
  default_temp: '0.7'
  default_top_p: '0.9'
  default_top_k: '20'
  default_min_p: '0.01'
  default_repeat_penalty: '1.05'
  code_temp: '0.6'
  code_top_p: '0.85'
  code_top_k: '40'
  code_min_p: '0.02'
  code_repeat_penalty: '1.05'
  think_temp: '0.6'
  think_top_p: '0.9'
  think_top_k: '20'
  think_min_p: '0.0'
  think_repeat_penalty: '1.0'
  small_model_min_ctx: '65536'
  small_model_max_ctx: '131072'
  large_model_min_ctx: '65536'
  large_model_max_ctx: '131072'
  vram_margin: '512'
  small_cache_k: q8_0
  small_cache_v: q8_0
  large_cache_k: q4_0
  large_cache_v: q4_0
  gemma_cache_k: q4_0
  gemma_cache_v: q4_0
models:
  qwen3.5-4b:
    name: Qwen3.5 4B
    description: Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Uses hadamard KV cache for maximum context efficiency and ngram speculative decoding.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.8 GB (UD-Q4_K_XL)
      context: 64K-128K (dynamic)
      vram_usage: ~4.5GB VRAM (model 2.8GB + q8_0/q4_0 hadamard cache + compute)
      source: unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: ik_llama.cpp with hadamard KV cache + --fit for dynamic context. Ngram spec decode via ik syntax. Uses qwen-fixed-chat-template.jinja for tool-call instructions. Formerly qwen3.5-4b-mtp, consolidated Jul 2026.
  qwen3.5-9b:
    name: Qwen3.5 9B
    description: Qwen 3.5 is a family of open-source multimodal models that delivers exceptional utility and performance, integrating breakthroughs in multimodal learning, architectural efficiency, and reinforcement learning.
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/Qwen3.5-9B-MoQ-3.6.gguf

      --fit

      --fit-margin 512

      --jinja

      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp ${default_temp}

      --top-p ${default_top_p}

      --top-k ${default_top_k}

      --min-p ${default_min_p}

      --repeat-penalty ${default_repeat_penalty}

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~3.75 GB (MoQ-3.6)
      context: 64K-128K (dynamic)
      vram_usage: ~4.8GB VRAM (text-only, ik with hadamard cache)
      source: w-ahmad/Qwen3.5-9B-GGUF-MoQ (MoQ-3.6)
      kv_cache: q4_0/q4_0 + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 8950000000
      context_length: 262144
      embedding_length: 4096
      quantization: MoQ-3.6
      note: 'MoQ-3.6 replaces UD-Q4_K_XL: same speed (12.2 tok/s), equal+ quality (21/25 vs 20/25 Snake), 32% smaller (3.75 vs 5.55 GB). MTP OOM on 6GB VRAM. OOM fix: q4_0 K cache (was q8_0), ctx-checkpoints=0, batch-size=512, ubatch=128 — prevents CUDA OOM at ~92K tokens on RTX 3050 6GB. --spec-type ngram-mod removed (spec decode buffers compete for VRAM with context checkpoints, aggravating OOM).'
  gemma4-e2b:
    name: Gemma 4 E2B
    description: Gemma 4 E2B QAT — Unsloth Dynamic 2.0 (UD-Q4_K_XL). Higher accuracy and smaller than Google Q4_0.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf

      --no-mmproj

      --fit on

      --fit-target 1024

      --fit-ctx ${small_model_min_ctx}

      --ctx-size ${small_model_max_ctx}

      --parallel 4

      --temp 0.7

      --top-p 0.9

      --top-k 40

      --min-p 0.01

      --repeat-penalty 1.0

      --reasoning on

      --cache-type-k ${gemma_cache_k}

      --cache-type-v ${gemma_cache_v}

      --flash-attn on

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.5 GB (UD-Q4_K_XL)
      context: 32K-128K (dynamic)
      vram_usage: ~2.5GB
      source: unsloth/gemma-4-E2B-it-qat-GGUF
      kv_cache: q4_0 + attn_rot
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma4
      parameters: 4650000000
      context_length: 131072
      embedding_length: 1536
      quantization: UD-Q4_K_XL
      note: Unsloth Dynamic 2.0 QAT. Better accuracy than Google Q4_0 (Top-1 98.16% vs 89.29%), 22% smaller. Upstream only — NOT compatible with ik_llama.
  lfm2.5-2.6b:
    name: LFM 2.5 2.6B
    description: Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-Q6_K.gguf

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 131072

      --ctx-size 131072

      --parallel 1

      --reasoning on

      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja

      --temp 0.1

      --top-p 0.9

      --top-k 50

      --min-p 0.0

      --repeat-penalty 1.1

      --cache-type-k q4_0

      --cache-type-v q4_0

      --flash-attn on

      --jinja

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 0.1
          top_p: 0.9
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~2.22 GB (Q6_K)
      context: 64K-128K (dynamic)
      vram_usage: ~4.6GB VRAM (model 2.22GB + q4_0 KV 131K + compute)
      source: LiquidAI/LFM2.5-2.6B-GGUF (Q6_K)
      kv_cache: q4_0 (8/30 layers attention, 131K full VRAM in 6GB)
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: Q6_K
      note: Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja.
  lfm2.5-vl-450m:
    name: LFM2.5-VL 450M
    description: Liquid AI general VLM with native bounding box grounding (RefCOCO-M 81.28). 450M params, 0-1 normalized coordinates.
    tags:
    - vision
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/LFM2.5-VL-450M-Q8_0.gguf\n--mmproj ${models_dir}/mmproj-LFM2.5-VL-450m-F16.gguf\n--media-path ${media_path}\n--jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx 4096\n--ctx-size 8192\n--parallel 1\n--cont-batching\n--temp 0.3\n--top-p 0.9\n--top-k 40\n--min-p 0.0\n--repeat-penalty 1.1\n--cache-type-k f16\n--cache-type-v f16\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 8192
    metadata:
      size: 379 MB (Q8_0) + 189 MB mmproj
      context: 8K (grounding-optimized)
      vram_usage: ~0.8 GB (model + mmproj + cache)
      source: LiquidAI/LFM2.5-VL-450M-GGUF (Q8_0 + mmproj F16)
      note: 'General VLM with grounding. Format: [{label, bbox:[x1,y1,x2,y2]}] 0-1 floats. NOT the Extract variant.'
      kv_cache: f16
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: lfm2
      parameters: 450000000
      context_length: 128000
      embedding_length: 1024
      quantization: Q8_0
  kat-coder-v2.5-dev:
    name: KAT-Coder V2.5 Dev
    description: KAT-Coder-V2.5-Dev is a coding-focused agentic model trained by Kwaipilot to act autonomously inside real, executable repositories. Built on Qwen3.6-35B-A3B with SFT+RL. SOTA agentic coding among similar-scale models.
    cmd: "${ik_llama_server} --port ${PORT}\n--model ${models_dir}/kat-coder-v2.5-dev/KAT-Coder-V2.5-Dev-APEX-I-Compact.gguf\n--fit\n--fit-margin 512\n--ctx-size 131072\n--temp 1.0\n--top-p 0.95\n--top-k 20\n--min-p ${code_min_p}\n--repeat-penalty 1.5\n--reasoning on\n--jinja\n--chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja\n--parallel 1\n--parallel-tool-calls\n--cache-type-k ${large_cache_k}\n--cache-type-v ${large_cache_v}\n--k-cache-hadamard\n--v-cache-hadamard\n--flash-attn auto\n--defer-experts\n--prefetch-experts\n--spec-type ngram-mod:n_max=64,n_min=48,ngram_size_n=24\n  --metrics\n"
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.8
          presence_penalty: 1.5
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 0.95
          presence_penalty: 1.5
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~16.5 GB (APEX I-Compact)
      context: 1K-131K (safe max)
      vram_usage: ~5.4GB VRAM + ~12GB pinned RAM (ik pinned memory, estimated 33-34 t/s)
      source: mudler/KAT-Coder-V2.5-Dev-APEX-GGUF
      kv_cache: q4_0 + attn_rot + hadamard
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX I-Compact
      note: Post-trained Qwen 3.6 35B MoE by Kwaipilot. SFT (127K examples) + RL with TITO consistency, TIS, hierarchical rewards. SWE-bench Verified 69.4 (SOTA for class). RL penalizes excessive parallel tool calls (Qwen3.6 tendency). Vision not included in open-weight release. Uses qwen-fixed-chat-template.jinja — same as Ornith/Qwen3.6.
  agentworld-35b:
    name: Qwen AgentWorld 35B
    description: Qwen's native language world model. 35B params, 3B active. Simulates 7 agent environments (MCP, Search, Terminal, SWE, Android, Web, OS) via long chain-of-thought reasoning. Trained from CPT onward for environment modeling.
    cmd: "${ik_llama_server} --port ${PORT}\n--model ${models_dir}/agentworld-35b/Qwen-AgentWorld-35B-A3B-APEX-I-Compact.gguf\n--fit\n--fit-margin 512\n--ctx-size 131072\n--temp ${think_temp}\n--top-p ${think_top_p}\n--top-k ${think_top_k}\n--min-p ${think_min_p}\n--repeat-penalty ${think_repeat_penalty}\n--reasoning on\n--jinja\n--parallel 1\n--cache-type-k ${large_cache_k}\n--cache-type-v ${large_cache_v}\n--k-cache-hadamard\n--v-cache-hadamard\n--flash-attn auto\n--defer-experts\n--prefetch-experts\n--spec-type ngram-mod:n_max=64,n_min=48,ngram_size_n=24\n  --metrics\n"
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 600
    health_check_timeout: 600
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: ~16.5 GB (APEX I-Compact)
      context: 1K-131K (safe max)
      vram_usage: ~5.4GB VRAM + ~12GB pinned RAM (ik pinned memory, estimated 33-34 t/s)
      source: mudler/Qwen-AgentWorld-35B-A3B-APEX-GGUF
      kv_cache: q4_0 + attn_rot + hadamard
      domains: MCP, Search, Terminal, SWE, Android, Web, OS
      features:
        completion: true
        tools: false
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: APEX I-Compact
      note: World model — simulates 7 agent environments. Use with worldsim CLI. Thinking mode recommended for simulation fidelity. 131K ctx safe max with APEX I-Compact (same as Qwen3.6/Ornith).
  bonsai-27b-1bit:
    name: Bonsai 27B 1-bit
    description: PrismML's 1-bit 27B reasoning model — Qwen3.6-27B with 1.125-bit weights, full thinking/reasoning at 3.9 GB. 89.5% of FP16 intelligence. Fits entirely in 6GB VRAM. Now on upstream llama.cpp with ngram-mod speculative decoding.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/bonsai-27b-1bit/Bonsai-27B-Q1_0.gguf

      --jinja

      --reasoning on

      -ngl 99

      --ctx-size 32768

      --temp 0.7

      --top-p 0.95

      --top-k 20

      --min-p 0

      --repeat-penalty 1.0

      --parallel 1

      --cache-type-k ${large_cache_k}

      --cache-type-v ${large_cache_v}

      --flash-attn on

      --spec-type ngram-mod

      --spec-ngram-mod-n-max 64

      --spec-ngram-mod-n-min 48

      --spec-ngram-mod-n-match 24

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k, min_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 32768
    metadata:
      size: ~3.9 GB (Q1_0 binary 1.125 bpw)
      context: 32K (full GPU offload, RTX 3050 6GB — experimental/bisturi)
      vram_usage: ~4.8 GB (model + KV cache q4_0, fits entirely in GPU)
      source: prism-ml/Bonsai-27B-gguf (Q1_0)
      kv_cache: q4_0 + attn_rot
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen3
      parameters: 27300000000
      context_length: 262144
      embedding_length: 3584
      quantization: Q1_0 (binary 1.125 bpw)
      note: Reativado Jul 2026 — Q1_0 CUDA kernels merged upstream (b9867+), sem fork. ngram-mod speculative decoding para ~20-31 tok/s em RTX 3050 6GB. 48K ctx é o sweet spot de full-GPU offload.
  qwen3-vl-4b:
    name: Qwen3-VL 4B
    description: Qwen3-VL dense 4B vision-language model with native 2D/3D grounding, OCR in 32 languages, visual agent GUI, and video understanding.
    tags:
    - vision
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/qwen3-vl-4b/Qwen3VL-4B-Instruct-Q4_K_M.gguf\n--mmproj ${models_dir}/qwen3-vl-4b/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf\n--media-path ${media_path}\n--jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx 8192\n--ctx-size 32768\n--parallel 1\n--temp 0.7\n--top-p 0.8\n--top-k 20\n--min-p 0.0\n--repeat-penalty 1.0\n--presence-penalty 1.5\n--cache-type-k ${small_cache_k}\n--cache-type-v ${small_cache_v}\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: 2.5 GB (Q4_K_M) + 454 MB mmproj
      context: 8K-256K (dynamic)
      vram_usage: ~4 GB (model + mmproj + cache)
      source: Qwen/Qwen3-VL-4B-Instruct-GGUF (Q4_K_M + mmproj Q8_0)
      note: 'Native grounding: bbox_2d [x1,y1,x2,y2] in 0-1000 scale. repeat_penalty 1.0 mandatory.'
      kv_cache: q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: qwen3vl
      parameters: 4000000000
      context_length: 256000
      embedding_length: 2560
      quantization: Q4_K_M
  agents-a1-4b:
    name: Agents-A1 4B
    description: Agents-A1 4B dense agentic model by InternScience. Fine-tuned Qwen3.5-4B for long-horizon search, engineering, scientific research, and tool calling. Text-only (mmproj disabled for full context).
    tags:
    - agentic
    cmd: '${ik_llama_server} --port ${PORT}

      --model ${models_dir}/agents-a1-4b/Agents-A1-4B-Q4_K_M.gguf

      --fit

      --fit-margin 512

      --jinja

      --parallel 1

      --parallel-tool-calls

      --ctx-size ${small_model_max_ctx}

      --temp 0.85

      --top-p 0.95

      --top-k 20

      --min-p 0.0

      --repeat-penalty 1.0

      --presence-penalty 1.1

      --reasoning on

      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

      --metrics

      '
    filters:
      stripParams: temperature, top_p, presence_penalty, repetition_penalty
