# llama-swap configuration for RTX 3050 Laptop (6GB VRAM)
# Configuração otimizada para uso com --fit automático + attn_rot (KV cache quantizado)
# Dual binary: llama.cpp for dense models, ik_llama.cpp for MoE models (pinned memory, better expert offload)
#
# Repositório: ~/git/ai-dotfiles/llama-swap/
# Modelos: ~/.llama-models/
# Requer: llama-swap v212+ (Prometheus metrics, SIGHUP reload, reasoning UI, race fix, zstd captures)
# Requer: llama.cpp build b9563+ (mtmd audio/TTS/video, 6 audio preprocessors: whisper/conformer/granite_speech/gemma4a/gemma4ua/qwen3a, LFM2.5 reasoning fix, Gemma4 MTP, Granite4 Vision, KV cache optimizations)
# Requer: ik_llama.cpp v4566+ (bf16 graph reduce fix, threads-mtmd, mtmd checkpoint save/restore)
# Requer: cafe-llama.cpp (fork quimmedes/Ark) — Turbo KV (turbo2/3/4) para contexto longo
#   (>131K) em MoE, MoE offload (-hmoe pinned RAM / -ssd streaming do NVMe), safetensors
#   nativo. Substituiu o beellama.cpp (removido Set/2026); upstream já tinha removido o
#   TurboQuant/TCQ original em v0.4.0 (renomeado KVarN).
#
# OTIMIZAÇÕES ik_llama.cpp (modelos MoE e dense offloaded):
#   --k-cache-hadamard / --v-cache-hadamard (-khad/-vhad): Hadamard transform no K/V cache
#     antes da quantização → qualidade muito mais próxima do f16 com cache q4_0/q8_0.
#     Especialmente útil em 6GB VRAM onde q4_0 é necessário para contexto longo.
#   --flash-attn auto: desliga FA automaticamente em contextos curtos (economia em MoE offloaded)
#   --defer-experts: defere mmap de experts no Linux → carregamento mais rápido de modelos MoE

# Schema para validação (VS Code)

healthCheckTimeout: 300
logLevel: info
logTimeFormat: "rfc3339"
logToStdout: "proxy"
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0

# Macros reutilizáveis
macros:
  "models_dir": "${env.HOME}/.llama-models"
  "media_path": "${env.HOME}/testfiles/vision"
  "templates_dir": "${env.HOME}/git/ai-dotfiles/llama-swap/templates"

  # Caminho para o llama-server compilado com CUDA (--fit disponível)
  # Build local em ~/git/llama.cpp/build/bin/llama-server
  "llama_server": "${env.HOME}/git/llama.cpp/build/bin/llama-server"

  # Caminho para ik_llama.cpp — fork otimizado para MoE (pinned memory, faster expert offload)
  # Build local em ~/git/ik_llama.cpp/build/bin/llama-server
  "ik_llama_server": "${env.HOME}/git/ik_llama.cpp/build/bin/llama-server"

  # ik_llama.cpp fork do kassane (branch k2-horizon) — suporte a arquitetura k2-horizon
  # Build local em ~/git/kassane-ik_llama.cpp/build/bin/llama-server
  "ik2_llama_server": "${env.HOME}/git/kassane-ik_llama.cpp/build/bin/llama-server"

  # bee_server REMOVIDO Sep 20 2026 — fork beellama.cpp deletado; cafe-llama.cpp
  # (turbo4 KV + hmoe/ssd MoE offload) cobre esse papel daqui em diante (user decision)

  # Caminho para o llama-server do fork cafe-llama.cpp (quimmedes/Ark)
  # Turbo KV cache (turbo2/3/4, FA-fused), safetensors nativo, -hmoe/-ssd MoE offload
  # Único backend que carrega qwen35moe @262K ctx na RTX 3050 6GB (turbo4 KV)
  # Build local em ~/git/cafe-llama.cpp/build/bin/llama-server (commit 0fbc13f, set/2026)
  "cafe_server": "${env.HOME}/git/cafe-llama.cpp/build/bin/llama-server"

  # Caminho para o llama-server do fork PrismML (Bonsai-2 ternary, runtime Hadamard)
  # Binário prebuilt em ~/git/prism-llama.cpp/llama-prism-b10685-7dffb15/
  "prism_llama_server": "${env.HOME}/git/prism-llama.cpp/llama-prism-b10685-7dffb15/llama-server"
  # Caminho para o vLLM (installed in ~/.vllm venv)
  "vllm_bin": "${env.HOME}/.vllm/bin/vllm"

  # ===========================================
  # PARÂMETROS DE INFERÊNCIA (baseados no Unsloth)
  # ===========================================
  # Qwen3.5: temp 0.6-0.7, top_p 0.8-0.9, top_k 20-40

  # Gemma: temp 0.7, top_p 0.9
  # Referência: https://unsloth.ai/docs/models/qwen3.5
  # ===========================================
  # Parâmetros padrão (uso geral)
  "default_temp": "0.7"
  "default_top_p": "0.9"
  "default_top_k": "20"
  "default_min_p": "0.01"
  "default_repeat_penalty": "1.05"

  # Parâmetros para código/tool-calling (mais determinístico)
  "code_temp": "0.6"
  "code_top_p": "0.85"
  "code_top_k": "40"
  "code_min_p": "0.02"
  "code_repeat_penalty": "1.05"

  # Parâmetros para thinking/reasoning
  "think_temp": "0.6"
  "think_top_p": "0.9"
  "think_top_k": "20"
  "think_min_p": "0.0"
  "think_repeat_penalty": "1.0"

  # Qwen3.8-27B samplers removed Aug 2026 — model disabled
  # Contexto para modelos pequenos (cabem inteiros na VRAM)
  # fit-ctx: mínimo garantido, ctx-size: máximo teto
  "small_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "small_model_max_ctx": "131072"  # 128K máximo
  # Contexto para completion models (sem agente, sem tool-calling)
  "completion_ctx": "32768"      # 32K — code completion não precisa de mais
  # Contexto para modelos grandes (requerem offload)
  "large_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "large_model_max_ctx": "131072"  # 128K máximo
  # Margem de segurança para VRAM (MiB) - usada pelo --fit-target
  "vram_margin": "512"

  # ===========================================
  # KV CACHE QUANTIZADO + ATTN_ROT
  # ===========================================
  # attn_rot é ativado AUTOMATICAMENTE quando o cache é quantizado
  # (q4_0/q8_0) e n_embd_head % 64 == 0
  # Reduz degradação de velocidade em contextos longos (~37% → ~10%)
  # NOTA: Gemma4 iSWA attn_rot bug FIXED (commit 4eb19514d, b8815+). q4_0 cache works now!
  # ===========================================
  #
  # Compatibilidade attn_rot por modelo:
  #   Qwen3.5-4B/9B   ✅ head_k=256 (256%64==0)
  #   Qwen3-14B        ✅ head_k=128 (128%64==0)
  #   Qwen3.6-35B-A3B  ✅ head_k=128
    #   Nemotron-3-Nano  ✅ head_k=128 (REMOVED — poor quality)
  #   Nemotron-Omni-30B ✅ head_k=128 (NOT added — ik_llama lacks nemotron_h_moe arch, NOT i-quants. ik_llama supports IQ2_XXS/IQ3_XXS/IQ4_XS natively)
  #   Gemma-4 E2B/E4B  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   Gemma-4 26B-MoE  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   LFM2.5-1.2B       ✅ head_k=64 (64%64==0) — dense hybrid
  #   LFM2-24B-A2B     ✅ head_k=128 (128%64==0) — MoE hybrid
  #   LFM2.5-VL-450M   ❌ vision model, manter f16
  #
  # Tipos de cache:
  #   q8_0: ~47% economia vs f16, perda mínima
  #   q4_0: ~72% economia vs f16, mais compressão
  #
  # Escolha: modelos pequenos (fit VRAM) usam q8_0 (saldo perf/mem)
  #          modelos grandes (offload) usam q4_0 (maximizar contexto)
  "small_cache_k": "q8_0"
  "small_cache_v": "q8_0"
  "large_cache_k": "q4_0"
  "large_cache_v": "q4_0"
  "gemma_cache_k": "q4_0"
  "gemma_cache_v": "q4_0"
models:
# -------------------------------------------
# QWEN3.5-4B - ik_llama.cpp BACKEND
# Dense 4B params, UD-Q4_K_XL ~2.8GB.
# ik_llama.cpp with hadamard KV cache + --fit for dynamic context.
# Ngram speculative decoding via ik syntax.
# qwen-fixed-chat-template.jinja for tool-call instructions.
# Tool calling: --parallel-tool-calls.
# Thinking: reasoning_content field, separate from content.
# Dual mode: base (chat, no think) and :think (reasoning)
# NOTE: Formerly "qwen3.5-4b-mtp" — consolidated as canonical qwen3.5-4b (Jul 2026)
#   Old upstream+Q4_K_M variant moved to _disabled/qwen3.5-4b-upstream.yaml
# -------------------------------------------
  "qwen3.5-4b":
    name: "Qwen3.5 4B"
    description: "Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Uses hadamard KV cache for maximum context efficiency and ngram speculative decoding."
    cmd: |
      ${ik_llama_server} --port ${PORT}
      --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf
      --fit
      --fit-margin 512
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --ctx-size ${small_model_max_ctx}
      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
      --repeat-penalty ${default_repeat_penalty}
      --reasoning on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --no-graph-reuse
      --ctx-checkpoints 0
      --ctx-checkpoints-interval 0
      --batch-size 512
      --ubatch-size 128
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~2.8 GB (UD-Q4_K_XL)"
      context: "64K-128K (dynamic)"
      vram_usage: "~4.5GB VRAM (model 2.8GB + q8_0/q4_0 hadamard cache + compute)"
      source: "unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)"
      kv_cache: "q4_0/q4_0 + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 4210000000
      context_length: 262144
      embedding_length: 2560
      quantization: UD-Q4_K_XL
      note: "ik_llama.cpp with hadamard KV cache + --fit for dynamic context. Ngram spec decode via ik syntax. Uses qwen-fixed-chat-template.jinja for tool-call instructions. Formerly qwen3.5-4b-mtp, consolidated Jul 2026."
# -------------------------------------------
# LFM2.5-2.6B - Liquid AI agentic on-device model (dense hybrid, text-only)
# 2.69B params, 30 layers (22 double-gated short conv + 8 GQA)
# Pre-trained on ~34T tokens, 128K context, 128K vocab
# 16 languages including Portuguese
# Reasoning model: always thinks before answering (tag 205)
# ChatML-like format, same as LFM2.5-8B-A1B
# GGUF has NO chat_template - requires --chat-template-file
# Backend: upstream llama.cpp (lfm2 arch supported, dense model)
# Model card params: temp=0.1, top_k=50, repeat_penalty=1.1
# Agentic RL post-training: trained inside Hermes Agent, OpenClaw, Pi
# Strong tool calling (ToolSandbox 77.83, ahead of Qwen3.5-9B at 76.44)
# Q8_0 = 2.87 GB - fits entirely in VRAM with room for context
# Only 8/30 layers are attention (GQA), KV cache is tiny - keep f16 (q8_0 is pure dequant overhead)
# -------------------------------------------
  lfm2.5-2.6b:
    name: "LFM 2.5 2.6B"
    description: "Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context. Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-QAD-Q4_0.gguf
      --fit on
      --fit-target ${vram_margin}
      --fit-ctx 131072
      --ctx-size 131072
      --parallel 2
      --reasoning on
      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja
      --temp 0.1
      --top-p 0.9
      --top-k 50
      --min-p 0.0
      --repeat-penalty 1.1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      -md ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-DSpark-Draft-v1-F16.gguf
      --spec-type draft-dspark
      --spec-draft-n-max 10
      --spec-draft-n-min 0
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.1
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.1
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~1.55 GB (QAD Q4_0)"
      context: "64K-128K (dynamic)"
      vram_usage: "~3.9GB VRAM (model 1.55GB + q4_0 KV 131K + compute)"
      source: "LiquidAI/LFM2.5-2.6B-GGUF (QAD Q4_0)"
      kv_cache: "q4_0"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: QAD Q4_0
      note: "Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template - uses lfm2.5-chat-template.jinja. Only 8/30 layers are attention (GQA), KV cache is tiny - q4_0 fits 131K full VRAM in 6GB. QAD (Quantization-Aware Distillation) recovers ~97% of BF16 quality vs native Q4_0. DSpark speculative decoding via F16 draft sidecar (633MB) — up to 2.27x speedup on-device, 57% latency reduction for function calling."
# -------------------------------------------
# QWEN2.5-CODER-1.5B-INSTRUCT-POLLARD - CPU-ONLY (coexist with GPU MoE)
# Pollard memory-fit quantization with imatrix guidance.
# Role/depth-aware precision: sensitive tensors high precision, FFN bulk compressed.
# Pollard v2 self-quant (2026-08-31): attn q/k/v/o -> q5_K (protected), ffn -> iq4_xs.
# 825.90 MiB, 4.49 BPW. Bench N=5 (maple 8ce8ca6, ngl 0): pp512 +7.6% (60.88 -> 65.48),
# tg128 empate (CIs overlap), FIM cold -6%, warm tpot equivalente.
# v2 wired 2026-09-16 via FRAGMENT edit + rebuild (v1 de 23/ago mantido em rollback).
# Architecture: qwen2 (28 layers, dense 1.54B params).
# Qwen2.5-Coder FIM tokens: <|fim_prefix|>, <|fim_suffix|>, <|fim_middle|>
# Also supports repo-level completion via <|repo_name|> and <|file_sep|>
# Backend: upstream llama.cpp, CPU-ONLY (CUDA_VISIBLE_DEVICES="").
# Purpose: code completion on CPU while GPU runs heavy MoE (Ornith 35B etc).
# ~44 tok/s on i7-13650HX CPU-only (estimated, same arch as Instruct variant).
# -------------------------------------------
  "qwen2.5-coder-1.5b-pollard":
    name: "Qwen2.5 Coder 1.5B Pollard"
    description: "Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct, CPU-only. IQ4_XS with imatrix. FIM native. Code completion on CPU, zero VRAM, coexists with GPU MoE."
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/qwen2.5-coder-1.5b-pollard-new/Qwen2.5-Coder-1.5B-Pollard-v2-IQ4XS-class.gguf
      --jinja
      --parallel 1
      --ctx-size ${completion_ctx}
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0.0
      --repeat-penalty 1.1
      --cache-type-k ${small_cache_k}
      --cache-type-v ${small_cache_v}
      --batch-size 512
      --ubatch-size 128
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 48
      --spec-ngram-mod-n-max 64
      --no-webui
      --metrics
    env:
      - "CUDA_VISIBLE_DEVICES="
    filters:
      stripParams: "temperature, top_p"
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in:
        - 'text'
      out:
        - 'text'
      tools: false
      reranker: false
      context: 32768
    metadata:
      size: "~824 MB (Pollard IQ4_XS + imatrix)"
      context: "32K (completion)"
      vram_usage: "0 (CPU-only)"
      source: "PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)"
      kv_cache: "q8_0"
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: true
        audio: false
        image: false
      architecture: qwen2
      parameters: 1540000000
      context_length: 32768
      embedding_length: 1536
      quantization: Pollard IQ4_XS
      note: "Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct. IQ4_XS with imatrix on mixed prose+code. FIM native (Qwen2.5-Coder tokens). CPU-only, coexists with GPU MoE. ngram-mod enabled."
# -------------------------------------------
# -------------------------------------------
# QWEN3.6-35B-A3B-HERETIC — PRODUCAO (cafe-llama.cpp 0.74, OFICIAL 05/10)
# Uncensored oficial da frota: heretic do llmfan46 (KL 0.0015, 88% menos
# recusas), quant SC117 APEX-I-Compact com MTP nextn=1 preservado.
# Renamed era "-cafe"; o ik (pico > rapido) ficou em _disabled/...-fast.yaml
# -cmoe 05/10: experts em page cache file-backed (RAM used ~5-6GB, evictavel)
#   — mesma FISICA provada no ornith-heretic + laguna (bancada 05/10);
#   -hmoe pinava ~15GB. Medicao -cmoe dedicada deste modelo: proximo smoke.

# ARMADILHAS do fork (ler cafe-llama-cpp-eval.md antes de mexer):
#   - NUNCA --pipeline-parallel com ctx >=131K (buffer DMA 48GB → OOM duplo)
#   - turbo2 CRASHA na arch hibrida; turbo4 limpo
#   - MTP draft @262K nao cabe (draft KV 512MiB) — sem --spec-type aqui
#   - cafe NAO tem: --parallel-tool-calls, --no-graph-reuse, --defer-experts,
#     --prefetch-experts, --k/v-cache-hadamard, --fit-margin (usar --fit-target)
#   - env LD_LIBRARY_PATH OBRIGATORIA (RUNPATH morto), sintaxe spec 0.74: draft-mtp
# -------------------------------------------
  "qwen3.6-35b-a3b-heretic":
    name: "Qwen 3.6 35B Heretic Long"
    description: "Assistente de código sem censura com visão e o maior contexto da frota (262K, dividido em até 4 sessões de 64K). Ideal para múltiplos agentes em paralelo, análise de documentos longos e refatorações extensas."
    cmd: |
      env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}
      --model ${models_dir}/qwen36-heretic-apex-mini/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Mini.gguf
      --mmproj ${models_dir}/qwen36-heretic-apex-mini/mmproj.gguf
      --ctx-size 131072
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 2
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      -cmoe
      -ngl 99
      -b 512
      -ub 128
      --temp ${code_temp}
      --top-p ${code_top_p}
      --top-k ${code_top_k}
      --min-p ${code_min_p}
      --repeat-penalty ${code_repeat_penalty}
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
        - 'text'
        - 'image'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~14.66 GB (APEX-I-Compact, heretic) + 614 MB mmproj Q8"
      context: "131K (2 slots de 64K)"
      vram_usage: "~5.1 GB VRAM (turbo4 KV) + ~15 GB pinned RAM (hmoe)"
      source: "SC117/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-GGUF (I-Compact) + mmproj unsloth Q8"
      kv_cache: "q4_0/q4_0"
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 34660000000
      context_length: 262144
      embedding_length: 2048
      quantization: "APEX I-Compact"
      note: "Produção Sep 24: café herdou o posto do ik-131K (menor pressão de VRAM/RAM, 262K nativo). Heretic KL 0.0015 (88% menos recusas). Sem MTP @262K (draft KV não cabe). Smoke 200 OK (7s). KV turbo4 = WHT-rotated, FA-fused (IK TurboQuant); source do mmproj: unsloth Q8."
# -------------------------------------------
# ORNITH-1.5-35B-A3B - MoE AGENTIC CODING + VISION (ONYX compact + MTP, DEFAULT)
# MoE 35B params, ~3B ativo por token. 256 experts, 8+1 active.
# Self-improving RL: extends Ornith-1.0 self-scaffolding into full self-improvement loop
# (task generation + scaffold construction + solution rollouts).
# Same qwen35moe architecture as Ornith-1.0 and Qwen3.6-35B-A3B.

# PROMOTED 2026-09-02 after A/B vs APEX Compact (N=3, same prompt/samplers):
#   ONYX compact + MTP:  45.1 tok/s mean (46.1/44.8/44.5), VRAM 4646 MiB (75.6%)
#   APEX Compact + ngram: 40.6 tok/s mean (40.2/40.7/40.9), VRAM 4232 MiB (68.9%)
#   MTP acceptance 85-93% (head well calibrated on this base).
#   +11.1% throughput for +414 MiB VRAM. User decision: speed wins.

# ONYX (el4) = APEX evolution: dynamic layer sensitivity + router-weighted
# imatrix (crushes cold MoE experts, protects hot ones in-tensor).
# ONYX PRESERVES MTP head (blk.40.nextn.* Q8_0, verified via GGUFReader:
# nextn_predict_layers=1, 4 nextn tensors). --spec-type mtp is SAFE here.
# (OOM pitfall applies only to GGUFs with 0 nextn layers — see
# references/mtp-speculative-decoding.md)

# Vision: mmproj.gguf (899MB, CLIP-based, shared with APEX — same encoder).
#   --no-mmproj-offload keeps it in RAM to preserve VRAM for weights.
# ik_llama backend: --fit, --defer-experts, hadamard KV, pinned memory.
# --fit-margin 2048: moderate headroom for context-shift + KV cache near full ctx

# Samplers (from model card):
#   General tasks: temp=0.6, top_p=0.95, top_k=20
#   Benchmarks: temp=1.0

# --ctx-size 131072: same safe ceiling (model supports 262K, YaRN extends to 1M)
# Dual mode: base (chat, no think) and :think (reasoning)
# --reasoning-budget 8192: caps thinking tokens at 8192 when :think is active.
#   Base mode is unaffected (template injects closed think block, budget never triggers).
# --reasoning-budget-message: smooth transition when budget is exhausted.
# Uses qwen-fixed-chat-template.jinja — embedded GGUF template lacks
# tool-call format instructions, causing leakage without the fixed template.

# Benchmark (Sep 2026 A/B, RTX 3050 6GB, N=3 same prompt):
#   ONYX compact + MTP: 45.1 tok/s, VRAM 4646 MiB, accept 85-93% — DEFAULT
#   APEX Compact + ngram-mod: 40.6 tok/s, VRAM 4232 MiB (_disabled, GGUF deleted
#   2026-09-02 — re-download from mudler/Ornith-1.5-35B-A3B-APEX-GGUF to revert)
# -------------------------------------------
  "ornith-1.5-35b":
    name: "Ornith 1.5 35B"
    description: "Ornith-1.5 is a family of open-source LLMs trained with end-to-end self-improvement — the model proposes new tasks, generates task-specific scaffolds, and produces solution rollouts for RL, continuously creating new learning experiences. ONYX quantization (el4, APEX evolution) with MTP speculative decoding and vision support."
    cmd: |
      ${ik_llama_server} --port ${PORT}
      --model ${models_dir}/ornith-1.5-35b/Ornith-1.5-35B-A3B-ONYX-compact.gguf
      --mmproj ${models_dir}/ornith-1.5-35b/mmproj.gguf
      --no-mmproj-offload
      --fit
      --fit-margin 2048
      --ctx-size 131072
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p ${code_min_p}
      --repeat-penalty ${code_repeat_penalty}
      --reasoning on
      --reasoning-budget 8192
      --reasoning-budget-message "Let me conclude my reasoning and provide the answer."
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --cache-type-k ${large_cache_k}
      --cache-type-v ${large_cache_v}
      --k-cache-hadamard
      --v-cache-hadamard
      --flash-attn auto
      --defer-experts
      --prefetch-experts
      --spec-type mtp:n_max=1,p_min=0.0
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.6
          top_p: 0.95
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.95
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
        - 'text'
        - 'image'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~16.4 GB (ONYX compact) + 899 MB mmproj"
      context: "1K-131K (safe max, model supports 262K)"
      vram_usage: "~4.6GB VRAM measured + ~16GB pinned RAM (45 tok/s with MTP, accept 85-93%)"
      source: "el4/Ornith-1.5-35B-A3B-ONYX-GGUF (compact tier)"
      kv_cache: "q4_0/q4_0 + hadamard"
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35moe
      parameters: 35000000000
      context_length: 262144
      embedding_length: 2048
      quantization: ONYX compact
      note: "Default since Sep 2026 A/B: 45.1 vs 40.6 tok/s (APEX+ngram), MTP accept 85-93%, +414MiB VRAM (75.6% total). ONYX = APEX evolution (dynamic layer sensitivity + router-weighted imatrix), MTP head preserved. Old APEX Compact: _disabled/ornith-1.5-35b-apex.yaml, GGUF deleted Sep 2026 (re-download from mudler repo if reverting)."
