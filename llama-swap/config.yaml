        - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~20.3 GB (Q4_K_M official)
      context: 131072
      vram_usage: ~4.0 GB VRAM + ~5 GB RAM
      source: poolside/Laguna-XS-2.1-GGUF (Q4_K_M official)
      kv_cache: q4_0/q4_0
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: laguna
      parameters: 33000000000
      context_length: 131072
