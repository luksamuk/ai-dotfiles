      --cache-type-k q4_0

      --cache-type-v q4_0

      --k-cache-hadamard

      --v-cache-hadamard

      --flash-attn auto

      --no-graph-reuse

      --ctx-checkpoints 0

      --ctx-checkpoints-interval 0

      --batch-size 512

      --ubatch-size 128

