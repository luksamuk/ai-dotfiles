      -ngl 99

      --temp 0.3

      --top-p 0.85

      --top-k 40

      --min-p 0.02

      --repeat-penalty 1.12

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParams:
        stop:
        - </assistant>
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
