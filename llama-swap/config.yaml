# MINICPM5-2B — OpenBMB (Apache-2.0) — quant POLLARD IQ4_XS
# Dense 2B, LlamaForCausalLM PURO (arch llama) — roda no upstream e no ik
# sem fork/patch. 42 layers, GQA 16/2, head_dim 128, ctx 131K nativo
# (rope_theta 5M). Text-only, sem vision, sem MTP/NextN.

# PROMOVIDO 2026-09-08 (user decision): PollardWeights IQ4_XS "PollardMix"
# (measured-allocation: bits por sensibilidade de camada) no lugar do
# Q4_K_M oficial. Comparação completa nos 3 ambientes (testchat ReAct,
# :think, N=1; bench direto greedy N=3):
#   GPU decode:   Pollard 86.5 t/s vs Q4_K_M 82.1 (empate técnico, ±5)
#   CPU decode:   Pollard 19.5     vs Q4_K_M 27.6 (Q4_K_M vence, -30% IQ dequant)
#   GPU prefill:  Pollard 3039     vs Q4_K_M 2870 tok/s
#   GPU TTFT:     Pollard 1.43s    vs Q4_K_M 1.85s (-23%)
#   Disco:        1341 MB vs 1489 MB (-148MB, ~10%)
#   Verdict: GPU -> Pollard (mesmo decode, arranque mais rápido, menor).
#            CPU -> Q4_K_M (mas user usa GPU aqui).

# TOOL CALL: no modo BASE o IQ4_XS falha (responde texto plano onde deveria
# chamar <function ...>); na variante :think funciona BEM — 4 parallel calls
# corretas no testchat, parse limpo. 3º caso do padrão "tools só no :think"
# (nanbeige4.2-3b, spark-x2.5-4b). Agentes: usar sempre :think.

# KV budget (RTX 3050 6GB): 42 layers x 2 KV heads x 128 dim.
# q4_0 KV = ~10.6 KiB/token -> 131K ~1.35GB. Modelo 1.41GB + KV + buffers ~3.8GB.

# Tool calling: XML-style <function name=...><param name=...>...</param></function>
# (SGLang usa parser dedicado 'minicpm5'). GGUF Pollard carrega metadata de
# tool-call + template EMBUTIDOS (byte-idênticos ao oficial — strings grep).
# Thinking: template dual-mode (enable_thinking), blocos think.
# Vendor: temp 1.0 / top_p 0.95. Grafia PT perfeita no IQ4_XS
# (luksamuk/Diamantina/Navi/Itaipava — smoke 07-08/09).

