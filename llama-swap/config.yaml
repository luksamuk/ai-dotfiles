      source: "prism-ml/Ternary-Bonsai-2-27B-gguf (PTQ1_0 + mmproj Q8_0)"
      kv_cache: "q4_0 (host RAM)"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 27360000000
      context_length: 262144
      embedding_length: 5120
      quantization: PTQ1_0
      note: "Deploy QUALIDADE (17/09): user pediu pra testar qualidade do output. Teto Navi: ngl 56 (2.94 t/s decode, pp 134 c/ desktop limpa); 57-63 OOM; ngl 48 = 1.66 t/s (ping-pong); CPU-only decode 0.53-0.64 t/s. Full offload OOM por ~100-200MiB. Velocidade NÃO é o objetivo aqui — 98.2% FP16 é. Vision Tower desligada por VRAM (regra: texto+ctx cheio > visão c/ ctx estrangulado); reativar mmproj = re-adicionar --mmproj + --no-mmproj-offload (custa ~0.63GB RAM). Re-teste em GPU 8GB+ ou fork otimizando unpack AVX2. Gen-1 1-bit (bonsai-27b) segue sendo o Bonsai rápido da casa."
