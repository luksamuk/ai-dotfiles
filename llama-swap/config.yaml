      note: 'Hand detection. Format: [{label:hand, bbox:[x1,y1,x2,y2]}] 0-1 floats, [] if none.'
      kv_cache: f16
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      architecture: lfm2
      parameters: 450000000
      context_length: 128000
      embedding_length: 1024
      quantization: Q8_0
  maple-preview:
    name: Maple Preview 20B-A1B
    description: DeepGrove's 20B-A1B ternary reasoning model — 1.49B active MoE with 256 experts, native 2-bit weights. SOTA reasoning for weight class. 5.5 GB, 131K context. Runs at 250+ t/s on CPU.
    cmd: '${env.HOME}/git/llama.cpp-maple/build/bin/llama-server --port ${PORT}

      --model ${models_dir}/maple-preview/maple-preview-TQ2_0-head-Q4_K.gguf

      --jinja

      --reasoning on

      -ngl 99

      --fit on

      --fit-target ${vram_margin}

      --fit-ctx 131072

      --ctx-size 131072

      --temp 1.0

      --top-p 0.95

      --top-k 20

      --min-p 0

      --repeat-penalty 1.0

      --parallel 1

      --cache-type-k ${large_cache_k}

      --cache-type-v ${large_cache_v}

      --flash-attn on

      --metrics

      '
    filters:
      stripParams: temperature, top_p, top_k, min_p
      setParamsByID:
        ${MODEL_ID}:
          chat_template_kwargs:
            enable_thinking: false
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0
        ${MODEL_ID}:think:
          chat_template_kwargs:
            enable_thinking: true
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0
    ttl: 900
    health_check_timeout: 900
    capabilities:
      in:
      - text
      out:
      - text
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: ~5.5 GB (TQ2_0 ternary 2-bit + Q4_K head)
      context: 131K (with --fit auto-reduction on 6GB VRAM)
      vram_usage: ~5.5 GB model + KV cache (fits in 6GB with reduced context)
      source: deepgrove/maple-preview-GGUF (TQ2_0-head-Q4_K)
      kv_cache: q4_0 + attn_rot
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: maple
      parameters: 20200000000
      context_length: 131072
      embedding_length: 2560
      quantization: TQ2_0 (ternary 2-bit, native-trained)
  nomic-embed-text-v2-moe:
    name: Nomic Embed v2
    description: Multilingual MoE text embedding model that excels at multilingual retrieval, supporting ~100 languages with state-of-the-art performance at the 300M parameter scale.
    env:
    - CUDA_VISIBLE_DEVICES=
    cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/nomic-embed-text-v2-moe-Q4_K_M.gguf\n--embeddings\n--pooling mean\n--ctx-size 512\n--cont-batching\n--cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
    ttl: 300
    capabilities:
      in:
      - text
      out: []
      tools: false
      reranker: false
      context: 512
    metadata:
      architecture: nomic-bert
      parameters: 475000000
      context_length: 512
      embedding_length: 768
      quantization: Q4_K_M
      size: ~0.33 GB (Q4_K_M)
      vram_usage: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only)
      source: nomic-ai/nomic-embed-text-v2-moe-GGUF (Q4_K_M)
      kv_cache: f16
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: true
        insert: false
        audio: false
        image: false
      note: 'Embedding-only model. Use /v1/embeddings endpoint. Prefix inputs with ''search_query: '' or ''search_document: ''. 100+ languages. Matryoshka → 256 dims.'
  qwen3-tts:
    name: Qwen3-TTS 0.6B
    description: Text-to-speech with voice cloning. 8 Portuguese voices. OpenAI-compatible /v1/audio/speech endpoint with voice profiles from voiceclone-tui.
    tags:
    - tts
    proxy: http://127.0.0.1:8880
    checkEndpoint: /v1/audio/voices
    cmd: '${env.HOME}/projects/ai/tts-api/.venv/bin/python ${env.HOME}/projects/ai/tts-api/tts_server.py --port 8880 --host 127.0.0.1

      '
    cmdStop: pkill -f tts_server.py
    health_check_timeout: 300
    ttl: 300
    capabilities:
      in:
      - text
      out:
      - audio
      tools: false
      reranker: false
      context: 0
    metadata:
      size: ~600MB (Qwen3-TTS-12Hz-0.6B-Base, torch-direct)
      context: N/A (TTS generation, not LLM context)
      vram_usage: ~2GB VRAM (torch-direct, separate GPU allocation)
      source: Qwen/Qwen3-TTS-12Hz-0.6B-Base (HuggingFace)
      kv_cache: N/A
      features:
        completion: false
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: true
        image: false
      architecture: qwen3-tts
      parameters: 600000000
      context_length: 0
      embedding_length: 0
      quantization: torch-direct (no GGUF)
      caveats:
      - External FastAPI server on port 8880 (not llama.cpp)
      - Must install qwen_tts and dependencies in ~/projects/ai/tts-api/.venv
      - Voice profiles loaded from ~/.config/voiceclone-tui/voices.json
      - Supports voice cloning with reference audio samples
      - Portuguese (pt-BR) voices with accent control
  space-core:
    name: Space Core
    description: Portal 2 Space Core personality construct. Obsessed with going to space. Bilingual PT/EN.
    tags:
    - chat
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/space-core/space-core-Q8_0.gguf

      --jinja

      --fit on

      --fit-target ${vram_margin}

      --ctx-size 16384

      --parallel 1

      --cont-batching

      --temp 1.0

      --top-p 0.9

      --top-k 40

      --repeat-penalty 1.1

      --cache-type-k q8_0

      --cache-type-v q8_0

      --flash-attn on

      --metrics

      '
    filters:
      stripParams: temperature, top_p
      setParamsByID:
        ${MODEL_ID}:
          temperature: 1.0
          top_p: 0.9
    health_check_timeout: 300
    ttl: 60
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 16384
    metadata:
      size: ~362 MB (Q8_0)
      context: 16K
      vram_usage: ~0.5GB (model + cache)
      source: LiquidAI/LFM2.5-350M + LoRA fine-tune
      kv_cache: q8_0 + q8_0
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
      architecture: lfm2
      parameters: 362000000
      context_length: 16384
      quantization: Q8_0
  translategemma-4b:
    name: TranslateGemma 4B
    description: Open translation models built on Gemma 3, helping people communicate across 55 languages. The 4B variant is optimized for mobile and edge devices.
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/translategemma-4b/translategemma-4b-it.Q4_K_M.gguf

      --no-jinja

      --chat-template gemma

      --fit on

      --parallel 1

      --ctx-size ${small_model_max_ctx}

      --temp 0.2

      --top-p 0.9

      --top-k 40

      --repeat-penalty 1.1

      --cache-type-k ${small_cache_k}

      --cache-type-v ${small_cache_v}

      --flash-attn on

      --metrics

      '
    health_check_timeout: 300
    ttl: 60
    capabilities:
      in:
      - text
      out:
      - text
      tools: false
      reranker: false
      context: 131072
    metadata:
      size: ~2.4 GB (Q4_K_M)
      context: 32K-128K (dynamic)
      vram_usage: ~3.5GB (model + cache)
      source: mradermacher/translategemma-4b-it-GGUF (Q4_K_M, from google/translategemma-4b-it)
      kv_cache: q8_0 + attn_rot
      features:
        completion: true
        tools: false
        thinking: false
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: gemma3
      parameters: 3880000000
      context_length: 131072
      embedding_length: 2560
      quantization: Q4_K_M
      caveats:
      - Native Jinja template crashes llama.cpp — must use --no-jinja --chat-template gemma
      - Needs explicit translation prompt (Sprachspiel format works)
      note: Translation model. Sprachspiel translate mode default. 55 languages.
  unlimited-ocr:
    name: Unlimited OCR
    description: 'Baidu Unlimited-OCR: 3B vision-language OCR model for long-horizon document parsing. DeepSeek-OCR architecture with SAM+CLIP vision tower. Outputs structured markdown with optional bounding boxes.'
    cmd: '${llama_server} --port ${PORT}

      --model ${models_dir}/unlimited-ocr/Unlimited-OCR-Q4_K_M.gguf

      --mmproj ${models_dir}/unlimited-ocr/mmproj-Unlimited-OCR-F16.gguf

      --jinja

      --media-path ${media_path}

      -ngl 99

      --ctx-size 32768

      --parallel 1

      --temp 0

      --top-p 1.0

      --repeat-penalty 1.0

      --reasoning off

      --cache-type-k q4_0

      --cache-type-v q4_0

      --metrics

      '
    ttl: 60
    capabilities:
      in:
      - text
      - image
      out:
      - text
      tools: false
      reranker: false
      context: 32768
    metadata:
      architecture: deepseek-ocr
      parameters: 3000000000
      context_length: 32768
      embedding_length: 2048
      quantization: Q4_K_M
      size: ~1.9 GB (Q4_K_M) + ~774 MB mmproj (F16)
      vram_usage: ~3.5GB (model + mmproj + f16 cache)
      source: sahilchachra/Unlimited-OCR-GGUF (Q4_K_M + mmproj F16)
      kv_cache: f16
      features:
        completion: true
        tools: false
        thinking: false
        vision: true
        embedding: false
        insert: false
        audio: false
        image: true
      note: 'Specialized OCR/document parsing model. Prompts: ''document parsing.'', ''Free OCR.'', ''<|grounding|>Convert the document to markdown.'' for bounding boxes. NOT a general chat model.'
