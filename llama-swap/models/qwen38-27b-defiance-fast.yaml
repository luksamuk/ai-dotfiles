qwen38-27b-defiance-fast:
  name: Qwen3.8 27B Defiance (fast)
  description: Lane MTP (speculative) da 27B — ctx 96k, decode acelerado; mesmo GGUF do regular.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/defiance/Qwen3.8-27B-Defiance-Uncensored-IQ4_XS.gguf

    -ngl 10

    -b 256

    -ub 256

    --ctx-size 98304

    --cache-type-k q8_0

    --cache-type-v q8_0

    -fa auto

    --jinja

    --parallel 1

    --reasoning on

    --reasoning-budget 8192

    --spec-type mtp:n_max=8,p_min=0.0

    -ctx-ckpt 0

    --temp 0.7

    --top-p 0.80

    --top-k 20

    --presence-penalty 1.5

    --metrics

    '
  filters:
    stripParams: temperature, top_p, presence_penalty
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.80
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 98304
  metadata:
    size: ~15.71 GB (IQ4_XS)
    context: 98304
    vram_usage: ~4.7-5.1 GB VRAM (medido ngl 10 + MTP; acima disso o primeiro decode aborta)
    source: ttindall/Qwen3.8-27B-Defiance-Uncensored-MTP-GGUF (sha256 d48cdb6e627b...f2f, validado)
    kv_cache: q8_0/q8_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 27000000000
    context_length: 262144
    embedding_length: 5120
    quantization: IQ4_XS
    note: "Lane MTP (cauda nextn embutida no GGUF), n_max=8; régua 25/10: 4.33 t/s com MTP vs 3.16 baseline no mesmo contexto (aceitação ~54-61%). Teto: acima de 98.304 o init passa mas o PRIMEIRO decode aborta (SIGABRT, cudaGraphLaunch OOM — ik aborta hard; core dumps em /var/lib/systemd/coredump). Sem MTP o mesmo GGUF vai a 130.816 (lane qw38d). -ctx-ckpt 0: snapshots de checkpoint consomem VRAM por slot; medir antes de reabilitar. UNCENSORED. Text-only."