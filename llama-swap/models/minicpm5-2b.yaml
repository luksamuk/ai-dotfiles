minicpm5-2b:
  name: MiniCPM5 2B
  description: 'OpenBMB MiniCPM5-2B (Q4_K_M oficial): dense 2B, 131K ctx nativo, tool
    calling limpo em ambos os modos. Text-only, sem MTP.'
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/minicpm5-2b/MiniCPM5-2B-Q4_K_M.gguf

    --jinja

    --fit on

    --parallel 1

    --ctx-size 131072

    --reasoning on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn auto

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~1.45 GB (Q4_K_M oficial)
    context: 131072
    vram_usage: ~4.1 GB VRAM @131K
    source: openbmb/MiniCPM5-2B-GGUF (oficial vendor)
    kv_cache: q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: llama
    parameters: 2000000000
    embedding_length: 2048
    context_length: 131072
    quantization: Q4_K_M
    note: 'vram detalhe: ~4.1GB @131K (modelo 1.45GB + KV q4_0 ~1.35GB + buffers)
      Pollard IQ4_XS testado 07-08/09 e REVERTIDO 08/09: loop infinito em tarefa de
      código simples (Adler32) no uso real — dados do A/B permanecem válidos (empate
      decode GPU, TTFT -23%, -148MB, CPU -30%), mas o comportamento agêntico pesa
      mais. Tool call: Q4_K_M clean nos DOIS modos (IQ4_XS só no :think). REMOVIDOS
      08/09: Q8_0 oficial, Pollard Q5_K_M (GGUFs deletados). Pollard IQ4_XS GGUF MANTIDO
      no dir como opção A/B futura. Fallback docs no header.'
