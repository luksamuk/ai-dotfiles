qwen3-next-80b:
  name: Qwen3-Next 80B
  description: 'O primeiro 80B da frota: MoE 512 experts top-10 com DeltaNet nativo
    (linear attention), 3B ativos. Serve via cafe -ssd — streaming de experts, quente
    rapido, frio lento (warmup por dominio).'
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT}

    --model ${models_dir}/qwen3-next-80b/Qwen3-Next-80B-A3B-Instruct.Q4_K_M.gguf

    --jinja

    --parallel 1

    --ctx-size 131072

    --cache-type-k q8_0

    --cache-type-v q8_0

    --flash-attn on

    -ssd

    --ssd-io-threads 4

    -ngl 99

    -b 512

    -ub 128

    --temp 0.7

    --top-p 0.8

    --top-k 20

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.7
        top_p: 0.8
  ttl: 3600
  health_check_timeout: 600
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~48.4 GB (Q4_K_M mradermacher)
    context: 131072
    vram_usage: ~4 GB VRAM
    source: mradermacher/Qwen3-Next-80B-A3B-Instruct-GGUF (Q4_K_M)
    kv_cache: q8_0/q8_0
    features:
      completion: true
      tools: true
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen3next
    parameters: 80000000000
    active_parameters: 3000000000
    context_length: 131072
    embedding_length: 2048
    experts: 512
    active_experts: 10
    quantization: Q4_K_M
    note: 'vram detalhe: ~3-4GB VRAM (dense+attn) + experts via -ssd (page cache)
      Primeiro 80B da frota. Hibrida gated DeltaNet (linear) + full@4. GGUF mradermacher
      SEM MTP (draft = fase 2, unsloth MTP/). -ssd regime igual laguna: quente rapido
      / warmup por dominio. INSTRUCT sem thinking: chat template do GGUF nao tem bloco
      think (verificado no dump) — alias :think removido no deploy (Oct 3), features.thinking=false.'
