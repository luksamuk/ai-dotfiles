saluki-27b:
  name: Underdog Saluki 27B
  description: Qwen3.8-27B comprimido pra 7.9 GB (IQ2-mix 2-bit) pela Underdog, foco em tool-calling agentic; visão opcional via add-on.
  tags:
  - vis
  - think
  - tools
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /health
  cmd: '${cafe_server} --host 127.0.0.1 --port ${PORT}

    -m ${models_dir}/saluki-27b/Underdog-Saluki-27B-1.0-IQ2-mix.gguf

    --mmproj ${models_dir}/saluki-27b/mmproj-Underdog-Saluki-27B-1.0-Q8_0.gguf --no-mmproj-offload

    -ngl 28 -c 65536 -fa on -nkvo -b 512 -ub 128 --jinja

    --temp 0.6 --top-p 0.95 --top-k 20

    '
  cmdStop: pkill -f "Saluki-27B-1.0-IQ2"
  ttl: 900
  health_check_timeout: 180
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
        top_k: 20

  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: 7.9 GB (IQ2-mix) + 0.6 GB mmproj
    context: 65536
    vram_usage: ~4.4 GB VRAM + ~4.9 GB RAM
    source: ConwayResearch/Underdog-Saluki-27B-1.0 (base Qwen3.8-27B, Apache 2.0)
    kv_cache: f16
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 27000000000
    context_length: 65536
    embedding_length: 0
    quantization: iq2_m
    reasoningEfforts:
      low: low
      medium: medium
      xhigh: xhigh
    reasoningEfforts:
      low: low
      medium: medium
      xhigh: xhigh
    note: 'REATIVADO 12/nov/2026 (round 7): single handle ALWAYS-THINKING (enable_thinking true
      pinado; o saluki aceita o knob false? NAO PROVADO nesta revisao o contrario, mas o
      decreto da casa  single handle, thinking ON, sem :think). Handles antigos plain-false/:think
      removidos. Sampling = receita Underdog (0.6/0.95/20) - MANTIDO (fabricante). Backend cafe
      (4.7 t/s = vanilla 4.8 paridade). GOTCHA: setParamsByID tem que ficar DENTRO de filters:
      (root = ignorado silenciosamente, K2 precedncia). Smoke 08/10: ctx 4K-64K free (-nkvo),
      128K = server sobe mas requisio morre (OOM no compute do slot, -b/-ub baixos NAO resolvem);
      262K native = invivel (KV ~9GB em RAM); ik ELIMINADO (degenera, template qwen3.5 quebrado
      + OOM sem unified memory). Tool call OK (get_weather Diamantina). -ngl 34 = max com rs
      rs cache do hybrid no 6GB acima de 30; 30/64 layers GPU, resto na CPU RAM; KV 64K em CPU RAM
      via -nkvo (+2.3GB, custo decode zero medido). mmproj 629MB (--no-mmproj-offload) = ViT
      prefill ~35s/imagem pago s no request; vision opt-in.
     _DIALETO PROVADO 12/nov (template extraida do GGUF via GGUFReader, 8.952 chars): effort
      xhigh (default: reasoning_effort|default xhigh) / medium / low com ramos prprios;
      enable_thinking FALSE DESLIGA de verdade (emite bloco think vazio e pula) — diferena
      do bonsai2 (que ignorava none); valores no suportados (high/none/off) = raise_exception
      "Unexpected reasoning effort" + HTTP 500. CORREO 12/nov (dono): efforts FUNCIONAM entra no reasoningEfforts (low/medium/xhigh) e no seletor; stripParams SEM reasoning_effort (a seleo do client atravssa); off no existe via effort (enable_thinking false existe mas o decreto  always-thinking) — os mapas 3-valores tornam impossvel o 500 do raise.'
    caveats:
    - Dense 27B IQ2: 4.6-4.8 t/s (lento p/ cotidiano vs MoE K2 17.5)
    - Tool calling = foco do refino Underdog; math de competicao ~82-85% do full
    - mmproj na RAM = ViT prefill ~35s/imagem (gargalo pago so com imagem)
    - -ngl 34 fixo (rs cache do hybrid estoura 6GB acima de 34)
    - backend ik NAO suportado (template quebrado)