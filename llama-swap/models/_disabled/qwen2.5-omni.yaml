# -------------------------------------------
# QWEN2.5-OMNI-7B — audio-chat omni (texto+áudio+visão, speech out co-modelo)
# unsloth/Qwen2.5-Omni-7B-GGUF, UD-Q5_K_XL (5.46GB) + mmproj F16 (2.64GB)
# Validado 31/08 (descartável 10699, Ballad of Hermes wav 60s):
#   - análise técnica sólida: glitch percussão, sub-bass analógico, pads suspensos,
#     field recordings, 120 BPM, C minor — bateu com o ground truth do user
#   - 1º request 93s; 2º e 3º requests de áudio SEM wedge (vence o bug mtmd que
#     matou o music-flamingo) — audio cache sane entre requests
#   - VRAM 3.6GB, dense 7B (roda todo-lá na 3050 legado com folga)
# Sem visão?? TEM visão (mmproj de imagem+áudio unificado do Omni). Sem tools.
# Path mtmd: qwen25o (whisper-encoder). Formatos áudio: wav/mp3/ogg/flac/m4a/aac.
# -------------------------------------------
"qwen2.5-omni":
  name: "Qwen2.5 Omni 7B"
  description: "Qwen2.5-Omni 7B (Unsloth UD-Q5_K_XL) — omni multimodal: texto+áudio+imagem. Audio-chat de qualidade (glitch/bass/BPM/key detectados na balada do user), sem wedge entre requests de áudio. PP 3.6GB."
  cmd: |
    ${llama_server} --port ${PORT}
    --model ${models_dir}/qwen2.5-omni-7b/Qwen2.5-Omni-7B-UD-Q5_K_XL.gguf
    --mmproj ${models_dir}/qwen2.5-omni-7b/mmproj-F16.gguf
    --ctx-size 8192
    --temp 0.7
    --top-p 0.9
    --min-p 0.01
    --flash-attn on
  filters:
    stripParams: "temperature, top_p"
  ttl: 60
  metadata:
    size: "~5.5 GB (UD-Q5_K_XL) + mmproj F16 2.64GB"
    context: "8K (2.3k tok de prompt p/ 60s de wav; cabe ~3-4min de audio)"
    vram_usage: "~3.6GB total (medido, modelo+mmproj+ctx 8K)"
    source: "unsloth/Qwen2.5-Omni-7B-GGUF (UD-Q5_K_XL)"
    kv_cache: f16
    features:
      completion: true
      tools: false
      thinking: false
      vision: true
      embedding: false
      insert: false
      audio: true
      image: true
    architecture: qwen25o
    parameters: 8000000000
    context_length: 8192
    quantization: UD-Q5_K_XL
    note: "A/B 31/08 vs gemma4-12b e music-flamingo: melhor equilíbrio velocidade/profundidade p/ audio-forense (93s vs 330s do gemma; descrição com glitch+bpm+key que o flamingo não entregou). Versão 3B (UD-Q5_K_XL 2.44GB) testada antes: rápida (21s) mas rasa e repetitiva — descartada. Wedge de áudio NÃO se aplica a este modelo (3 requests de áudio seguidos OK). Cartão: 256k ctx nativo, truncado a 8K pro fit da 3050. KV f16: quant de cache não testada com path de áudio."