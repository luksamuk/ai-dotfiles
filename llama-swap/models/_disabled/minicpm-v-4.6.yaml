minicpm-v-4.6:
  name: MiniCPM-V 4.6
  description: A series of multimodal LLMs designed for vision-language understanding,
    with strong OCR capability, multi-image understanding, and efficient visual token
    processing.
  tags:
  - vision
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/MiniCPM-V-4_6-Q5_K_M.gguf\n\
    --mmproj ${models_dir}/mmproj-MiniCPM-V-4.6-F16.gguf\n--media-path ${media_path}\n\
    --jinja\n--fit on\n--fit-ctx 8192\n--ctx-size 262144\n  --parallel 4\n--cont-batching\n\
    --temp ${default_temp}\n--top-p 0.8\n--top-k 100\n--min-p ${default_min_p}\n--repeat-penalty\
    \ 1.05\n--reasoning on\n--cache-type-k f16\n--cache-type-v f16\n--flash-attn on\n\
    --metrics\n"
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 262144
  metadata:
    size: 0.55 GB (Q5_K_M) + 1.1 GB mmproj
    context: 262144
    vram_usage: ~2 GB VRAM
    source: openbmb/MiniCPM-V-4.6-gguf
    kv_cache: f16
    features:
      completion: true
      tools: false
      thinking: false
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 752160000
    context_length: 262144
    embedding_length: 1024
    quantization: Q5_K_M
    note: 'vram detalhe: ~2GB (model + mmproj + cache) '
