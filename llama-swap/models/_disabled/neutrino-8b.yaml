neutrino-8b:
  name: Neutrino 8B
  description: 'Fermion Research Neutrino-1: 8B ternary model (TRTC v4, sub-2-bit).
    2.56GB download, 72.1 MMLU, 65.31 BFCL v3. Based on Qwen3-8B with ternary QAT.
    Runs on 4.68 GiB VRAM.'
  cmd: '${fv5_llama_server} --port ${PORT}

    --model ${models_dir}/neutrino-8b/gguf/neutrino-8b-fv5.gguf

    --jinja

    -ngl 99

    --parallel 1

    --ctx-size 32768

    --temp 0.01

    --top-p 1.0

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.05

    --reasoning on

    --flash-attn auto

    --cache-type-k q4_0

    --cache-type-v q4_0

    --metrics

    '
  filters:
    stripParams: temperature, top_p, repeat_penalty
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.01
        top_p: 1.0
        repeat_penalty: 1.05
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
        repeat_penalty: 1.05
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 32768
  metadata:
    source: fermionresearch/Neutrino-8B (GGUF FV5)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen3
    parameters: 8190735360
    context_length: 40960
    embedding_length: 4096
    quantization: TRTC v4 (FV5 ternary, sub-2-bit)
    note: '5-valued ternary weights (-1,-0.5,0,+0.5,+1). Requires fermion-llama.cpp
      fork (branch fermion-fv5). Tool calling: greedy temp=0, rep_penalty=1.0. 62.63%
      of weights are zero.'
