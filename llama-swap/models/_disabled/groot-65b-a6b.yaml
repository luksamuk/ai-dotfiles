groot-65b-a6b:
  name: Groot 65B A6B
  description: "LANE UNICA (sem fast, por fisica) — BLOQUEADO 04/nov no build d33bcfd7e/build
    12256: o GGUF (mradermacher Q2_K) aborta no warm-up decode em QUALQUER config offload
    (-ssd com knobs, -ssd puro, -ssd modo slots, -cmoe, e ate -ngl 0 all-CPU): mesmas
    GGML_ASSERT(buffer) failed, ggml-backend.cpp:383, kpool::set_input (QSA indexer k-pool
    input sem buffer). O 19B (qwen35moe, sem QSA) e o flash-next 125B (unsloth IQ1_M,
    mesma build ontem) RODAM -ssd/-cmoe normal: bug confinado ao hybrid-idx (needs_mem_idx
    = QWEN4EXP-only) x este GGUF/conversao. Bug report a caminho (quimmedes/cafe-llama.cpp).
    Fatos cravados: starts-from Qwen3.8-Flash-Next (licenca qwen-community-1.0), arch
    qwen4exp, 48 camadas (12 Qwen Sparse Attention + 36 Gated DeltaNet), experts 256
    roteados + 1 shared (10 ativos), PLE n-gram 51B em host mmap, multimodal nativo,
    MTP 1.4B (6 tensors blk.48.nextn no GGUF; MTP_USAGE oficial: opt-in/experimental,
    NAO lossless e sem speedup prometido — OFF), ctx nativo 262K, template extraido do
    oficial shard 1 (8.952 chars) e wired local. Decode SSD-bound esperado quando
    destravar: ~2-4 t/s — assento de raciocinio pesado/consulta esparsa, nao daily
    driver."
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

    --model ${models_dir}/groot-65b-a6b/groot-65b-a6b-261023.Q2_K.gguf

    --mmproj ${models_dir}/groot-65b-a6b/mmproj-Q8_0.gguf

    --ctx-size 65536

    --jinja

    --chat-template-file ${models_dir}/groot-65b-a6b/chat_template.jinja

    --parallel 1

    --no-mmproj-offload

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -ssd

    --ssd-predict

    --ssd-io-threads 4

    --ssd-cache-mb 4096

    -ngl 99

    -b 512

    -ub 128

    --temp 1.0

    --top-k 20

    --top-p 0.95

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 0.0
  ttl: 0
  health_check_timeout: 1200
  unlisted: true
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 65536
  metadata:
    size: ~52.46 GB (Q2_K) + 0.58 GB mmproj
    context: 65536
    vram_usage: 'a medir'  # ~2 GB backbone na GPU + KV leve (12 sparse-attn layers) + PLE ~25 GB em host (mmap)
    source: mradermacher/Groot-65B-A6B-261023-GGUF (Q2_K, 56335871168 bytes exatos)
      + mmproj-Q8_0 (616703296 bytes)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen4exp
    experts: "256 roteados + 1 shared; 10 ativos/token"
    mtp: "1.4B — 6 tensors blk.48.nextn no GGUF mradermacher (probe 04/11); MTP_USAGE oficial: opt-in/experimental, output especulativo NAO lossless (greedy difere) e sem speedup prometido — OFF"
    license: qwen-community-1.0 (herdada do Qwen3.8-Flash-Next)
    note_extra: "chat_template do GGUF mradermacher: ABSENT (quirk de conversao) — template 8.952 chars EXTRAIDO do GGUF oficial (shard 1) em 04/11 e wired via --chat-template-file (casa: padrao minicpm-v)"
    parameters: 65000000000
    active: 6000000000
    embedding_length: 2560
    context_length: 262144
    quantization: Q2_K
