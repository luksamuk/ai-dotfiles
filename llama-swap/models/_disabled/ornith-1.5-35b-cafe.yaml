ornith-1.5-35b-cafe:
  name: Ornith 1.5 35B Cafe
  description: 'Ornith 1.5 35B ONYX compact (qwen35moe hibrida SSM+atencao) no cafe-llama.cpp
    f8982d690. Deploy espelhado no heretic-cafe: -hmoe, template embutido, MTP mantido
    (ONYX preserva o head nextn). 200K cap (degradacao ~213K) com parallel 1 (KV so
    nas 10 layers full: ~1.2 GB q4_0). Fallback ik: ornith-1.5-35b.'
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT}

    --model ${models_dir}/ornith-1.5-35b/Ornith-1.5-35B-A3B-ONYX-compact.gguf

    --mmproj ${models_dir}/ornith-1.5-35b/mmproj.gguf

    --no-mmproj-offload

    --ctx-size 200000

    --jinja

    --parallel 1

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -hmoe

    -ngl 99

    -b 512

    -ub 128

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --reasoning-budget 8192

    --spec-type draft-mtp

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 200000
  metadata:
    size: ~17.69 GB (ONYX compact) + 899 MB mmproj
    context: 200000
    vram_usage: ~8 GB VRAM
    source: el4/Ornith-1.5-35B-A3B-ONYX-GGUF (compact tier)
    kv_cache: q4_0 (attn) + gdn (estado constante)
    note: 'vram detalhe: a medir no smoke (esperado ~6-8 GB VRAM + ~15 GB RAM pinned
      -hmoe) ONYX swap Sep 28: MiniPlus V2.1 reprovado (loops agentic), GGUF deletado.
      MTP @200K com parallel 1. Sem --fit no cafe: loader valida no load. MTP head
      Q8_0 preservado no quant. KV: q4_0 nas 10 layers full-attention (~1.5 GB @262K);
      31 layers gdn = estado constante.'
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: ONYX compact
