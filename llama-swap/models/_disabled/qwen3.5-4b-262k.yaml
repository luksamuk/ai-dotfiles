qwen3.5-4b-262k:
  name: Qwen3.5 4B (262K TurboKV)
  description: Same Qwen3.5-4B served by cafe-llama.cpp with Turbo KV (turbo2) and
    ngram-mod speculative decoding at its native 262K context — direct A/B against
    the production 4B (ik, q4_0+hadamard, 131K). Dense 4B fits entirely in VRAM even
    at 262K.
  cmd: '${cafe_server} --port ${PORT}

    --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf

    --ctx-size 262144

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --cache-type-k turbo2

    --cache-type-v turbo2

    --flash-attn on

    -ngl 99

    -b 512

    -ub 128

    --temp ${default_temp}

    --top-p ${default_top_p}

    --top-k ${default_top_k}

    --min-p ${default_min_p}

    --repeat-penalty ${default_repeat_penalty}

    --spec-type ngram-mod

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~2.8 GB (UD-Q4_K_XL)
    context: 262144
    vram_usage: ~4.5 GB VRAM
    source: unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)
    kv_cache: turbo2 (WHT-rotated, FA-fused)
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4210000000
    context_length: 262144
    embedding_length: 2560
    quantization: UD-Q4_K_XL
    note: 'vram detalhe: ~4.5GB VRAM @262K (model 2.8GB + turbo2 KV 1.3GB + rs cache
      0.8GB + compute) cafe-llama.cpp backend with turbo2 Turbo KV + ngram-mod at
      native 262K — mirror of qwen3.5-4b (ik_llama, q4_0+hadamard, ngram, 131K) for
      direct A/B. MTP draft does NOT fit on 6GB at long ctx (draft compute buffer
      556MB @131K scales with ctx; turbo4 KV @262K = 2.1GB alone) — ngram-mod is the
      same spec family as prod and needs no draft context. Smoke 20/set: base/think/tool
      OK, ~41.5 t/s decode w/ prefill included. Vision off (matches prod 4B).'
