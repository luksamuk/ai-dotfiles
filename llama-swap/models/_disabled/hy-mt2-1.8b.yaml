hy-mt2-1.8b:
  name: Hy-MT2 1.8B
  description: Fast-thinking multilingual translation model from Tencent Hunyuan,
    supporting translation across 33 languages for complex real-world scenarios.
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/Hy-MT2-1.8B-Q4_K_M.gguf\n\
    --jinja\n--fit on\n--fit-target 768\n--fit-ctx ${small_model_min_ctx}\n--ctx-size\
    \ ${small_model_max_ctx}\n--parallel 1\n--temp 0.7\n--top-p 0.6\n--top-k 20\n\
    --repeat-penalty 1.05\n--cache-type-k ${small_cache_k}\n--cache-type-v ${small_cache_v}\n\
    --flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min\
    \ 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
  health_check_timeout: 300
  ttl: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 131072
  metadata:
    size: ~1.1 GB (Q4_K_M)
    context: 131072
    vram_usage: ~2 GB VRAM
    source: tencent/Hy-MT2-1.8B-GGUF (Q4_K_M)
    kv_cache: q8_0 + attn_rot
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: hunyuan-dense
    parameters: 1790000000
    context_length: 262144
    embedding_length: 2048
    quantization: Q4_K_M
    note: 'vram detalhe: ~2GB (model + cache) Translation-only model. No system prompt
      needed (per Hy-MT2 docs). Official prompt: ''Translate the following text into
      {target_lang}. Note that you should only output the translated result without
      any additional explanation:


      {source_text}''. Supports terminology, style, personalization, delimiter preservation,
      and structured data translation. See https://github.com/Tencent-Hunyuan/Hy-MT2
      for all prompt formats.'
