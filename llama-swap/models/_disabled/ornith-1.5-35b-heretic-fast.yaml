ornith-1.5-35b-heretic-fast:
  name: Ornith 1.5 35B Heretic Fast
  description: Ornith-1.5-35B com heretic (SC117 trial 62, KL 0.0105) + MTP graft
    shisa + template Sharp v22.5.0 (o Tiel da casa). Substituto de orn15+q36hc. Visão
    via mmproj BF16. APEX I-Compact 17.3GB.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/ornith-heretic/Ornith-1.5-35B-A3B-Heretic-MTP-APEX-I-Compact.gguf

    --mmproj ${models_dir}/ornith-heretic/mmproj-Ornith-1.5-35B-A3B-Heretic-MTP-BF16.gguf

    --no-mmproj-offload

    --fit

    --fit-margin 2048

    --ctx-size 131072

    --temp 0.6

    --top-p 0.95

    --top-k 20

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --reasoning-budget 8192

    --reasoning-budget-message "Let me conclude my reasoning and provide the answer."

    --jinja

    --chat-template-file ${templates_dir}/sharp_chat_template.jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    --spec-type mtp:n_max=1,p_min=0.0

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~17.33 GB (APEX I-Compact) + 0.9 GB mmproj BF16
    context: 131072
    vram_usage: ~5 GB VRAM
    source: SC117/Ornith-1.5-35B-A3B-Heretic-MTP-APEX-GGUF (I-Compact, sha256 37f67861...e0e7)
    kv_cache: q4_0 + attn_rot + hadamard (herdado do orn15; validar)
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-Compact
    note: 'vram detalhe: ~4.6-5GB VRAM estimado (mesma arch do orn15; medir no smoke)
      Heretic KL 0.0105 (moderado, sem eval público) + Sharp v22.5.0 externo (GGUF
      embutido NAO é sharp) + MTP graft shisa (nextn=1 verificado). Handle ''ornith-1.5-35b-heretic''
      é TEMPORÁRIO de teste: se a régua de sanidade passar, vira o substituto de orn15+q36hc;
      se falhar, fragmento vai pra _disabled/ sem drama.'
