nanbeige4.1-3b:
  name: Nanbeige 4.1 3B
  description: Compact generalist language model that simultaneously achieves strong
    agentic behavior, code generation, and general reasoning with only 3B parameters.
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/Nanbeige4.1-3B-Q4_K_M.gguf

    --jinja

    --fit on

    --fit-target 768

    --fit-ctx ${small_model_min_ctx}

    --ctx-size ${small_model_max_ctx}

    --temp 0.6

    --top-p 0.9

    --top-k 40

    --min-p 0.01

    --repeat-penalty 1.05

    --reasoning on

    --n-predict 32768

    --cache-type-k ${small_cache_k}

    --cache-type-v ${small_cache_v}

    --flash-attn on

    --metrics

    '
  ttl: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 262144
  metadata:
    size: ~1.8 GB (Q4_K_M)
    context: 262144
    vram_usage: ~2.5GB (model + cache)
    source: DevQuasar/Nanbeige.Nanbeige4.1-3B-GGUF (Q4_K_M)
    kv_cache: q8_0 + attn_rot
    features:
      completion: true
      tools: false
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: llama
    parameters: 3930000000
    context_length: 262144
    embedding_length: 2560
    quantization: Q4_K_M
    warning: Always thinks (no toggle). Multi-turn tool calls broken — use single-turn
      only. Verbose reasoning.
