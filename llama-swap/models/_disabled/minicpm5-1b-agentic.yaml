minicpm5-1b-agentic:
  name: MiniCPM5 1B Agentic
  description: MiniCPM5-1B fine-tuned with Nemotron SFT+DPO traces for agentic tool
    use. Dense 1B Transformer for on-device assistants and tool-calling workflows.
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/MiniCPM5-1B-Agentic-Tooluse-Nemotron-DPO.Q4_K_M.gguf\n\
    --jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx ${small_model_min_ctx}\n\
    --ctx-size ${small_model_max_ctx}\n--parallel 1\n--temp 0.7\n--top-p 0.9\n--top-k\
    \ ${default_top_k}\n--min-p 0.0\n--repeat-penalty 1.05\n--cache-type-k ${small_cache_k}\n\
    --cache-type-v ${small_cache_v}\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match\
    \ 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.9
        top_p: 0.9
  ttl: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~688 MB (Q4_K_M)
    context: 131072
    vram_usage: ~1.2GB (model + cache)
    source: ewinregirgojr/MiniCPM5-1B-Agentic-Tooluse-GGUF (Q4_K_M Nemotron DPO)
    note: Nemotron SFT+DPO fine-tune for agentic tool use. Parser auto-detects via
      --jinja. NEVER use custom chat template.
    kv_cache: q8_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: llama
    parameters: 1080632832
    context_length: 131072
    embedding_length: 1536
    quantization: Q4_K_M
