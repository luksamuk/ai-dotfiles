ministral-3-3b:
  name: Ministral 3 3B
  description: The Ministral 3 family is designed for edge deployment, with best-in-class
    agentic capabilities, native function calling, and multilingual support.
  tags:
  - tools
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/Ministral-3-3B-Instruct-2512-UD-Q5_K_XL.gguf

    --fit on

    --fit-ctx 8192

    --ctx-size 131072

    --parallel 4

    --cont-batching

    --temp ${default_temp}

    --top-p ${default_top_p}

    --top-k ${default_top_k}

    --min-p ${default_min_p}

    --repeat-penalty ${default_repeat_penalty}

    --jinja

    '
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 131072
  metadata:
    size: 2.31 GB (UD-Q5_K_XL)
    context: 131072
    vram_usage: ~3 GB VRAM
    source: unsloth/Ministral-3-3B-Instruct-2512-GGUF
    kv_cache: q4_0 + attn_rot
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: mistral3
    parameters: 3000000000
    context_length: 131072
    embedding_length: 3072
    quantization: Q4_K_M
    warning: 'Uses mistral3 arch — ONLY runs on llama.cpp upstream, NOT ik_llama.cpp.
      Vision disabled: mmproj crashes with CUDA OOM on mistral3. --n-gpu-layers 99
      causes OOM with 131K ctx, use --fit on instead.'
    note: 'vram detalhe: ~3 GB VRAM with --fit on '
