gemma4-12b-pollard:
  name: Gemma 4 12B (Pollard IQ4_XS)
  description: Pollard measured-allocation IQ4_XS de google/gemma-4-12B-it. Dense
    11.9B, PPL 29.80 (recommended default do ladder).
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/pollard-gemma4-12b/gemma-4-12B-it-Pollard-IQ4_XS.gguf

    --mmproj ${models_dir}/pollard-gemma4-12b/mmproj-gemma-4-12b-it-qat-q4_0.gguf

    --ubatch-size 4096

    --jinja

    --parallel 1

    --temp 0.4

    --top-p 0.85

    --fit on

    --fit-target ${vram_margin}

    --fit-ctx 8192

    --min-p 0.01

    --repeat-penalty 1.05

    --cache-type-k q8_0

    --cache-type-v q8_0

    --reasoning off

    --no-webui

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    - audio
    out:
    - text
    tools: true
    reranker: false
    context: 8192
  metadata:
    size: ~6.95 GB (IQ4_XS 6.78 + mmproj 175MB)
    context: 8192
    vram_usage: ~4.37 GB VRAM
    source: PollardWeights/gemma-4-12B-it-Pollard (IQ4_XS + mmproj qat-q4_0)
    kv_cache: q8_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: true
      image: false
    architecture: gemma4
    parameters: 11900000000
    context_length: 8192
    embedding_length: 3840
    quantization: Pollard IQ4_XS
    note: 'vram detalhe: ~4.37GB Ladder Pollard (measured-allocation + imatrix Calib
      3.0), f16 ref PPL 23.04. IQ2_XXS (4.64GB, PPL 56.88): APOSENTADO Sep 19 — vision
      INSERVIVEL (foto real eu.jpg: alucinava multiplas faces, genero errado); GGUF
      remanescente no disco (documentacao do ladder, nao serve). IQ4_XS (6.78GB, PPL
      29.80): VEREDICTO Sep 19 — vision CORRETA no eu.jpg (masculino, oculos de grau
      armacao grossa, mao no rosto; zero alucinacao). MM: encoder-free, mmproj qat-q4_0
      175MB (gem4uv+gem4ua), audio experimental. Performance @ 8K fit livre: 4370MiB
      VRAM, TTFT 1.5-3s, decode 10.3 t/s c/ VRAM compartilhada / 20-25 t/s limpa,
      prefill 209-585 t/s; nativo 256K. TTL 900 contra cold-start (leitura 6.78GB).
      UMA (drop-in uma-ggml.conf) removida do daemon em Sep 20 — era a causa do 0.7
      t/s (decode em CPU sob cudaMallocManaged). Trade-off: qualidade > velocidade
      (regra user). Historico: prefill lento @ 32K era TTFT 51.7s; @ 8K caiu pra 1.5-3s.'
