# -------------------------------------------
# ANTARES-1B — Cisco Foundation AI
# Agentic vulnerability localization model.
# Trained with SFT + GRPO on IBM Granite 4.0 1B base.
# Terminal agent: explores repos via grep/find/cat, reasons about output,
# and identifies files containing reported vulnerabilities.
# Arch: granite (dense, upstream llama.cpp)
# Q8_0 ~1.9GB — fits entirely in VRAM with room to spare
# No thinking/reasoning toggle, no tool-calling (prompt-based agentic)
# Context: 128K native
# -------------------------------------------
"antares-1b":
  name: "Antares 1B"
  description: "Antares-1B is a 1B parameter language model specialized for vulnerability localization in real-world codebases. Built on IBM Granite 4.0 1B, trained to autonomously navigate source code repositories through a terminal interface."
  cmd: |
    ${llama_server} --port ${PORT}
    --model ${models_dir}/antares-1b/antares-1b-Q8_0.gguf
    --jinja
    --fit on
    --fit-target 512
    --fit-ctx ${small_model_min_ctx}
    --ctx-size ${small_model_max_ctx}
    --parallel 1
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --repeat-penalty 1.1
    --cache-type-k ${small_cache_k}
    --cache-type-v ${small_cache_v}
    --flash-attn on
    --metrics
  health_check_timeout: 300
  ttl: 60
  capabilities:
    in: ['text']
    out: ['text']
    tools: false
    reranker: false
    context: 131072
  metadata:
    size: "~1.9 GB (Q8_0)"
    context: "64K-128K (dynamic)"
    vram_usage: "~2.5GB (model + cache)"
    source: "DevQuasar/fdtn-ai.antares-1b-GGUF (Q8_0)"
    kv_cache: "q8_0 + attn_rot"
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: granite
    parameters: 1000000000
    context_length: 128000
    embedding_length: 2048
    quantization: Q8_0
    note: "Agentic vulnerability localization model. Trained with SFT + GRPO to navigate repos via terminal (grep, find, cat) and identify vulnerable files. Antares CLI available in HF repo — connects to any OpenAI-compatible endpoint. Use with Pi for terminal-based code scanning."