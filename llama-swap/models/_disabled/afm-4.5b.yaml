afm-4.5b:
  name: AFM-4.5B
  description: Arcee AFM-4.5B dense model with tool calling via Hermes 2 Pro template.
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/AFM-4.5B-Q5_K_M.gguf

    --fit on --fit-target 768 --fit-ctx 65536

    --ctx-size 32768

    --parallel 1

    --chat-template-file /home/alchemist/git/ai-dotfiles/llama-swap/templates/afm-4.5b-tool_use.jinja

    --temp 0.3

    --top-p 0.9

    --top-k 40

    --min-p 0.15

    --repeat-penalty 1.05

    --cache-type-k q8_0

    --cache-type-v q4_0

    --flash-attn on

    --n-predict -1

    --jinja

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.3
        min_p: 0.15
  ttl: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~3.11 GB (Q5_K_M)
    context: 262144
    vram_usage: ~4GB VRAM (3.11 GB model + KV)
    source: arcee-ai/AFM-4.5B-GGUF
    kv_cache: q8_0 (K) + q4_0 (V)
    features:
      completion: true
      tools: true
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: llama
    parameters: 4500000000
    context_length: 262144
    embedding_length: 2560
    quantization: UD-Q3_K_XL
    note: Dense 4.5B by Arcee AI. No native thinking. Tool calling requires Hermes
      2 Pro template override via --chat-template-file. Uses upstream (ik/Bee lack
      arcee arch support).
