north-mini-code:
  name: North Mini Code
  description: Cohere's first open-source agentic coding model. 30B MoE with only
    3B active params, optimized for code generation, agentic software engineering,
    and terminal tasks.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/north-mini-code-iq4xs/North-Mini-Code-1.0-IQ4_XS.gguf

    --jinja

    --reasoning on

    --fit

    --fit-margin 768

    --parallel-tool-calls

    --ctx-size 65536

    --temp 1.0

    --top-p 0.95

    --repeat-penalty 1.0

    --parallel 1

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --no-graph-reuse

    --defer-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 1.0
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
  ttl: 300
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~15.3 GB (IQ4_XS)
    context: 65536
    vram_usage: ~5.7GB VRAM + ~12GB RAM (ik pinned memory, MoE offload)
    source: Arki05/North-Mini-Code-1.0-GGUF (IQ4_XS)
    kv_cache: q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: cohere2moe
    parameters: 30484340939
    context_length: 262144
    embedding_length: 2048
    quantization: IQ4_XS
