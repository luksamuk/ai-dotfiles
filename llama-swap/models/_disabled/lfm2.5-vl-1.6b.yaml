lfm2.5-vl-1.6b:
  name: LFM2.5-VL 1.6B
  description: Liquid AI flagship VLM with native grounding and visual reasoning.
    1.6B params, 0-1 normalized coordinates.
  tags:
  - vision
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/lfm2.5-vl-1.6b-g/LFM2.5-VL-1.6B-Q8_0.gguf\n\
    --mmproj ${models_dir}/lfm2.5-vl-1.6b-g/mmproj-LFM2.5-VL-1.6b-F16.gguf\n--media-path\
    \ ${media_path}\n--jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx 8192\n\
    --ctx-size 32768\n--parallel 1\n--temp 0.3\n--top-p 0.9\n--top-k 40\n--min-p 0.0\n\
    --repeat-penalty 1.1\n--cache-type-k ${small_cache_k}\n--cache-type-v ${small_cache_v}\n\
    --flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min\
    \ 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 32768
  metadata:
    size: 1.25 GB (Q8_0) + 854 MB mmproj
    context: 32768
    vram_usage: ~2.5 GB (model + mmproj + cache)
    source: LiquidAI/LFM2.5-VL-1.6B-GGUF (Q8_0 + mmproj F16)
    note: 'Flagship VLM with grounding. Format: [{label, bbox:[x1,y1,x2,y2]}] 0-1
      floats. NOT the Extract variant.'
    kv_cache: q8_0
    features:
      completion: true
      tools: false
      thinking: false
      vision: true
      embedding: false
      insert: false
      audio: false
      image: true
    architecture: lfm2
    parameters: 1600000000
    context_length: 128000
    embedding_length: 2048
    quantization: Q8_0
