nemotron-bolt-74b:
  name: Nemotron 3.5 Bolt 74B-A9B (IQ2 QAT)
  description: "NVIDIA Nemotron 3.5 Bolt — 74B total / 9B active, LatentMoE Mamba-2
    hybrid (8 full-attn layers), C-RADIO vision. IQ2 QAT nativo. 262K native.
    Deploy CAFE + -ssd-streaming (experts do NVMe): -ncmoe no vanilla NAO CABE
    no 6GB Navi (dense ~4.8GB + compute > 5.1GB free; fit abortado por tensor
    overrides — testado 15/out, RAM 93%). Cafe fit auto-ajusta."
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

    --model ${models_dir}/nemotron-bolt/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf

    --jinja

    --parallel 1

    --ctx-size 32768

    --flash-attn on

    -ngl 34

    -nkvo

    -ssd-streaming

    -ssd-io-threads 8

    -ssd-cache-mb 4096

    -b 512

    -ub 128

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k, min_p, repeat_penalty
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 1.0
        top_p: 0.95
        top_k: 0
        min_p: 0.0
        repeat_penalty: 1.0
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 0
        min_p: 0.0
        repeat_penalty: 1.0
  ttl: 300
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~20.5 GB (IQ2 QAT nativo) + mmproj 1.6 GB (vision, opcional, FORA do smoke text-first)"
    context: "262144 nativo (so 8 attn layers: KV ~1.2 GB q8 @262K) — servindo 131072 no primeiro smoke; 262K depois se der"
    vram_usage: "a medir: dense+SSM+KV+compute na GPU; experts (ncmoe 88 = todos) na CPU RAM ~17-19 GB"
    source: "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF (GGUF OFICIAL NVIDIA; receita mainline llama-server do card + community-validated no tweet)"
    kv_cache: q8_0/q8_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
    architecture: "nemotron_h_moe (88 blocks: 48 GDN/Mamba2 + 8 full-attn + MoE layers, 384 experts 9 ativos, latent 1024, SSM state 128, vocab 131K, ctx 262144 — header parseado 15/out)"
    parameters: 74000000000
    quantization: "IQ2 QAT nativo (quantization-aware training)"
    note: "EXPERIMENTO 15/out. RECEITA REFITA pelo tweet DogukanUrker 15/out
      (RTX 3060 12GB VRAM + 16GB RAM: -ngl 99 --n-cpu-moe 66 -c 262144 -fa on,
      q8/q8 KV, -b 2048 -ub 1024, temp 1.0 top-p 0.95 top-k 0 min-p 0 rp 1.0 —
      24 t/s decode, 500 t/s prefill, 262K inteiro). CADA flag conferida contra
      os bins locais: -ncmoe existe no upstream, ik e cafe. ADAPTACAO pro Navi
      6GB: -ncmoe 88 (TODOS os experts na CPU RAM; o 3060/12GB usou 66 c/ GPU
      maior — dense+SSM+KV+compute nos levam ~4.5-5GB VRAM) e ctx 131072 no
      1o smoke (262K KV ~1.2GB cabe, mas compute de 88 blocks a 262K e outra
      historia — medir). -ssd-streaming/-nkvo/-ngl-34 REMOVIDOS: RAM da conta
      (experts ~17-19GB na RAM, folga ~8GB), SSD-streaming resolveria problema
      que nao existe. Servidor = upstream llama-server (receita exata do
      vendor); ik/cafe sao A/B de t/s DEPOIS do primeiro verde. mmproj NAO
      anexado no cmd: text-first (vision add-on depois). DFlash drafter
      (LiLiCorr) PULO no smoke 1. Benchmarks do card: Terminal-Bench 2.1 =
      50.98 (vs 44.38 qwen3.6-35b BF16), GPQA-D = 86.43, GDPVal-AA-V2 = 28.47.
      Criterio (atualizado pos-tweet): esperado >= 15 t/s (6GB < 12GB do
      tweet, experts em RAM idem); se <10 t/s ou OOM mesmo c/ ncmoe 88 →
      deletar modelo + fragment. Pendendo SE promovido a frota:
      ORIGINAL_ORDER (build-config.py) + matrix var/evict_cost (footer) +
      download-models.sh 5 locations + smoke tool-call. Bench N=5 do LFM24
      terminava antes do experimento (ordem do user); fragmento fora do
      build ate la."