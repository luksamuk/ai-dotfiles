sabia-7b:
  name: Sabiá 7B
  description: Maritaca AI's Portuguese language model — LLaMA-1-7B architecture,
    pretrained on Portuguese ClueWeb22. Base completion model, 2048 context.
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/sabia-7b-Q4_K_M.gguf\n\
    --fit on\n--fit-target ${vram_margin}\n--ctx-size 2048\n--parallel 1\n--temp ${default_temp}\n\
    --top-p ${default_top_p}\n--top-k ${default_top_k}\n--repeat-penalty ${default_repeat_penalty}\n\
    --cache-type-k ${small_cache_k}\n--cache-type-v ${small_cache_v}\n--flash-attn\
    \ on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min\
    \ 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
  health_check_timeout: 300
  ttl: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 2048
  metadata:
    size: ~4.08 GB (Q4_K_M)
    context: 2048
    vram_usage: ~4.7 GB VRAM
    source: RichardErkhov/maritaca-ai_-_sabia-7b-gguf (Q4_K_M)
    kv_cache: q8_0 + q8_0
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: llama
    parameters: 7000000000
    context_length: 2048
    embedding_length: 4096
    quantization: Q4_K_M
    note: 'vram detalhe: ~4.7GB (model + cache, fits in VRAM) Portuguese base model
      (not instruction-tuned). LLaMA-1-7B architecture, same tokenizer. Completion-only,
      no chat template. Trained on Portuguese ClueWeb22 subset. 2048 token native
      context.'
