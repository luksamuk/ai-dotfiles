qwen3.8-27b:
  name: Qwen3.8 27B
  description: 'Qwen3.8-27B: dense 27B VLM with Gated DeltaNet linear attention +
    Gated Attention hybrid. APEX Nano quantization (~3.3 bpw, 22.1% better than flat).
    Native image/video understanding, 262K context. MTP speculative decoding. ik_llama
    with heavy offload.'
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/qwen3.8-27b/Qwen3.8-27B-APEX-I-Nano.gguf

    --mmproj ${models_dir}/qwen3.8-27b/mmproj-Qwen3.8-27B-F16.gguf

    --no-mmproj-offload

    --fit

    --fit-margin 2048

    --mlock

    --ctx-size 131072

    --temp 0.7

    --top-p 0.80

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.0

    --presence-penalty 1.5

    --reasoning on

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --spec-type mtp:n_max=1,p_min=0.0

    --metrics

    '
  filters:
    stripParams: temperature, top_p, presence_penalty
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~11.24 GB (APEX Nano) + 930 MB mmproj
    context: 131072
    vram_usage: ~5 GB VRAM
    source: mudler/Qwen3.8-27B-APEX-GGUF
    kv_cache: q4_0 + hadamard (DeltaNet, 16/64 attn layers)
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: true
    architecture: qwen35
    parameters: 27000000000
    context_length: 262144
    embedding_length: 5120
    quantization: APEX I-Nano (~3.3 bpw)
    note: 'vram detalhe: ~5GB VRAM (--fit auto) + ~7GB RAM offload. DeltaNet KV cache
      near-constant at 128K. Dense 27B DeltaNet+Attn hybrid (48+16 layers). Native
      VLM. APEX Nano 22.1% better KL than flat. ik_llama with --fit + --mlock + MTP
      spec decode. Instruct: presence_penalty=1.5. Thinking: temp=1.0. Expected ~3-5
      tok/s with heavy offload.'
