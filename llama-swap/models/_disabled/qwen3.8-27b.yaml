# -------------------------------------------
# QWEN3.8-27B - DENSE VLM WITH DELTANET (text+vision)
# Dense 27B, hybrid Gated DeltaNet + Gated Attention.
# 64 layers: 16 x (3 x (Gated DeltaNet -> FFN) -> 1 x (Gated Attention -> FFN))
# Native VLM (image + video), 262K context native, extensible to 1M with YaRN.
# UD-IQ1_M ~6.7GB - Unsloth Dynamic V3.0 1-bit quant (~2.0 bpw).
#   Unsloth reports ~77% of original quality at 1-bit. Aggressive but testable.
# llama.cpp upstream: GATED_DELTA_NET merged since March, MTP supported.
# DeltaNet = linear attention -> KV cache is O(1) per token, constant regardless of context.
# 128K context does NOT explode KV cache like standard attention models.
#
# Samplers (official Qwen3.8 model card):
#   Thinking: temp=1.0, top_p=0.95, top_k=20, min_p=0.0, repetition_penalty=1.0
#   Instruct: temp=0.7, top_p=0.80, top_k=20, min_p=0.0, presence_penalty=1.5, repetition_penalty=1.0
#
# VRAM math (RTX 3050 6GB):
#   Model weights: ~6.7GB -> partial GPU offload, rest to RAM
#   mmproj: ~885MB (F16) -> can offload to RAM
#   KV cache: minimal (DeltaNet linear attention, only 16/64 layers use standard attention)
#   --n-gpu-layers 35: conservative start, leaves headroom for system + mmproj
#
# Dual mode: base (instruct, no think) and :think (reasoning)
# Uses qwen-fixed-chat-template.jinja - same fix as Ornith/other Qwen models.
# -------------------------------------------
"qwen3.8-27b":
  name: "Qwen3.8 27B"
  description: "Qwen3.8-27B: dense 27B VLM with Gated DeltaNet linear attention + Gated Attention hybrid. Native image/video understanding, 262K context. Most capable Qwen generation - coding, agentic tasks, long-horizon planning."
  cmd: |
    ${llama_server} --port ${PORT}
    --model ${models_dir}/qwen3.8-27b-1bit/Qwen3.8-27B-UD-IQ1_M.gguf
    --ctx-size 131072
    --n-gpu-layers 25
    --temp ${qwen38_instruct_temp}
    --top-p ${qwen38_instruct_top_p}
    --top-k ${qwen38_instruct_top_k}
    --min-p ${qwen38_instruct_min_p}
    --repeat-penalty ${qwen38_instruct_repeat_penalty}
    --presence-penalty ${qwen38_instruct_presence_penalty}
    --reasoning on
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --flash-attn auto
    --metrics
  filters:
    stripParams: "temperature, top_p, presence_penalty"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.80
        presence_penalty: 1.5
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~6.7 GB (UD-IQ1_M)"
    context: "1K-131K (deploy), 262K native, 1M with YaRN"
    vram_usage: "~4.5GB VRAM (35 layers) + ~3GB RAM offload. DeltaNet KV cache near-constant."
    source: "unsloth/Qwen3.8-27B-GGUF"
    kv_cache: q4_0 (DeltaNet, 16/64 attn layers)
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: true
    architecture: qwen35
    parameters: 27000000000
    context_length: 262144
    embedding_length: 5120
    quantization: UD-IQ1_M (~2.0 bpw)
    note: "Dense 27B DeltaNet+Attn hybrid (48+16 layers). Native VLM. IQ1_M ~77% quality. Uses upstream llama.cpp (GATED_DELTA_NET). Instruct: presence_penalty=1.5. Thinking: temp=1.0."