qwen3.8-35b-a3b:
  name: Qwen 3.8 35B Distill
  description: Empero distill de Qwen3.8 (2.4T A95B) em Qwen3.6-35B-A3B. CoT destilado,
    math/code-weighted. Thinking sempre ligado. APEX-I-Compact + mmproj F16. Sem MTP.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/qwen3.8-35b-a3b/Qwen3.8-35B-A3B-Distill-APEX-I-Compact.gguf

    --mmproj ${models_dir}/qwen3.8-35b-a3b/mmproj-Qwen3.8-35B-A3B-F16.gguf

    --no-mmproj-offload

    --no-graph-reuse

    --fit

    --fit-margin 1024

    --ctx-size 131072

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~16.5 GB (APEX-I-Compact) + 858 MB mmproj F16
    context: 131072
    vram_usage: ~4-5 GB estimado + ~11GB pinned RAM — medir no smoke
    source: MrFuzzihead/Qwen3.8-35B-A3B-Distill-APEX-GGUF (APEX-I-Compact, imatrix
      agentic/tool-calling) + mmproj F16 oficial empero-ai (SHA256SUMS verificados
      17/09)
    kv_cache: q4_0 + attn_rot + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34700000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX-I-Compact
    note: 'Sep 17: onboarding. Quant primario APEX-I-Compact (receita validada do
      q36); IQ4_XS em disco para A/B no smoke — fica o vencedor, perdedor deletado.
      Sampler vendor do card: temp 0.6 / top_p 0.95 / top_k 20 (filters + models.json).
      Greedy = failure mode documentado (repetition loop). Thinking always-on (traces
      de professor, sem toggle real). Sem MTP. Smoke + speed-bench pendentes; rebuild/sync
      da config so apos ichef2 do occamy fechar (watcher reload derruba o llama-server
      no meio da run).'
