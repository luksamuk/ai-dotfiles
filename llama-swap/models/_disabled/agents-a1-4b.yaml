agents-a1-4b:
  name: Agents-A1 4B
  description: "Agents-A1 4B dense agentic model by InternScience. Fine-tuned Qwen3.5-4B for long-horizon search, engineering, scientific research, and tool calling. Text-only (mmproj disabled for full context). Rewritten 11/10/2026 no padrão atual da casa (template fixo qwen35, fit, hadamard q4_0); quant official Q4_K_M mantida (scan 11/10: melhor fit pro papel; Q8_0 mata contexto, sem Pollard/APEX/ONYX do modelo)."
  tags:
  - agentic
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/agents-a1-4b/Agents-A1-4B-Q4_K_M.gguf

    --fit

    --fit-margin 512

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --ctx-size ${small_model_max_ctx}

    --temp 0.85

    --top-p 0.95

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.0

    --presence-penalty 1.1

    --reasoning on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --no-graph-reuse

    --ctx-checkpoints 0

    --ctx-checkpoints-interval 0

    --batch-size 512

    --ubatch-size 128

    --metrics

    '
  filters:
    stripParams: temperature, top_p, presence_penalty, repetition_penalty
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.85
        top_p: 0.95
        presence_penalty: 1.1
        repetition_penalty: 1.0
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.85
        top_p: 0.95
        presence_penalty: 1.1
        repetition_penalty: 1.0
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~2.7 GB (Q4_K_M official)
    context: 131072
    vram_usage: ~4.5 GB VRAM
    source: InternScience/Agents-A1-4B-Q4_K_M-GGUF (sha256 d93c393a...508f062, 2.708.805.312 bytes)
    kv_cache: q4_0/q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4000000000
    context_length: 262144
    embedding_length: 2560
    quantization: Q4_K_M
    note: "vram detalhe: ~4.5 GB VRAM (model 2.7GB + hadamard q4_0 cache + compute). Dense 4B agentic FT (Qwen3.5-4B base, InternScience; SFT -> teachers -> multi-TT distill). Fragment reescrito 11/10/2026 (padrao qwen3.5-4b.yaml da casa: chat-template-file fixo qwen35 tool-calls, ik hadamard KV, --fit, no-graph-reuse). Sampling = card InternScience (temp 0.85, top_p 0.95, top_k 20, min_p 0, presence 1.1, repeat 1.0). OOM doctrine: q4_0/q4_0 hadamard, checkpoints 0, batch 512, ubatch 128. Scan de quant 11/10: Q4_K_M official mantida; Q8_0 (~4.4GB) derrubaria ctx; sem Pollard/APEX/ONYX/MTP do modelo; Heretic excluido por decreto user."