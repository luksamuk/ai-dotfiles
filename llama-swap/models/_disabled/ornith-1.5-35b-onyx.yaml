ornith-1.5-35b:
  name: Ornith 1.5 35B
  description: Ornith-1.5 is a family of open-source LLMs trained with end-to-end
    self-improvement — the model proposes new tasks, generates task-specific scaffolds,
    and produces solution rollouts for RL, continuously creating new learning experiences.
    ONYX quantization (el4, APEX evolution) with MTP speculative decoding and vision
    support.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/ornith-1.5-35b/Ornith-1.5-35B-A3B-ONYX-compact.gguf

    --mmproj ${models_dir}/ornith-1.5-35b/mmproj.gguf

    --no-mmproj-offload

    --fit

    --fit-margin 1024

    --ctx-size 131072

    --temp 0.6

    --top-p 0.95

    --top-k 20

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --reasoning-budget 8192

    --reasoning-budget-message "Let me conclude my reasoning and provide the answer."

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    --spec-type mtp:n_max=1,p_min=0.0

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~16.4 GB (ONYX compact) + 899 MB mmproj
    context: 131072
    vram_usage: ~4.6 GB VRAM
    source: el4/Ornith-1.5-35B-A3B-ONYX-GGUF (compact tier)
    kv_cache: q4_0 + attn_rot + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: ONYX compact
    note: 'vram detalhe: ~4.6GB VRAM measured + ~16GB pinned RAM (45 tok/s with MTP,
      accept 85-93%) Default since Sep 2026 A/B: 45.1 vs 40.6 tok/s (APEX+ngram),
      MTP accept 85-93%, +414MiB VRAM (75.6% total). ONYX = APEX evolution (dynamic
      layer sensitivity + router-weighted imatrix), MTP head preserved. Old APEX Compact:
      _disabled/ornith-1.5-35b-apex.yaml, GGUF deleted Sep 2026 (re-download from
      mudler repo if reverting).'
