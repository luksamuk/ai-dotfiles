qwopus-35b:
  name: Qwopus 35B
  description: Qwopus3.5 is a reasoning-enhanced model family fine-tuned from Qwen3.5
    designed to improve reasoning stability and correctness, especially in programming.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/Qwopus3.6-35B-A3B-v1-APEX-I-Compact.gguf

    # No --no-mmproj: ik_llama.cpp doesn''t support this flag (upstream-only)

    # No --fit-ctx: ik_llama.cpp doesn''t support this flag; --ctx-size serves as
    ceiling

    --fit

    --fit-margin 512

    --ctx-size 131072

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --jinja

    --parallel-tool-calls

    --multi-token-prediction

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.85
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 120
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~16.5 GB (APEX I-Compact)
    context: 262144
    vram_usage: ~5 GB VRAM
    source: mudler/Qwopus3.6-35B-A3B-v1-APEX-GGUF
    kv_cache: q4_0 + attn_rot + hadamard (ik -khad/-vhad)
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34660000000
    context_length: 262144
    embedding_length: 2048
    quantization: I-Compact
    warning: 'Vision disabled — mmproj blocks partial expert offload. APEX I-Compact:
      edges Q4_K, middle Q3_K, shared Q6_K, attn Q4_K. --defer-experts speeds up model
      loading. --flash-attn auto saves overhead on short prompts.'
    note: 'vram detalhe: ~5GB VRAM + ~11GB RAM (APEX mixed-precision offload, ik_llama.cpp
      pinned memory)'
