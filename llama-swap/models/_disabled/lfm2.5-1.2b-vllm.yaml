lfm2.5-1.2b-vllm:
  name: LFM2.5 1.2B Instruct (vLLM)
  description: LFM2.5-1.2B with vLLM backend for Sprachspiel compatibility and proper
    tool calling.
  cmd: '${vllm_bin} serve LiquidAI/LFM2.5-1.2B-Instruct

    --port ${PORT}

    --served-model-name lfm2.5-1.2b-vllm

    --gpu-memory-utilization 0.70

    --max-model-len 8192

    --max-num-seqs 2

    --dtype half

    --trust-remote-code

    --enable-auto-tool-choice

    --tool-call-parser lfm2

    '
  ttl: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 128000
  metadata:
    backend: vllm
    size: ~2.4 GB (BF16 safetensors, auto-download from HF)
    context: 128000
    vram_usage: ~3 GB VRAM
    source: LiquidAI/LFM2.5-1.2B-Instruct (HuggingFace safetensors)
    note: 'vram detalhe: ~3GB (model + cache) vLLM backend with native lfm2 tool parser
      — no --jinja workaround needed'
    features:
      completion: true
      tools: false
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: lfm2
    parameters: 1200000000
    context_length: 128000
    embedding_length: 1536
    quantization: Q4_K_M
