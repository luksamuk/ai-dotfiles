bonsai-27b:
  name: Bonsai 27B (1-bit)
  description: PrismML's 1-bit 27B reasoning model — Qwen3.6-27B with true 1.125-bit binary weights, full thinking and reasoning at ~3.9 GB. 89.5% of FP16 intelligence.
  cmd: '${llama_server} --port ${PORT}

    -m ${models_dir}/bonsai-27b/Bonsai-27B-Q1_0.gguf

    --mmproj ${models_dir}/bonsai-27b/Bonsai-27B-mmproj-Q8_0.gguf

    --no-mmproj-offload

    --jinja

    -ngl 99

    --ctx-size 40960

    -fa on

    -ctk ${large_cache_k}

    -ctv ${large_cache_v}

    -b 512

    -ub 128

    --spec-type ngram-mod

    --spec-ngram-mod-n-max 64

    --spec-ngram-mod-n-min 48

    --spec-ngram-mod-n-match 24

    --n-predict 32768

    --temp 0.7 --top-p 0.95 --top-k 20

    --min-p 0

    --repeat-penalty 1.0

    --parallel 1

    --metrics

    '
  cmdStop: pkill -f "Bonsai-27B-Q1_0"
  ttl: 900
  health_check_timeout: 300
  filters:
    stripParams: temperature, top_p, top_k, min_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        min_p: 0
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 40960
  metadata:
    architecture: qwen35
    ik_support: 'BOOT TEST 08/11: NEGATIVO — ik carrega o GGUF (q1_0_g128, 498 tensores) mas SEM os kernels rapidos do repack PrismML (o vanilla/upstream _ que os tem): decode 1.9-2.3 t/s e prefill 6.3
      t/s a ctx vazio = fallback lento, NO GO. Lane segue vanilla; a escada de contexto via KV q4_0 GPU no vanilla (metade da KV, ~80-100K alvo) fica em aberto e precisa de rgua de qualidade junto.'
    parameters: 27300000000
    context_length: 262144
    embedding_length: 5120
    quantization: Q1_0
    size: ~3.80 GB (Q1_0 binary) + 0.63 GB mmproj
    context: 40960
    vram_usage: ~4.9 GB VRAM (5358 MiB card = 87% c/ desktop ~690 MiB)
    source: prism-ml/Bonsai-27B-gguf
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
