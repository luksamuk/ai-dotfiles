laguna-xs-2.1-moecache:
  name: Laguna XS 2.1 (moe-cache A/B)
  description: A/B test - Laguna XS 2.1 on cafe 0.75 with upstream --moe-cache-mib
    instead of fork -cmoe. Same everything else.
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT}

    --model ${models_dir}/laguna-xs-2.1/Laguna-XS-2.1-Q4_K_M.gguf

    --jinja

    --parallel 1

    --ctx-size 131072

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    --override-tensor "ffn_gate_exps=CPU,ffn_down_exps=CPU,ffn_up_exps=CPU"

    --moe-cache-mib 512

    -ngl 99

    --temp 0.3

    --top-p 0.85

    --top-k 40

    --min-p 0.02

    --repeat-penalty 1.12

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParams:
      stop:
      - </assistant>
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.3
        top_p: 0.85
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.9
  ttl: 300
  health_check_timeout: 600
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~20.3 GB (Q4_K_M official)
    context: 131072
    vram_usage: ~4.5 GB VRAM (0.5GB moe-cache) + ~5 GB RAM
    source: poolside/Laguna-XS-2.1-GGUF (Q4_K_M official)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: laguna
    parameters: 33000000000
    context_length: 131072
    embedding_length: 2048
    quantization: Q4_K_M
    note: 'A/B TEST (07/10): cafe 0.75 e67054048 com --moe-cache-mib 512 (upstream
      #29887) vs fragment oficial -cmoe (fork). Mapping: experts CPU via override-tensor
      (o -cmoe faz isso automatico; no moe-cache o experts CPU e explicito). Bench
      A/B c/ ab-k2-horizon.sh adaptado. Se ganhar, fragment oficial migra (user:
      "papo de alterarmos no restante"). Se empatar, -cmoe fica.'