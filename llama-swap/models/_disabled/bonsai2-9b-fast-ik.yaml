bonsai2-9b-fast-ik:
  name: Ternary Bonsai 9B (fast, ik A/B)
  description: 'Mesmo Ternary Bonsai 9B fast (PQ2_0-MTP, 32K, sempre-thinking, visão),
    rodando no ik_llama.cpp em vez do fork PrismML. Fragmento de A/B da lane de
    velocidade: o MTP do ik tem dialeto próprio (--spec-type mtp:n_max=...), não
    aceita o draft-mtp do Prism.'
  tags:
  - llm
  - thinking
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /health
  cmd: '${ik_llama_server}

    --port ${PORT}

    -m ${models_dir}/bonsai2/Ternary-Bonsai-2-9B-PQ2_0-MTP-Q8_0.gguf

    --spec-type mtp:n_max=2,n_min=0,p_min=0

    --mmproj ${models_dir}/bonsai2/Ternary-Bonsai-2-9B-mmproj-Q8_0.gguf --no-mmproj-offload

    -rtr

    -ngl 99 -c 32768 -fa on -ctk q8_0 -ctv q8_0

    --host 127.0.0.1 --jinja

    '
  cmdStop: pkill -f 'ik_llama.cpp/build/bin/llama-server.*Bonsai-2-9B-PQ2_0-MTP'
  health_check_timeout: 120
  ttl: 1800
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 32768
  metadata:
    size: 2.68 GB DiT (PQ2_0-MTP-Q8_0, draft head embutido) + 0.62 GB mmproj Q8_0
    context: 32768
    vram_usage: ~3.4-5.6 GB total c/ desktop (ngl 99; rs-cache MTP 603 MB)
    source: prism-ml/Ternary-Bonsai-2-9B-gguf (PQ2_0-MTP-Q8_0 + mmproj Q8_0)
    kv_cache: q8_0
    features:
      completion: false
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 9000000000
    context_length: 32768
    embedding_length: 0
    quantization: PQ2_0-MTP
    note: '[A/B 22/10: viável mas PERDE do fork — PQ2_0 AR no ik 51,3 t/s vs 83,5-85,9 do fork; e MTP do ik aceita 2/87 (~2%), caindo pra 31,6 t/s. Manter MTP desligado se rodar. Não promover.] A/B CONTRA O FORK (lane velocidade, draft MTP 2). Baseline a bater:
      83.5-85.9 t/s normais / 89.5 copy-heavy / 87.9% de draft acceptance medidos
      no fork PrismML @32K. TRADUÇÃO DE FLAG OBRIGATÓRIA: o Prism usa `--spec-type
      draft-mtp --spec-draft-n-max 2 --spec-draft-n-min 0 --spec-draft-p-min 0`;
      o ik usa uma entrada só, no dialeto canônico dele: `--spec-type
      mtp:n_max=2,n_min=0,p_min=0` (os tipos aceitos no ik são none, draft, dflash,
      dspark, mtp, ngram-*, suffix — draft-mtp não existe lá). `-rtr` incluído pro
      repack ternary. Passa no A/B = migrar o bonsai2-9b:fast e aposentar o fork.
      Samplers oficiais Prism mantidos: temp 1.0/0.95/20/presence 1.0.'
    caveats:
    - 'A/B: medir acceptance também, não só t/s — MTP que aceita pouco é t/s de mentira'
    - 'LoRA em peso ternary no ik nunca foi testado aqui — se o load falhar, tirar --lora-scaled primeiro pra isolar a causa'
    - 'rs-cache do MTP consome ~0.6 GB extra; 131K OOMa na 6GB com desktop'
    - 'cmdStop casa binário do ik + sufixo do GGUF, pra não matar a lane sem drafter'
    - 'Thinking model: reasoning longo'
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.0
