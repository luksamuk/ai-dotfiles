qwen3.6-35b-a3b:
  name: Qwen 3.6 35B
  description: Qwen3.6 delivers substantial upgrades in agentic coding and thinking
    preservation. Built on direct community feedback for a more intuitive, responsive,
    and productive coding experience. Vision enabled Sep 10 at full 131K context (needs
    ~20GB free host RAM; 32K fallback under memory pressure).
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-APEX-MTP-I-Compact.gguf

    --mmproj ${models_dir}/qwen3.6-35b-a3b/mmproj_qwen36_F16.gguf

    --no-mmproj-offload

    --no-graph-reuse

    --fit

    --fit-margin 1024

    --ctx-size 131072

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    --spec-type mtp:n_max=1,p_min=0.0

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~17.3 GB (APEX-MTP I-Compact)
    context: 131072
    vram_usage: ~5.6 GB VRAM
    source: mudler/Qwen3.6-35B-A3B-APEX-MTP-GGUF (I-Compact) + mmproj unsloth (F16)
    kv_cache: q4_0 + attn_rot + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34660000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX-MTP I-Compact
    note: 'vram detalhe: ~5.6 GB VRAM estimado + ~14GB pinned RAM (MTP ~+414MiB, padrão
      ornith Sep 2026) Sep 09: reactivated com APEX-MTP I-Compact (MTP heads baked
      in, nextn=1; o APEX plain ignorava --multi-token-prediction silenciosamente
      — audit May 2026). --spec-type mtp:n_max=1,p_min=0.0 = receita ornith-1.5 (42.6
      tok/s medido Sep 10, accept 85-93%). VISION re-ativada 10/09 c/ ctx FULL 131K
      (RAM limpa: VRAM 5.4/6.1GB estável em smokes; fallback 32K sob pressão — regra
      Jul 2026). mmproj unsloth F16, verificado tensor-a-tensor vs ornith (qwen3vl_merger,
      proj_dim 2048). Sep 10: alinhado ao ornith — --no-mmproj-offload + --prefetch-experts
      + top_p 0.95 nos dois modos.'
