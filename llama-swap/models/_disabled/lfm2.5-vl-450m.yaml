lfm2.5-vl-450m:
  name: LFM2.5-VL 450M
  description: Liquid AI general VLM with native bounding box grounding (RefCOCO-M
    81.28). 450M params, 0-1 normalized coordinates.
  tags:
  - vision
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/LFM2.5-VL-450M-Q8_0.gguf\n\
    --mmproj ${models_dir}/mmproj-LFM2.5-VL-450m-F16.gguf\n--media-path ${media_path}\n\
    --jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx 4096\n--ctx-size 8192\n\
    --parallel 1\n--cont-batching\n--temp 0.3\n--top-p 0.9\n--top-k 40\n--min-p 0.0\n\
    --repeat-penalty 1.1\n--cache-type-k f16\n--cache-type-v f16\n--flash-attn on\n\
    --spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min\
    \ 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 8192
  metadata:
    size: 379 MB (Q8_0) + 189 MB mmproj
    context: 8192
    vram_usage: ~0.8 GB VRAM
    source: LiquidAI/LFM2.5-VL-450M-GGUF (Q8_0 + mmproj F16)
    note: 'vram detalhe: ~0.8 GB (model + mmproj + cache) General VLM with grounding.
      Format: [{label, bbox:[x1,y1,x2,y2]}] 0-1 floats. NOT the Extract variant.'
    kv_cache: f16
    features:
      completion: true
      tools: false
      thinking: false
      vision: true
      embedding: false
      insert: false
      audio: false
      image: true
    architecture: lfm2
    parameters: 450000000
    context_length: 128000
    embedding_length: 1024
    quantization: Q8_0
