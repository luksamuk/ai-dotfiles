"qwen3.6-35b-a3b-heretic":
  name: "Qwen 3.6 35B Heretic"
  description: "Uncensored drop-in do qwen3.6-35b-a3b (heretic, KL 0.0015, 88% menos recusas). Mesma estrutura: APEX-MTP nextn=1, vision via mmproj compartilhado, 131K ctx, q4_0+attn_rot+hadamard."
  cmd: |
    ${ik_llama_server} --port ${PORT}
    --model ${models_dir}/qwen3.6-35b-a3b-heretic/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-I-Compact.gguf
    --mmproj ${models_dir}/qwen3.6-35b-a3b-heretic/mmproj_qwen36_F16.gguf
    --no-mmproj-offload
    --no-graph-reuse
    --fit
    --fit-margin 1536
    --ctx-size 102400
    --temp ${code_temp}
    --top-p ${code_top_p}
    --top-k ${code_top_k}
    --min-p ${code_min_p}
    --repeat-penalty ${code_repeat_penalty}
    --reasoning on
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --parallel-tool-calls
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --defer-experts
    --prefetch-experts
    --spec-type mtp:n_max=1,p_min=0.0
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 102400
  metadata:
    size: "~15.85 GB (APEX-I-Compact, heretic) + 899 MB mmproj F16 (compartilhado do q36)"
    context: "1K-100K (vision ON, RAM limpa; fallback 32K sob pressão de RAM)"
    vram_usage: "~5.6 GB VRAM estimado + ~14GB pinned RAM (MTP ~+414MiB, padrao q36)"
    source: "SC117/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-GGUF (I-Compact) + mmproj unsloth F16 (compartilhado do qwen3.6-35b-a3b)"
    kv_cache: "q4_0/q4_0 + hadamard"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34660000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-Compact
    note: "Sep 21: drop-in uncensored do q36. Heretic do llmfan46 (KL 0.0015 vs base) quantizado pelo SC117 com nextn=1 preservado (753 tensors = bit-compatible com APEX-MTP original; header verificado). mmproj e o MESMO arquivo do q36 (vision tower do base, heretic nao toca). MTP: --spec-type mtp:n_max=1,p_min=0.0 (receita ornith/q36)."