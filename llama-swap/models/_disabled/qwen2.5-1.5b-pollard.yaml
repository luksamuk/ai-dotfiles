qwen2.5-1.5b-pollard:
  name: Qwen2.5 1.5B Pollard
  description: 'Pollard memory-fit Qwen2.5-1.5B-Instruct, CPU-only. Role/depth-aware
    quant: q4_K sensitive, Q4_K_M bulk. 44 tok/s on i7-13650HX. Zero VRAM — coexists
    with GPU MoE models.'
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/qwen2.5-1.5b-pollard-fit1gb/Qwen2.5-1.5B-Instruct-Pollard-Q4_K_S.gguf

    --jinja

    --parallel 1

    --ctx-size ${completion_ctx}

    --temp ${default_temp}

    --top-p ${default_top_p}

    --top-k ${default_top_k}

    --min-p ${default_min_p}

    --repeat-penalty ${default_repeat_penalty}

    --cache-type-k ${small_cache_k}

    --cache-type-v ${small_cache_v}

    --batch-size 512

    --ubatch-size 128

    --spec-type ngram-mod

    --spec-ngram-mod-n-match 24

    --spec-ngram-mod-n-min 48

    --spec-ngram-mod-n-max 64

    --no-webui

    --metrics

    '
  env:
  - CUDA_VISIBLE_DEVICES=
  filters:
    stripParams: temperature, top_p
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 32768
  metadata:
    size: ~834 MB (Pollard fit1GB)
    context: 32768
    vram_usage: 0 (CPU-only)
    source: PollardWeights/Qwen2.5-1.5B-Instruct-Pollard (fit1GB / Q4_K_S)
    kv_cache: q8_0
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen2
    parameters: 1540000000
    context_length: 32768
    embedding_length: 1536
    quantization: Pollard fit1GB (q4_K sensitive + Q4_K_M bulk)
    note: CPU-only variant for coexistence with GPU MoE models. CUDA_VISIBLE_DEVICES=''
      forces CPU. 42.5 tok/s on i7-13650HX. Zero VRAM cost — runs alongside Ornith
      35B or other heavy GPU models without competition. ngram-mod enabled (helps
      on CPU where compute is bottleneck).
