athenas-symbiote-9b:
  name: Athenas Symbiote 9B
  description: Brazilian Portuguese legal LLM — Qwen3.5-9B LoRA fine-tune optimized
    for OAB/ENEM exams. Instruct model with ChatML, 32K context.
  cmd: "${ik_llama_server} --port ${PORT}\n--model ${models_dir}/Athenas-Symbiote-9B-Q4_K_M.gguf\n\
    --fit\n--fit-margin 512\n--jinja\n--chat-template-file ${templates_dir}/athenas-chatml.jinja\n\
    --parallel 1\n--ctx-size 32768\n--temp 0.3\n--top-p 0.9\n--top-k 40\n--min-p 0.05\n\
    --repeat-penalty 1.1\n--cache-type-k q8_0\n--cache-type-v q4_0\n--k-cache-hadamard\n\
    --v-cache-hadamard\n--flash-attn auto\n--spec-type ngram-mod:n_max=64,n_min=48,ngram_size_n=24\n\
    \  --metrics\n"
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.3
        top_p: 0.9
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 32768
  metadata:
    size: ~5.63 GB (Q4_K_M)
    context: 32768
    vram_usage: ~6.2 GB VRAM
    source: Kodjaoglanian/Athenas-Symbiote-9B-GGUF (Q4_K_M)
    kv_cache: q8_0 + q4_0 hadamard
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 8950000000
    context_length: 32768
    embedding_length: 4096
    quantization: Q4_K_M
    note: 'vram detalhe: ~6.2GB VRAM (model + cache, ik with hadamard) Qwen3.5-9B
      LoRA fine-tune for Brazilian Portuguese legal/academic domain. OAB 63.23%, ENEM
      80.90%. Author recommends temp=0.3, ChatML format. NOT a reasoning/tool-calling
      model — simple instruct. GGUF has no chat_template, uses athenas-chatml.jinja.
      GGUF contains mmproj but vision disabled. LoRA pre-merged.'
