# REATIVADO 17/nov/2026 (dono): release final do modelo saiu do -Preview; lane CPU-only
# para conviver com GPU externa (EffectCraft Vulkan) — ordem do dono ("sacrificar t/s").
# RESTORE/deploy: fork build em ~/projects/ai/sensenova-loop-fork (branch sensenova-loop,
# cmake -GGML_CUDA=ON, server SEM UI embutida — ver ai-dotfiles llama-swap backend-smoke.md);
# GGUF: hf download guideboardlabs/SenseNova-Loop-9B-GGUF SenseNova-Loop-9B-Q3_K_M.gguf
# (4.642.406.752 B byte-checked) --local-dir ~/.llama-models/sensenova-loop-9b/.
# DISPARADOR DE DESCARTE: ik_llama.cpp PR #2936 MERGEAR = remover fragment + apagar fork build
# (tracker: entrada SenseNova-Loop-9B vigia o PR).
sensenova-loop-9b:
  name: SenseNova Loop 9B
  description: "SenseNova Loop 9B is a 9B text model from SenseTime deployed with a 128K context window.
    Built for general chat, agentic tasks and creative work; it excels at structured creative reasoning
    and motion design oriented workflows. Handles: thinking on by default."
  tags:
    - think
    - tools
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /health
  cmd: 'env CUDA_VISIBLE_DEVICES= LD_LIBRARY_PATH=${env.HOME}/projects/ai/sensenova-loop-fork/build/bin ${sensenova_server}

    --port ${PORT}

    -m ${models_dir}/sensenova-loop-9b/SenseNova-Loop-9B-Q3_K_M.gguf

    --jinja

    --parallel 1

    -ngl 0

    --ctx-size 131072

    -fa on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --no-webui

    --metrics

    '
  cmdStop: pkill -f 'sensenova-loop-fork/build/bin/llama-server'
  ttl: 900
  health_check_timeout: 300
  filters:
    stripParams: temperature, top_p, reasoning_effort
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
  capabilities:
    in:
      - text
    out:
      - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~4.6 GB (Q3_K_M)
    context: 131072
    vram_usage: CPU-only
    source: guideboardlabs/SenseNova-Loop-9B-GGUF (Q3_K_M) — base sensenova/SenseNova-Loop-9B (Apache 2.0)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: sensenova_loop
    parameters: 9200000000
    context_length: 524288
    embedding_length: 4096
    quantization: Q3_K_M
    note: "REATIVADO 17/nov/2026 com o release final (saiu do -Preview, sem gating; GGUF text-only,
      visao/MTP fora). MEDIDAS 17/nov na 3050 6GB (binario fork, Q3_K_M): full GPU -ngl 99 = decode
      17.8-17.9 t/s INVARIANTE com ctx 2K-16K (híbrido DeltaNet: prefill 105-142 t/s), 16K @94% VRAM,
      24K+ OOM (degrau fixo de compute do grafo loopeado); offload -ngl 28/30 = 7.0-7.2 t/s e prefill
      colapsa pra 14 t/s (sync GPU-CPU por token sobre 56 execucoes; 2 camadas ja custam quase o
      full-CPU); CPU-only = decode 6.06 t/s / prefill 382 t/s @3.8K tokens (20 threads; 6 threads =
      5.91 t/s, E-cores indiferentes) e 16K em RAM com folga — CPU-only escolhido pro convivio com
      EffectCraft. CUDA_VISIBLE_DEVICES= vazio no cmd: build e GGML_CUDA e o flag garante 0 VRAM.
      CTX 131072 (17/nov/noite, dono): 16K estourou no pi — overhead do harness ~20K tokens
      (system prompt + catalogo de tools) nao cabia; CPU-only custa RAM e 21GB livres comportam
      o cap da casa; prefill CPU 380 t/s absorve o 20K do pi em ~52s por turno.
      Sampler = gen config do card final via README do maintainer (temp 1.0, top_p 0.95), thinking on.
      SEM escada de effort: template do GGUF tem 0 hits de reasoning_effort; dual apenas por
      enable_thinking (bool) — handle unico com pin true (decreto 12/nov). ctx DEPLOYED 131072
      (native 524288, YaRN x2 no GGUF). tools: template com blocos completos; probe na rota do swap
      pendente no deploy (legado do Preview passou 31/out) — falhando, flipar tools false + rebuild.
      Arch sensenova_loop so roda no fork (mission-deny/GuideboardLabs; GGML mHC ops em CPU+CUDA+Vulkan);
      upstream ggml-org: FR #31571 aberto; ik_llama.cpp PR #2936 draft — merge dispara o descarte.
      HISTORIA PREVIEW (aposentado 31/out, broxou em offload + vocab): 16.2 t/s @16K ngl 88 Vulkan,
      ladder em sn9-ladder.sh (git log)."
