manaca-1b-instruct:
  name: Manacá 1B Instruct
  description: 'LNCC Manacá-1B-Instruct (PT-BR do zero, CC BY-NC). Release de PESQUISA
    experimental v0.1: MT-Bench-PT 2.9/10, exames no acaso, segurança ~75%. Alpaca-PT
    embutido. Não usar como assistente real.'
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/manaca-1b-instruct/manaca-1b-instruct-Q4_K_M-tpl.gguf

    --jinja

    --parallel 1

    --ctx-size 4096

    --no-webui

    --metrics

    '
  ttl: 300
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 4096
  metadata:
    size: ~1.04 GB (Q4_K_M, 4.92 BPW, template embutido)
    context: 4096
    vram_usage: ~1.3 GB VRAM
    source: sulfierry/manaca-1b-instruct-GGUF (F16-UGM) -> Q4_K_M local
    license: CC BY-NC 4.0 (pesquisa/não-comercial)
    kv_cache: f16
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: llama
    parameters: 1722951680
    context_length: 4096
    embedding_length: 2048
    quantization: Q4_K_M
    note: 'vram detalhe: ~1.3 GB (modelo + KV f16 @ 4k + buffers) 1B PT-BR do zero
      (LNCC × NII/LLM-jp). Alpaca-PT OBRIGATÓRIO (template embutido no GGUF, EOS </s>
      fecha turno). Pesquisa experimental v0.1: MT-Bench-PT 2.9, exames no acaso,
      safety recall ~75%, over-refusal ~8.8%. Papel: pesquisa/auditoria/feedback pro
      LNCC, não produção. Rollback F16 ao lado.'
