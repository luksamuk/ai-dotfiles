# -------------------------------------------
# QWEN3.8-27B POLLARD (IQ3_S) - DENSE VLM WITH DELTANET (text+vision)
# Same base as the Aug 2026 APEX I-Nano test (Qwen/Qwen3.8-27B, arch qwen35,
# Gated DeltaNet hybrid), now quantized by Pollard Weights:
#   - imatrix from Qwen3.8-27B itself, requantized from Q8_0 source
#   - IQ3_S ~12.08GB (~3.4 bpw equivalent tier, twin of APEX I-Nano 11.24GB)
#   - mmproj bf16 0.93GB (separate file, kept in RAM via --no-mmproj-offload)
#   - Embedded MTP/NextN head CONFIRMED (blk.64: eh_proj, enorm, hnorm,
#     shared_head_norm; 65 blocks) — MTP spec decode enabled, same as APEX.
# APEX reference (2026-08-27, same box): GPU offload 3.75 tok/s, CPU-only 3.40 (-9%).
#
# GPU config (baseline): ik_llama --fit + --mlock, q4_0 hadamard KV, MTP if present.
# CPU-only variant (A/B toggle): env CUDA_VISIBLE_DEVICES= ; drop --fit, flash-attn,
#   hadamard; KV q8_0 (see references/cpu-only-model-coexistence.md).
# Samplers (official Qwen3.8 card): instruct temp 0.7/top_p 0.80/top_k 20/presence 1.5;
#   thinking temp 1.0/top_p 0.95/top_k 20.
# -------------------------------------------
"qwen3.8-27b-pollard":
  name: "Qwen3.8 27B Pollard"
  description: "Qwen3.8-27B dense VLM (DeltaNet hybrid) in Pollard IQ3_S quantization with imatrix. Native image/video understanding, 262K context. Pollard requantized from Q8_0 with exact imatrix."
  cmd: |
    ${ik_llama_server} --port ${PORT}
    --model ${models_dir}/Qwen3.8-27B-Pollard-IQ3_S.gguf
    --mmproj ${models_dir}/mmproj-Qwen3.8-27B-bf16.gguf
    --no-mmproj-offload
    --fit
    --fit-margin 896
    --mlock
    --ctx-size 131072
    --temp 0.7
    --top-p 0.80
    --top-k 20
    --min-p 0.0
    --repeat-penalty 1.0
    --presence-penalty 1.5
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --parallel-tool-calls
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --spec-type mtp:n_max=1,p_min=0.0
    --metrics
  filters:
    stripParams: "temperature, top_p, presence_penalty"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.80
        presence_penalty: 1.5
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~12.08 GB (Pollard IQ3_S) + 0.93 GB mmproj (bf16)"
    context: "1K-131K (deploy), 262K native, 1M with YaRN"
    vram_usage: "~5GB VRAM (--fit auto) + ~7GB RAM offload. DeltaNet KV near-constant at 128K."
    source: "PollardWeights/Qwen3.8-27B-Pollard (IQ3_S + mmproj bf16)"
    kv_cache: "q4_0 + hadamard (DeltaNet, 16/64 attn layers)"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: true
    architecture: qwen35
    parameters: 27000000000
    context_length: 262144
    embedding_length: 5120
    quantization: "Pollard IQ3_S (imatrix Qwen3.8-27B, from Q8_0)"
    note: "Dense 27B DeltaNet+Attn hybrid (48+16 layers). Native VLM. Pollard quant w/ exact imatrix, embedded MTP head blk.64 (verified in GGUF). Instruct: presence_penalty=1.5. Thinking: temp=1.0. APEX reference same box: 3.75 GPU / 3.40 CPU tok/s."