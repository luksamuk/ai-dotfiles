spark-x2.6-1.7b:
  name: Spark X2.6 1.7B
  description: "XHToken 1.7B denso na arch Spark 2.5 (plain, sem draft): 1M de
    contexto nativo, agentic forte pro porte (BFCL-V4 55.2, tau2 85.3, SWE-V
    59.8 no card vendor, thinking HIGH). Lane @262K via --fit (1M no papel).
    O DSpark draft foi JULGADO E REPROVADO para chat: aceitacao 17-21% no
    template = neutro/negativo (57 t/s vs 60.1 do plain); so ganha em
    continuacao crua (3x, 184 t/s). Draft parked; gate = PR #31372."
  tags: [think, tools]
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/spark-x2.6-1.7b/Spark-X2.6-1.7B-Q8_0.gguf

    --jinja

    --parallel 1

    --ctx-size 262144

    --fit on

    -ngl 99

    -b 512 -ub 128

    --flash-attn on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --temp 1.0

    --top-p 0.95

    --top-k 0

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 0
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 0
  ttl: 900
  health_check_timeout: 600
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~1.82 GB (Q8_0 — Q4_K_M tinha so 50MB a menos, Q8 vence em hybrid) +
      0.69 GB draft DSpark BF16 (PARKED no dir, NAO usado pela lane)
    context: 262144
    vram_usage: "~4.6 GB TOTAL medido (plain @262K: 4631 MiB TOTAL c/ desktop
      1187; a lane ~3.4 GB; o --fit manteve os 262K inteiros)"
    source: XHToken/Spark-X2.6-1.7B-GGUF (Q8_0) + XHToken/Spark-X2.6-1.7B-DSpark-GGUF
      (draft BF16 345M, repo oficial)
    kv_cache: q4_0 + q4_0; draft f16 (SWA 512)
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: spark2_5
    parameters: 1700000000
    context_length: 1048576
    embedding_length: 2048
    quantization: Q8_0
    note: 'SMOKE 01/11/2026 (completo): spawn via swap OK; o --fit manteve os
      262K inteiros (VRAM 5484 total c/ draft, 4631 plain). Veredicto do
      DSpark draft (medido com counters): chat (template, temp 1.0, think
      ON) = 57.1 t/s / aceitacao 16.8% / 1.16 tok/verif — vs baseline plain
      60.1 t/s = NEUTRO/NEGATIVO (o passe do draft custa ~21ms + alvo 16.6 =
      37.6ms/verif; preciso de >2.27 tok/verif pra vencer — o template mata
      a aceitacao, mesmo bug do 4B). Cru (temp 0, sem template) = 178-187
      t/s com 92% de aceitacao = 3x REAL — porem nenhum uso real da frota e
      continuacao crua. LANE = PLAIN (sem draft, binario da frota, sem fork).
      Draft BF16 696MB parked no dir (re-teste se o 31372 corrigir a
      aceitacao no template e mergear). Benchmarks vendor (thinking HIGH):
      Average 49.6, BFCL-V4 55.2, tau2 85.3, SWE-V 59.8, SWE-Multi 57.3, IFEval
      89.4, GPQA-D 56.1, AIME 70.1, MRCR 256k 56.1, Graphwalks 1M 25.7. Vs
      LFM3-1.7B local (75 t/s, 320K, slots 5x64K): o LFM3 vence decode e
      flexibilidade de slots; o Spark vence no ctx maximo (262K vs 320K? o
      LFM3 deploya 320K) e no agentic do card. Samplers do card vendor (temp
      1.0, top_p 0.95, top_k -1/0). GGUFs em ~/.llama-models/spark-x2.6-1.7b/.'