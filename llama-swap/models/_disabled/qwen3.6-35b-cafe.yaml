qwen3.6-35b-cafe:
  name: Qwen 3.6 35B (262K TurboKV, cafe)
  description: Same Qwen3.6-35B-A3B served by cafe-llama.cpp fork with Turbo KV cache
    (turbo4). The only backend that loads the model's native 262K context on 6GB VRAM.
    Vision verified at full 262K. Slower decode than the 131K production entry (~17
    vs ~35 tok/s at 30K fill) — use for maximum-context workloads, batch/long-doc
    analysis.
  cmd: '${cafe_server} --port ${PORT}

    --model ${models_dir}/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-APEX-MTP-I-Compact.gguf

    --mmproj ${models_dir}/qwen3.6-35b-a3b/mmproj_qwen36_F16.gguf

    --ctx-size 262144

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --cache-type-k turbo4

    --cache-type-v turbo4

    --flash-attn on

    -hmoe

    -ngl 99

    -b 512

    -ub 128

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~17.3 GB (APEX-MTP I-Compact)
    context: 262144
    vram_usage: ~5.1 GB VRAM (turbo4 KV) + ~15GB pinned RAM (hmoe)
    source: mudler/Qwen3.6-35B-A3B-APEX-MTP-GGUF (I-Compact) + mmproj unsloth (F16)
    kv_cache: turbo4 (WHT-rotated, FA-fused)
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34660000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX-MTP I-Compact
    note: 'Backend cafe-llama.cpp (quimmedes/Ark fork) com Turbo KV turbo4 — unico
      que carrega 262K nativo na 3050 6GB (ik q4_0 KV @262K OOM). Validado 20/set:
      needle+QG limpos @30K fill, 16.6 t/s decode @30K, vision OK @262K full (5.1GB).
      Tradeoff: decode -52% vs ik-prod — batch/long-doc, não agentic interativo. Dual-mode
      padrão: base sem thinking, :think liga. Sem MTP (draft KV 512MiB não cabe),
      sem pipeline-parallel (48GB DMA @ctx longo), turbo2 crasha na arch hibrida.
      Tool calling nativo do cafe (smoke OK).'
