k2-horizon-36b:
  name: K2-Horizon MoVA 36B
  description: K2-Horizon-MoVA-36B-A4B Q3_K_M. 36B MoE (100 experts, 8 ativos) + MoVA
    (64 value-experts, top-4) no caminho de V. k2-horizon arch. Reasoning model (thinking
    em reasoning_content). Text-only.
  cmd: '${ik2_llama_server} --port ${PORT}

    --model ${models_dir}/k2-horizon-36b/K2-Horizon-MoVA-36B-A4B-Q3_K_M.gguf

    --chat-template-file ${templates_dir}/k2-horizon-chat-template.jinja

    -ngl 99

    --override-tensor "ffn_gate_exps=CPU,ffn_down_exps=CPU,ffn_up_exps=CPU,tok_embd=CPU"

    --no-kv-offload

    --ctx-size 131072

    --temp 1.0

    --top-p 0.95

    --reasoning on

    --reasoning-format deepseek

    --chat-template-kwargs ''{"reasoning_effort":"high"}''

    --jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --flash-attn auto

    --ubatch-size 256

    --reasoning-budget 16384

    --reasoning-budget-message "Now answer directly."

    --metrics

    '
  env:
  - GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
  ttl: 1200
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~17 GB (Q3_K_M)
    context: 131072
    vram_usage: ~3.3 GB VRAM
    source: abenzerps/K2-Horizon-MoVA-36B-A4B-GGUF (SHA256 662610e0)
    kv_cache: q4_0 + attn_rot
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: k2-horizon
    parameters: 36000000000
    context_length: 524288
    quantization: Q3_K_M
    note: 'vram detalhe: ~3.3GB VRAM + ~16GB RAM pinned (medido @8K no R1; 131K muda
      só o KV em RAM) Mapeamento manual (--fit falha nesta arch): experts FFN na CPU
      (pinned), value-experts MoVA + output na GPU, KV em RAM. Flag UMA = seguro anti-OOM
      apenas. Hadamard K rejeitada (glitches determinísticos; lado V, incl. MoVA,
      verificado limpo). 131K consome ~24GB de RAM total (incl. sistema) — feche apps
      pesados. Backend: fork do kassane + patch de vocab anexado. Template: abenzerps
      (a embutida do IFM pressupõe o parser k2_horizon do fork MBZUAI).'
