gemma4-26b-a4b-qat-ik:
  name: Gemma 4 26B MoE QAT
  description: Gemma 4 26B-A4B with Quantization-Aware Training (Q4_0). MoE reasoning
    + coding model.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/gemma-4-26B_q4_0-it.gguf

    --no-mmproj

    --gpu-layers 24

    --jinja

    --parallel-tool-calls

    --ctx-size ${large_model_max_ctx}

    --temp 1.0

    --top-p 0.95

    --reasoning on

    --cache-type-k ${gemma_cache_k}

    --cache-type-v ${gemma_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
  ttl: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~14.4 GB (Q4_0 QAT)
    context: 262144
    vram_usage: ~5 GB VRAM
    source: google/gemma-4-26B-A4B-it-qat-q4_0-gguf
    kv_cache: q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: gemma4
    parameters: 25230000000
    context_length: 262144
    embedding_length: 2816
    quantization: Q4_0_QAT
    note: 'vram detalhe: ~5GB VRAM + ~9.5GB RAM (24 GPU layers, ik pinned memory)
      Google QAT checkpoint. MoE 26B/4B active — 24 GPU layers on RTX 3050 6GB. ik
      --gpu-layers 24, --fit causes OOM. Speed TBD after benchmark.'
