bonsai-27b-ternary:
  name: Bonsai 27B Ternary
  description: PrismML's ternary 27B reasoning model — Qwen3.6-27B with 1.71-bit weights,
    full thinking/reasoning/agentic capabilities at 7.2 GB. 95% of FP16 intelligence
    retained. Hybrid attention enables 262K context.
  cmd: '${bonsai_llama_server} --port ${PORT}

    --model ${models_dir}/bonsai-27b-ternary/Ternary-Bonsai-27B-Q2_0.gguf

    --jinja

    --reasoning on

    --fit on

    --fit-target ${vram_margin}

    --fit-ctx 8192

    --ctx-size 65536

    --temp 0.7

    --top-p 0.95

    --top-k 20

    --min-p 0

    --repeat-penalty 1.0

    --parallel 1

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --flash-attn on

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k, min_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        min_p: 0
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        min_p: 0
  ttl: 300
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~7.2 GB (Q2_0_g128 ternary) + 0.63 GB mmproj
    context: 65536
    vram_usage: ~7.2 GB VRAM
    source: prism-ml/Ternary-Bonsai-27B-gguf (Q2_0 + mmproj Q8_0)
    kv_cache: q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen3
    parameters: 27300000000
    context_length: 262144
    embedding_length: 3584
    quantization: Q2_0_g128 (ternary 1.71 bpw)
    note: 'vram detalhe: ~7.2 GB weights (partial GPU offload) + ~0.5-1 GB KV cache '
