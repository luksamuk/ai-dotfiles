k2-horizon-3.7b-pollard-fim:
  name: K2-Horizon 3.7B Pollard FIM
  description: "K2-Horizon-3.7B Pollard IQ4_XS, CPU-only FIM lane. Zero VRAM, coexiste com GPU. FIM tokens no vocab (fim_prefix/suffix/middle/pad). Deploy separado de contexto pequeno; spec ngram-mod como o qpoll."
  tags:
  - fim
  - code
  - cpu
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/k2-horizon-3.7b/K2-Horizon-3.7B-Pollard-IQ4_XS.gguf

    --jinja

    --parallel 1

    --ctx-size 16384

    --cache-type-k ${small_cache_k}

    --cache-type-v ${small_cache_v}

    --temp 0.7

    --top-p 0.8

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.0

    --cache-type-k ${small_cache_k}

    --cache-type-v ${small_cache_v}

    --batch-size 512

    --ubatch-size 128

    --spec-type ngram-mod

    --spec-ngram-mod-n-match 24

    --spec-ngram-mod-n-min 48

    --spec-ngram-mod-n-max 64

    --no-webui

    --metrics

    '
  env:
  - CUDA_VISIBLE_DEVICES=
  filters:
    stripParams: temperature, top_p
  ttl: 300
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 16384
  metadata:
    size: ~3.1 GB (Pollard IQ4_XS, ctx 16K)
    context: 16384
    vram_usage: 0 (CPU-only)
    source: PollardWeights/K2-Horizon-3.7B-Pollard (sha256 cd2add66...b0403)
    kv_cache: q8_0
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: true
      audio: false
      image: false
    architecture: k2-horizon
    parameters: 5100000000
    context_length: 524288
    embedding_length: 2560
    quantization: IQ4_XS Pollard
    note: "FIM lane CPU-only do K2-Horizon-3.7B (Pollard IQ4_XS 3.10GiB). Doutrina qpoll: CUDA_VISIBLE_DEVICES vazio, llama_server vanilla, ctx completion_ctx, ngram-mod spec (24/48/64), zero VRAM coexistindo com GPU. FIM tokens no vocab confirmados. Tool-calls OFF (agente vive no k2-horizon-3.7b-pollard GPU; aqui é completion-only)."