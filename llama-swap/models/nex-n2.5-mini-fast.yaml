nex-n2.5-mini-fast:
  name: Nex N2.5 Mini (fast)
  description: "Nex-AGI's open-weight agent model, post-trained from Qwen3.5-35B-A3B: 35B MoE with 3B active parameters, tuned for computer use, coding, and tool calling. Built for responsive interactive sessions with 131072-token context. Handles: thinking on by default."
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/nex-n2.5-mini/Nex-N2.5-mini-APEX-Mini.gguf

    --mmproj ${models_dir}/nex-n2.5-mini/mmproj-Nex-N2.5-mini-Q8_0.gguf

    --no-mmproj-offload

    --fit

    --fit-margin 2048

    --ctx-size 131072

    --temp 0.7

    --top-p 0.8

    --top-k 20

    --repeat-penalty 1.05

    --reasoning on

    --reasoning-budget 8192

    --reasoning-budget-message "Let me conclude my reasoning and provide the answer."

    --jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.7
        top_p: 0.8
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~13.5 GB
    context: 131072
    vram_usage: ~3.9 GB VRAM
    source: MrFuzzihead/Nex-N2.5-mini-APEX-GGUF (Mini) + mmproj Q8_0
    kv_cache: q4_0/q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX Mini
    note: 'lane ik do nex-n2.5-mini no molde ornith-fast: fit-margin 2048, hadamard K/V q4_0, defer+prefetch experts, ttl 900, mmproj Q8_0 + --no-mmproj-offload, template EMBUTIDO do GGUF via --jinja (sem sharp — template é arch-bound; o embutido tem think toggle nativo). Probe 05/nov: 0 tensores nextn no APEX Mini → SEM --spec-type mtp (flag seria silenciosamente ignorada; lição do Q4_K_M de setembro, 36.7 t/s pure AR no ik). SEM kwarg enable_thinking no setParamsByID — o template do APEX Mini o ignora e o parser do ik com kwarg ignorado classifica TODO texto como reasoning_content (lição 09/set; o default-adaptive já liga thinking e reasoning_effort high força o think limpo no wire). Template reconhece reasoning_effort none/high; low/medium/xhigh/max caem no ramo default = adaptativo. Sampler herdado da lane cafe (0.7/0.8/top_k 20/rp 1.05). VRAM estimada ~4 GB — medir no smoke; sem fit probe ainda. MEDIDO 05/nov (lane quente, régua intercalada): decode 23.8 t/s média (min 23.4, CV 1.2percent, N=5) vs 22.4 t/s da lane cafe -cmoe (CV 1.7percent) = +6percent; TTFT a ~1.1K tok de prompt 14.3s vs 18.3s (N=4, CV <=1percent) = -22percent; VRAM 3878 MiB com mmproj na GPU; fail_rate 0/5; thinking real nas duas (reasoning_content > 0 em task aritmetica). MAPA DE EFFORTS enxugado 05/nov pos-teste no wire (kwarg E top-level, trivia, N=1/nível): low/medium/xhigh/max = aliases do default-adaptive (ramo else do template; 0 reasoning na trivia e content ok); única exceção real é high (think forçado, 113 chars na trivia, content ok). none QUEBRA: parser classifica a resposta inteira como reasoning (content VAZIO) — nunca wirear; off = não manda nada = default-adaptive. Teste replicado por top-level reasoning_effort: mesma resposta. CARD oficial (nex-agi/Nex-N2.5-mini): só none(non-thinking)/medium(default-adaptive)/high(always-think) existem — low/xhigh/max não são do card; off=null = medium do card; none não exposto (quebra o parser no nosso stack llama-server, content vazio).'
  reasoningEfforts:
    high: high
