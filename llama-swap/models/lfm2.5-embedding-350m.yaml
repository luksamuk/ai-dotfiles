lfm2.5-embedding-350m:
  name: LFM2.5 Embed 350M
  description: Liquid AI embedding model (350M) for RAG and semantic search. CPU-only
    serving.
  env:
  - CUDA_VISIBLE_DEVICES=
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/lfm2.5-embed/LFM2.5-Embedding-350M-Q8_0.gguf\n\
    --embeddings\n--pooling cls\n--ctx-size 512\n--cont-batching\n--parallel 4\n--cache-type-k\
    \ f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
  ttl: 300
  capabilities:
    in:
    - text
    out: []
    tools: false
    reranker: false
    context: 512
  metadata:
    architecture: lfm2-bidir
    parameters: 354000000
    context_length: 512
    embedding_length: 1024
    quantization: Q8_0
    size: ~379 MB (Q8_0)
    vram_usage: CPU-only
    source: LiquidAI/LFM2.5-Embedding-350M-GGUF (Q8_0)
    kv_cache: f16
    features:
      completion: false
      tools: false
      thinking: false
      vision: false
      embedding: true
      insert: false
      audio: false
      image: false
    note: 'vram detalhe: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only) | -ngl
      0, ~0.1GB CUDA ctx overhead apenas Embedding-only model. Use /v1/embeddings
      endpoint. Asymmetric prompts: ''query: '' for queries, ''document: '' for passages.
      11 languages. Dense bi-encoder — one 1024-dim vector per document.'
