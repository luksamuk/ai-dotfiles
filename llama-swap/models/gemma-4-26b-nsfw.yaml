# Smoke 16/11/2026: tools PASS, vision PASS, ctx 262144 PASS. ~23-27 t/s @ ~4.8GB VRAM.
gemma-4-26b-nsfw:
  name: Gemma 4 26B-A4B (Heretic NSFW)
  description: 'Gemma-4-26B-A4B-it decensorado via Heretic v2.2 com ARA otimizada em dataset focalizado de conteúdo adulto
    (yukiworks; KL 0.0411, refusals 0/100 no classificador do card vs 89/100 do base google/gemma-4-26B-A4B-it). MoE 26B com
    ~4B ativos por token, served por cafe -cmoe. Capacidades: chat, visão (mmproj Q8_0 em RAM via --no-mmproj-offload),
    tool calling nativo do template canônico, contexto 262144 nativo com KV q4_0 (medido no smoke 16/11). Papel primário na
    frota: enhancer de prompt (diffuse/h3/ltx/musica). Uso genérico de chat é suportado. Thinking habilitado por padrão via
    setParamsByID; o template canônico não expõe escada de effort.'
  tags:
    - think
    - nsfw
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

    --model ${models_dir}/gemma4-heretic-nsfw/gemma-4-26B-A4B-it-heretic-NSFW.i1-IQ4_XS.gguf

    --mmproj ${models_dir}/gemma4-heretic-nsfw/gemma-4-26B-A4B-it-heretic-NSFW.mmproj-Q8_0.gguf

    --no-mmproj-offload

    --ctx-size 262144

    --jinja

    --parallel 1

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -cmoe

    -ngl 99

    -b 512

    -ub 128

    --temp 0.7

    --top-p 0.95

    --top-k 20

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --spec-type none

    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 0
  health_check_timeout: 900
  unlisted: true
  capabilities:
    in:
      - text
      - image
    out:
      - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~13.0 GB (i1-IQ4_XS, imatrix) + 0.81 GB mmproj-Q8_0
    context: 262144
    vram_usage: "MEDIDO 16/11 smoke: ~4.8 GB VRAM @32K; @262K total no sistema 5352 MiB (mmproj em RAM); decode ~23 t/s; load 6s (page cache quente); KV q4_0 30 layers"
    source: 'mradermacher/gemma-4-26B-A4B-it-heretic-NSFW-i1-GGUF (i1-IQ4_XS); decensor base yukiworks/gemma-4-26B-A4B-it-heretic-NSFW
      (Heretic v2.2, dataset NSFW próprio, KL 0.0411 vs refusals 0/100 do classificador)'
    base_model: google/gemma-4-26B-A4B-it
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: gemma4moe
    parameters: 26000000000
    active_parameters: 4000000000
    context_length: 262144
    embedding_length: 2816
    quantization: i1-IQ4_XS
    note: 'Espaço veio da aposentadoria com honras do Ornith 1.5 35B (16/11/2026, fragments em _disabled/). Template
      canônico Gemma 4 EMBUTIDO no GGUF (sem --chat-template-file): controla thinking via kwarg enable_thinking (default
      OFF do lado do template — setParamsByID força true) e injeta canal vazio <|channel>thought quando OFF. SEM escada de
      effort: template não tem kwarg reasoning_effort e o dono determinou NÃO limitar --reasoning-budget (decisão 16/11) —
      think livre, o tempo é o custo declarado. NÃO declarar reasoningEfforts nas capabilities (lição do Fara no minicpm: duplicaria o off no menu).
      mmproj Q8_0 (0.81 GB) SERVIDO em RAM (--no-mmproj-offload, preced ctiel); dono não vê NSFW, mmproj é p/ papel geral.
      SMOKE capa completa 16/11: TOOLS PASS (get_weather → tool_calls city=Curitiba limpa, think on); VISION PASS (PIL PNG
      deterministica: red circle upper-left + blue square lower-right, descrição exata, 6s ViT na CPU); CTX 262144 PASS
      (native max, total sistema 5352 MiB, decode ~23 t/s, finish=stop com think 1285 chars + content limpo @max_tokens
      1024; o content vazio de um probe @cap 64 era think burn, não contexto). RAW /completion sem template sai junk
      (sampling da lane é pra chat, não FIM) — usar chat sempre. PAPEL PRIMÁRIO: enhancer da frota de enhance (diffuse/h3/ltx/musica), in-chain ANTES do render — sem
      modelo paralelo no llama-swap durante chain (regra da casa). Piso de qualidade do quant: i1-IQ4_XS é piso, se a
      prosa vier evasiva subir p/ i1-Q4_K_M 15.6 GB (67 GB livres comportam). SMOKE 16/11 (célula única bare-server port
      8899): header limpo (658/658 tensores, gemma4moe, 128e/8a, template canônico com enable_thinking, SEM reasoning_effort).
      PASSOU: think OFF no chat_template com sysprompt REAL do enhancer v2 (4402 chars = header 547 + _NSFW_V2_BASE)
      entregou contrato flat 3 campos + vocab blunt (cock) + speaker ids + anti-speech; probe bruto idem (dick, cunt,
