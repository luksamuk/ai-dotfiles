# Teste de viabilidade do "grandão": 125B parâmetros / 6B ativos + PLE n-gram 51B.
# Experts ~20GB (IQ1_M) em RAM via -cmoe; PLE (26.8 GiB) streama do SSD
# (--ngram-ssd DEFAULT-ON neste fork para arch qwen4exp); dense/KV/routers na GPU.
# MTP draft externo quimmedes Q4_0 (2.2 GB). Arch qwen4exp — o -ssd full streaming
# ABORTA nesse arch (GGML_ASSERT get_usage NULL, medido 27/out no Groot, mesma arch).
# Descendente de: experimento Groot-65B-A6B (distill deste modelo, _disabled).
# -------------------------------------------
qwen38-flash-next-1m:
  name: Qwen3.8 Flash Next 1M
  description: "Teste do grandão — 125B/6B MoE do Qwen (linhagem qwen4exp, distill do Groot). Lane experimental: viabilidade de decode 4-8 t/s com experts IQ1_M residentes em RAM."
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

    --model ${models_dir}/qwen38-flash-next-ud-iq1m/UD-IQ1_M/Qwen3.8-Flash-Next-UD-IQ1_M-00001-of-00003.gguf

    --jinja

    --parallel 1

    --ctx-size 16384

    --cache-type-k q8_0

    --cache-type-v q8_0

    -kvu

    --flash-attn on

    -ssd

    --ssd-streaming-cache-experts 8

    -ngl 99

    -b 512

    -ub 128

    -t 6

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 0
  health_check_timeout: 1200
  unlisted: true
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 16384
  metadata:
    size: "~74.5 GiB (UD unsloth, split 3) + 2.2 GiB MTP draft"
    context: 16384 (GGUF declara 262144 — teto da casa por RAM/VRAM)
    vram_usage: "a medir (dense + KV + draft; régua 550-600 MiB livre = passa)"
    source: unsloth/Qwen3.8-Flash-Next-GGUF (UD-IQ1_M) + quimmedes/Qwen3.8-Flash-Next-MTP-GGUF (Q4_0)
    kv_cache: q8_0/q8_0 (-kvu), draft q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen4exp
    parameters: 125000000000
    active: 6000000000
    context_length: 262144
    embedding_length: 2560
    quantization: UD-IQ1_M
    note: 'RESULTADO DO TESTE 03-04/nov/2026 (dono dormindo; Hermes com permissão total). VEREDITO: INVIAVEL nesta máquina como lane de uso — a física do streaming venceu. MEDIDAS (llama-server standalone, greedy, ctx 16k, q8_0 KV, 6 threads):
      (1) L1NOMTP (-cmoe, experts mmap/page-cache): decode 0.15 t/s QUENTE, prefill 0.21-0.28 t/s — kernels IQ1 na CPU + page-cache pressure. (2) L3C (-ssd --ssd-streaming-cache-experts 8): decode 1.19-1.55 t/s steady, prefill 0.83-1.04 t/s — 10x melhor que -cmoe, CASA com o piso do Maya (1.5 frio → 4-8 esperado NÃO confirmou: steady ficou ~1.0-1.5), e IMPORTANTE: o crash do -ssd com qwen4exp (medido no Groot 27/out, ggml-backend.cpp:383) NAO reproduz no build atual (d92b99ba7 + house 01/nov) — carregou em 15s e serviu. (3) L3MTP (draft MTP quimmedes Q4_0 na CPU, -ngld 0): decode 0.72 t/s — MTP É NEGATIVO em regime IO-bound (verify em lote lê +experts por token aceito do que economiza; previsto na análise do colibri). (4) L1 com -ngld 99: OOM no draft CUDA0 (+1.9 GiB não fecha). VRAM estable 4.83 GiB/6.14 (1.3 GiB livre > régua 550-600 MiB). RAM: avail 6.7-7.8 GiB (~75% usado, sob regra). Tool calling: FUNCIONA (finish_reason=tool_calls, arguments JSON válidos) mas exige enable_thinking false — com thinking o bloco de raciocínio come o budget antes do call (bug/cost conhecido do cafe). GGUF (69.57 GiB em 3 partes, verificado vs HEAD do HF) + draft (2.2 GiB) PERMANECEM em ~/.llama-models/qwen38-flash-next-ud-iq1m/ para re-teste futuro (colibri com engine qwen4exp, ou quant mais agressivo de experts que caiba em -hmoe ~23.5 GiB pinned). RE-TESTE: ./test/launch_q38.sh L3C. CONTRASTE: Ornith 1.5 (incumbent) roda 20-34 t/s @131K na mesma máquina — 15-25x mais rápido.'