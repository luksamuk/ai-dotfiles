# Teste de viabilidade do "grandão": 125B parâmetros / 6B ativos + PLE n-gram 51B.
# Experts ~20GB (IQ1_M) em RAM via -cmoe; PLE (26.8 GiB) streama do SSD
# (--ngram-ssd DEFAULT-ON neste fork para arch qwen4exp); dense/KV/routers na GPU.
# MTP draft externo quimmedes Q4_0 (2.2 GB). Arch qwen4exp — o -ssd full streaming
# ABORTA nesse arch (GGML_ASSERT get_usage NULL, medido 27/out no Groot, mesma arch).
# Descendente de: experimento Groot-65B-A6B (distill deste modelo, _disabled).
# -------------------------------------------
qwen38-flash-next-1m:
  name: Qwen3.8 Flash Next 1M
  description: "Teste do grandão — 125B/6B MoE do Qwen (linhagem qwen4exp, distill do Groot). Lane experimental: viabilidade de decode 4-8 t/s com experts IQ1_M residentes em RAM."
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

    --model ${models_dir}/qwen38-flash-next-ud-iq1m/UD-IQ1_M/Qwen3.8-Flash-Next-UD-IQ1_M-00001-of-00003.gguf

    --jinja

    --parallel 1

    --ctx-size 16384

    --cache-type-k q8_0

    --cache-type-v q8_0

    -kvu

    --flash-attn on

    -ssd

    --ssd-streaming-cache-experts 8

    -ngl 99

    -b 512

    -ub 128

    -t 6

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 0
  health_check_timeout: 1200
  unlisted: true
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 16384
  metadata:
    size: "~74.5 GiB (UD unsloth, split 3) + 2.2 GiB MTP draft"
    context: 16384 (GGUF declara 262144 — teto da casa por RAM/VRAM)
    vram_usage: "a medir (dense + KV + draft; régua 550-600 MiB livre = passa)"
    source: unsloth/Qwen3.8-Flash-Next-GGUF (UD-IQ1_M) + quimmedes/Qwen3.8-Flash-Next-MTP-GGUF (Q4_0)
    kv_cache: q8_0/q8_0 (-kvu), draft q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen4exp
    parameters: 125000000000
    active: 6000000000
    context_length: 262144
    embedding_length: 2560
    quantization: UD-IQ1_M
    note: 'RESULTADO E DESTINO. Pesos removidos do disco 04/nov de manha POR DECRETO do dono apos o veredito do teste noturno (lane segue na frota, unlisted). VEREDITO: INVIAVEL nesta maquina como lane de uso. MEDIDAS (llama-server standalone, greedy, ctx 16k, q8_0 KV, 6 threads): (1) L1NOMTP (-cmoe, experts mmap/page-cache): decode 0.15 t/s QUENTE, prefill 0.21-0.28 t/s — kernels IQ1 na CPU + page-cache pressure. (2) L3C (-ssd --ssd-streaming-cache-experts 8): decode 1.19-1.55 t/s steady, prefill 0.83-1.04 t/s — 10x melhor que -cmoe; o piso 1.5 frio do Maya CONFIRMOU, o 4-8 aquecido NAO (IO-bound). (3) L3MTP (draft MTP quimmedes Q4_0 na CPU): decode 0.72 t/s — MTP NEGATIVO em regime IO-bound. (4) -ngld 99: OOM no draft CUDA0 (+1.9 GiB). VRAM estavel 1.3 GiB livre (regua passa). RAM ~75% (sob os 90%), zero thrash. Tool calling FUNCIONA (finish_reason=tool_calls, arguments JSON validos) mas exige enable_thinking false. Crash do -ssd c/ qwen4exp (Groot 27/out) NAO reproduz no build atual. CONTRASTE: Ornith 1.5 roda 20-34 t/s @131K na mesma maquina (15-25x). RESTORE (se um dia quant so-experts fechar -hmoe ~23.5G pinned em 31G, ou 2a NVMe): hf download unsloth/Qwen3.8-Flash-Next-GGUF --include "UD-IQ1_M/*" --local-dir ~/.llama-models/qwen38-flash-next-ud-iq1m/ + hf download quimmedes/Qwen3.8-Flash-Next-MTP-GGUF mtp-Qwen3.8-Flash-Next-Q4_0.gguf --local-dir ~/.llama-models/qwen38-flash-next-ud-iq1m/mtp/. Artefatos do teste (relatorio, launcher L1-L3, bench, monitor, probe) preservados em ~/.llama-models/qwen38-flash-next-lane/. Relatorio completo: RELATORIO-2026-11-04.md la.'