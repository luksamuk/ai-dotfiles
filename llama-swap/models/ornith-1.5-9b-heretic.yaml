ornith-1.5-9b-heretic:
  name: Ornith 1.5 9B (Heretic)
  description: 'Ornith-1.5-9B decensurado (heretic) — dense 9B da arch qwen35 (hbrido GDN, a mesma famlia do 35B-A3B e do
    122B), MIT, multimodal no checkpoint de origem (mmproj 0.86 GB no repo do autor; NAO wired nesta lane — a VRAM da
    partial-offload 64K fica apertada com +0.86 GB; viso pendente do dono). Pos-treino de self-improvement da ornith-ai:
    o card vnde SWE-V 70.6 vs 53.2 do base Qwen3.5-9B, e o A/B local de 06/11 confirmou o esprito — a mesma fatorao pt-BR
    pediu 4x menos thinking que a lane 169Pi/Alpie que aposentamos. O decensor  da linha Heretic (p-e-w) feita pelo
    Thunder13240 COM metodologia acima da mdia: mediu recusas dentro do bloco de reasoning (onde o Ornith escondia 67/100
    das recusas), corrigiu a posio de sampling e converteu sem --no-nextn (o checkpoint declara mtp_num_hidden_layers mas
    no traz pesos mtp).'
  tags:
  - think
  cmd: '${llama_server} --port ${PORT}
    --model ${models_dir}/ornith-1.5-9b/Ornith-1.5-9B-heretic-Q4_K_M.gguf
    --mmproj ${models_dir}/ornith-1.5-9b/mmproj-Ornith-1.5-9B-heretic-f16.gguf
    --ctx-size 65536
    --jinja
    --flash-attn on
    -ngl auto
    -nkvo
    --no-mmproj-offload
    --cache-type-k q4_0
    --cache-type-v q4_0
    -b 2048
    -ub 1024
    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 65536
  metadata:
    size: ~5.24 GB (Q4_K_M heretic)
    context: '65536'  # escada da familia 06/11 passou inteira (32K-262K fp16, VRAM 4.72-4.89 GB); 262K nativo degrada o decode pra 4.9 t/s com janela 64K preenchida
    vram_usage: '~3.9 GB VRAM (pesos/buffers, offload parcial do auto-fit) + mmproj em RAM (viso opt-in)'
    kv_cache: q4_0/q4_0
    source: 'Thunder13240/Ornith-1.5-9B-heretic-GGUF (Ornith-1.5-9B-heretic-Q4_K_M.gguf, 5629108768 bytes exatos; MIT;
      base_model declarado ornith-ai/Ornith-1.5-9B; autor documenta ARA do Heretic com sampling position corrigida)'
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 9000000000
    embedding_length: 4096
    context_length: 262144
    quantization: Q4_K_M
    license: 'MIT (base) — decensor Thunder13240'
    note: 'DESENSOR VERIFICADO (card do autor): recusas genuinas 99/100 base -> 0/100 (two-scorer — o keyword-scorer
      dizia 6/100 e erastava; todo hit era resposta cumprindo que continha "illegal"), uniformidade cross-group UNIFORME
      em 20 grupos (zero spread demografico — o modo de falha classico da ablerao), KL 0.0019 @Q8_0 / 0.048 @Q4_K_M
      ("normal pattern" da casa heretic). INSIGHT do autor: 67/100 das recusas do Ornith moram DENTRO do bloco de
      reasoning — corrigir a posio de sampling do ARA derrubou 22 -> 0 com KL Menor. Sem MTP no checkpoint (declarado,
      sem pesos). BENCH+SMOKE 06/11 (vanilla c7d9f630d, 64K fp16, no build da NO-heretic; heretic mede na mesma fsica
      — diff 0.048 de KL): decode 12.8-13.3 t/s (EMPATE fsico com a 169Pi/Alpie aposentada, mesmo shape), prefill
      694/830/805 t/s. SMOKE fatorao pt-BR par quase-homorfo: PASS com 1.7k chars de thinking vs 6.9k da Alpie
      (4x menos na mesma lane). tools false PENDING PROBE (o 35B heretic da famlia provou tools; o 9B heretic falta
      medir). TROCA: dono aposentou a 169Pi/Alpie 06/11 no A/B; heretic entra como troca direta com o mesmo quant. VISAO PROVADA 06/11 pela rota do swap (candy.JPG do p-blog): identificou os M&Ms com CONTAGENS exatas (2 teal / 2 laranja / 1 verde), VRAM 4.9 GB com mmproj no device (0.86 GB cabem — sem --no-mmproj-offload), decode 8.5 t/s processando imagem. DSH input text+image nos 4 patches. NOTA: o mmproj do 35B NAO interopera — projetor 2048-d vs 4096-d do 9B (112 tensores divergem em dtype), confirmado por header. COMBO Q4-HOST 08/11 (lição do S5-nano): 52.9k prefill/régua, decode @52k cheio f16 = 3.1-3.3 t/s → combo -ngl auto -nkvo q4_0/q4_0 mmproj RAM = 7.2-7.8 t/s (+130%), prefill cold 72.2s, TTFT cache-hit 0.3s, visão re-provada pela rota do swap (descrição coerente do gráfico, ViT na RAM). A/B ik (fit, kv q4+hadamard): decode 9.3-9.6 (+28% sobre combo), prefill cold 131.6s/-45% — tradeoff real, decisão de swap canônico pendente do dono.'
