lfm3-1.7b:
  name: LFM3 1.7B
  description: "LiquidAI LFM3 1.7B descensurado (Heretic, KL 0.0094 / refusals
    3-100 vs 92-100 do original — par KL+recusas verificado), gerico edge da nova
    geracao tri-hybrid (13 short-conv + 5 SWA + 6 global attn), 256K de contexto
    nativo, raciocinio dual-mode. Substituto drop-in do GGUF oficial (mesmo
    tamanho/quant)."
  tags: [think, tools]
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/lfm3-1.7b/LFM3-1.7B-Heretic-Abliterated-Q8_0.gguf

    --ctx-size 327680

    --jinja

    --parallel 5

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -ngl 99

    -b 2048

    -ub 1024

    --temp 0.1

    --top-k 50

    --repeat-penalty 1.1

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.1
        top_k: 50
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.1
        top_k: 50
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~1.85 GB (Q8_0)
    context: "65536 por slot x 5 slots (327680 total)"
    vram_usage: "~4.1 GB VRAM pico @262K slot unico; @5x64K est. ~4.4GB (KV q4_0 ~1.35GB)"
    source: Vortecks/LFM3-1.7B-Heretic-Abliterated-GGUF (static, sem imatrix;
      Q8_0, 1846237728 bytes exatos; upstream safetensors BF16 do mesmo repo)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: lfm3
    parameters: 1900000000
    embedding_length: 2048
    context_length: 262144
    quantization: Q8_0
    note: 'Smoke 27/10 (llama.cpp b3282-19ff817fb; LFM3 chegou HOJE via merges
      #31252/#31257 — pull + rebuild local). ctx NATIVO 262144 deployado (escada:
      f16 KV @262K = 3.0GB CUDA OOM; q4_0 = pico 4.14GB com folga). Decode 75
      t/s, prompt 631 t/s (Q8_0, GPU sozinha). Tool calling: 4 get_weather/
