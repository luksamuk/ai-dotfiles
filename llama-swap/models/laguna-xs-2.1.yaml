laguna-xs-2.1:
  name: Laguna XS 2.1
  description: "APOSENTADO COM HONRAS 04/nov/2026 (pesos deletados por decreto do dono para abrir espaço pro Groot-65B; lane fica unlisted, fragment + receita intactos). Poolside 33B-A3B MoE coding model, atencao hibrida SWA(512)+global,
    131K de contexto, -cmoe (experts em page-cache evictavel), spec ngram-mod.
    Quant: APEX I-Compact (mudler, 14.69 GiB) reavaliada 01/11/2026 apos a
    reforma do backend cafe. Reasoning ALWAYS-ON no handle unico (padrao 2b-ter;
    samplers frios para reduzir o fechamento precoce do think); handle :think
    aposentado 01/11/2026."
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT}

    --model ${models_dir}/laguna-xs-2.1/Laguna-XS-2.1-APEX-I-Compact.gguf

    --jinja

    --parallel 1

    --ctx-size 131072

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -cmoe

    -ngl 99

    --spec-type ngram-mod

    --spec-ngram-mod-n-match 24

    --spec-ngram-mod-n-min 48

    --spec-ngram-mod-n-max 64

    --temp 0.3

    --top-p 0.85

    --top-k 40

    --min-p 0.02

    --repeat-penalty 1.12

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParams:
      stop:
      - </assistant>
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.3
        top_p: 0.85
        top_k: 40
        min_p: 0.02
  ttl: 0
  health_check_timeout: 300
  unlisted: true
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
