laguna-xs-2.1:
  name: Laguna XS 2.1
  description: Poolside's 33B/3B MoE agentic coding model with mixed SWA+global attention
    and native interleaved reasoning. 131K context, -cmoe expert offload.
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT}

    --model ${models_dir}/laguna-xs-2.1/Laguna-XS-2.1-Q4_K_M.gguf

    --jinja

    --parallel 1

    --ctx-size 131072

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -cmoe

    -ngl 99

    --temp 0.3

    --top-p 0.85

    --top-k 40

    --min-p 0.02

    --repeat-penalty 1.12

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParams:
      stop:
      - </assistant>
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.3
        top_p: 0.85
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.9
  ttl: 300
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~20.3 GB (Q4_K_M official)
    context: 131072
    vram_usage: ~4.0 GB VRAM + ~5 GB RAM (page cache evictável)
    source: poolside/Laguna-XS-2.1-GGUF (Q4_K_M official)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: laguna
    parameters: 33000000000
    context_length: 131072
    embedding_length: 2048
    quantization: Q4_K_M
    note: 'vram detalhe: MEDIDO 05/10 0.74 (c/ desktop ativo): -cmoe 3.9GB VRAM +
      ~5GB RAM used (18GB em page cache file-backed evictável), decode 34.6-35.1 t/s
      | -hmoe: 4.7GB VRAM + ~21GB used pinado, 28.5-32.0 | -ssd+predict: empata mas
      PERDEU no uso live (user verbatim ''lento''), rejeitado Revanche Sep 2026: cafe-llama.cpp
      carrega o que o ik nao conseguia (o ik morria com 29GB RSS no load). MoE offload
      via -hmoe (experts pinned em RAM, ~12-14GB, sem warmup por dominio; o -ssd era
      a alternativa com warmup). Q4_K_M oficial obrigatorio — APEX I-Compact trava
      com system prompt (deletado). Template EMBUTIDO via --jinja (externo v5 nao
      renderiza no cafe). turbo4/turbo2 corrompem a arch SWA hibrida — teto de ctx
      com qualidade: 131K q4_0. Decode 31.8 t/s @131K. Tool calling: com tools no
      request a grammar do cafe limita a 1 call/round e suprime o thinking (bug do
      fork, ver skill). GGUF em ~/.llama-models/laguna-xs-2.1/.'
