# -------------------------------------------
# QWEN3.6-35B-A3B HERETIC (mudler APEX-I-Mini) — EXPERIMENTAL
# O MESMO heretic TPE do prod (KL 0.0015), quant APEX-I-Mini do mudler.
# 14,32 GB — o heretic em quant leve que o usuário procurava.
# 733 tensors, SEM MTP nextn tail (speculative off no ik, igual ao KAT).
# Visão via mmproj.gguf (903 MB).
#
# vs PROD (SC117 APEX-I-Compact 17,02 GB): -2,7 GB, quant mais agressiva
# ("Smallest viable, fastest inference" no README do mudler). EXPERIMENTAL:
# dependendo do andar da carruagem, substitui o prod.
# -------------------------------------------
"qwen3.6-35b-a3b-heretic":
  name: "Qwen 3.6 35B Heretic"
  description: "Assistente de código sem censura (heretic TPE) com visão, em 14 GB — a quant mais compacta da família. Ideal para teste de velocidade e comparação com o prod."
  cmd: |
    ${ik_llama_server} --port ${PORT}
    --model ${models_dir}/qwen36-heretic-apex-mini/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Mini.gguf
    --mmproj ${models_dir}/qwen36-heretic-apex-mini/mmproj.gguf
    --no-mmproj-offload
    --no-graph-reuse
    -ngl 99
    --n-cpu-moe 35
    --ctx-size 102400
    --temp ${code_temp}
    --top-p ${code_top_p}
    --top-k ${code_top_k}
    --min-p ${code_min_p}
    --repeat-penalty ${code_repeat_penalty}
    --reasoning on
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --parallel-tool-calls
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --defer-experts
    --prefetch-experts
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.85
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~14.32 GB (APEX-I-Mini, heretic) + 903 MB mmproj"
    context: "1K-131K"
    vram_usage: "~5.1 GB VRAM + ~14 GB pinned RAM (n-cpu-moe 34)"
    source: "mudler/Qwen3.6-35B-A3B-uncensored-heretic-APEX-GGUF (APEX-I-Mini, base llmfan46 heretic TPE)"
    kv_cache: "q4_0/q4_0 + hadamard"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34660000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-Mini (mudler, heretic TPE)
    note: "Sep 24: experimental. O mesmo heretic TPE do prod em quant APEX-I-Mini do mudler (14.32 GB, -2.7 GB vs prod). MTP off (sem nextn tail). Se andar bem, substitui o prod."
