nomic-embed-text-v2-moe:
  name: Nomic Embed v2
  description: Multilingual MoE text embedding model that excels at multilingual retrieval,
    supporting ~100 languages with state-of-the-art performance at the 300M parameter
    scale.
  env:
  - CUDA_VISIBLE_DEVICES=
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/nomic-embed-text-v2-moe-Q4_K_M.gguf\n\
    --embeddings\n--pooling mean\n--ctx-size 512\n--cont-batching\n--parallel 4\n\
    --cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
  ttl: 300
  capabilities:
    in:
    - text
    out: []
    tools: false
    reranker: false
    context: 512
  metadata:
    architecture: nomic-bert
    parameters: 475000000
    context_length: 512
    embedding_length: 768
    quantization: Q4_K_M
    size: ~0.33 GB (Q4_K_M)
    vram_usage: ~0.1 GB VRAM
    source: nomic-ai/nomic-embed-text-v2-moe-GGUF (Q4_K_M)
    kv_cache: f16
    features:
      completion: false
      tools: false
      thinking: false
      vision: false
      embedding: true
      insert: false
      audio: false
      image: false
    note: 'vram detalhe: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only) Embedding-only
      model. Use /v1/embeddings endpoint. Prefix inputs with ''search_query: '' or
      ''search_document: ''. 100+ languages. Matryoshka → 256 dims.'
