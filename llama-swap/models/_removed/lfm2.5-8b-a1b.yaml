lfm2.5-8b-a1b:
  name: LFM 2.5 8B
  description: Liquid AI MoE hybrid — 8.3B total, 1.5B active per token. Built for
    fast, reliable tool calling on consumer hardware.
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/lfm2.5-8b-a1b/LFM2.5-8B-A1B-APEX-I-Compact.gguf\n\
    --fit on\n--fit-ctx 16384\n--ctx-size 131072\n--parallel 1\n--no-cont-batching\n\
    --reasoning-format deepseek-legacy\n--reasoning on\n--chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja\n\
    --temp 0.2\n--top-p 0.8\n--top-k 40\n--min-p 0.15\n--repeat-penalty 1.05\n--cache-type-k\
    \ q8_0\n--cache-type-v q4_0\n--flash-attn on\n--n-predict -1\n--jinja\n--spec-type\
    \ ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max\
    \ 64\n  --metrics\n"
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.2
        min_p: 0.15
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.3
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~4.2 GB (APEX I-Compact)
    context: 131072
    vram_usage: ~5.2GB VRAM (4.2 GB model + KV)
    source: mudler/LFM2.5-8B-A1B-APEX-GGUF
    kv_cache: q8_0 + q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: lfm2moe
    parameters: 8470000000
    context_length: 128000
    embedding_length: 2048
    quantization: APEX I-Compact
    note: 'MoE 1.5B active, hybrid conv+GQA. Reasoning + tool calling. APEX I-Compact:
      13% smaller than Q4_0, imatrix v1.3 calibrated. Uses upstream (BeeLlama segfaults
      on LFM2.5). GGUF has empty chat_template — requires --chat-template-file + --reasoning-format
      deepseek.'
