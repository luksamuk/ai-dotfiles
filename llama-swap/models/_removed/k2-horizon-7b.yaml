k2-horizon-7b:
  name: K2-Horizon 7B
  description: 'IFM K2-Horizon-7B dense (k2_horizon arch, PR #2435). 512K nativo,
    thinking profundo (budget vendor 32K+). EXPERIMENTAL: smoke de codigo reprovado
    por budget de thinking — testchat apenas.'
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/k2-horizon-7b/K2-Horizon-7B-Q4_K_M.gguf

    --jinja

    --chat-template-file ${models_dir}/k2-horizon-7b/chat_template.jinja

    --fit

    --fit-margin 512

    --ctx-size 131072

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --jinja

    --parallel 1

    --reasoning-budget -1

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 1.0
        top_p: 0.95
      ${MODEL_ID}:think:
        temperature: 1.0
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~5.59 GB (Q4_K_M abenzerps) — BF16 oficial 18 GB
    context: 131072
    vram_usage: 5.28 GB medido @8K ctx com --fit (smoke 16/09)
    source: abenzerps/K2-Horizon-7B-GGUF (Q4_K_M), base IFM/K2-Horizon-7B
    kv_cache: q4_0 + hadamard K/V (v-cache ok; k-cache-hadamard teve glitches reportados
      pelo kassane no fork dele — monitorar)
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: k2_horizon
    parameters: 8000000000
    context_length: 524288
    embedding_length: 4096
    quantization: Q4_K_M
    note: 'Thinking voraz: vendor recomenda 32K+ output tokens com reasoning_effort=high.
      Smoke de codigo reprovado com budgets <= 8K (4 runs: 3x content=0, 1x codigo
      com bug). USO EXPERIMENTAL — testchat com budget generoso.'
