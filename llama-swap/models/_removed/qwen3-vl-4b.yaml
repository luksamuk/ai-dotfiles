qwen3-vl-4b:
  name: Qwen3-VL 4B
  description: Qwen3-VL dense 4B vision-language model with native 2D/3D grounding,
    OCR in 32 languages, visual agent GUI, and video understanding.
  tags:
  - vision
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/qwen3-vl-4b/Qwen3VL-4B-Instruct-Q4_K_M.gguf\n\
    --mmproj ${models_dir}/qwen3-vl-4b/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf\n--media-path\
    \ ${media_path}\n--jinja\n--fit on\n--fit-target ${vram_margin}\n--fit-ctx 8192\n\
    --ctx-size 32768\n--parallel 1\n--temp 0.7\n--top-p 0.8\n--top-k 20\n--min-p 0.0\n\
    --repeat-penalty 1.0\n--presence-penalty 1.5\n--cache-type-k ${small_cache_k}\n\
    --cache-type-v ${small_cache_v}\n--flash-attn on\n--spec-type ngram-mod\n  --spec-ngram-mod-n-match\
    \ 24\n  --spec-ngram-mod-n-min 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 32768
  metadata:
    size: 2.5 GB (Q4_K_M) + 454 MB mmproj
    context: 32768
    vram_usage: ~4 GB VRAM
    source: Qwen/Qwen3-VL-4B-Instruct-GGUF (Q4_K_M + mmproj Q8_0)
    note: 'vram detalhe: ~4 GB (model + mmproj + cache) Native grounding: bbox_2d
      [x1,y1,x2,y2] in 0-1000 scale. repeat_penalty 1.0 mandatory.'
    kv_cache: q8_0
    features:
      completion: true
      tools: false
      thinking: false
      vision: true
      embedding: false
      insert: false
      audio: false
      image: true
    architecture: qwen3vl
    parameters: 4000000000
    context_length: 256000
    embedding_length: 2560
    quantization: Q4_K_M
