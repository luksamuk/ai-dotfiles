webworld-8b:
  name: WebWorld 8B
  description: World model predicting next page state from web browsing context —
    trained for web navigation and interaction understanding.
  tags:
  - world-model
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/WebWorld-8B.i1-Q5_K_M.gguf

    --fit

    --fit-margin 768

    --ctx-size 40960

    --timeout 0

    --parallel 2

    --cont-batching

    --temp 0.6

    --top-p 0.9

    --top-k 20

    --min-p 0.01

    --repeat-penalty 1.05

    --cache-type-k q8_0

    --cache-type-v q4_0

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --jinja

    --metrics

    '
  ttl: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 40960
  metadata:
    size: ~5.9 GB (i1-Q5_K_M)
    context: 40960
    vram_usage: ~4 GB VRAM
    source: mradermacher/WebWorld-8B-i1-GGUF (i1-Q5_K_M)
    kv_cache: q8_0 + q4_0 hadamard
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen3
    parameters: 8190000000
    context_length: 40960
    embedding_length: 4096
    quantization: Q5_K_M
    warning: Not a chatbot — requires specialized world model prompts.
    note: 'vram detalhe: ~4GB model + KV q8_0+q4_0+hadoop ~80-83% VRAM '
