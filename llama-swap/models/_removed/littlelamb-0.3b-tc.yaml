littlelamb-0.3b-tc:
  name: LittleLamb 0.3B TC
  description: Compact 0.3B-parameter model specialized for function and tool calling
    tasks in resource-constrained environments.
  tags:
  - tools
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/LittleLamb-ToolCalling.Q8_0.gguf\n\
    --jinja\n--fit on\n--fit-target 768\n--fit-ctx ${small_model_min_ctx}\n--ctx-size\
    \ 40960\n  --parallel 4\n--cont-batching\n--temp ${code_temp}\n--top-p ${code_top_p}\n\
    --top-k ${code_top_k}\n--min-p ${code_min_p}\n--repeat-penalty ${code_repeat_penalty}\n\
    --reasoning on\n--cache-type-k ${small_cache_k}\n--cache-type-v ${small_cache_v}\n\
    --flash-attn on\n--metrics\n"
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.9
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  health_check_timeout: 300
  ttl: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 40960
  metadata:
    size: ~303 MB (Q8_0)
    context: 40960
    vram_usage: ~0.5 GB VRAM
    source: mradermacher/LittleLamb-ToolCalling-GGUF (Q8_0)
    kv_cache: q8_0 + attn_rot
    features:
      completion: true
      tools: true
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen3
    parameters: 293260000
    context_length: 40960
    embedding_length: 544
    quantization: Q8_0
    warning: ik_llama.cpp incompatible — use llama.cpp upstream
    note: 'vram detalhe: ~0.5GB (model + cache) '
