qwen3-coder-30b:
  name: Qwen 3 Coder 30B
  description: Qwen's 30B-A3B MoE coding model (heretic, text-only). Agentic-first
    tool calling at 131K context.
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT}

    --model ${models_dir}/qwen3-coder-30b/Qwen3-Coder-30B-APEX-I-Compact.gguf

    --ctx-size 131072

    --jinja

    --parallel 1

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -cmoe

    -ngl 99

    -b 512

    -ub 128

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.7
        top_p: 0.8
        top_k: 20
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~13.8 GB (APEX I-Compact)
    context: 131072
    vram_usage: ~4.6 GB VRAM
    source: mudler/Qwen3-Coder-30B-APEX-GGUF (I-Compact; base Qwen/Qwen3-Coder-30B-A3B-Instruct)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen3_moe
    parameters: 30500000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-Compact
    note: 'vram detalhe: ~4.6 GB VRAM (experts CPU) | experts CPU (-cmoe); zen fechado
      05/10: decode 31.3-32.8 t/s, prefill 165 t/s, load 6.6s; ik -fast: 35.2 t/s
      vram detalhe: MEDIDO 05/10 (zen fechado): 4.64GB VRAM, decode 31.3-32.8 t/s
      (μ32), prefill 165 t/s, load 6.6s — ik -fast no mesmo dia: 35.2 t/s / prefill
      432 t/s (ik domina prefill; cafe empata decode e evita RAM pinada) Deploy Oct
      2 2026: variante café do qwen3-coder-30b (ik), espelho do heretic-cafe. Sem
      MTP (arch sem nextn), text-only, sampling do fabricante 0.7/0.8/20. Turbo4 KV
      limpo na arch (crasha só em hibrida SSM). ONYX de el4: não existe pra esse modelo
      (catalogado Oct 1).'
