nex-n2.5-mini:
  name: Nex N2.5 Mini
  description: Nex-N2.5-mini is a 35B Mixture-of-Experts agentic model (Qwen3.5 base
    + Gated DeltaNet hybrid attention) post-trained by Nex-AGI for long-horizon coding,
    computer use and tool calling. Adaptive thinking via reasoning_effort. Text-only
    on 6GB VRAM (vision mmproj available but disabled).
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/nex-n2.5-mini/Nex-N2.5-mini-Q4_K_M.gguf

    # No --mmproj: vision crashes on 6GB RTX 3050 (lição Jul 2026, mmproj 899MB em
    disco se precisar).

    --fit

    --fit-margin 768

    --ctx-size 131072

    --temp 0.7

    --top-p 0.95

    --top-k 40

    --min-p 0.0

    --repeat-penalty 1.0

    --presence-penalty 1.1

    --reasoning on

    --jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.7
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          reasoning_effort: high
        temperature: 0.7
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~21.2 GB (Q4_K_M ggml-org official conversion)
    context: 131072
    vram_usage: ~6 GB VRAM
    source: abenzerps/Nex-N2.5-mini-GGUF (Q4_K_M, SHA256 verificado)
    kv_cache: q4_0 + attn_rot + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: Q4_K_M
    note: 'vram detalhe: ~5-6GB VRAM estimado + ~15-16GB pinned RAM (Q4_K_M não-interleaved,
      sem spec decoding) Added Sep 09 2026 (release Sep 08). Vendor benches: Terminal-Bench
      2.1 73.4, SWE-Bench Pro 43.8, OSWorld-V 71.2 — números de vendor, régua própria
      decide. Toggle thinking = reasoning_effort (''none''/''high'') via chat_template_kwargs
      — NÃO usar qwen-fixed-chat-template (var errada). Tool calls XML qwen3-coder
      style. Sem MTP tensors: rodará pure AR. Upgrade natural: APEX-MTP/ONYX do mudler
      quando sair (N2-mini antigo tinha APEX I-Compact 16.5GB).'
