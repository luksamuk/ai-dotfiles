# -------------------------------------------
# NEX-N2.5-MINI - MoE AGENTIC CODING (text-only on 6GB RTX 3050)
# MoE 35B params, ~3B ativo por token. Base Qwen3.5 + Gated DeltaNet (hybrid).
# Released Sep 08 2026 (nex-agi/Nex-N2.5-mini, Apache-2.0). Arch: qwen35moe.
# Benchmarks do vendor (com sal): Terminal-Bench 2.1 = 73.4, SWE-Bench Pro 43.8,
# OSWorld-Verified 71.2. Agentic family (computer use, web, long-horizon).
# GGUF: abenzerps/Nex-N2.5-mini-GGUF Q4_K_M (conversão ggml-org oficial, f3f1a8f2,
# SHA256 verificado no download). SEM MTP heads — runs pure AR (sem spec decoding).
# APEX/ONYX do mudler ainda não existe pra N2.5-mini (só pro N2-mini antigo).
# Q4_K_M 21.2GB (não-interleaved; mais VRAM/RAM que APEX 16.5GB do irmão N2-mini).
# Chat template EMBEDDED no GGUF (estilo qwen3-coder XML: <tool_call><function=...>)
# com toggle reasoning_effort — INVERTIDO do enable_thinking qwen:
#   'none' = thinking OFF (template pré-fecha <think>) | default/'high' = ON.
# mmproj F16 (899MB) baixado mas NÃO carregado — vision crashes no 6GB (lição Jul 2026,
# mesmo comportamento do N2-mini/CLIP OOM). Text-only.
# ik_llama backend: --fit, --defer-experts, hadamard KV, pinned memory.
# --fit-margin 768: mesmo valor do fragmento APEX do N2-mini (classe 35B MoE).
# --ctx-size 131072: teto seguro da frota (modelo suporta 262K nativo).
# Dual mode: base = adaptive thinking default (modelo decide; kwarg reasoning_effort:'none'
#   NÃO USAR — o auto-parser do ik assume TAG_BASED "sempre pensa" quando o diff
#   enable_thinking do template é no-op (template usa reasoning_effort, não
#   enable_thinking), e classifica TODO o output como reasoning_content.
#   Verificado Sep 09 2026: default → reasoning vazio + content limpo em trivia;
#   'high' → reasoning separado + content limpo. :think = reasoning_effort: high.
# Sampling oficial (vendor): temp 0.7, top_p 0.95, top_k 40.
# License: Apache-2.0
# -------------------------------------------
"nex-n2.5-mini":
  name: "Nex N2.5 Mini"
  description: "Nex-N2.5-mini is a 35B Mixture-of-Experts agentic model (Qwen3.5 base + Gated DeltaNet hybrid attention) post-trained by Nex-AGI for long-horizon coding, computer use and tool calling. Adaptive thinking via reasoning_effort. Text-only on 6GB VRAM (vision mmproj available but disabled)."
  cmd: |
    ${ik_llama_server} --port ${PORT}
    --model ${models_dir}/nex-n2.5-mini/Nex-N2.5-mini-Q4_K_M.gguf
    # No --mmproj: vision crashes on 6GB RTX 3050 (lição Jul 2026, mmproj 899MB em disco se precisar).
    --fit
    --fit-margin 768
    --ctx-size 131072
    --temp 0.7
    --top-p 0.95
    --top-k 40
    --min-p 0.0
    --repeat-penalty 1.0
    --presence-penalty 1.1
    --reasoning on
    --jinja
    --parallel 1
    --parallel-tool-calls
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --defer-experts
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        temperature: 0.7
        top_p: 0.95
      "${MODEL_ID}:think":
        chat_template_kwargs:
          reasoning_effort: "high"
        temperature: 0.7
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text']
    out: ['text']
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~21.2 GB (Q4_K_M ggml-org official conversion) + 899 MB mmproj (não carregado)"
    context: "1K-131K (modelo suporta 262K nativo)"
    vram_usage: "~5-6GB VRAM estimado + ~15-16GB pinned RAM (Q4_K_M não-interleaved, sem spec decoding)"
    source: "abenzerps/Nex-N2.5-mini-GGUF (Q4_K_M, SHA256 verificado)"
    kv_cache: "q4_0 + attn_rot + hadamard"
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: Q4_K_M
    note: "Added Sep 09 2026 (release Sep 08). Vendor benches: Terminal-Bench 2.1 73.4, SWE-Bench Pro 43.8, OSWorld-V 71.2 — números de vendor, régua própria decide. Toggle thinking = reasoning_effort ('none'/'high') via chat_template_kwargs — NÃO usar qwen-fixed-chat-template (var errada). Tool calls XML qwen3-coder style. Sem MTP tensors: rodará pure AR. Upgrade natural: APEX-MTP/ONYX do mudler quando sair (N2-mini antigo tinha APEX I-Compact 16.5GB)."