occamy-1.0:
  name: Occamy 1.0 35B
  description: 'Accio-Lab Occamy-1.0: co-work agentic (long-horizon, state tracking,
    tool grounding). Qwen3.6-35B-A3B + SFT/HDPO/SAO. APEX-I-MiniPlus-V2 i-quant mix,
    vision mmproj Q8_0 bundled. Sem MTP.'
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/occamy-1.0/Occamy-1.0.APEX-I-MiniPlus-V2.gguf

    --mmproj ${models_dir}/occamy-1.0/mmproj-Accio-Lab_occamy-1.0-Q8_0.gguf

    --no-mmproj-offload

    --no-graph-reuse

    --fit

    --fit-margin 1024

    --ctx-size 131072

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --reasoning on

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~13.62 GiB (APEX-I-MiniPlus-V2 3.38 BPW) + 585 MiB mmproj Q8_0
    context: 131072
    vram_usage: ~5 GB VRAM
    source: IsValorum/Occamy-1.0-APEX-I-MiniPlus-V2-GGUF + mmproj-Accio-Lab (Q8_0),
      base Accio-Lab/occamy-1.0 (Qwen3.6-35B-A3B)
    kv_cache: q4_0 + attn_rot + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    note: 'vram detalhe: ~4-5 GB estimado (i-quant dequant + fit) — medir no smoke '
