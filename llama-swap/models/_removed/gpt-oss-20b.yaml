gpt-oss-20b:
  name: GPT-OSS 20B
  description: GPT-OSS is OpenAI's open-weight model designed for powerful reasoning,
    agentic tasks, and versatile developer use cases. The 20B MoE variant uses 32
    experts per layer.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/gpt-oss-20b-Q4_K_M.gguf

    --jinja

    --parallel-tool-calls

    --reasoning on

    --fit

    --fit-margin 768

    --ctx-size 131072

    --timeout 0

    --temp 0.6

    --top-p 0.9

    --top-k 40

    --min-p 0.01

    --repeat-penalty 1.0

    --ubatch-size 2048

    --batch-size 2048

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --metrics

    '
  filters:
    stripParams: temperature, top_p
  ttl: 120
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~10.8 GB (Q4_K_M)
    context: 131072
    vram_usage: ~5 GB VRAM + ~6 GB RAM
    source: unsloth/gpt-oss-20b-GGUF
    kv_cache: q4_0 + hadamard + attn_rot
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: gpt-oss
    parameters: 20910000000
    context_length: 131072
    embedding_length: 2880
    quantization: Q4_K_M
    warning: Always reasons internally (not optional). MoE offload to RAM — slower
      than pure GPU models.
    note: 'vram detalhe: ~5GB VRAM + ~6GB RAM (heavy offload, MoE) '
