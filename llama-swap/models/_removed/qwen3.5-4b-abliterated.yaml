qwen3.5-4b-abliterated:
  name: Qwen3.5 4B Abliterated
  description: Qwen 3.5 is a family of open-source multimodal models that delivers
    exceptional utility and performance. Abliterated variant with refusal behaviors
    removed for adversarial testing and NSFW prompt enhancement.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/qwen3.5-4b-abliterated/Huihui-Qwen3.5-4B-abliterated.Q4_K_M.gguf

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --fit

    --fit-margin 512

    --ctx-size ${small_model_max_ctx}

    --temp ${default_temp}

    --top-p ${default_top_p}

    --top-k ${default_top_k}

    --min-p ${default_min_p}

    --repeat-penalty ${default_repeat_penalty}

    --reasoning on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --no-graph-reuse

    --ctx-checkpoints 0

    --ctx-checkpoints-interval 0

    --batch-size 512

    --ubatch-size 128

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    architecture: qwen35
    parameters: 4210000000
    context_length: 262144
    embedding_length: 2560
    quantization: Q4_K_M
    size: ~2.71 GB (Q4_K_M)
    context: 131072
    vram_usage: ~4.5 GB VRAM
    source: mradermacher/Huihui-Qwen3.5-4B-abliterated-GGUF (Q4_K_M)
    kv_cache: q4_0/q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    note: 'vram detalhe: ~4.5GB VRAM (model 2.71GB + q4_0/q4_0 hadamard cache + compute)
      Abliterated variant — refusal behaviors removed via Abliterix. Parameters aligned
      to qwen3.5-4b normal (Aug 2026). Uses Huihui-Qwen3.5-4B-abliterated (renamed
      from Qwen3.5-4B-abliterated-i1).'
