# -------------------------------------------
# BONSAI 27B 1-BIT — PrismML binary {-1,+1} LLM (Q1_0, upstream llama.cpp)
# prism-ml/Bonsai-27B-gguf — Qwen3.6-27B base, 27.3B binary weights at 1.125 bpw.
# Q1_0 CUDA kernels upstream (b9867+): initial backend #21629, byte_perm #25628,
#   MMQ fix #25778 — all present in build 2026-08-25+ (recompiled 08-30 for #28000).
# 3.80 GB on disk, ~3.9 GB deployed. Fits entirely in RTX 3050 6GB VRAM.
# 89.5% of FP16 intelligence retained (76.11 avg, 15 benchmarks).
#
# Aug 2026 redeploy notes (differs from Jul deploy):
#   - ctx 131072 (user preference) with --no-kv-offload: weights fully in VRAM,
#     KV cache kept in host RAM. Hybrid backbone grows full-attn KV on only
#     16/64 layers -> RAM bandwidth hit is minor at 128K.
#   - MEASURED (Aug 30, upstream b9723942ad, browser open ~595MiB VRAM):
#       131K KV-host: 10.95 tok/s (VRAM 4436 MiB / 72%)
#       48K KV-GPU + mmproj-RAM: 22.91 tok/s | 48K mmproj-GPU: OOM
#       96K KV-GPU + mmproj-RAM: OOM | dspark sidecar: INCOMPATIBLE (see below)
#   - To switch to speed mode: swap ctx-size to 49152 and remove --no-kv-offload.
#   - mmproj Q8_0 (0.63 GB) via --no-mmproj-offload — vision tower stays in RAM.
#   - dspark-Q4_1 sidecar from prism-ml is INCOMPATIBLE with upstream dflash
#     loader (tensor names dspark.markov_head_a/b, confidence_head, log_snr vs
#     expected markov_w1/w2 + dflash.target_layers). PrismML format is fork-only.
#     GGUF deleted; ngram-mod is the only spec type on this box.
#   - Upstream #28000 (2026-08-30) fixes NVFP4 scales in dflash path —
#     recompiled before measuring dspark.
# Sampling: temp 0.7, top_p 0.95, top_k 20 per model card.
# Dual mode: :think suffix toggles enable_thinking via filters.
# -------------------------------------------
"bonsai-27b":
  name: "Bonsai 27B 1-bit"
  description: "PrismML's 1-bit 27B reasoning model — Qwen3.6-27B with true 1.125-bit binary weights, full thinking/reasoning at ~3.9 GB. 89.5% of FP16 intelligence. Full GPU offload on RTX 3050 6GB. Upstream llama.cpp with ngram-mod/dspark speculative decoding."
  cmd: |
    ${llama_server} --port ${PORT}
    --model ${models_dir}/bonsai-27b/Bonsai-27B-Q1_0.gguf
    --mmproj ${models_dir}/bonsai-27b/Bonsai-27B-mmproj-Q8_0.gguf
    --no-mmproj-offload
    --jinja
    -ngl 99
    --ctx-size 131072
    --no-kv-offload
    --temp 0.7
    --top-p 0.95
    --top-k 20
    --min-p 0
    --repeat-penalty 1.0
    --parallel 1
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --flash-attn on
    --spec-type ngram-mod
    --spec-ngram-mod-n-max 64
    --spec-ngram-mod-n-min 48
    --spec-ngram-mod-n-match 24
    --metrics
  filters:
    stripParams: "temperature, top_p, top_k, min_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        min_p: 0
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        min_p: 0
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~3.9 GB (Q1_0 binary 1.125 bpw) + 0.63 GB mmproj"
    context: "131072 (KV on host via --no-kv-offload); 64K-262K native"
    vram_usage: "~4.4 GB VRAM (Q1_0 weights + compute; mmproj in RAM, KV in host RAM)"
    source: "prism-ml/Bonsai-27B-gguf (Q1_0 + dspark-Q4_1 sidecar + mmproj Q8_0)"
    kv_cache: "q4_0 (host RAM via --no-kv-offload, 16/64 full-attn layers)"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: true
    architecture: qwen3
    parameters: 27300000000
    context_length: 262144
    embedding_length: 3584
    quantization: "Q1_0 (binary 1.125 bpw, Qwen3.6-27B base)"
    note: "1-bit 27B, full GPU resident. Aug 2026: 128K ctx via --no-kv-offload experiment, mmproj enabled, dspark sidecar staged for A/B. Jul 2026 measurements: 32K=27 tok/s, 48K=20 tok/s with ngram-mod."