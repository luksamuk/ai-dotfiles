nex-n2.5-mini:
  name: Nex N2.5 Mini
  description: Nex-AGI's open-weight agent model. 35B MoE with 3B active, post-trained from Qwen3.5-35B-A3B for computer use,
    coding, and tool calling. Supports reasoning effort control (low, medium, high, xhigh).
  tags:
  - think
  - tools
  - vis
  cmd: "env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT} --model ${models_dir}/nex-n2.5-mini/Nex-N2.5-mini-APEX-I-Micro.gguf\
    \ --ctx-size 131072 --mmproj ${models_dir}/nex-n2.5-mini/mmproj-Nex-N2.5-mini-Q8_0.gguf\n    --jinja --parallel 1 --cache-type-k\
    \ q4_0 --cache-type-v q4_0 --flash-attn on -cmoe -ngl 99 -b 512 -ub 128 --lazy-mode off --temp 0.7 --top-p 0.8 --top-k\
    \ 20 --repeat-penalty 1.05 --reasoning-budget 8192 --metrics"
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.8
  ttl: 0
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~10.15 GiB (APEX I-Micro) + 586 MB mmproj Q8_0
    context: 131072
    vram_usage: ~3.5 GB VRAM + ~13 GB RAM (experts mmap -cmoe)
    source: MrFuzzihead/Nex-N2.5-mini-APEX-GGUF (I-Micro + mmproj Q8_0; base nex-agi/Nex-N2.5-mini)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    active: 3000000000
    experts: 256 roteados + 1 shared; 8 ativos/token; 40 layers
    experts_ff: 2048
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-Compact
    note: Computer-use lane com vision. I-Micro 10.15 GiB backbone (maioria dos experts via -cmoe em RAM) + mmproj Q8_0 586
      MB. APEX I-Compact 15.4 GiB NAO coube com mmproj a 131K (OOM em 6GB VRAM).
  reasoningEfforts:
    low: low
    medium: medium
    high: high
    xhigh: xhigh
    max: max
