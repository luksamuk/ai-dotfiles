nex-n2.5-mini:
  name: Nex N2.5 Mini
  description: Nex-AGI's open-weight agent model. 35B MoE with 3B active, post-trained from Qwen3.5-35B-A3B for computer use,
    coding, and tool calling. Supports reasoning effort control (low, medium, high, xhigh).
  tags:
  - think
  - tools
  - vis
  cmd: "env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT} --model ${models_dir}/nex-n2.5-mini/Nex-N2.5-mini-APEX-Mini.gguf\
    \ --ctx-size 131072 --mmproj ${models_dir}/nex-n2.5-mini/mmproj-Nex-N2.5-mini-Q8_0.gguf\n    --jinja --parallel 1 --cache-type-k\
    \ q4_0 --cache-type-v q4_0 --flash-attn on -cmoe -ngl 99 -b 512 -ub 128 --lazy-mode off --temp 0.7 --top-p 0.8 --top-k\
    \ 20 --repeat-penalty 1.05 --reasoning-budget 8192 --metrics"
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.8
  ttl: 0
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~13.5 GB
    context: 131072
    vram_usage: ~2.5 GB VRAM (backbone) + ~570 MB mmproj Q8_0 + ~10 GB RAM (experts)
    source: MrFuzzihead/Nex-N2.5-mini-APEX-GGUF (Mini; base nex-agi/Nex-N2.5-mini)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    active: 3000000000
    experts: 256 roteados + 1 shared; 8 ativos/token; 40 layers
    experts_ff: 2048
    context_length: 262144
    embedding_length: 2048
    quantization: APEX Mini
    note: 'Computer-use lane com VISION. APEX Mini 12.54 GiB + mmproj Q8_0 573 MB (experts IQ2_S mid, dono: ''Q1 no meio é
      complicado'' — I-Micro IQ1_M rejeitado). I-Compact 15.4G + mmproj BF16 906MB OOM na 3050 6GB a 131K; Mini + mmproj Q8_0
      570MB = 4.4G VRAM de 6G, folga. reasoningEfforts low/med/high/xhigh/max no wire (medidos: low=9tok, high=117tok). Vision
      probed: descreveu retângulo verde-limão vibrante. Boot ~3s via cafe -cmoe. RETIFICAÇÃO 05/nov (card oficial nex-agi/Nex-N2.5-mini +
      teste no wire kwarg E top-level): o card declara SÓ none(non-thinking)/medium(default-adaptive)/high(always-think) — low/xhigh/max
      NÃO EXISTEM no card e no wire caem no ramo default (escada cafe N=1: 701/1321/1284/916 chars = ruído do sampler em torno do
      default 1073, sem monotonia; a medição antiga low=9tok não reproduz). Mapa enxugado pra off(null = não manda nada = medium do
      card)/high; none está NO CARD mas no nosso stack llama-server quebra o parser (content vazio, resposta inteira vira reasoning) —
      não exposto.'
    reasoningEfforts:
      'off': null
      medium: medium
      high: high
