glm-ocr:
  name: GLM-OCR
  description: GLM's vision-language OCR model for complex document understanding
    and text extraction.
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/GLM-OCR-Q8_0.gguf\n\
    --mmproj ${models_dir}/mmproj-GLM-OCR-Q8_0.gguf\n--jinja\n--media-path ${media_path}\n\
    --fit on\n--fit-target ${vram_margin}\n--fit-ctx ${small_model_min_ctx}\n--ctx-size\
    \ ${small_model_max_ctx}\n--temp 0.1\n--top-p 0.9\n--top-k 40\n--repeat-penalty\
    \ 1.0\n--reasoning off\n--cache-type-k f16\n--cache-type-v f16\n--flash-attn on\n\
    --spec-type ngram-mod\n  --spec-ngram-mod-n-match 24\n  --spec-ngram-mod-n-min\
    \ 48\n  --spec-ngram-mod-n-max 64\n  --metrics\n"
  ttl: 60
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 131072
  metadata:
    architecture: glm4
    parameters: 940000000
    context_length: 131072
    embedding_length: 2048
    quantization: Q8_0
    size: ~0.95 GB (Q8_0) + ~0.48 GB mmproj (Q8_0)
    vram_usage: ~2GB (model + mmproj + cache)
    source: ggml-org/GLM-OCR-GGUF (Q8_0 + mmproj Q8_0)
    kv_cache: f16
    features:
      completion: true
      tools: false
      thinking: false
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    note: Specialized OCR model — use prompts like 'OCR', 'OCR markdown', 'Table Recognition:'.
      NOT a general VLM. Complements LFM2.5-VL-450M (general vision) for document
      extraction.
