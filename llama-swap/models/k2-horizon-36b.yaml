#   - Hadamard K/V: seguia REJEITADO (glitches deterministicos no smoke 16/09, com o
#     build NOVO de 4 dias de vida). Teste A/B na reativação: primeiro SEM hadamard
#     (fragile), re-testar hadamard após validar baseline sadio.
#   - MoVA: value-experts residentes na GPU (attn_v_exps ~3.2GB @Q3 profile; Mini
#     pode ser menor — CONFERIR no primeiro load via nvidia-smi).
# Manual mapping (--fit FAIL nesta arch): FFN experts + tok_embd CPU pinned;
#   MoVA + output na GPU; KV q4_0 em RAM (~49KB/token, 48 layers).
# GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 = OOM insurance ONLY (UMA como path primario
#   roda 8-10x mais lento em MoE: page migration vs pinned copies).
# Samplers: 0.7/0.95; model-card temp 1.0 quebrou leitura agentic em Sep (London->Tokyo).
# Reasoning: thinking -> reasoning_content (--reasoning-format deepseek), budget
#   16384 ceiling; vendor pede effort high mas 32K+ output queima wall clock.
