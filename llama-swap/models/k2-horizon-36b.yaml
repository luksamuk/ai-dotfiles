# -------------------------------------------
# K2-HORIZON-MOVA-36B-A4B — RTX 3050 6GB (manual mapping; --fit fails on this arch)
# Why --fit fails: attn_v_exps (MoVA value-experts, ~3.2GB @Q3_K_M) is not treated
# as a MoE tensor, and --override-tensor cannot be combined with --fit (measured:
# 5.8GB residue > 5.0GB free on 6GB card).
# Manual mapping:
#   - FFN experts + tok_embd on CPU (pinned); MoVA value-experts + output on GPU
#   - output on GPU = +30% decode (15.2 -> 20.9 t/s @8K for +0.9GB VRAM)
#   - KV q4_0 = ~49KB/token (48 layers, 8 kv-heads x 128) -> 6.4GB @131K in RAM
#   - ubatch 256: compute buffer fits with MoVA experts resident (5.3GB / 86% VRAM)
# GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 = OOM insurance ONLY (as primary path, UMA
# runs 8-10x slower on MoE: page migration vs overlapped pinned copies).
# Hadamard K/V REJECTED on k2-horizon: deterministic token glitches at temp 0
# (K de-transform missing on the llm_build_kv attention path; V side, incl. MoVA
# routing, verified clean end-to-end — see issue dossier).
# Samplers: 0.7/0.95 both modes. Model-card temp 1.0 broke agentic reading
# ("London" read as "Tokyo" 3x in a row); benchmark temp is for scoring, not agents.
# Reasoning: thinking lands in reasoning_content (--reasoning-format deepseek),
# effort high (template default), budget 16384 as runaway ceiling.
# -------------------------------------------
"k2-horizon-36b":
  name: "K2-Horizon MoVA 36B"
  description: "K2-Horizon-MoVA-36B-A4B Q3_K_M. 36B MoE (100 experts, 8 ativos) + MoVA (64 value-experts, top-4) no caminho de V. k2-horizon arch. Reasoning model (thinking em reasoning_content). Text-only."
  cmd: |
    ${ik2_llama_server} --port ${PORT}
    --model ${models_dir}/k2-horizon-36b/K2-Horizon-MoVA-36B-A4B-Q3_K_M.gguf
    --chat-template-file ${templates_dir}/k2-horizon-chat-template.jinja
    -ngl 99
    --override-tensor "ffn_gate_exps=CPU,ffn_down_exps=CPU,ffn_up_exps=CPU,tok_embd=CPU"
    --no-kv-offload
    --ctx-size 131072
    --temp 1.0
    --top-p 0.95
    --reasoning on
    --reasoning-format deepseek
    --chat-template-kwargs '{"reasoning_effort":"high"}'
    --jinja
    --parallel 1
    --parallel-tool-calls
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --flash-attn auto
    --ubatch-size 256
    --reasoning-budget 16384
    --reasoning-budget-message "Now answer directly."
    --metrics
  env:
    - "GGML_CUDA_ENABLE_UNIFIED_MEMORY=1"
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.95
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
  ttl: 1200
  health_check_timeout: 900
  capabilities:
    in:
      - 'text'
    out:
      - 'text'
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~17 GB (Q3_K_M)"
    context: "1K-131K (modelo suporta 512K nativo; teto da frota; KV q4_0 6.4GB em RAM)"
    vram_usage: "~3.3GB VRAM + ~16GB RAM pinned (medido @8K no R1; 131K muda só o KV em RAM)"
    source: "abenzerps/K2-Horizon-MoVA-36B-A4B-GGUF (SHA256 662610e0)"
    kv_cache: "q4_0 + attn_rot (head_dim 128)"
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: k2-horizon
    parameters: 36000000000
    context_length: 524288
    quantization: Q3_K_M
    note: "ROUND 2 — config da casa. ATENÇÃO: 131K consome ~28GB de RAM (pinned 16GB + KV 6.4GB + sistema) — feche apps pesados; fallback seguro é ctx 65536 (~3.2GB de KV). Backend: ik2_llama_server (fork kassane, patch vocab cf03d82). R1 mediu 16.3 tok/s decode / 48.8 tok/s prefill @8K ctx 8192. Template abenzerps (IFM embutida pressupõe parser k2_horizon do fork MBZUAI — inexistente aqui). Snake test R1: 180 linhas compilando (curses/score/aceleração)."