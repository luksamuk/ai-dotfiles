"k2-horizon-36b":
  name: "K2-Horizon MoVA 36B"
  description: "IFM K2-Horizon-MoVA-36B-A4B (linhagem LLM360/MBZUAI, NAO Kimi K2) em APEX-Mini 14.74GB. MoE 36B (100 experts top-8) + MoVA (value-experts no caminho de V). Arch k2-horizon — ik-only (cafe não tem suporte). Reasoning model, effort high, budget 16384."
  cmd: |
    ${ik_llama_server} --port ${PORT}
    --model ${models_dir}/k2-horizon-36b/K2-Horizon-MoVA-36B-A4B-APEX-Mini.gguf
    -ngl 99
    --override-tensor "ffn_gate_exps=CPU,ffn_down_exps=CPU,ffn_up_exps=CPU,tok_embd=CPU"
    --no-kv-offload
    --ctx-size 131072
    --temp 0.7
    --top-p 0.95
    --reasoning on
    --reasoning-format deepseek
    --chat-template-file ${templates_dir}/k2-horizon-chat-template.jinja
    --jinja
    --parallel 1
    --parallel-tool-calls
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --flash-attn auto
    --ubatch-size 256
    --reasoning-budget 16384
    --reasoning-budget-message "Now answer directly."
    --metrics
  env:
    - "GGML_CUDA_ENABLE_UNIFIED_MEMORY=1"
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.95
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
  ttl: 1200
  health_check_timeout: 900
  capabilities:
    in:
      - 'text'
    out:
      - 'text'
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~14.7 GB (APEX-Mini)"
    context: 131072
    vram_usage: "~5.0 GB VRAM + ~14 GB RAM pinned"
    source: "VladHong/K2-Horizon-MoVA-36B-A4B-APEX-Mini-GGUF (SHA256 A0B4FEBE...C74D233C4)"
    kv_cache: "q4_0/q4_0"
    features:
      completion: true
      tools: true
      thinking: true
    note: "Reativado 05/10: Q3_K_M abenzerps (17GB) -> APEX-Mini VladHong (imatrix K2-shaped: Q3_K edges, IQ2_S middle, shared/attn precisos). Backend: kassane fork -> ik upstream (18 commits K2 opt: #2466 tools grammar, #2479, #2490, #2496, #2504). Hadamard K/V REJEITADO (glitches determinísticos no smoke; re-testar quando baseline sadio). Manual mapping (--fit FAIL nesta arch): ffn_gate/down/up_exps + tok_embd CPU pinned; MoVA + output na GPU. KV q4_0 ~49KB/token. UMA=OOM insurance ONLY — como path primário roda 8-10x mais lento em MoE. Medido 05/10: decode 17.5 t/s @8K sem desktop / 15.9 com; user re-registro: 92% VRAM + 74% RAM com browser. VENENOS: NO_PINNED quebra sampling (fatal, llama-sampling.cpp:745), override attn_v_exps=CUDA0 = 0 ganho + fatal (MoVA já residente GPU no baseline), UMA primário lento. Samplers 0.7/0.95 (model-card temp 1.0 quebrou leitura agentic em Sep). Reasoning budget 16384 (vendor pede effort high, 32K+ queima wall clock). Quirk tool_choice auto: pode planejar calls em texto e não emitir <ifm|tool_calls> (re-run ou required resolve). Tool parsing: parser PEG dedicado no ik (COMMON_CHAT_FORMAT_PEG_K2_HORIZON) — validado E2E 4/4 calls 05/10. PR ggml-org/llama.cpp#29535 (MoVA no mainline) em revisão — quando mergear, café herda; tracker monitorando."