# IK-ONLY: cafe-llama.cpp NÃO tem arch k2-horizon (sem suporte no horizonte —
#   nem arch, nem port em andamento). Handle limpo (sem sufixo: não há coexistência).
# Mudanças vs fragment antigo (16/09):
#   - Quant: Q3_K_M abenzerps (17GB) -> APEX-Mini VladHong (14.74GB, SHA256
#     A0B4FEBE2745AF83434B99672288C7B20E7BC47F950ACDB5DC250E7C74D233C4) — perfil
#     K2-shaped (Q3_K edges, IQ2_S middle, shared/attn precisos), imatrix multilingual.
