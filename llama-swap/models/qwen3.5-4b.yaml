qwen3.5-4b:
  name: Qwen3.5 4B
  description: Qwen 3.5 4B with UD-Q4_K_XL quantization and ik_llama.cpp. Hadamard KV
    cache; Alibaba-recommended sampling per mode (thinking 1.0/0.95, instruct 0.7/0.8).
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf

    --fit

    --fit-margin 512

    --jinja

    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja

    --parallel 1

    --parallel-tool-calls

    --ctx-size ${small_model_max_ctx}

    --temp 1.0

    --top-p 0.95

    --top-k 20

    --min-p 0

    --repeat-penalty 1.0

    --presence-penalty 1.5

    --reasoning on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --no-graph-reuse

    --ctx-checkpoints 0

    --ctx-checkpoints-interval 0

    --batch-size 512

    --ubatch-size 128

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~2.8 GB (UD-Q4_K_XL)
    context: 131072
    vram_usage: ~4.5 GB VRAM
    source: unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)
    kv_cache: q4_0/q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4210000000
    context_length: 262144
    embedding_length: 2560
    quantization: UD-Q4_K_XL
    note: 'vram detalhe: ~4.5 GB VRAM | model 2.8GB UD-Q4_K_XL + q8_0/q4_0 hadamard
      cache + compute ik_llama.cpp with hadamard KV cache + --fit for dynamic context.
      Sampling = Alibaba card (thinking 1.0/0.95/pres 1.5; instruct 0.7/0.8/pres
      1.5). repeat_penalty DESATIVADO (1.0, anti-loop oficial = presence_penalty).
      Config errada Jul-out 2026 (temp 0.7+rep 1.05 geravam loop no thinking)
      corrigida 07/10; runs anteriores removidas (estaca zero). Uses
      qwen-fixed-chat-template.jinja for tool-call instructions. Formerly
      qwen3.5-4b-mtp, consolidated Jul 2026.'
