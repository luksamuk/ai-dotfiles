groot-19b-a3b-fast:
  name: Groot 19B A3B (fast)
  description: 'GrootTeam''s efficient reasoning MoE on the faster ik_llama.cpp lane. 19B total with 3B active, built from
    Qwen3.6-35B-A3B, multimodal with full 262K context and parallel tool calling. Same model as Groot 19B A3B. Handles: thinking
    on by default.'
  tags:
  - vis
  - think
  - tools
  cmd: ${ik_llama_server} --port ${PORT} --model ${models_dir}/groot-19b-a3b/groot-19b-a3b-261023-Q4_K_M.gguf --mmproj ${models_dir}/groot-19b-a3b/mmproj-Groot-19B-A3B-261023-BF16.gguf
    --no-mmproj-offload --no-graph-reuse -ngl 99 --n-cpu-moe 34 --ctx-size ${small_model_max_ctx} --reasoning on --jinja --parallel 1 --parallel-tool-calls
    --cache-type-k q4_0 --cache-type-v q4_0 --k-cache-hadamard --v-cache-hadamard --flash-attn auto --defer-experts --prefetch-experts
    -b 512 -ub 128 --temp 1.0 --top-k 20 --top-p 0.95 --spec-type mtp:n_max=1,p_min=0.0 --metrics
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~11.66 GB (Q4_K_M) + 0.86 GB mmproj
    context: '131072 (262144 era o degra anterior; MTP exige o degrau menor — rollback do ctx devolve o 262K)'
    vram_usage: '~4.34 GB VRAM @131K c/ MTP (5.22 no pico @262K, que OOMa no prefill com draft) + ~14 GB RAM'
    source: GrootTeam/Groot-19B-A3B-261023-GGUF (Q4_K_M, 11657618560 bytes exatos) + mmproj-BF16 (902822016 bytes)
    kv_cache: q4_0/q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 19400000000
    active: 3000000000
    experts: 128 roteados + 1 shared; 8 ativos/token; expert_ff 512
    mtp: 1 layer (0.4B) — 4 tensors nextn no GGUF, 271.4 MiB skipped quando MTP nao pedido
    license: apache-2.0
    sampling_card: 'thinking: 1.0/0.95/top_k 20/presence 1.5 (matches setParamsByID) | non-thinking: 0.7/0.80/top_k 20/presence
      1.5 (matches) | precise coding: 0.6/0.95/top_k 20/presence 0.0 (nao wired — handle opcional futura)'
    embedding_length: 2048
    context_length: 262144
    quantization: Q4_K_M
    note: 'Smoke 27/10 (ik 804ee29c): escada de tuning medida — n-cpu-moe 40 @131K = 2.89GB/36.4 t/s; n-cpu-moe 32 @262K =
      5.53GB (90%, raspa)/38+ t/s; ESCOLHIDO n-cpu-moe 34 @262144 = pico 5.06GB (82%, folga ~1.1GB) e MESMOS 37.4-37.9 t/s
      (plain e think). 1.5x mais rapido que a lane cafe. TURBO A/B 08/11: NEGATIVO — tq2_t/tqk6 abortam no build do
      graph (ggml.c:13092 quantize_row_q sem implementao CPU pro TQ; iqk s tem TQ2_T pra mul_mat/dequantize). Kernels
      CUDA tq chegaram no merge 639e2012 + parser aberto via patch house 662bb434, MAS falta o plumbing CPU — NO GO
      at upstream fechar; KV segue q4_0+hadamard. MTP A/B 08/11: ENGATA — `--spec-type mtp:n_max=1,p_min=0.0`
      (receita da ornith-35b-fast) com ctx 131072: decode @52k cheio 25.5-26.7 t/s vs 20.5 baseline (+25-30%),
      prefill inalterado (215-245s, dentro do rudo), VRAM 4338 MiB @131K. @262K o MTP MORRE no meio do prefill
      (morte sbita no draft, reproduziu AT com a VRAM livre) — por isso o dono aceitou descer pra 131K; a escada
      de volta  rollback do ctx. Parallel tool calls NATIVO (-ptc): 4 get_weather/get_local_time simultaneos,
      JSON limpo, finish=tool_calls — com template embedded (sem --chat-template-file da casa). Dual-mode via enable_thinking,
      reasoning_content OK, 17*23=391. Mesmo peso e mmproj da lane cafe (um download serve as duas). Hadamard KV = TurboQuant
      ik (exclusivo do ik; o cafe roda KV q4_0 puro). GGUF em ~/.llama-models/groot-19b-a3b/. EDIT 04/nov: renomeada para
      -fast quando a lane normal (groot-19b-a3b) passou pro cafe via -ssd streaming + knobs (33-34 t/s medidos no probe de
      hoje); o bug de parser de tools do ik segue a ressalva viva desta variante (args unescape).'
