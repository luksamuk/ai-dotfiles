# GGUF deletado 24/10/2026 (sacrificio pro Gyro-S); re-baixavel de mudler/LFM2.5-24B-A2B-APEX-GGUF
lfm2.5-24b-a2b:
  unlisted: true
  name: LFM 2.5 24B A2B
  description: "LiquidAI flagship agentic MoE: 24B total / 2.45B active (64 experts,
    top-4 routing, 30 shortconv + 10 GQA layers). 131K context, 128K vocab, native
    reasoning. Agent-focused training (36T tokens); knowledge-heavy tasks need retrieval."
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT}

    --model ${models_dir}/lfm25-24b-a2b/LFM2.5-24B-A2B-APEX-I-Compact.gguf

    --jinja

    --parallel 1

    --ctx-size 131072

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -cmoe

    -ngl 99

    --temp 0.1

    --top-k 50

    --repeat-penalty 1.05

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.1
        top_k: 50
        repetition_penalty: 1.05
  ttl: 0
  health_check_timeout: 600
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~10.4 GB (APEX I-Compact)
    context: 131072
    vram_usage: ~5-6 GB VRAM + ~13.7 GB RAM (est. -cmoe)
    source: mudler/LFM2.5-24B-A2B-APEX-GGUF (APEX I-Compact; oficiais usam alias d1)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: lfm2moe
    parameters: 24000000000
    active: 2000000000
    embedding_length: 2048
    context_length: 131072
    quantization: APEX I-Compact
    note: 'MoE 64 experts +4 usados/token, 2 dense-lead blocks (header do GGUF cravado).
      Reasoning NATIVO (template preserve_thinking — SEM toggle enable_thinking, sempre
      pensa; SEM handle :think de decreto do user 13/out: a variante é desnecessária
      no always-think). ctx 131072
      NO cmd (decreto user 13/out: 131K ou morte; o KV q4_0 = +0.7 GB VRAM: cabe). -cmoe = o offload exclusivo do cafe (experts RAM page-cache evictável,
      receita validada do laguna 34.6 t/s @131K). Estimativa de decode: 25-35 t/s
      (A2B < A3B do laguna). GGUF em ~/.llama-models/lfm25-24b-a2b/.'
