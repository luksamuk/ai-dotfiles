# -------------------------------------------
# OCCAMY-1.0 V2.1 ABLITERATED (IsValorum MiniPlus V2.1)
# Base: Accio-Lab/Occamy-1.0 (agentic/co-work especializado, visão nativa).
# Abliterated direcional (KL 0.0076 — NÃO é Heretic TPE). Quant MiniPlus
# V2.1 (14.66 GB): routers F32, output Q6_K, shared expert Q5_K.
# MTP EMBUTIDO no GGUF (o Occamy sempre teve nextn).
# mmproj Q8 (614 MB) — visão preservada.
# V2 vs V2.1: V2.1 = streaming de RAM sem AVX2 stalls (edge Q3_K linear).
# -------------------------------------------
"occamy-v2.1-abliterated":
  name: "Occamy 1.0 Abliterated (V2.1)"
  description: "Assistente agentic sem censura, com visão e especialização em trabalho colaborativo. 262K de contexto, cache Turbo KV e speculative decoding via MTP nativo. Versão abliterated direcional da quant MiniPlus V2.1."
  cmd: |
    env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}
    --model ${models_dir}/occamy-v2.1-abliterated/Occamy-1.0.APEX-I-MiniPlus-V2.1-Abliterated.gguf
    --mmproj ${models_dir}/occamy-v2.1-abliterated/mmproj-Q8_0.gguf
    --ctx-size 262144
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --cache-type-k turbo4
    --cache-type-v turbo4
    --flash-attn on
    -hmoe
    -ngl 99
    -b 512
    -ub 128
    --temp ${code_temp}
    --top-p ${code_top_p}
    --top-k ${code_top_k}
    --min-p ${code_min_p}
    --repeat-penalty ${code_repeat_penalty}
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: "~14.66 GB (APEX-I-MiniPlus V2.1, abliterated) + 614 MB mmproj Q8"
    context: "262K nativo"
    vram_usage: "~5.1 GB VRAM (turbo4 KV) + ~15 GB pinned RAM (hmoe)"
    source: "IsValorum/Occamy-1.0-APEX-I-MiniPlus-V2.1-Abliterated-GGUF (base Accio-Lab/Occamy-1.0)"
    kv_cache: "turbo4 (WHT-rotated, FA-fused)"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34660000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-MiniPlus V2.1 (abliterated)
    note: "Sep 24: candidato. V2.1 = streaming RAM sem AVX2 stalls. Abliterated direcional (KL 0.0076)."
