lfm3-audio-2b-pollard:
  name: LFM3 Audio 2B Pollard
  description: "Audio 2B da LiquidAI quantizado Pollard (IQ ladder, imatrix +
    tool-call retention medida). Rung Q6_K = recomendado do card: KLD 0.0043 vs
    f16, top-1 97.6%, tool-ready 98.2% (CI 94-100, verified gate). Libera
    ~0.4 GB VRAM vs Q8_0 p/ coexistencia no fleet. Alternativa de menor
    pegada: IQ4_XS (1.07 GB, retention 100%, CI 93-108)."
  tags: [tools, audio]
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /health
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/lfm3-audio-2b-pollard/LFM3-Audio-2B-Pollard-IQ4_XS.gguf

    --mmproj ${models_dir}/lfm3-audio-2b/mmproj-F16.gguf

    --ctx-size 32768

    --jinja

    --parallel 1

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -ngl 99

    -b 512

    -ub 128

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - audio
    out:
    - text
    tools: true
    reranker: false
    context: 32768
  metadata:
    size: ~1.07 GB (IQ4_XS Pollard) + 0.57 GB mmproj-F16 (audio encoder,
      compartilhado com a lane lfm3-audio-2b)
    context: 32768
    vram_usage: "~3.9 GB VRAM pico @32K estimado (KV q4_0)"
    source: PollardWeights/LFM3-Audio-2B-Pollard (IQ4_XS) + mmproj-F16 oficial
      LiquidAI (570846400 bytes, mesmo arquivo da lane lfm3-audio-2b)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: true
      image: false
    architecture: lfm3
    parameters: 2200000000
    embedding_length: 2048
    context_length: 32768
    quantization: IQ4_XS
    note: 'Smoke 27/10 (llama.cpp b3282-19ff817fb, merges #31252/#31257 do dia):
      ASR impecável — voz real PT de 2021 (45s ogg convertido wav 16kHz mono)
      transcrita com fidelidade, 2.2s / 77 t/s. Music QA: responde estilo/
      instrumentos (funk pro theme 8-bit — o Omni julgou melhor: house). NAO
      THINKING (A/B: reasoning 0 nas 3 condicoes — o card fala "reason before
      answering" pro TEXT path, mas o llama.cpp server nao expõe toggle e o
      kwarg enable_thinking nao muda nada). ASR via system prompt "Perform ASR."
      (idioma auto). Fala-SAIDA: via llama-tts CLI (--tts-lang/--tts-voice);
      rota chat do server ainda sem receita de speech-out; /v1/realtime (WebSocket
      voice, incl. tool calls) oficial upstream desde llama.cpp v0.8.0/b11960+
      (card GGUF 27/10/26); llama-swap ainda não proxeia a rota (issue pendente).
      Audio sampling params do card original
      embutidos no GGUF. Quirk de idioma da familia: respondendo matematica
      pura em italiano a pergunta PT; ASR e QA audio ficam no idioma certo.
      VOZ PT = SOTAQUE INGLES — VEREDICTO FECHADO 27/10: e o CHECKPOINT, nao
      a stack. Testado (a) instrucao de idioma no user turn (receita oficial da
      doc Liquid), (b) patch set_lang/codec_language ate o gen (server-realtime
      do fork), (c) rota /tts com lang pt — todos sem efeito audivel. A demo
      OFICIAL deles (hugging-apps/lfm3-audio-2b, transformers de referencia)
      produz o mesmo: texto PT lido com voz EN. NAO re-investigar. GGUF em
      ~/.llama-models/lfm3-audio-2b/.'
    pollard_note: 'Pollard build (repo 29/10/26): pesos IGUAIS ao f16, bits
      alocados por sensibilidade medida por camada, imatrix + pollard-verify
      gate. Rung Q6_K: PPL 3.4089, KLD 0.0043, top-1 97.6%, tool-ready 98.2%
      (CI 94-100). ATIVO: IQ4_XS (29/10, rung menor; A/B de voz do dono decide
      vs Q6_K — card: IQ4_XS top-1 93.2%, KLD 0.0437, tool-ready 100%).
      Q6_K segue NO DISCO (rollback instantaneo, uma linha no fragment).
      O repo Pollard NAO inclui mmproj: este lane REUSA o mmproj-F16
      oficial da lane lfm3-audio-2b. Contexto 32K mantido = limite de
      arquitetura do card, nao estendido. Ganhos esperados: ~0.4 GB VRAM
      de coexistencia no fleet + cold-start menor; ganho de decode marginal
      (2B ja offloada integral nos 6 GB). Baixar peso (huggingface-cli APOSENTADO,
      o CLI atual e hf):
      hf download PollardWeights/LFM3-Audio-2B-Pollard
      --include LFM3-Audio-2B-Pollard-Q6_K.gguf --local-dir
      ~/.llama-models/lfm3-audio-2b-pollard/'