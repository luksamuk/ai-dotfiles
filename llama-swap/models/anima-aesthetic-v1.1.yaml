anima-aesthetic-v1.1:
  name: Anima Aesthetic v1.1
  description: "Anima Aesthetic v1.1 — 2B text-to-image anime/illustration da CircleStone Labs x Comfy Org, via sd-server (sd.cpp). Uncensored por default (tier Unbound); safety tags booru (safe/sensitive/nsfw/explicit) dirigem em vez de bloquear. Prompt estilo danbooru em ingles. Fine-tune de consistencia; o melhor default art style da familia."
  tags:
  - image
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /sdcpp/v1/capabilities
  cmd: '${sd_server}
    --diffusion-model ${models_dir}/anima/aesthetic-v1.1/anima-aesthetic-v1.1.safetensors
    --llm ${models_dir}/anima/common/te/Qwen3-0.6B-Base.Q8_0.gguf
    --vae ${models_dir}/anima/common/vae/qwen_image_vae.safetensors
    --offload-to-cpu
    --listen-port ${PORT} --listen-ip 127.0.0.1
    '
  cmdStop: pkill -f 'sd-server.*anima-aesthetic-v1.1.safetensors'
  health_check_timeout: 300
  ttl: 1200
  capabilities:
    in:
    - text
    out:
    - image
    tools: false
    reranker: false
    context: 0
  metadata:
    size: 4.18 GB DiT (BF16) + 0.64 GB TE (Qwen3-0.6B Q8_0) + 0.25 GB VAE qwen_image — TE/VAE compartilhados
    context: 0
    vram_usage: ~5.1 GB residente (DiT+TE+VAE; --offload-to-cpu absorve o pico na 6GB)
    source: circlestone-labs/Anima (HF split_files) — sem GGUF upstream para o aesthetic
    kv_cache: n/a
    features:
      completion: false
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      tts: false
      image: true
    architecture: anima
    parameters: 2000000000
    context_length: 0
    embedding_length: 0
    quantization: bf16
    note: >-
      40 steps CFG 3 (o criador: aesthetic tolera CFG 3 e frequentemente fica melhor). Sampler er_sde. Uncensored tier Unbound. Instalado 30/10/2026.
    caveats:
      - '40 steps = mais lento que o turbo (usar para take final, nao para iterar)'
