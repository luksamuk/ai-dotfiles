neohorse-1-4b:
  name: NeoHorse 1 4B
  description: NeoHorse community 4B model. 131K context with --fit.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/neohorse-1-4b/NeoHorse-1-4B-Q4_K_M.gguf

    --fit

    --fit-margin 512

    --jinja

    --parallel 1

    --parallel-tool-calls

    --ctx-size ${small_model_max_ctx}

    --temp 1.0

    --top-p 0.95

    --top-k 20

    --min-p 0

    --presence-penalty 1.5

    --repeat-penalty 1.0

    --reasoning on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --no-graph-reuse

    --ctx-checkpoints 0

    --ctx-checkpoints-interval 0

    --batch-size 512

    --ubatch-size 128

    --metrics

    '
  filters:
    stripParams: temperature, top_p, presence_penalty
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 0.0
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~2.71 GB (Q4_K_M)
    context: 131072
    vram_usage: ~4.4 GB VRAM
    source: TokenRhythm/NeoHorse-1-4B-GGUF (Q4_K_M oficial)
    kv_cache: q4_0/q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4210000000
    context_length: 262144
    embedding_length: 2560
    quantization: Q4_K_M
    note: 'vram detalhe: ~4.4 GB (model 2.7GB + q4_0 hadamard cache + compute) | model
      2.7GB Q4_K_M + q4_0 hadamard cache + compute Copy-YAML do qwen3.5-4b (18/09).
      Samplers do card TokenRhythm (protocolo SGLang: temp 1.0/top_p 0.95/presence
      1.5 thinking; instruct 0.7/0.80/presence 1.5). SEM tensors nextn (o repack stripou
      o MTP do base — o base mantém, experimento MTP separado). Comparar na régua
      155 vs qwen3.5-4b (66/75 histórico). Deploy: pending smoke (fila empero em curso
      18/09).'
