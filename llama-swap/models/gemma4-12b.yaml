# Modelo: huihui-ai/Huihui-gemma-4-12B-it-qat-q4_0-unquantized-abliterated (Abliterix)
#   — abliteração em pesos: sem recusa mesmo sem system prompt (testado 30/08;
#     Heretic culturerevolt IQ4_XS recusava user-only, ficou em _disabled/)
# Q4_K 7.38GB (Huihui sobre base QAT q4_0 unquantized) + mmproj bf16 (175MB)
