# -------------------------------------------
"gemma4-12b":
  name: "Gemma 4 12B Abliterated"
  description: "Gemma 4 12B Q4_K abliterated (Huihui/Abliterix) — BeeLlama.cpp v0.4.4 com KVarN kvarn4. Multimodal unificado (texto+áudio+imagem), sem recusas em nível de pesos."
  cmd: |
    ${bee_server} --port ${PORT}
    --model ${models_dir}/gemma-4-12b/huihui-gemma-4-12B-it-abliterated-Q4_K.gguf
    --mmproj ${models_dir}/gemma-4-12b/huihui-gemma-4-12B-mmproj-bf16.gguf
    --fit on
    --fit-target 768
    --ctx-size 131072
    --jinja
    --reasoning on
    --cache-type-k kvarn4
    --cache-type-v kvarn4
    --flash-attn on
    --min-p 0.01
    --repeat-penalty 1.05
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 60
  metadata:
    size: "~7.4 GB (Q4_K sobre base QAT) + mmproj bf16 175MB"
    context: "128K (--fit on, target 768; áudio exige ctx menor)"
    vram_usage: "~7.6GB com kvarn4"
    source: "huihui-ai/Huihui-gemma-4-12B-it-qat-q4_0-unquantized-abliterated-GGUF (Q4_K)"
    kv_cache: "kvarn4 (PPL ~ fp16 a ~4 bits)"
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: true
      image: true
    architecture: gemma4
    parameters: 12000000000
    context_length: 131072
    quantization: Q4_K
    abliterated: true
    method: "Abliterix (Huihui) — refusal behavior removido em pesos"
    note: "Sem recusa user-only (validado 30/08: erotica explicita sem system). tools=false: validar antes de habilitar. ctx 131072 proibido p/ áudio (crash mtmd) — se usar áudio, rebaixar ctx. KVarN so em Qwen3.6/Gemma 4. Alternativa testada e rejeitada: culturerevolt heretic IQ4_XS (recusa sem system)."