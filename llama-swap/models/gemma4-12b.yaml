# -------------------------------------------
# GEMMA-4-12B - Bee BACKEND (KVarN KV cache)
# BeeLlama.cpp v0.4.4 (upstream 84e908c6) — KVarN target KV-cache compression
# Modelo: culturerevolt/gemma-4-12b-heretic-abliterated (Heretic abliteration)
#   — norm-preserving directional ablation, sem recusas categóricas
# IQ4_XS (6.64GB, imatrix próprio) + mmproj F16 (175MB, par validado do repo)
# KVarN suportado APENAS em Qwen3.6 e Gemma 4 (fork surface intencional)
# Multimodal unificado: texto + imagem (+áudio via gemma4a preprocessor)
# BUG CONHECIDO (2026-08-29, bisect confirmado): `--timeout 0` QUEBRA requests
#   de áudio (broken pipe) — manter ausente. ctx 131072 segue proibido p/ audio.
#   reasoning_effort:none NAO desliga thinking no Bee — cliente deve mandar
#   chat_template_kwargs.enable_thinking=false (variante default cobre isso).
# -------------------------------------------
"gemma4-12b":
  name: "Gemma 4 12B Heretic"
  description: "Gemma 4 12B IQ4_XS abliterated (Heretic) — BeeLlama.cpp v0.4.4 com KVarN kvarn4. Multimodal unificado (texto+áudio+imagem), sem recusas."
  cmd: |
    ${bee_server} --port ${PORT}
    --model ${models_dir}/gemma-4-12b/gemma-4-12b-heretic-IQ4_XS.gguf
    --mmproj ${models_dir}/gemma-4-12b/gemma-4-12b-heretic-mmproj-f16.gguf
    --fit on
    --fit-target 768
    --ctx-size 131072
    --jinja
    --reasoning on
    --cache-type-k kvarn4
    --cache-type-v kvarn4
    --flash-attn on
    --min-p 0.01
    --repeat-penalty 1.05
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 60
  metadata:
    size: "~6.6 GB (IQ4_XS) + mmproj F16 175MB"
    context: "128K (--fit on, target 768; áudio exige ctx menor)"
    vram_usage: "~6.8GB com kvarn4"
    source: "culturerevolt/gemma-4-12b-heretic-abliterated-GGUF (IQ4_XS imatrix)"
    kv_cache: "kvarn4 (PPL ~ fp16 a ~4 bits)"
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: true
      image: true
    architecture: gemma4
    parameters: 12000000000
    context_length: 131072
    quantization: IQ4_XS
    abliterated: true
    note: "Heretic abliteration (sem recusas categóricas). tools=false: validar antes de habilitar. ctx 131072 proibido p/ áudio (crash mtmd) — se usar áudio, rebaixar ctx. KVarN so em Qwen3.6/Gemma 4."