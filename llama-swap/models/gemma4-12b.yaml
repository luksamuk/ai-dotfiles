# -------------------------------------------
# GEMMA-4-12B - Bee BACKEND (KVarN KV cache)
# BeeLlama.cpp v0.4.4 (upstream 84e908c6) — KVarN target KV-cache compression
# Modelo: google/gemma-4-12b-it (Q4_0 original) + mmproj F16 unificado
#   — par original do bee (REVERT 31/08: experimentos abliterated Heretic e
#     Huihui rejeitados em produção; histórico nos commits 2f2f4e6/9400a64)
# Q4_0 dense 12B (~6.7GB) + mmproj F16 unificado (vision+audio, 168MB)
# KVarN suportado APENAS em Qwen3.6 e Gemma 4 (fork surface intencional)
# Multimodal unificado: texto + imagem (+áudio via gemma4a preprocessor)
# BUG CONHECIDO (2026-08-29, bisect confirmado): `--timeout 0` QUEBRA requests
#   de áudio (broken pipe) — manter ausente. ctx 131072 segue proibido p/ audio.
#   reasoning_effort:none NAO desliga thinking no Bee — cliente deve mandar
#   chat_template_kwargs.enable_thinking=false (setParamsByID cobre isso).
# -------------------------------------------
"gemma4-12b":
  name: "Gemma 4 12B"
  description: "Gemma 4 12B Q4_0 — BeeLlama.cpp v0.4.4 com KVarN kvarn4. Multimodal unificado (texto+áudio+imagem)."
  cmd: |
    ${bee_server} --port ${PORT}
    --model ${models_dir}/gemma-4-12b/gemma-4-12b-it-Q4_0.gguf
    --mmproj ${models_dir}/gemma-4-12b/mmproj-F16.gguf
    --fit on
    --fit-target 768
    --ctx-size 8192
    --jinja
    --reasoning on
    --cache-type-k kvarn4
    --cache-type-v kvarn4
    --flash-attn on
    --min-p 0.01
    --repeat-penalty 1.05
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 60
  metadata:
    health_check_timeout: 1800   # read_timeout do testchat = 1830s (audio análise do Gemma é lenta)
    size: ~6.7 GB (Q4_0) + mmproj F16 168MB
    context: 8K (--fit on, target 768)
    vram_usage: "~6.9GB com kvarn4"
    source: "google/gemma-4-12b-it (Q4_0 + mmproj F16)"
    kv_cache: "kvarn4 (PPL ~ fp16 a ~4 bits)"
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: true
      image: true
    architecture: gemma4
    parameters: 12000000000
    context_length: 8192
    quantization: Q4_0
    note: "REVERT 31/08: modelo original Google Q4_0 (par validado do bee). Experimentos abliterated (Heretic IQ4_XS, Huihui Q4_K) rejeitados em produção — vision describe instável no fit do Bee. tools=false: validar antes de habilitar. ctx 131072 proibido p/ áudio (crash mtmd). KVarN so em Qwen3.6/Gemma 4. GGUFs experimentais ainda em ~/.llama-models/gemma-4-12b/ (limpar quando confirmado)."