twil-lm3-pro:
  name: TwIL-LM3-Pro
  description: webAI's 3.66B dense formal-logic reasoning specialist (on Granite 4.2-3B).
    131K context.
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/twil-lm3-pro/TwIL-LM3-Pro-Q6_K.gguf

    --fit on

    --fit-target ${vram_margin}

    --fit-ctx 131072

    --ctx-size 131072

    --parallel 1

    --jinja

    --temp ${default_temp}

    --top-p ${default_top_p}

    --top-k ${default_top_k}

    --min-p ${default_min_p}

    --repeat-penalty 1.0

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 1.0
        top_p: 0.95
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.0
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~2.80 GB (Q6_K)
    context: 131072
    vram_usage: ~4.5 GB VRAM
    source: webAI-Official/TwIL-LM3-Pro (Q6_K)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: granite
    parameters: 3659737600
    context_length: 131072
    embedding_length: 2560
    quantization: Q6_K
    note: 'vram detalhe: ~4.5GB VRAM @131K no 6GB (modelo 2.80GB + KV q4_0 + compute);
      fit derruba ctx se apertar Track A greedy temp 0 (inject no :think); card pede
      max_tokens >=2048 senao trunca think. Track B avaliado SEM thinking (empata
      com base Granite no macro 10 datasets: 0.790 vs 0.794). BBH-logic 95.4, MATH-500
      74.7, MuSR 64.1. Tool calling: probe local 01/10 OK (tool_calls + JSON valido,
      heranca Granite) apesar do card nao reivindicar. Quant A/B 01/10: Q6_K 28 t/s
      vs Q8_0 21 t/s no FOL hard (+33%), entailment probe OK nos dois -> Q6_K em prod,
      Q8_0 removido do disco (re-download via hf). Spec decoding: MTP impossivel (GGUF
      sem nextn, familia Granite 4.x MTP-free, verificado nos configs 4.0/4.2); ngram-mod/ngram-simple
      +5% apenas (think formal-logic sem repeticao n-gram suficiente). Deploy 30/09/2026.'
