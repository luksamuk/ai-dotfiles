lfm2.5-2.6b:
  name: LFM 2.5 2.6B
  description: Liquid AI on-device agentic model. 2.6B dense hybrid with 128K context.
    Trained with agentic RL inside Hermes Agent. Best-in-class tool use for its size.
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/llama.cpp/build/bin ${llama_server} --port
    ${PORT}

    --model ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-QAD-Q4_0.gguf

    --fit on

    --fit-target ${vram_margin}

    # server: vanilla 0.6.0 (d81235049, 05/10) — build na mesma pasta que o cafe 0.74

    --fit-ctx 131072

    --ctx-size 131072

    --parallel 2

    --reasoning on

    --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja

    --temp 0.1

    --top-p 0.9

    --top-k 50

    --min-p 0.0

    --repeat-penalty 1.1

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    --jinja

    -md ${models_dir}/lfm2.5-2.6b/LFM2.5-2.6B-DSpark-Draft-v1-F16.gguf

    --spec-type draft-dspark

    --spec-draft-n-max 10

    --spec-draft-n-min 0

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.1
        top_p: 0.9
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.1
        top_p: 0.9
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~1.55 GB (QAD Q4_0)
    context: 131072
    vram_usage: ~3.9GB VRAM (model 1.55GB + q4_0 KV 131K + compute)
    source: LiquidAI/LFM2.5-2.6B-GGUF (QAD Q4_0)
    kv_cache: q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: lfm2
    parameters: 2690000000
    context_length: 131072
    embedding_length: 2048
    quantization: QAD Q4_0
    note: Dense hybrid (22 conv + 8 GQA). Reasoning model with 205 tag. Agentic RL
      trained inside Hermes Agent. 16 languages incl Portuguese. GGUF has no chat_template
      - uses lfm2.5-chat-template.jinja. Only 8/30 layers are attention (GQA), KV
      cache is tiny - q4_0 fits 131K full VRAM in 6GB. QAD (Quantization-Aware Distillation)
      recovers ~97% of BF16 quality vs native Q4_0. DSpark speculative decoding via
      F16 draft sidecar (633MB) — up to 2.27x speedup on-device, 57% latency reduction
      for function calling.
