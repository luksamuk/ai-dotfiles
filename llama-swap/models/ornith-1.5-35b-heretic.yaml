"ornith-1.5-35b-heretic":
  name: "Ornith 1.5 35B Heretic"
  description: "Heretic Tiel (SC117 + Sharp v22.5.0) OFICIAL 05/10 no cafe-llama.cpp 0.74 (-cmoe): decode 29.9-30.9 idle (~25 c/ desktop), RAM evictável ~5-6GB used, ctx 200K. Substitui o ik -fast (em _disabled/). Visão via mmproj BF16. APEX I-Compact 17.33GB."
  cmd: |
    env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}
    --model ${models_dir}/ornith-heretic/Ornith-1.5-35B-A3B-Heretic-MTP-APEX-I-Compact.gguf
    --mmproj ${models_dir}/ornith-heretic/mmproj-Ornith-1.5-35B-A3B-Heretic-MTP-BF16.gguf
    --no-mmproj-offload
    --ctx-size 200000
    --jinja
    --chat-template-file ${templates_dir}/sharp_chat_template.jinja
    --parallel 1
    --cache-type-k q4_0
    --cache-type-v q4_0
    --flash-attn on
    -cmoe
    -ngl 99
    -b 512
    -ub 128
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p ${code_min_p}
    --repeat-penalty ${code_repeat_penalty}
    --reasoning-budget 8192
    --spec-type draft-mtp
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 200000
  metadata:
    size: "~17.33 GB (APEX I-Compact heretic) + 0.9 GB mmproj BF16"
    context: "1K-200K (cap de degradação ~213K, parallel 1)"
    vram_usage: "MEDIDO 0.74 05/10: ~4.85GB VRAM + ~4.7GB RAM used no sistema (experts em page cache FILE-BACKED evictável via -cmoe) — -hmoe do 0.74 (GPU via PCIe) era MAIS LENTO: 17.6-24.3 t/s; decode -cmoe: 29.2-30.9 t/s"
    source: "SC117/Ornith-1.5-35B-A3B-Heretic-MTP-APEX-GGUF (I-Compact, sha 37f67861...e0e7)"
    kv_cache: "q4_0/q4_0"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: "APEX I-Compact"
    note: "0.74 05/10/2026: -hmoe (GPU computa experts via PCIe + moe-cache VRAM) perdeu p/ CPU compute em 6GB — A/B medido: cmoe 29.9 t/s avg vs hmoe auto 17.6 / reserve 21.0 / overlap 24.3; moe-cache NÃO engaja em 6GB (reserva 1024MB + KV 131K < pool min). -cmoe = experts em page cache FILE-BACKED (RSS server 2.3GB, evictável) = desktop-friendly. Esboço Oct 4: turbo4 + 262K nativo; turbo8 user-verbatim NUNCA funcionou (removida a linha custom TURBO8_0). Se RAM apertar, fica só a variante ik (131K)."
