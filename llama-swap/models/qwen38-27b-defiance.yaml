qwen38-27b-defiance:
  name: Qwen3.8 27B Defiance
  description: Qwen3.8 27B dense (qwen35, DeltaNet hybrid), iq4_xs. Uncensored repack Defiance; template embutido com modos por reasoning_effort.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/defiance/Qwen3.8-27B-Defiance-Uncensored-IQ4_XS.gguf

    -ngl 10

    -b 256

    -ub 256

    --ctx-size 130816

    --cache-type-k q8_0

    --cache-type-v q8_0

    -fa auto

    -ctx-ckpt 0

    --jinja

    --parallel 1

    --reasoning on

    --reasoning-budget 8192

    --temp 0.7

    --top-p 0.80

    --top-k 20

    --presence-penalty 1.5

    --metrics

    '
  filters:
    stripParams: temperature, top_p, presence_penalty
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.80
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
  ttl: 0
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 130816
  metadata:
    size: ~15.71 GB (IQ4_XS)
    context: 130816
    vram_usage: ~4.8-5.2 GB VRAM (medido ngl 10)
    source: ttindall/Qwen3.8-27B-Defiance-Uncensored-MTP-GGUF (sha256 d48cdb6e627b...f2f, validado)
    kv_cache: q8_0/q8_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 27000000000
    context_length: 262144
    embedding_length: 5120
    quantization: IQ4_XS
    efforts: [xhigh, medium, low, ultra, xomni, xdeeptree, xhyper, xsocrates, xlogic, xeinstein, xspoon, omni, deeptree, hyper, socrates, logic, einstein, spoon, holodeck, prompt, pkd, musk, joker, vader, quinn, joe, neo, curie, brainstorm, comedy, business, story, teacher, "007", coder, stark, matlock, house, help]
    default_effort: xhigh
    effort_note: "modos via reasoning_effort no corpo da requisicao (OpenAI-style); think default xhigh, instruct default medium; template embutida aplica solo"
    note: "Familia tinha aposentadoria em ago/26 (qw38, 1-bit, 'too slow') — re-entrada 25/10/2026 com MTP medido. Régua: baseline 3.2 t/s, com MTP 4.3 t/s (seed e prompt idênticos). Template EMBUTIDO do Defiance (40 modos via reasoning_effort) — NAO usar chat-template-file externo. Uncensored (pesos HauhauCS, sem recusas). Text-only: sem mmproj no repo. -ctx-ckpt 0: snapshots de estado do ik consomem VRAM por slot em ctx alto; medir antes de reabilitar. 131072 cheio nao cabe (faltam ~120MB no compute buffer)."