# -------------------------------------------
# QWEN3.8-27B GSQ-RCO - ISTA-DASLab NON-UNIFORM QUANT
# Dense 27B VLM, hybrid Gated DeltaNet + Gated Attention (64 layers: 48 lin + 16 attn).
# Native vision (mmproj BF16 931MB), 262K ctx native, 1M com YaRN.
#
# GSQ (Gumbel-Softmax Quantization, arXiv:2604.18556) + RCO (Riemannian
# Constrained Optimization, arXiv:2605.00649): busca gradiente de quant-type
# POR TENSOR sob budget exato de tamanho. Rung IQ2_S-mtp: 2.81 bpw efetivo,
# 866 tensors (allocation.txt auditavel). MTP head (blk.64, Q6_K, 15 tensors)
# embutido pro speculative decoding — pesos identicos ao IQ2_S base.
#
# REGUA PUBLICADA (IST-DASLab, vs BF16 e UD-Unsloth):
#   IQ2_S: AIME25 100.00 (empata BF16), GPQA-D 86.36, LCB v6 82.29,
#          zero-shot recovery 101.8% (ACIMA da base), wiki ppl 7.39.
#   vs UD-IQ2_S mesmo tamanho (8.4GB): +10 pts AIME, +8.6 GPQA, +4.6 LCB.
#   Tensors DeltaNet (ssm_*) preservados em BF16/F32 pela busca.
#
# Substitui a vaga do bonsai-27b (removido Sep 20) e o antigo qw38
# APEX-I-Nano (11.24GB, ~3-5 t/s) — 1.9GB menor com regua melhor publicada.
#
# Backend: ik_llama (--fit + --mlock + hadamard KV + MTP spec decode).
# Samplers (card oficial Qwen3.8):
#   Thinking: temp=1.0, top_p=0.95, top_k=20 | Instruct: temp=0.7, top_p=0.80, presence=1.5.
# Expectativa honesta: offload-bound (~5GB VRAM + ~6GB pinned RAM);
#   MTP n_max=1 e o tamanho menor devem colocar acima dos 3-5 t/s do APEX — medir.
# -------------------------------------------
"qwen3.8-27b-gsq":
  name: "Qwen3.8 27B GSQ-RCO"
  description: "ISTA-DASLab GSQ-RCO IQ2_S-mtp de Qwen/Qwen3.8-27B. Dense 27B DeltaNet VLM, non-uniform 2.81 bpw com MTP head embutido."
  cmd: |
    ${ik_llama_server} --port ${PORT}
    --model ${models_dir}/qwen3.8-27b-gsq/Qwen3.8-27B-GSQ-RCO-IQ2_S-mtp.gguf
    --mmproj ${models_dir}/qwen3.8-27b-gsq/mmproj-Qwen3.8-27B-BF16.gguf
    --no-mmproj-offload
    --fit
    --fit-margin 1536
    --mlock
    --ctx-size 98304
    --temp 0.7
    --top-p 0.80
    --top-k 20
    --min-p 0.0
    --repeat-penalty 1.0
    --presence-penalty 1.5
    --reasoning on
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --cache-type-k ${large_cache_k}
    --cache-type-v ${large_cache_v}
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --spec-type mtp:n_max=1,p_min=0.0
    --metrics
  filters:
    stripParams: "temperature, top_p, presence_penalty"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.80
        presence_penalty: 1.5
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        presence_penalty: 0.0
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 98304
  metadata:
    size: "~9.65 GB (IQ2_S-mtp) + 931 MB mmproj"
    context: "96K"
    vram_usage: "~4.6GB VRAM (medido) + ~5GB RAM offload (mlock)"
    source: "ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF (IQ2_S-mtp + mmproj BF16)"
    kv_cache: "q4_0 + hadamard (DeltaNet, 16/64 attn layers)"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 27000000000
    context_length: 98304
    embedding_length: 5120
    quantization: GSQ-RCO IQ2_S-mtp (2.81 bpw)
    note: "GSQ+RCO (ISTA-DASLab, arXiv:2604.18556 + 2605.00649): quant-type por tensor via busca gradiente sob budget. IQ2_S-mtp = IQ2_S + MTP head blk.64 (Q6_K) — AIME25 100.00 (empata BF16), recovery zero-shot 101.8%, wiki ppl 7.39. Allocation auditavel em tensor-allocation/ do repo (866 tensors, DeltaNet ssm_* preservado BF16/F32). Preenche a vaga do bonsai-27b (removido Sep 20) e do antigo qw38 APEX-I-Nano (11.24GB). REGUA MEDIDA Sep 20 (RTX 3050 6GB, ik_llama): teto fisico do dense 27B — 3.8-4.2 t/s decode warm, TTFT warm 2.3-3.0s, offload-bound (~5GB pesos na RAM via PCIe). Ajustes testados: fit-margin 2048->1024 + ctx 131K->96K = +36% (2.8->3.8 t/s); sem mmproj = +0.4 t/s de ruido (fit ja offloada o mmproj sozinho) — REVERTIDO, vision BF16 mantida. MTP n_max=1: +35-52% reportado, embutido no GGUF. Papel na frota: pesado ocasional de qualidade BF16-equivalente (thinking profundo/longas respostas); dia a dia rapido = MoE A3B (q36/q38). DeltaNet KV quase constante @ 96K."