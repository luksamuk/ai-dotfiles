groot-65b-a6b:
  name: Groot 65B A6B
  description: "EXPERIMENTO Dormammu (27/out): MoE 65B-A6B do GrootTeam (distill do
    Qwen3.8-Flash-Next) com tabela n-gram PLE de 51B params em host + experts roteados
    streamados do SSD no cafe. Espera-se lentidao; lane para medir tradeoffs, nao para
    producao."
  cmd: 'env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}

    --model ${models_dir}/groot-65b-a6b/groot-65b-a6b-261023.Q2_K.gguf

    --mmproj ${models_dir}/groot-65b-a6b/mmproj-Q8_0.gguf

    --ctx-size 65536

    --jinja

    --parallel 1

    --no-mmproj-offload

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn on

    -ssd

    -ngl 99

    -b 512

    -ub 128

    --temp 1.0

    --top-k 20

    --top-p 0.95

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 0.0
  ttl: 0
  health_check_timeout: 1200
  unlisted: true
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~52.46 GB (Q2_K) + 0.58 GB mmproj
    context: 65536
    vram_usage: "a medir no smoke — backbone ~2 GB na GPU + KV leve (12 sparse-attn layers) + PLE 25 GB em host (mmap, thrash esperado)"
    source: mradermacher/Groot-65B-A6B-261023-GGUF (Q2_K, 56335871168 bytes exatos)
      + mmproj-Q8_0 (616703296 bytes)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen4exp
    parameters: 65000000000
    active: 6000000000
    embedding_length: 2560
    context_length: 262144
    quantization: Q2_K
    note: 'EXPERIMENTO 27/out — BLOQUEADO no build atual do cafe (02dda80a9 + merges
      26/10): o expert streaming nao carrega o Groot-65B. Fatos medidos: (1) flag
      correta e -ssd (-ssd-streaming e parse invalido, "-ssd"+"-streaming"); (2)
      load com -ssd ABORTA em ggml-backend.cpp:383 get_usage(NULL) ("GGML_ASSERT(buffer)
      failed") ~50s no load, thread llama_row_pool no dump — repetido em 3 variantes
      (default ngram-ssd, --no-ngram-ssd, --ssd-streaming-cache-experts 8GB explicito)
      → bug do path -ssd com qwen4exp, nao interplay com PLE nem orcamento de cache;
      (3) sem -ssd, experts somam ~26 GB e -ngl 99 tenta CUDA direto ("unable to
      allocate CUDA0"); (4) -cmoe (experts RAM 26GB) > RAM disponivel da casa e
      Gyro-S (mesma familia, engine dedicado TQ1_0) ja fechou 97% RAM em 24/10 —
      nada do lado dos runtimes encaixa hoje. Descoberta util: cafe tem --ngram-ssd
      DEFAULT-ENABLED (PLE do qwen4 streama do SSD nativamente do fork — o thrash
      de PLE projetado NAO aplica enquanto o ngram-ssd funciona). GGUF Q2_K
      (mradermacher, 56335871168) + mmproj-Q8_0 (616703296) baixados e integros em
      ~/.llama-models/groot-65b-a6b/; re-teste quando o path
      -ssd do cafe (ou um patch local) aceitar o arch. GGUFs (Q2_K 56335871168 +
      mmproj-Q8_0 616703296) DELETADOS 27/out pelo dono — ~52.5 GB de volta ao disco;
      re-download de mradermacher/Groot-65B-A6B-261023-GGUF:
      hf download mradermacher/Groot-65B-A6B-261023-GGUF Groot-65B-A6B-261023.Q2_K.gguf
      --local-dir ~/.llama-models/groot-65b-a6b/ (+ mmproj-Q8_0.gguf). LANE UNLISTED
      ATE SEGUNDA ORDEM (dono, 27/out). Header do GGUF oficial
      GrootTeam declara tensor_count=1 (anomalo) — mradermacher parseia normal
      (tc=1256). ctx no fragmento segue 65536 para o promeiro teste que funcionar.'