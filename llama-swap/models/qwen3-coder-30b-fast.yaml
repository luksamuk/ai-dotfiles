qwen3-coder-30b-fast:
  name: Qwen 3 Coder 30B Fast
  description: Qwen's 30B-A3B MoE coding model on ik_llama.cpp — 2.6x prefill speed
    of the cafe build. 131K context, text-only.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/qwen3-coder-30b/Qwen3-Coder-30B-APEX-I-Compact.gguf

    --no-graph-reuse

    -ngl 99

    --n-cpu-moe 48

    --ctx-size 131072

    --jinja

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    --temp ${code_temp}

    --top-p ${code_top_p}

    --top-k ${code_top_k}

    --min-p ${code_min_p}

    --repeat-penalty ${code_repeat_penalty}

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        temperature: 0.7
        top_p: 0.8
        top_k: 20
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~13.8 GB (APEX I-Compact)
    context: 131072
    vram_usage: ~4.8 GB VRAM + ~13.9 GB RAM pinned
    source: mudler/Qwen3-Coder-30B-APEX-GGUF (I-Compact; base Qwen/Qwen3-Coder-30B-A3B-Instruct)
    kv_cache: q4_0/q4_0 + hadamard
    note: 'vram detalhe: MEDIDO 05/10 (zen fechado): 4.77GB VRAM + 13.9GB RAM pinada,
      decode 35.0-35.4 t/s (μ35.2), prefill 432 t/s (2.6x o cafe!), load 4.8s Deploy
      Oct 1 2026. Arch qwen3_moe: sem nextn (MTP N/A), sem mmproj (text-only), nao-thinking
      (Instruct puro; sem enable_thinking nos filters). APEX I-Compact = PPL do UD-Q4_K_XL
      com -16% tamanho (tabela mudler, DGX Spark). Manufacturer sampling: 0.7/0.8/20.
      ONYX de el4: nao existe pra esse modelo (catalogado Oct 1).'
    features:
      completion: true
      tools: true
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen3_moe
    parameters: 30500000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-Compact
