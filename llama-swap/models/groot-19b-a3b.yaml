groot-19b-a3b:
  name: Groot 19B A3B
  description: "GrootTeam's efficient reasoning MoE. 19B total with 3B active, built
    from Qwen3.6-35B-A3B, multimodal with 64K context on this lane. Targets agentic
    and tool-using tasks with concise outputs. Handles: plain answers directly;
    :think adds visible chain-of-thought."
  tags:
  - vis
  - think
  - tools
  cmd: env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT} --model ${models_dir}/groot-19b-a3b/groot-19b-a3b-261023-Q4_K_M.gguf
    --mmproj ${models_dir}/groot-19b-a3b/mmproj-Groot-19B-A3B-261023-BF16.gguf
    --no-mmproj-offload --jinja --parallel 1 --ctx-size 65536 --cache-type-k q4_0
    --cache-type-v q4_0 --flash-attn on -ssd --ssd-predict --ssd-io-threads 4
    --ssd-cache-mb 4096 -ngl 99 -b 512 -ub 128 --temp 1.0 --top-k 20 --top-p 0.95
    --metrics
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.5
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~11.66 GB (Q4_K_M) + 0.86 GB mmproj
    context: 65536
    vram_usage: ~4.7 GB VRAM + ~10 GB RAM
    source: GrootTeam/Groot-19B-A3B-261023-GGUF (Q4_K_M, 11657618560 bytes exatos)
      + mmproj-BF16 (902822016 bytes)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 19400000000
    active: 3000000000
    experts: "128 roteados + 1 shared; 8 ativos/token; expert_ff 512"
    mtp: "1 layer (0.4B) — 4 tensors nextn no GGUF, 271.4 MiB skipped quando MTP nao pedido"
    license: apache-2.0
    sampling_card: "thinking: 1.0/0.95/top_k 20/presence 1.5 (matches setParamsByID) | non-thinking: 0.7/0.80/top_k 20/presence 1.5 (matches) | precise coding: 0.6/0.95/top_k 20/presence 0.0 (nao wired — handle opcional futura)"
    quantization: Q4_K_M
    embedding_length: 2048
    context_length: 262144
    note: 'LANE NORMAL de 04/nov — cafe-llama.cpp via -ssd streaming + knobs vencedores
      da escada do proprio modelo (probe standalone 03/11: 8.2 frio / 14.6 quente defaults
      → 24-25 c/ predict → 31 c/ io-threads 4 → 33-34 c/ cache-mb 4096; essa aqui é
      a config E medida NESTE GGUF). -ssd carregou a familia no build d33bcfd7e
      (build 12256) — o crash de 27/out nao reproduz. TOOLS PROVADO 04/nov via rota
      do swap: 4/4 calls paralelos (2 tools x 2 cidades), JSON limpo,
      finish=tool_calls — tools true. Parallel tool calls do lado do cafe: por
      request param (parallel_tool_calls: true). MTP/spec NEGATIVO em IO-bound
      (2x medido) — nao habilitar. KV Hadamard (TurboQuant) e exclusivo do path ik
      (ver groot-19b-a3b-fast); aqui KV q4_0 puro. VRAM 4.5-4.9 GB probe 03/11; RSS
      ~10 GB = cache ssd 4 GiB residente + mmap. Historico da lane ik em _disabled→fast:
      aposentada 28/out pelo bug de re-serializacao do parser de tools do ik. Base
      pra lane do 65B: mesma familia de knobs.'
    caveats:
      - 'ctx 65536 no primeiro ciclo; nativo 262K/KV q4_0 ~10 full layers — subir com medicao'