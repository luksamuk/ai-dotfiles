# valor = Turbo KV turbo4 + -hmoe (mesma receita do qwen3.6-heretic-cafe),
# herdando o contexto 262K NATIVO na RTX 3050 6GB (~131K a mais que o ik).
# Herdando do cafe-orn15-ONYX: --parallel 1 + MTP @200K (draft-mtp: o cafe
# preserva o head nextn graft shisa do APEX, mas @262K + parallel 2 o draft KV não cabe).
# ARMADILHAS cafe (iguais às do irmão qwen36-heretic-cafe):
#   - NUNCA --pipeline-parallel com ctx >=131K (buffer DMA 48GB → OOM duplo)
#   - turbo4 limpo na hibrida; turbo2 CRASHA
#   - cafe NÃO tem: --parallel-tool-calls, --defer-experts, --prefetch-experts,
#     --k/v-cache-hadamard (hadamard é ik-only!), --fit-margin (usar --fit-target)
#   - env LD_LIBRARY_PATH OBRIGATORIA (RUNPATH morto)
# TEMPLATE: Sharp v22.5.0 (o GGUF heretic vem com template genérico — o
#   --chat-template-file sharp é OBRIGATORIO pro efeito Tiel).
