bonsai2-9b:
  name: Ternary Bonsai 9B (PTQ1_0 @131K, full-context)
  description: 'PrismML Bonsai-2 9B ternary (1.71-bit block-scale, Qwen3.5-base) — lane de contexto máximo: 131K sem drafter (~60-66 t/s). Multimodal (mmproj Q8_0). Thinking model. Exceção da frota: prioriza contextWindow sobre velocidade.'
  tags:
  - llm
  - thinking
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /health
  cmd: '${env.HOME}/git/bonsai-llama.cpp-prism/build/bin/llama-server

    --port ${PORT}

    -m ${models_dir}/bonsai2/Ternary-Bonsai-2-9B-PTQ1_0.gguf

    --mmproj ${models_dir}/bonsai2/Ternary-Bonsai-2-9B-mmproj-Q8_0.gguf --no-mmproj-offload

    -ngl 99 -c 131072 -fa on -ctk q8_0 -ctv q8_0

    --host 127.0.0.1 --jinja

    '
  cmdStop: pkill -f 'Bonsai-2-9B'
  health_check_timeout: 120
  ttl: 1800
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: 2.0 GB DiT (PTQ1_0, sem draft head) + 0.62 GB mmproj Q8_0
    context: 131072
    vram_usage: ~3.4-3.9 GB total (ngl 99 @131K, sem rs-cache do MTP)
    source: prism-ml/Ternary-Bonsai-2-9B-gguf (PTQ1_0 + mmproj Q8_0)
    kv_cache: q8_0
    features:
      completion: false
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 9000000000
    context_length: 131072
    embedding_length: 0
    quantization: PTQ1_0
    note: 'kv detalhe: q8_0 @131072 (262K nativo; PTQ1_0 puro não tem rs-cache — 131K cabe onde o MTP estoura). SÓ O FORK PrismML-Eng/llama.cpp branch prism carrega PTQ1_0 (GGML type 143 — vanilla e cafe rejeitam). DUPLO-DEPLOY 16/out (pedido do dono): bonsai2-9b = PTQ1_0 puro @131K SEM drafter (context first, 66.2 t/s medidos; PTQ1_0 sem rs-cache engole o 131K que o MTP OOMa) | bonsai2-9b:fast = PQ2_0-MTP draft 2 @64K (speed first, 83-90 t/s, draft acceptance 87.9%; copy-heavy 89.5). Sempre-thinking: sem handle :think (o modelo raciocina sempre; samplers oficiais Prism: temp 1.0/0.95/20/presence 1.0).'
    caveats:
    - Exige o fork Prism (PrismML-Eng/llama.cpp branch prism, build ~/git/bonsai-llama.cpp-prism)
    - 'Thinking model: reasoning longo'
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.0
