"qwen3.8-flash-next":
  name: Qwen 3.8 Flash-Next
  description: "Qwen3.8-Flash-Next 125B MoE comprimido em quant trellis 1-bit (agentionai Gyro). 16K context (teto real da placa de 6GB; o motor streamia experts do page cache)."
  cmd: 'sh -c "cd ${env.HOME}/.local/share/strata/terminal/current && CUDA_MODULE_LOADING=LAZY GGML_CUDA_FORCE_MMQ=1 STRATA_RESIDENT_HEADROOM_GIB=1.5 exec ionice -c2 -n7 ./python/bin/python3.12 -m serve.server --engine strata --config ${env.HOME}/git/ai-dotfiles/llama-swap/strata/gyro-s-16k.json --host 127.0.0.1 --port ${PORT}"'
  env:
    - "CUDA_MODULE_LOADING=LAZY"
    - "GGML_CUDA_FORCE_MMQ=1"
    - "STRATA_RESIDENT_HEADROOM_GIB=1.5"
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 16384
  metadata:
    size: ~60 GB no disco (GGUF 58.5 + pack 1.5 + mmproj 0.9)
    context: 16384
    vram_usage: ~5.7 GB VRAM em request (93%; reserve 512 = anti-driver-paging #2065) + ~21.5 GB RAM page-locked (modo residente)
    source: agentionai/Qwen3.8-Flash-Next-Gyro-GGUF (Gyro-S TQ1_0; engine Strata 0.1.48 cuda13 / Terminal 0.2.4.2; mmproj F16)
    kv_cache: k8v4
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen4exp
    parameters: 125000000000
    context_length: 262144
    embedding_length: 2560
    quantization: TQ1_0
    note: "Install via Terminal oficial do Strata (0.2.4.2, engine 0.1.48 cuda13, driver 580+). Bench da casa N=5 (24/10, 0 falhas): chat decode 17.87 t/s (piso 15.9, CV 3.9%), prompt 4K 257 t/s, agent decode 16.3 t/s / cache hit 70.8%. Referencial: Mac mini 32GB 9.1 t/s, A750 8GB 15.8, 3050-8GB do kassane 20-25. Stamps pela porta da frota: tool call limpa (get_temp, finish=tool_calls) e visao via reader de CPU (mmproj-F16: um circulo vermelho sobre fundo branco, zero VRAM). SSD relief final (modo residente): --resident-budget-gib 21.0 = 21.5 GB dos experts PAGE-LOCKED na RAM (mlock engole 20-21 dos 21; o 1 GB de cauda vira LimitMEMLOCK no servico p/ lock inteiro), no file reads nos swaps, cache GPU 200, KV resident 1024, reserve 100: SSD de 5.6-6.7 GB/request para 461 MB (-93%) e decode de 17.9 para 19.4-19.7 t/s. VRAM em request assenta ~93% (5.72-5.74 GB); o grafo de decode (~590 MiB) e CONTRATO do serve.server (--no-token-graph quebra o serve). Reserva 512 MiB no config (o warning do proprio engine: card full = driver paginaria VRAM pro RAM = decode a 0.5 t/s e streams quebrados, issue #2065); com o cache CAPADO (modo residente) o reserve e alavanca real (o auto nao re-come). A RAM paga o trade (user aprovou). O teto REAL de contexto na 6GB e 16K: 32K abre (2/2, ~5.77 GB VRAM) mas colapsa em uso (verify: instantiate: out of memory, 15 falhas no bench); 64K/128K nunca abrem (parede do alocador no raso do VMM: free-at-failure ~44-48 MiB, buffers 9/18/36 por passo de ctx - forense na skill strata-gyro-6gb). Sem MTP draft (custa 3.75 GiB de VRAM; prepado em Strata-data p/ teste futuro). Sampling do proprio server (temp 1.0/0.95/20/0.05, Qwen-oficial). Emergency: strata launch --stop; presets salvos: gyro-32k, gyro-131k (nao operacionais); manifest de desinstalacao em ~/.llama-models/REINSTALAR-STRATA-2026-10.md. Config do fleet versionado em llama-swap/strata/gyro-s-16k.json (edita LA e copia pro live se precisar). "