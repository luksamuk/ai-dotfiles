ornith-1.5-9b:
  name: Ornith 1.5 9B
  description: 'Ornith-1.5-9B (ornith-ai) — dense 9B da mesma arch qwen35 do base do Alpie, MIT, multimodal no card de origem
    (mmproj 0.86 GB disponvel no repo, NO wired nesta lane — VRAM da partial-offload 64K est apertada p/ +0.86GB; viso
    pendente do dono). Pos-treino de self-improvement da famlia: card vende SWE-V 70.6 vs 53.2 do base Qwen3.5-9B e o A/B
    06/11 confirmou o esprito — 4x menos thinking que a 169Pi/Alpie com resposta melhor organizada.'
  tags:
  - think
  cmd: '${llama_server} --port ${PORT}
    --model ${models_dir}/ornith-1.5-9b/Ornith-1.5-9B-Q4_K_M.gguf
    --ctx-size 65536
    --jinja
    --flash-attn on
    -b 2048
    -ub 1024
    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 65536
  metadata:
    size: ~5.38 GB (Q4_K_M)
    context: '65536 deployado (KV hbrido fp16, quase de graa; a escada da famlia medida em 06/11: 32K at 262K, todos passam,
      VRAM 4.724.89 GB)'
    vram_usage: ~4.6 GB VRAM com offload parcial (sem -ngl, fit decide)
    source: 'ornith-ai/Ornith-1.5-9B-GGUF (Ornith-1.5-9B-Q4_K_M.gguf, ~5.38 GiB; MIT; mmproj-BF16 0.86GB no repo, sem download)'
    features:
      completion: true
      tools: false
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 9000000000
    embedding_length: 4096
    context_length: 262144
    quantization: Q4_K_M
    license: mit
    note: 'BENCH+SMOKE 06/11 (vanilla c7d9f630d, 64K KV fp16): decode 12.813.3 t/s (EMPATE fsico com a 169Pi/Alpie, mesmo
      shape), prefill 694/830/805 t/s. SMOKE fatorao pt-BR par quase-homorfo: PASS com 1708 chars de thinking vs 6877 da
      Alpie (4x menos na mesma lane) — o self-improvement da Ornith materializou no tamanho pequeno. tools false PENDING
      PROBE (o 35B heretic da famlia provou; o 9B falta). MTP/nextn: verificar no probe antes de spec-decode. Dono decretou
      aposentadoria da 169Pi/Alpie em 06/11.'
