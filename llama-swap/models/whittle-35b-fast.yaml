whittle-35b-fast:
  name: Whittle Qwen3.8 35B-A3B (fast)
  description: Slot veloz do Whittle 35B no ik — kernels ik + builder de grafo qwen4exp
    dedicado (graphs/build_qwen4exp.cpp). Mesma quant compact — TESTE de RAM pinned
    estimado em ~28-30GB anon; deletar fragmento inteiro se matar o desktop. Sem spec
    decode (sem MTP).
  tags:
  - think
  - tools
  cmd: ${ik_llama_server} --port ${PORT} --model ${models_dir}/whittle-35b/Whittle-Qwen-3.8-35B-A3B-ONYX-compact.gguf
    --ctx-size 131072 --jinja --parallel 1 --cache-type-k q4_0 --cache-type-v q4_0
    --flash-attn on -ngl 99 -b 512 -ub 128 -ptcall -ot per_layer_token_embd=CPU -ot
    "blk\.([6-9]|1[0-9]|2[0-9]|3[0-9])\.ffn_(up|down|gate)_exps=CPU" --temp 0.7 --top-p
    0.8 --top-k 20 --repeat-penalty 1.05 --reasoning-budget 8192 --metrics
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.8
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~21.9 GB (ONYX compact, MESMO arquivo do whittle-35b)
    context: 131072
    vram_usage: atencao/hyper-conn/shared na GPU; tabela+experts pinned anon ~28-30GB
      RAM — RISCO medido no smoke
    source: el4/Whittle-Qwen-3.8-35B-A3B-ONYX-GGUF (compact compartilhado c/ cafe)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen4exp
    parameters: 35100000000
    context_length: 262144
    embedding_length: 2048
    quantization: ONYX compact
    note: 'Loader ik e eager (sem --lazy-mode aqui: flag nao existe no ik). SEM --prefetch-experts:
      no-op bugado ate o rebase #2667 (19 commits pendentes). -nkvo OFF (decisao do
      teste). Protocolo do user 17/out: se o load matar o desktop, DELETAR este fragmento
      inteiro (sem _disabled).'
