spark-x2.6-4b:
  name: Spark X2.6 4B
  description: "XHToken 4B denso na arch Spark 2.5 com spec-decode DSpark (draft
    Q8_0 no binario FORK xhtoken): 135 t/s de decode @32K medidos (3,3x do
    baseline 41 t/s, aceitacao 94,9%, mean 7,50/8) + o prefill king da frota.
    Thinking budget controlavel (template enable_thinking). Lane @64K: o
    draft custa ~0.63 GB+KV e @131K nao cabe de jeito nenhum."
  cmd: '${fork_server} --port ${PORT}

    --model ${models_dir}/spark-x2.6-4b/Spark-X2.6-4B-Q4_K_M.gguf

    -md ${models_dir}/spark-x2.6-4b/Spark-X2.6-4B-DSpark-Q8_0.gguf

    --spec-type draft-dspark

    --spec-draft-sampling greedy

    --spec-draft-n-max 7

    --spec-draft-p-min 0

    -ngld 999

    --jinja

    --parallel 1

    --ctx-size 65536

    -ngl 99

    -b 256 -ub 64

    --flash-attn on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --temp 1.0

    --top-p 0.95

    --top-k 0

    --repeat-penalty 1.0

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
        top_k: 0
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.95
        top_k: 0
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~3.54 GB (Q4_K_M) + 0.63 GB draft DSpark (Q8_0; o BF16 1.2 GB foi
      descartado — OOM de pp buffer na 6GB com desktop)
    context: 65536
    vram_usage: "~5.7 GB pico ESTIMADO @64K (A/B 01/11 @32K mediu 5322 MiB TOTAL
      com desktop 1070 — a lane ~4.2 GB; SEM --fit: OOM se o desktop engordar)"
    source: XHToken/Spark-X2.6-4B-GGUF (Q4_K_M) + XHToken/Spark-X2.6-4B-DSpark-GGUF
      (draft; Q8_0 quantizado local com llama-quantize --pure, 01/11)
    kv_cache: q4_0 + q4_0; draft f16 ~20MB fixo (SWA 512)
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: spark2_5
    parameters: 4000000000
    context_length: 1048576
    embedding_length: 2560
    quantization: Q4_K_M
    note: 'ADOTADO 01/11/2026: lane spec-decode @64K no binario FORK xhtoken
      (macro fork_server = ~/git/xhtoken-llama.cpp/build-cuda/bin/llama-server,
      build 01/11 com patch local de uma linha: #include <algorithm> em
      src/llama-context.cpp — bug de compile do fork). A/B @32K: 135.0/136.0
      t/s vs 41.0/40.7 baseline = 3.3x (o card reclama 2x mas mediu com
      sampling probabilistico; este teste e greedy/temp 0); acceptance 0.9485
      (221/233), mean len 7.50/8 no teto. BF16 draft = CRASH pp buffers
      (descartado). Prefill king intacto (1607 t/s @30K era o X2.5; este 4B
      herda a arch). GATE DE VOLTA pro upstream: PR ggml-org/llama.cpp#31372
      (Septend-fun, DSpark draft tensor support, OPEN, up 31/10) MERGEADO =>
      trocar ${fork_server} por ${llama_server} no cmd (o tracker Spark vigia
      o PR; o ctx fica 64K — com draft, @131K nao cabe de jeito nenhum).
      HISTORICO: smoke 24/10 @131K sem draft: 41,9-43,0 t/s, tool calling OK,
      funcao Python OK; smoke via llama-swap: 36-38 t/s pico 88,9%. X2.6 =
      post-training do X2.5 (agentico, tool use); o irmao X2.5 REPROVADO
      (snake v2 colisao + timeout bench agentico 03) — regua pendente pro
      X2.6 tb. Base E :think SAO AMBOS thinking-ON (24/10: thinking-none
      respondeu EM CHINES a uma saudacao curta — o default do vendor eh
      ligado e o none nao serve). Samplers do proprio GGUF (temp 1.0, top_p
      0.95, top_k -1, repeat 1.0) — hardcoded, nao usar macro.'
    fork_note: 'FORK ISOLADO (doutrina fork): ~/git/xhtoken-llama.cpp = upstream
      + PR #31372 (ainda nao mergeado; master 22c0ae1 de 30/10). O binario
      NUNCA substitui a frota; mas o checkout vive PROPOSITADAMENTE (a lane
      prod aponta pra ele) ate o merge do 31372, quando: flip ${fork_server}
      -> ${llama_server} + APAGAR o checkout inteiro (o build-cuda vira lixo).
      Se ficar vivo semanas, re-syncar com o upstream master (fork master
      base de 30/10 envelhece).'