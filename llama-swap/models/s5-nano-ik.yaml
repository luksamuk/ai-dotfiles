s5-nano-ik:
  name: S5-nano (Maritaca) ik-prototipo
  description: 'Prototipo A/B do backend ik para o S5-nano — molde da lane qwen3.5-4b ik aposentada
    11/10 (KV q4_0+hadamard na VRAM, fit, qwen-fixed template). Texto puro (mmproj no ik SEM
    TESTE; a lane vanilla mantem visao opt-in). NAO produtor de dsh/pi ate o A/B ser fechado.'
  tags:
  - think
  cmd: '${ik_llama_server} --port ${PORT}
    --model ${models_dir}/s5-nano/S5-nano-Q4_K_M.gguf
    --mmproj ${models_dir}/s5-nano/mmproj-S5-nano-F16.gguf
    --no-mmproj-offload
    --fit
    --fit-margin 512
    --ctx-size ${small_model_max_ctx}
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --reasoning on
    --cache-type-k q4_0
    --cache-type-v q4_0
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --no-graph-reuse
    -b 512
    -ub 128
    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 131072
  metadata:
    size: mesmo GGUF da lane vanilla (~2.59 GB Q4_K_M) + KV q4_0 na VRAM
    kv_cache: q4_0/q4_0 + hadamard (na VRAM)
    vram_usage: ~4.5 GB esperado (shape da lane antiga do 4B; medir)
    backend: ik_llama.cpp (build 1/nov)
    note: 'A/B FECHADO 08/11 vs lane vanilla (rgua 52.9k tokens de prefill, thinking counting):
      decode @ctx cheio 18.3-20.3 t/s (vanilla: 10.4-10.7, +80%); TTFT com cache hit 0.2-0.6s;
      prefill cold 55s @52.9k (967 t/s). KV q4_0+hadamard FICA NA HOST por deciso do fit do ik
      (KV buffer CUDA_Host 1202 MiB, VRAM 4012 MiB com pesos) — o ganho  kernel, no VRAM.
      CACHE LADDER CRVETE: o prompt cache do ik s restaura estado em modelos private-state (GDN)
      VIA CHECKPOINTS DE CONTEXTO — com --ctx-checkpoints 0 (herdado da lane antiga do 4B) o ik
      re-prefilia TUDO a cada turn (55s); no default (32 checkpoints) o reuse  instantneo (TTFT
      0.6s). Referencias: qwen3.5-4b ik = 27.7 t/s @131K; Bee (removido) = 41.2. Pendentes: template
      emite thinking INLINE em content (no separa reasoning_content — parser/UX a conferir em cliente);
      mmproj OK em RAM (--no-mmproj-offload, viso opt-in, VRAM no paga); tools PENDING PROBE no ik.'
