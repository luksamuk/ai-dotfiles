nanbeige4.2-3b:
  name: Nanbeige 4.2 3B
  description: Nanbeige's 3B generalist chat model. 65K practical context (262K nominal).
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/nanbeige4.2-3b/nanbeige4.2-3b-Q4_K_M.gguf

    --jinja

    --fit

    --parallel 1

    --ctx-size 131072

    -nkvo

    --temp 0.6

    --top-p 0.95

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.05

    --reasoning on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn auto

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
        top_k: 20
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
          preserve_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~2.4 GB (Q4_K_M)
    context: 131072
    vram_usage: ~2.4 GB model (GPU) + ~6.6 GB KV q4_0 @131K (RAM via -nkvo) + compute
    source: owao/Nanbeige4.2-3B-GGUF (Q4_K_M)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: nanbeige
    parameters: 4000000000
    context_length: 262144
    embedding_length: 3072
    quantization: Q4_K_M
    note: 'MIGRACAO IK @131K (15/out, sondagem deleg_289362fb): nativo e 262K
      (theta 70M, sem rope scaling; 131K fica DENTRO da janela treinada — zero
      risco RoPE). GGUF owao Q4_K_M ja declara context_length 262144; cap 65K
      antigo era de VRAM, nao do modelo. IK PR #2590 (merged, checkout local
      13/out) = KV por camada logica (looped, 22x2=44 efetivas; KV q4_0 @131K
      ~6.6GB vira RAM via -nkvo; modelo 2.4GB fica GPU). Upstream nanbeige =
      PR #25994. YaRN >262K: org diz nao avaliado — nao usar. Pendente: smoke
      duplo (chat + tool-call) + needle @131K no ik antes de fechar. Regra ik:
      --fit sem "on"; sem --fit-ctx/--fit-target (usar --fit-margin).'
