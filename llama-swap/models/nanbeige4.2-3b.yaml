nanbeige4.2-3b:
  name: Nanbeige 4.2 3B
  description: Nanbeige's 3B generalist chat model. 65K practical context (262K nominal).
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/nanbeige4.2-3b/nanbeige4.2-3b-Q4_K_M.gguf

    --jinja

    --fit on

    --parallel 1

    --ctx-size 65536

    --temp 0.6

    --top-p 0.95

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.05

    --reasoning on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --flash-attn auto

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
        top_k: 20
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
          preserve_thinking: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~2.4 GB (Q4_K_M)
    context: 65536
    vram_usage: ~5.3 GB VRAM
    source: owao/Nanbeige4.2-3B-GGUF (Q4_K_M)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: nanbeige
    parameters: 4000000000
    context_length: 262144
    embedding_length: 3072
    quantization: Q4_K_M
    note: 'vram detalhe: ~2.4 GB model + ~2.9 GB q4_0 KV @ 65K + compute | model 2.4GB
      Q4_K_M + q4_0 KV ~2.9GB @65K + compute Looped Transformer (22 layers x2 loops
      = 44 effective). Upstream llama.cpp (PR #25994). Multi-turn tool calling FIXED
      vs 4.1 (#22684). Thinking toggle via enable_thinking.'
