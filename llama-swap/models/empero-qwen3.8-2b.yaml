# -------------------------------------------
# EMPERO QWEN3.8-2B - ik_llama.cpp BACKEND
# Empero distillation of Qwen3.8-2.4T-A95B into Qwen3.5-2B architecture.
# Full-parameter SFT on ~30K curated teacher CoT traces.
# MMLU CoT 0.283 -> 0.548 (+0.265). GSM8K 0.330 -> 0.640 (+0.310).
# Hybrid Gated DeltaNet (3:1) + full attention. Reasoning model.
# Chat template embedded in GGUF (supports tool calling natively).
# ik_llama.cpp with hadamard KV cache + --parallel-tool-calls.
# 101.1 tok/s @ RTX 3050 6GB (ik_llama benchmark 2026-08-16).
# Reasoning model: always thinks. No :think variant — thinking is always on.
# Tool calling requires thinking enabled to function correctly.
# Architecture: qwen35 — same as Qwen3.5-4B, fully supported by ik_llama.
# -------------------------------------------
"empero-qwen3.8-2b":
  name: "Empero Qwen3.8 2B"
  description: "Empero distillation of Qwen3.8-2.4T-A95B into Qwen3.5-2B. Full-parameter SFT on ~30K curated teacher CoT traces. MMLU 0.283 to 0.548, GSM8K 0.330 to 0.640. Hybrid Gated DeltaNet + full attention. Reasoning model — always thinks. Tool calling supported."
  cmd: |
    ${ik_llama_server} --port ${PORT}
    --model ${models_dir}/empero-qwen3.8-2b/Qwen3.8-2B-Q4_K_M.gguf
    --jinja
    --fit
    --fit-margin 512
    --parallel 1
    --parallel-tool-calls
    --ctx-size ${small_model_max_ctx}
    --temp ${default_temp}
    --top-p ${default_top_p}
    --top-k ${default_top_k}
    --min-p ${default_min_p}
    --repeat-penalty ${default_repeat_penalty}
    --reasoning on
    --cache-type-k ${small_cache_k}
    --cache-type-v ${small_cache_v}
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --no-graph-reuse
    --ctx-checkpoints 0
    --ctx-checkpoints-interval 0
    --batch-size 512
    --ubatch-size 128
    --metrics
  filters:
    stripParams: "temperature, top_p"
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in: ['text']
    out: ['text']
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~1.31 GB (Q4_K_M)"
    context: "64K-128K (dynamic)"
    vram_usage: "~2.5GB VRAM (model 1.31GB + q4_0 hadamard KV cache + compute)"
    source: "empero-ai/Qwen3.8-2B-GGUF (Q4_K_M)"
    kv_cache: "q4_0/q4_0 + hadamard"
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 2000000000
    context_length: 262144
    embedding_length: 1536
    quantization: Q4_K_M
    note: "Empero distillation of Qwen3.8-2.4T-A95B into Qwen3.5-2B. Full-parameter SFT on ~30K curated teacher CoT traces. MMLU 0.283->0.548, GSM8K 0.330->0.640. Hybrid Gated DeltaNet (3:1 with full attention). Reasoning model — always thinks, no :think variant. Chat template embedded in GGUF supports tool calling. Tool calling REQUIRES thinking enabled. 101.1 tok/s @ RTX 3050 6GB (ik_llama). Architecture qwen35 — fully supported by ik_llama.cpp."