julia-1:
  name: Julia-1 (decision)
  description: System One decision model (ModernBERT 144M BF16). Serves POST /v1/systemone
    for laya-snake judge. Not a chat model.
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/decision-models/Julia-1-GGUF/Julia-1-BF16.gguf

    --ctx-size 8192

    --batch-size 512

    --ubatch-size 512

    --parallel 1

    --no-webui

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k, min_p, repeat_penalty
  ttl: 3600
  health_check_timeout: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 8192
  metadata:
    size: ~303 MB (BF16)
    context: 8192
    vram_usage: ~0.3 GB VRAM
    source: 'ggml-org/Julia-1-GGUF (BF16, official #29818 conversion)'
    kv_cache: n/a
    features:
      decision: true
      completion: false
      tools: false
      thinking: false
      vision: false
      image: false
      embedding: false
      insert: false
      audio: false
    architecture: modern-bert
    parameters: 144000000
    context_length: 8192
    embedding_length: 384
    quantization: BF16
    note: 'vram detalhe: ~0.3 GB VRAM (model 303MB + compute) | model 303MB BF16 +
      compute Decision model (/v1/systemone: noul/choice/score). llama-swap v262+
      roteia /v1/systemone nativo (issue #1195 fechada). Lightest judge: 144M, sub-5ms
      per question expected on GPU.'
