# Ternary Bonsai 2.5 27B (PrismML, Apache-2.0): Qwen3.8-27B-based, hybrid attention
# (~75% linear / ~25% full), ternary {-1,0,+1} 1.76 bpw — packing PTQ1_0 (menor e
# mais rapido em CUDA; so existe no fork PrismML).
# BACKEND: prismml-eng-llama.cpp (prism2_llama_server, tag prism-b12178-03ec600, build 24/nov).
#
# HISTÓRICO (24/nov/2026):
# - Versão inicial com MTP draft head (spec-draft-n-max 3): aceitação 57-70%, ganho ~0-5% (decode 4.4-5.7 t/s), VRAM 5.4-5.7GB.
#   Dono mandou tirar: VRAM em 91% e ganho marginal. MTP desligado/removido.
# - KV q4_0/q4_0: com MTP matava a aceitação do draft (15-49%). SEM MTP é livre — permite +8 layers e ctx 16K->32K.
# - Medido (plain, -b 2048 -ub 1024, prompt 737 tok):
#     36L/16K: 201/6.02 | 40L/16K: 212/6.63 | 44L/16K: 226/7.46 | 48L/16K: 254/9.08 (teto) | 52L OOM
#     40L/32K: 211/6.70 | 44L/32K: 238/7.98 (escolhido) | 48L/32K OOM
# Config final: plain PTQ1_0, -ngl 44, ctx 32768, KV q4_0 → prefill ~238 t/s, decode ~8.0 t/s.
# Se o dono quiser mais decode em detrimento do contexto: -ngl 48 + ctx 16384 (9.1 t/s).
# Fallback se OOM com desktop pesado: -ngl 40 ou voltar ctx 16384.
# Sampling vendor (thinking/xhigh): temp 1.0 / top_p 0.95 / top_k 20 / min_p 0.
# Tools nativas. Visão: NÃO nesta lane (mmproj-Q8_0 629MB não baixado).
# Nativo 262K de contexto; 32K é o teto prático nesta GPU.
bonsai-2-5-27b:
  name: Bonsai 2.5 27B (PTQ1_0)
  description: PrismML Ternary Bonsai 2.5 27B — ternary 1.76 bpw agentic model (Qwen3.8-27B base, hybrid attention). FP16-level tool calling (77.2 avg vs 77.7 FP16), 90% of FP16 agentic coding. PTQ1_0 packing via PrismML fork; 32K context, KV q4_0.
  cmd: '${prism2_llama_server} --port ${PORT}

    --model ${models_dir}/bonsai-2.5-27b/Ternary-Bonsai-2.5-27B-PTQ1_0.gguf

    --jinja

    --ctx-size 32768

    -ngl 44

    -b 2048

    -ub 1024

    --flash-attn on

    --cache-type-k q4_0

    --cache-type-v q4_0

    --temp 1.0

    --top-p 0.95

    --top-k 20

    --min-p 0

    --parallel 1

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k
    setParamsByID:
      ${MODEL_ID}:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
  ttl: 0
  health_check_timeout: 600
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 32768
  metadata:
    size: ~5.99 GB (PTQ1_0)
    context: 32768
    vram_usage: "~5.3-5.6 GB (44 layers, ctx 32K q4_0) — cabe na RTX 3050 apesar do desktop"
    source: prism-ml/Ternary-Bonsai-2.5-27B-GGUF (PTQ1_0 plain; sha256 929560ec9d37cf3cadd4b00cc87b51c570082a628dd830b4692dc0b2ed18dbbe, conferido 24/nov/2026)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 27360000000
    context_length: 262144
    quantization: PTQ1_0
    reasoningEfforts:
      'medium': 'medium'
      'xhigh': 'xhigh'
    note: 'Medido 24/nov/2026 (fork b12178): prefill 238 t/s, decode ~8.0 t/s @ 32K ctx.
      MTP testado e removido pelo dono (ganho ~0, VRAM demais). 48L/16K = 9.1 t/s se quiser trocar ctx por velocidade.
      Alternativas: Ornith grelha (-ngl auto/-nkvo/KV q4) NAO serve pra este modelo com spec decode.
      Tool calling: nao validado formalmente neste build; validar antes de producao.
      Fora do matrix; lane por id direto.'
