qwen2.5-coder-1.5b-pollard:
  name: Qwen2.5 Coder 1.5B Pollard
  description: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct, CPU-only. IQ4_XS with
    imatrix. FIM native. Code completion on CPU, zero VRAM, coexists with GPU MoE.
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/qwen2.5-coder-1.5b-pollard-new/Qwen2.5-Coder-1.5B-Pollard-v2-IQ4XS-class.gguf

    --jinja

    --parallel 1

    --ctx-size ${completion_ctx}

    --temp 0.7

    --top-p 0.8

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.1

    --cache-type-k ${small_cache_k}

    --cache-type-v ${small_cache_v}

    --batch-size 512

    --ubatch-size 128

    --spec-type ngram-mod

    --spec-ngram-mod-n-match 24

    --spec-ngram-mod-n-min 48

    --spec-ngram-mod-n-max 64

    --no-webui

    --metrics

    '
  env:
  - CUDA_VISIBLE_DEVICES=
  filters:
    stripParams: temperature, top_p
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 32768
  metadata:
    size: ~824 MB (Pollard IQ4_XS + imatrix)
    context: 32768
    vram_usage: 0 (CPU-only)
    source: PollardWeights/Qwen2.5-Coder-1.5B-Instruct-Pollard (IQ4_XS)
    kv_cache: q8_0
    features:
      completion: true
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: true
      audio: false
      image: false
    architecture: qwen2
    parameters: 1540000000
    context_length: 32768
    embedding_length: 1536
    quantization: Pollard IQ4_XS
    note: Pollard memory-fit Qwen2.5-Coder-1.5B-Instruct. IQ4_XS with imatrix on mixed
      prose+code. FIM native (Qwen2.5-Coder tokens). CPU-only, coexists with GPU MoE.
      ngram-mod enabled.
