bonsai2-27b-heretic:
  name: Bonsai 2 27B Heretic
  description: Variante decensored (OS-Software OT-Ridge v2) do Bonsai 2 27B ternário
    PTQ1_0; 0/100 recusas com custo mínimo (MMLU -0.66). Mesmos 5.54 GB e mesmos kernels
    cafe CUDA do original.
  tags:
  - vis
  - think
  - tools
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /health
  cmd: '${cafe_server} --host 127.0.0.1 --port ${PORT}

    -m ${models_dir}/bonsai2-27b/Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-PTQ1_0.gguf

    --mmproj ${models_dir}/bonsai2-27b/mmproj-Q8_0.gguf --no-mmproj-offload

    -ngl 56 -c 65536 -fa on -nkvo --jinja

    --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --presence-penalty 1.5 --repeat-penalty 1.0

    '
  ttl: 900
  health_check_timeout: 900
  filters:
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20
        min_p: 0
        presence_penalty: 1.5
        repeat_penalty: 1.0
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
          reasoning_effort: xhigh
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0
        presence_penalty: 0.0
        repeat_penalty: 1.0
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: ~5.54 GB (PTQ1_0 heretic) + 0.59 GB mmproj
    context: 65536
    vram_usage: ~5.6 GB VRAM + ~3.5 GB RAM
    source: OS-Software/Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-GGUF (base prism-ml Ternary-Bonsai-2-27B PTQ1_0, Apache 2.0)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 27360000000
    context_length: 262144
    embedding_length: 5120
    quantization: PTQ1_0
    note: 'Merge heretic APROXIMADO: LoRA OT-Ridge cozido nos codigos ternarios preservando
      block scales (v2 = todas as camadas attn.o_proj/mlp.down_proj; v1 mexia so 34
      matrizes). Ganhos v2 vs original: refusals 95/100 -> 0/100, thinking-incompleto
      22% -> 9% (16% greedy), MMLU -0.66, HumanEval -0.61 (ns). Decode esperado IGUAL
      ao original (scales intactos, mesmos kernels) — 3.4-3.5 t/s @ngl 56; velocidade
      segue regua do original (Saluki 4.1 vence na Navi). Vision ATIVADA 10/10 — mmproj
      Q8_0 0.59 GB em CPU RAM (--no-mmproj-offload), ViT prefill ~35s/imagem pago so
      no request com imagem, decode zero custo. Handle a ativar so depois de smoke;
      mesmo conjunto de flags do original.'
