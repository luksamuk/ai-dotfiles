s5-nano:
  name: S5-nano (Maritaca)
  description: 'S5-nano (maritaca-ai) — dense 4.2B de texto nativo BR, arch qwen35 (a mesma famlia hbrida do alpie/ornith-9b),
    treino focado em portugus: o card traz a primeira rgua eval 100% pt-BR que a casa viu (Prosa-PT, CAPITU, MMLU-PT,
    ENADE-QA, ENEM-VL, BLUEX, MARCA, BRoverbs, ASSIN 2) e o placar NATIVO-BR 83.74 (Think) esmaga Qwen3.5-4B (72.49), o
    LFM2.5-24B-A2B (67.06) e tudo mais. Dual-mode think, MTP incluso (4 tensores nextn — candidato spec-decode; wire depois
    do smoke), mmproj de viso prprio, Apache-2.0, ctx nativo 262144.'
  tags:
  - think
  cmd: '${llama_server} --port ${PORT}
    --model ${models_dir}/s5-nano/S5-nano-Q4_K_M.gguf
    --mmproj ${models_dir}/s5-nano/mmproj-S5-nano-F16.gguf
    --ctx-size 262144
    --jinja
    --flash-attn on
    -ngl 99
    -nkvo
    -b 512
    -ub 128
    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 262144
  metadata:
    size: ~2.59 GB (Q4_K_M com imatrix) + 0.63 GB mmproj
    context: '262144 deployado @262K native via ngl99+nkvo (KV f16 hbrido ~8.2 GB na host RAM, server RSS ~10.4 GB, zero swap;
      o teto deixou de ser a VRAM de 6 GB da famlia qwen35 — a escada passou inteira no ornith-9b: 32K a
      262K fp16 em GPU, VRAM quase fixa)'
    vram_usage: ~3.5 GB VRAM estimado (Q4 2.59 + mmproj 0.63; medir no load — shape all-in-VRAM provavel)
    kv_cache: f16/f16
    source: 'maritaca-ai/S5-nano-GGUF (S5-nano-Q4_K_M.gguf 4.29 GB Q8_0 + mmproj-S5-nano-F16.gguf 0.63 GB; Apache-2.0; base
       do treino = fine-tune pt-nativo da famlia S5 da Maritaca)'
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4200000000
    embedding_length: 2560
    context_length: 262144
    quantization: Q4_K_M
    license: apache-2.0
    note: 'MTP presente no GGUF (4 tensores nextn, blk.32) — spec-decode  candidato real NO APs o smoke (dense em VRAM  
      o nico regime que a casa no descartou MTP). tools false PENDING PROBE (21 markers no template). Placar do card  
      BF16 com rgua prpria multi-seed; comparao pt-BR vs spark-x2.6-4b pendente no e2e. MEASURED A/B speed 07/11 (probe
      smoke N=5, prompt LRU, thinking counting): auto/-b2048/-ub1024 = 18.7 t/s (CV 2.6%); ngl99+nkvo/-b512/-ub128 =
      22.1 t/s (CV 3.0%, +18%, TTFT 0.2s inalterado) — -ngl 99 sem -nkvo OOM no KV @114K (fit abortado: ngl setado pelo
      user desativa o auto-fit; KV f16 hbrido = 3.58 GB). Fica a config ngl99+nkvo. CTX LADDER 07/11: 262144 deployado
      @nkvo — decode 20.2 t/s N=5 (CV 1.8%, -9% vs 114K, mesma banda, TTFT idem), KV ~8.2 GB RAM; ctx de 262144 declarado
      em capabilities e DSH/Pi (contextWindow IGUAL ao ctx da lane) deve acompanhar.'
