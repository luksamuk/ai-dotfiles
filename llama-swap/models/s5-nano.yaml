s5-nano:
  name: S5-nano (Maritaca)
  description: 'S5-nano (maritaca-ai) — dense 4.2B de texto nativo BR, arch qwen35 (a mesma famlia hbrida do alpie/ornith-9b),
    treino focado em portugus: o card traz a primeira rgua eval 100% pt-BR que a casa viu (Prosa-PT, CAPITU, MMLU-PT,
    ENADE-QA, ENEM-VL, BLUEX, MARCA, BRoverbs, ASSIN 2) e o placar NATIVO-BR 83.74 (Think) esmaga Qwen3.5-4B (72.49), o
    LFM2.5-24B-A2B (67.06) e tudo mais. Dual-mode think, MTP incluso (4 tensores nextn — candidato spec-decode), mmproj de
    viso prprio, Apache-2.0, ctx nativo 262144.'
  tags:
  - think
  cmd: '${ik_llama_server} --port ${PORT}
    --model ${models_dir}/s5-nano/S5-nano-Q4_K_M.gguf
    --mmproj ${models_dir}/s5-nano/mmproj-S5-nano-F16.gguf
    --no-mmproj-offload
    --fit
    --fit-margin 512
    --ctx-size ${small_model_max_ctx}
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --reasoning on
    --cache-type-k q4_0
    --cache-type-v q4_0
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --no-graph-reuse
    -b 512
    -ub 128
    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 131072
  metadata:
    size: ~2.59 GB (Q4_K_M com imatrix) + 0.63 GB mmproj
    context: '131072 deployado via ${small_model_max_ctx} (262144 nativo). Escada vanilla 07-08/11: 114688 f16 RAM =
      decode 20 t/s empty / 5.1 @46k cheio; q4_0 host KV = 10.5 @46k, prefill cold 1170 t/s @52.9k; slot @262K NO
      cura o decode (gargalo = banda de RAM por token, no o slot).'
    backend: 'ik_llama.cpp (CANONICO 08/11 — vanilla aposentado: baseline auto 18.7 t/s, ngl99+nkvo 22.1 t/s, e
      PITFALL: mmproj na GPU + q4_0 host KV crasha o vanilla no prefill longo)'
    kv_cache: 'q4_0/q4_0 + hadamard na host por deciso do fit (buffer CUDA_Host 1202 MiB) — ganho do ik _KERNEL,
      no "KV na VRAM"'
    vram_usage: '~3.95 GB VRAM (pesos 2573 MiB) + mmproj em RAM (--no-mmproj-offload: viso opt-in, prefill ViT pago
      s no request com imagem, ~7-10s)'
    server_rss: ~3.5 GB host RAM (checkpoints de contexto inclusos)
    ctx_checkpoints: 'DEFAULT (32) OBRIGATRIO — o prompt cache do ik restaura estado GDN (private-state) VIA
      checkpoints de contexto; com --ctx-checkpoints 0 (herdado da lane antiga do 4B ik) o ik re-prefilia TUDO
      por turn (55s @52.9k). Com default: TTFT cache hit 0.2-0.6s.'
    source: 'maritaca-ai/S5-nano-GGUF (S5-nano-Q4_K_M.gguf 4.29 GB Q8_0 + mmproj-S5-nano-F16.gguf 0.63 GB; Apache-2.0)'
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4200000000
    embedding_length: 2560
    context_length: 262144
    quantization: Q4_K_M
    license: apache-2.0
    note: 'A/B FECHADO 08/11 vs vanilla (rgua 52.9k prefill, thinking counting): decode @ctx cheio 18.3-20.3 t/s
      (vanilla 10.4-10.7, +80%); prefill cold ik 55s/967 t/s (vanilla 45.2s/1170 t/s, vence cold; ik vence o fio).
      Referencias do card da famlia: qwen3.5-4b ik 27.7 t/s @131K; Bee (removido 20/09) 41.2. MTP nextn no GGUF
      no cabe como draft nos 6GB (nota da casa); ngram-mod existe no ik se a velocidade apertar. Pendentes:
      template emite thinking INLINE em content (no separa reasoning_content — parser/UX a conferir em cliente);
      tools PENDING PROBE no ik; DSH headless/tui espelho @131072; comparao pt-BR vs spark-x2.6-4b pendente no e2e.'
