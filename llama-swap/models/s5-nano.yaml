s5-nano:
  name: Maritaca S5-nano
  description: 'S5-nano da Maritaca AI: dense 4.2B, arch qwen35 (a famlia hbrida GDN do ornith-9b), treino focado
    em portugus nativo. O card traz uma rgua eval 100% pt-BR (Prosa-PT, CAPITU, MMLU-PT, ENADE-QA, ENEM-VL, BLUEX,
    MARCA, BRoverbs, ASSIN 2) com placar NATIVO-BR 83.74 (Think), acima do Qwen3.5-4B (72.49) e do LFM2.5-24B-A2B
    (67.06). Thinking, mmproj de viso prprio, Apache-2.0, ctx nativo 262144.'
  tags:
  - think
  cmd: '${ik_llama_server} --port ${PORT}
    --model ${models_dir}/s5-nano/S5-nano-Q4_K_M.gguf
    --mmproj ${models_dir}/s5-nano/mmproj-S5-nano-F16.gguf
    --no-mmproj-offload
    --fit
    --fit-margin 512
    --ctx-size ${small_model_max_ctx}
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --reasoning on
    --cache-type-k q4_0
    --cache-type-v q4_0
    --k-cache-hadamard
    --v-cache-hadamard
    --flash-attn auto
    --no-graph-reuse
    -b 512
    -ub 128
    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 131072
  metadata:
    size: ~3.2 GB (Q4_K_M 2.59 + mmproj 0.63 na RAM)
    context: '131072 deployado (262144 nativo)'
    backend: ik_llama.cpp (canonico 08/11; vanilla aposentado)
    kv_cache: q4_0/q4_0 + hadamard (host)
    vram_usage: '~4.0 GB VRAM (pesos) + mmproj em RAM (viso opt-in)'
    server_rss: ~3.5 GB host RAM
    ctx_checkpoints: 'DEFAULT (32) OBRIGATRIO para o prompt cache de modelos private-state (GDN); 0 = re-prefill por turn'
    source: 'maritaca-ai/S5-nano-GGUF (S5-nano-Q4_K_M.gguf 4.29 GB Q8_0 + mmproj-S5-nano-F16.gguf 0.63 GB; Apache-2.0)'
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4200000000
    embedding_length: 2560
    context_length: 262144
    quantization: Q4_K_M
    license: apache-2.0
    note: 'A/B fechado 08/11 contra a lane vanilla aposentada, régua de 52.9k tokens de prefill com thinking contado:
      decode a contexto cheio 18.3-20.3 t/s no ik vs 10.4-10.7 no vanilla (+80%); prefill cold ik 55s/967 t/s vs vanilla
      45.2s/1170 t/s (vanilla vence o cold, ik vence o fio). Escada vanilla do mesmo dia: f16 KV na RAM = 5.1 t/s @46k;
      KV q4_0 na RAM = 10.4-10.7 (@262K ou @114K dá igual, o gargalo é banda de RAM por token, não o slot). O ganho do
      ik vem de kernel: o fit dele deixa a KV q4_0+hadamard na host de propósito (buffer CUDA_Host de 1202 MiB). Pitfall
      do vanilla: mmproj na GPU + q4_0 host KV crasha no prefill longo (com mmproj em RAM é estável). Referências da
      família no catálogo: qwen3.5-4b ik 27.7 t/s @131K; Bee (removido 20/09) 41.2. Pendentes: tools PENDING PROBE no ik;
      template emite thinking inline no content (não separa reasoning_content — conferir em cliente); MTP nextn não cabe
      como draft nos 6GB e ngram-mod existe no ik se apertar; comparação pt-BR vs spark-x2.6-4b pendente no e2e.'
