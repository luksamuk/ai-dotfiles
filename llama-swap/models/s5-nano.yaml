s5-nano:
  name: S5-nano (Maritaca)
  description: 'S5-nano (maritaca-ai) — dense 4.2B de texto nativo BR, arch qwen35 (a mesma famlia hbrida do alpie/ornith-9b),
    treino focado em portugus: o card traz a primeira rgua eval 100% pt-BR que a casa viu (Prosa-PT, CAPITU, MMLU-PT,
    ENADE-QA, ENEM-VL, BLUEX, MARCA, BRoverbs, ASSIN 2) e o placar NATIVO-BR 83.74 (Think) esmaga Qwen3.5-4B (72.49), o
    LFM2.5-24B-A2B (67.06) e tudo mais. Dual-mode think, MTP incluso (4 tensores nextn — candidato spec-decode; wire depois
    do smoke), mmproj de viso prprio, Apache-2.0, ctx nativo 262144.'
  tags:
  - think
  cmd: '${llama_server} --port ${PORT}
    --model ${models_dir}/s5-nano/S5-nano-Q4_K_M.gguf
    --mmproj ${models_dir}/s5-nano/mmproj-S5-nano-F16.gguf
    --ctx-size 114688
    --jinja
    --flash-attn on
    -b 2048
    -ub 1024
    --metrics
    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 900
  health_check_timeout: 300
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: false
    reranker: false
    context: 114688
  metadata:
    size: ~2.59 GB (Q4_K_M com imatrix) + 0.63 GB mmproj
    context: '65536 deployado (262144 nativo; KV hbrido — a escada da famlia qwen35 passou inteira no ornith-9b: 32K a
      262K fp16, VRAM quase fixa)'
    vram_usage: ~3.5 GB VRAM estimado (Q4 2.59 + mmproj 0.63; medir no load — shape all-in-VRAM provavel)
    kv_cache: f16/f16
    source: 'maritaca-ai/S5-nano-GGUF (S5-nano-Q4_K_M.gguf 4.29 GB Q8_0 + mmproj-S5-nano-F16.gguf 0.63 GB; Apache-2.0; base
       do treino = fine-tune pt-nativo da famlia S5 da Maritaca)'
    features:
      completion: true
      tools: false
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4200000000
    embedding_length: 2560
    context_length: 262144
    quantization: Q4_K_M
    license: apache-2.0
    note: 'MTP presente no GGUF (4 tensores nextn, blk.32) — spec-decode  candidato real NO APs o smoke (dense em VRAM  
      o nico regime que a casa no descartou MTP). tools false PENDING PROBE (21 markers no template). Placar do card  
      BF16 com rgua prpria multi-seed; comparao pt-BR vs spark-x2.6-4b pendente no e2e.'
