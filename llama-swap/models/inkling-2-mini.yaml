# -------------------------------------------
# INKLING-2-MINI - llama.cpp upstream (why: UNICO backend com inkling2_loop -
# PR ggml-org #32694 mergeado 21/nov/2026; ik issue #2211 fechada sem impl,
# cafe sem rebase desde 04/11 - ambos ainda NAO trazem a arch).
# Looped MoE TML: 24 blocos (os 12 centrais rodam 3x = 48 apps/token),
# 128 experts / 8 ativos, ctx nativo 1,048,576. head_dim 96 (2304/24) NAO e
# multiplo de 64 -> sem attn_rot -> KV q8_0/q8_0 (regra da casa, exige FA).
# Quant APEX-I-NanoPlus (IsValorum) NAO tem mmproj nem MTP no GGUF: text-only.
# Experts na host RAM via --n-cpu-moe 24; samplers do vendor TML (guia unsloth:
# temp 1.0, top-p 1.0, top-k 0, min-p 0). Lane de teste do dono, fora dos sets
# (exclusiva no solver, sem var/evict_cost - padrao de lane nova).
# RESOLVIDO 21/nov (dossie: ~/relatorios-frota/inkling-loop-buffer/): buffer CUDA
# de ~4.7GB no boot era op_offload default-true + sched_copy_experts copiando os
# pesos de experts das 12 layers do core pro CUDA0 MESMO COM ngl 0 — o override
# n-cpu-moe NAO impede a copia. Fix: --no-op-offload (o cafe herda o mesmo
# mecanismo do upstream no merge 5eeeecb21 — validar a flag no binario novo).
# Lane HIBRIDA 64K no CAFE: -cmoe (experts host, cache de experts do cafe
# disponivel: probe com --moe-cache-mib) + -nkvo (KV host q8) + --no-op-offload.
# Rebase do cafe 60fc74bd0 (21/11) trouxe o inkling2_loop completo (arch + loop),
# binario build 12974/commit 5eeeecb21. Fallback vanilla: ${llama_server} +
# --n-cpu-moe 24 (receita anterior), funciona a 64K a ~12 t/s.
# -------------------------------------------
inkling-2-mini:
  name: Inkling-2-Mini
  description: "Thinking Machines' small open-weights model: 26B parameters, 5.4B active, with looped layers for more computation per token."
  cmd: |
    ${cafe_server} --port ${PORT}
    --model ${models_dir}/inkling-2-mini/Inkling-2-Mini-Abliterated-APEX-I-MiniPlus-V2.1.gguf
    --mmproj ${models_dir}/inkling-2-mini/mmproj-Inkling-2-Mini-Q8_0.gguf
    --jinja
    -ngl 24   # varre 22/24 @131K q4: cabem — o OOM anterior era mmproj+staging q8
    --no-op-offload
    -cmoe
    -nkvo
    --ctx-size 131072
    -b 512 -ub 128
    --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0.0
    --repeat-penalty 1.0
    --cache-type-k q4_0 --cache-type-v q4_0
    --flash-attn auto
    --parallel 1
    --metrics
  filters:
    stripParams: temperature, top_p
  ttl: 0
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: "~12.09 GB"
    context: 131072
    source: "IsValorum/Inkling-2-Mini-Abliterated-APEX-I-MiniPlus-V2.1-GGUF, base thinkingmachines/Inkling-2-Mini da TML"
    kv_cache: "q4_0/q4_0 host"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: inkling2_loop
    parameters: 26200000000
    context_length: 1048576
    embedding_length: 2304
    quantization: APEX-I-MiniPlus-Abliterated
    reasoningEfforts:
      off: none
      low: low
      medium: medium
      high: high
      xhigh: xhigh
    note: "Lane de teste do dono, 21/nov. Quant NanoPlus text-only do IsValorum: 0 tensors de visao e 0 nextn, portanto sem mmproj e sem draft. Arch inkling2_loop mergeada no vanilla pelo PR upstream 32694. Samplers do vendor TML. Gate real de frota segue ik/cafe, esta lane e vanilla e exclusiva no solver. Template tem reasoning_effort de none a max e float 0 a 0.99. Probe de tools PASSOU no fio da swap em 21/nov: finish_reason tool_calls com get_weather e argumentos validos — capabilities.tools true. BUG do op_offload RESOLVIDO com --no-op-offload (dossie completo em ~/relatorios-frota/inkling-loop-buffer/: op_offload default-true puxava copia de 4.7GB de pesos de experts do core pelo sched_copy_experts mesmo com ngl 0). Lane HIBRIDA 64K: ngl 99 + ncmoe 24 + nkvo q8/q8; headroom de 131K GPU e 91% NO GO, e de 131K host funciona so CPU-only a 10.1 t/s. Fallback CPU-only documentado no bloco de cabecalho. Visao ATIVA: mmproj-Inkling-2-Mini-Q8_0 (0.32 GiB) do proprio repo Abliterated (21/11); existe tambem NanoPlus-Abliterated 10.23 GiB com o mesmo mmproj, opcao de headroom se a VRAM apertar."
