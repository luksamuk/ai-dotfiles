# -------------------------------------------
# INKLING-2-MINI - llama.cpp upstream (why: UNICO backend com inkling2_loop -
# PR ggml-org #32694 mergeado 21/nov/2026; ik issue #2211 fechada sem impl,
# cafe sem rebase desde 04/11 - ambos ainda NAO trazem a arch).
# Looped MoE TML: 24 blocos (os 12 centrais rodam 3x = 48 apps/token),
# 128 experts / 8 ativos, ctx nativo 1,048,576. head_dim 96 (2304/24) NAO e
# multiplo de 64 -> sem attn_rot -> KV q8_0/q8_0 (regra da casa, exige FA).
# Quant APEX-I-NanoPlus (IsValorum) NAO tem mmproj nem MTP no GGUF: text-only.
# Experts na host RAM via --n-cpu-moe 24; samplers do vendor TML (guia unsloth:
# temp 1.0, top-p 1.0, top-k 0, min-p 0). Lane de teste do dono, fora dos sets
# (exclusiva no solver, sem var/evict_cost - padrao de lane nova).
# RESOLVIDO 21/nov (dossie: ~/relatorios-frota/inkling-loop-buffer/): buffer CUDA
# de ~4.7GB no boot era op_offload default-true + sched_copy_experts copiando os
# pesos de experts das 12 layers do core pro CUDA0 MESMO COM ngl 0 — o override
# n-cpu-moe NAO impede a copia. Fix da lane: --no-op-offload.
# Lane HIBRIDA 64K: -ngl 99 (attention GPU) + -ncmoe 24 (experts host) + -nkvo
# (KV host q8) + --no-op-offload. Medido 21/nov via porta direta: decode 15.3
# t/s @4K, VRAM escada +24.6MB/1K ctx (4K=39%, 131K ngl99 = 91% NO GO).
# 64K = interpolado ~3.9GB (64%). Fallback CPU-only: CUDA_VISIBLE_DEVICES=""
# (remove -ngl/-nkvo, funciona a 131K a 10 t/s — receita no dossie).
# -------------------------------------------
inkling-2-mini:
  name: Inkling-2-Mini
  description: "Thinking Machines' small open-weights model: 26B parameters, 5.4B active, with looped layers for more computation per token."
  cmd: |
    ${llama_server} --port ${PORT}
    --model ${models_dir}/inkling-2-mini/Inkling-2-Mini-APEX-I-NanoPlus-V2.1.gguf
    --jinja
    -ngl 99
    --no-op-offload
    --n-cpu-moe 24
    -nkvo
    --ctx-size 65536
    --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0.0
    --repeat-penalty 1.0
    --cache-type-k q8_0 --cache-type-v q8_0
    --flash-attn auto
    --parallel 1
    --metrics
  filters:
    stripParams: temperature, top_p
  ttl: 300
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 65536
  metadata:
    size: "~10.98 GB"
    context: 65536
    source: "IsValorum/Inkling-2-Mini-APEX-I-NanoPlus-V2.1-GGUF, base thinkingmachines/Inkling-2-Mini da TML"
    kv_cache: "q8_0/q8_0"
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: inkling2_loop
    parameters: 26200000000
    context_length: 1048576
    embedding_length: 2304
    quantization: APEX-I-NanoPlus
    reasoningEfforts:
      off: none
      low: low
      medium: medium
      high: high
      xhigh: xhigh
    note: "Lane de teste do dono, 21/nov. Quant NanoPlus text-only do IsValorum: 0 tensors de visao e 0 nextn, portanto sem mmproj e sem draft. Arch inkling2_loop mergeada no vanilla pelo PR upstream 32694. Samplers do vendor TML. Gate real de frota segue ik/cafe, esta lane e vanilla e exclusiva no solver. Template tem reasoning_effort de none a max e float 0 a 0.99. Probe de tools PASSOU no fio da swap em 21/nov: finish_reason tool_calls com get_weather e argumentos validos — capabilities.tools true. BUG do op_offload RESOLVIDO com --no-op-offload (dossie completo em ~/relatorios-frota/inkling-loop-buffer/: op_offload default-true puxava copia de 4.7GB de pesos de experts do core pelo sched_copy_experts mesmo com ngl 0). Lane HIBRIDA 64K: ngl 99 + ncmoe 24 + nkvo q8/q8; headroom de 131K GPU e 91% NO GO, e de 131K host funciona so CPU-only a 10.1 t/s. Fallback CPU-only documentado no bloco de cabecalho. Visao re-adicionavel depois com mmproj-BF16 da unsloth de 0.6 GiB apos conferir interop do projector."
