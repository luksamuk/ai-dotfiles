# -------------------------------------------
# QWEN3.6-35B-A3B-HERETIC — PRODUCAO (cafe-llama.cpp Turbo KV)
# Uncensored oficial da frota: heretic do llmfan46 (KL 0.0015, 88% menos
# recusas), quant SC117 APEX-I-Compact com MTP nextn=1 preservado.
# Backend cafe-llama.cpp (quimmedes/Ark) com Turbo KV turbo4 — o unico
# backend que carrega o contexto nativo 262K na RTX 3050 6GB.
#
# Validado 24/set/2026: smoke 200 OK (7s, cold), vision via mmproj Q8 do
# heretic. RAM pinned ~15 GB (hmoe) — fechar apps pesados antes de usar.
#
# ARMADILHAS do fork (ler cafe-llama-cpp-eval.md antes de mexer):
#   - NUNCA --pipeline-parallel com ctx >=131K (buffer DMA 48GB → OOM duplo)
#   - turbo2 CRASHA na arch hibrida; turbo4 limpo
#   - MTP draft @262K nao cabe (draft KV 512MiB) — sem --spec-type aqui
#   - cafe NAO tem: --parallel-tool-calls, --no-graph-reuse, --defer-experts,
#     --prefetch-experts, --k/v-cache-hadamard, --fit-margin (usar --fit-target)
#   - RUNPATH do binario aponta p/ /tmp/cafe (morto) — env LD_LIBRARY_PATH
#     OBRIGATORIA no cmd (fix 24/set, smoke 200 OK)
# -------------------------------------------
"qwen3.6-35b-a3b-heretic-cafe":
  name: "Qwen 3.6 35B Heretic (Cafe 262K)"
  description: "Assistente de código sem censura, com visão e 262K de contexto — o maior da frota. Ideal para sessões longas de programação, refatoração de arquivos grandes e agentes que precisam de contexto inteiro. Roda em 6 GB de VRAM com cache Turbo KV."
  cmd: |
    env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}
    --model ${models_dir}/qwen36-heretic-apex-mini/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Mini.gguf
    --mmproj ${models_dir}/occamy-1.0/mmproj-Accio-Lab_occamy-1.0-Q8_0.gguf
    --ctx-size 262144
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --cache-type-k turbo4
    --cache-type-v turbo4
    --flash-attn on
    -hmoe
    -ngl 99
    -b 512
    -ub 128
    --temp ${code_temp}
    --top-p ${code_top_p}
    --top-k ${code_top_k}
    --min-p ${code_min_p}
    --repeat-penalty ${code_repeat_penalty}
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: "~14.66 GB (APEX-I-Compact, heretic) + 614 MB mmproj Q8"
    context: "262K nativo"
    vram_usage: "~5.1 GB VRAM (turbo4 KV) + ~15 GB pinned RAM (hmoe)"
    source: "SC117/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-GGUF (I-Compact) + mmproj unsloth Q8"
    kv_cache: "turbo4 (WHT-rotated, FA-fused)"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 34660000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX I-Compact
    note: "Produção Sep 24: café herdou o posto do ik-131K (menor pressão de VRAM/RAM, 262K nativo). Heretic KL 0.0015 (88% menos recusas). Sem MTP @262K (draft KV não cabe). Smoke 200 OK (7s)."
