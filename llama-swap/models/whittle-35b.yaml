whittle-35b:
  name: Whittle Qwen3.8 35B-A3B
  description: logic65 Whittle 35B — corpo Qwen3.6-35B podado (180 experts) reformatado
    p/ arch qwen4_exp (GDN+FA, hyper-connections) + tabela n-gram hashada 10B servida
    Q8_0. Distill logit do Qwen3.8-27B. Text-only, sem MTP, sem vision.
  tags:
  - think
  - tools
  cmd: env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server}
    --port ${PORT} --model ${models_dir}/whittle-35b/Whittle-Qwen-3.8-35B-A3B-ONYX-compact.gguf
    --ctx-size 131072 --jinja --parallel 1 --cache-type-k q4_0 --cache-type-v q4_0
    --flash-attn on -cmoe -ngl 99 -b 512 -ub 128 --lazy-mode off --temp 0.7 --top-p
    0.8 --top-k 20 --repeat-penalty 1.05 --reasoning-budget 8192 --metrics
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
      ${MODEL_ID}:think:
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.7
        top_p: 0.8
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in:
    - text
    out:
    - text
    tools: true
    reranker: false
    context: 131072
  metadata:
    size: ~21.9 GB (ONYX compact)
    context: 131072
    vram_usage: atencao/hyper-conn/shared na GPU; tabela+experts em page cache file-backed
      evictavel via -cmoe
    source: el4/Whittle-Qwen-3.8-35B-A3B-ONYX-GGUF (compact)
    kv_cache: q4_0/q4_0
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen4exp
    parameters: 35100000000
    context_length: 262144
    embedding_length: 2048
    quantization: ONYX compact
    note: 'Tabela n-gram = load-bearing (sem ela codigo +4.9 nats): ONYX manteve a
      tabela Q8_0 — nunca usar quant que droppa linhas. Sem MTP (zero nextn nos 1022
      tensores) e sem vision (sem mmproj). --lazy-mode off OBRIGATORIO (default auto
      le a tabela lazy do disco, -ot ignorado, prefill despenca — issue 28355). Sampler
      da autora: temp 0.7, top_p 0.8, top_k 20, rp 1.05 — greedy decodifica em loop
      nessa familia. Sem min_p (a receita nao usa).'
