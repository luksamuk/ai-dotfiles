lfm2.5-colbert-350m:
  name: LFM2.5 ColBERT 350M
  description: Liquid AI ColBERT reranker for RAG retrieval pipelines. CPU-only serving.
  env:
  - CUDA_VISIBLE_DEVICES=
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/LFM2.5-ColBERT-350M-Q8_0.gguf\n\
    --embeddings\n--pooling mean\n--ctx-size 512\n--cont-batching\n--parallel 4\n\
    --cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
  ttl: 300
  capabilities:
    in:
    - text
    out: []
    tools: false
    reranker: true
    context: 512
  metadata:
    architecture: lfm2-bidir
    parameters: 353000000
    context_length: 512
    embedding_length: 128
    quantization: Q8_0
    size: ~378 MB (Q8_0)
    vram_usage: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only)
    source: LiquidAI/LFM2.5-ColBERT-350M-GGUF (Q8_0)
    kv_cache: f16
    features:
      completion: false
      tools: false
      thinking: false
      vision: false
      embedding: true
      insert: false
      audio: false
      image: false
    note: Late-interaction model. OAI-compatible /v1/embeddings uses mean-pooled 128-dim
      vectors. For true MaxSim reranking, use raw /embedding endpoint for per-token
      vectors and compute MaxSim client-side. Asymmetric prompts from config_sentence_transformers.json.
      11 languages. Higher accuracy than dense (0.605 vs 0.577 NDCG@10) but larger
      index (per-token vectors).
