# -------------------------------------------
# QWEN3.5-4B-262K - DENSE 4B CTX MAXIMO (cafe-llama.cpp Turbo KV)
# Mesmo modelo/GGUF do qwen3.5-4b (ik_llama + hadamard KV), backend cafe-llama.cpp
# com Turbo KV + ngram-mod. A/B direto contra o prod 4B + contexto nativo dobrado.
#
# O QUE FOI MEDIDO (20/set, systemd-run direto na 3050 6GB):
#   MTP draft-mtp NAO CABE em nenhum ctx longo nesta GPU:
#     - draft compute buffer @131K = 556MB (escala c/ ctx, nao c/ ubatch;
#       -ub 64 nao muda) — OOM junto c/ model+KV+rs+draft-KV
#     - KV turbo4 @262K = 2112MB sozinho — inviavel
#   VENCEDOR: 262K + turbo2 + ngram-mod = 5.3GB total (desktop incl.)
#     - KV turbo2 @262K ~1.3GB | rs cache (GDN) ~804MB @262K
#     - ngram-mod = mesma familia de spec do prod (ngram), SEM draft
#       context (trabalha do KV do target) — por isso cabe
#   Smoke: base/'56' direto | :think 411c reasoning | decode ~41.5 t/s
#     (512 tok c/ prefill embutido; comparavel ao prod ~44)
#
# ESPPELHADO DO qwen3.5-4b (prod): dual-mode base/:think, ttl 60, samplers
#   default 0.7/0.9 (base) e 0.6/0.9 (think), mesmo template, mesmo
#   capabilities/metadata schema. Diferencas SÓ de backend (dialeto cafe):
#   sem --parallel-tool-calls, --no-graph-reuse, --k/v-cache-hadamard,
#   --fit-margin, --ctx-checkpoints, --reasoning on (ik-only); turbo2 no
#   lugar de q4_0+hadamard; --spec-type ngram-mod no lugar do ngram do ik.
#
# ARCH qwen35 (hybrid): 9 full-attn layers, head_dim 256 (mult. 128 —
#   turbo2/3/4 elegiveis), 24 GDN layers (rs cache ~3.2KB/token —
#   ORCAMENTO-CHAVE que o q36 nao tem; ver nota acima).
# nextn tensors PRESENTES (4, blk.32) mas MTP bloqueado por VRAM em ctx longo.
#
# ARMADILHAS cafe (cafe-llama-cpp-eval.md): pipeline-parallel PROIBIDO em
#   ctx >=131K (buffer DMA ~ctx); NAO usar --fit-margin (--fit-target).
#   turbo2 crashou no q36 (moe hibrida) @131K em geracao — NAO crashou
#   aqui (dense qwen35) em smoke+decode, mas e unica celula validada.
# -------------------------------------------
"qwen3.5-4b-262k":
  name: "Qwen3.5 4B (262K TurboKV)"
  description: "Same Qwen3.5-4B served by cafe-llama.cpp with Turbo KV (turbo2) and ngram-mod speculative decoding at its native 262K context — direct A/B against the production 4B (ik, q4_0+hadamard, 131K). Dense 4B fits entirely in VRAM even at 262K."
  cmd: |
    ${cafe_server} --port ${PORT}
    --model ${models_dir}/qwen3.5-4b-mtp/Qwen3.5-4B-UD-Q4_K_XL.gguf
    --ctx-size 262144
    --jinja
    --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
    --parallel 1
    --cache-type-k turbo2
    --cache-type-v turbo2
    --flash-attn on
    -ngl 99
    -b 512
    -ub 128
    --temp ${default_temp}
    --top-p ${default_top_p}
    --top-k ${default_top_k}
    --min-p ${default_min_p}
    --repeat-penalty ${default_repeat_penalty}
    --spec-type ngram-mod
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.9
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.9
  ttl: 60
  health_check_timeout: 300
  capabilities:
    in: ['text']
    out: ['text']
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: "~2.8 GB (UD-Q4_K_XL)"
    context: "262K"
    vram_usage: "~4.5GB VRAM @262K (model 2.8GB + turbo2 KV 1.3GB + rs cache 0.8GB + compute)"
    source: "unsloth/Qwen3.5-4B-GGUF (UD-Q4_K_XL)"
    kv_cache: "turbo2 (WHT-rotated, FA-fused)"
    features:
      completion: true
      tools: true
      thinking: true
      vision: false
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35
    parameters: 4210000000
    context_length: 262144
    embedding_length: 2560
    quantization: UD-Q4_K_XL
    note: "cafe-llama.cpp backend with turbo2 Turbo KV + ngram-mod at native 262K — mirror of qwen3.5-4b (ik_llama, q4_0+hadamard, ngram, 131K) for direct A/B. MTP draft does NOT fit on 6GB at long ctx (draft compute buffer 556MB @131K scales with ctx; turbo4 KV @262K = 2.1GB alone) — ngram-mod is the same spec family as prod and needs no draft context. Smoke 20/set: base/think/tool OK, ~41.5 t/s decode w/ prefill included. Vision off (matches prod 4B)."