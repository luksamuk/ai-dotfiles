# QWEN3-CODER-30B-A3B — baseline limpo de código no cafe-llama.cpp
# Espelho de config do qwen3.6-35b-a3b-heretic-cafe (mesmas flags do café):
# LD_LIBRARY_PATH obrigatória (RUNPATH morto), turbo4 KV, -hmoe, template
# embutido --jinja. Diferenças de família (LERCER que o irmão):
#   - text-only (sem mmproj)
#   - SEM --spec-type draft-mtp (arch qwen3_moe não tem nextn)
#   - SEM thinking (Instruct puro — sem enable_thinking nos filters)
#   - sampling do fabricante: 0.7/0.8/20
# Café NÃO aceita: --parallel-tool-calls, --no-graph-reuse, --defer-experts,
#   --prefetch-experts, --k/v-cache-hadamard, --fit-margin.
# NÃO usar --chat-template-file do heretic aqui: o Qwen3-Coder-30B (qwen3_moe)
#   NÃO compartilha o template do 3.6/35B — com o template herdado o modelo
#   emite EOG no 1º token (content vazio, predicted_n 1). --jinja embutido
#   resolve (fix Oct 2, smoke content correto). Pitfall registrado no
#   cafe-llama-cpp-eval.md.
