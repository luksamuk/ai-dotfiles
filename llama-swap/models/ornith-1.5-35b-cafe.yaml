# -------------------------------------------
# ORNITH-1.5-35B-CAFE — qwen35moe hibrida no cafe-llama.cpp
# O MESMO Ornith-1.5 (MoE 35B, 256 experts, 8+1 active, nextn=1) no motor cafe.
# Deploy espelhado no heretic-cafe (irmão arquitetural): -hmoe, template
# embutido --jinja, KV q4_0. Sem hadamard (exclusivo do ik), sem --fit
# (o cafe valida no load).
#
# 262K nativo com parallel 1: a arquitetura hibrida SSM+atencao so tem KV
# nas 10 layers de atencao full (full_attention_interval=4); as 31 gdn usam
# estado constante. ~1.5 GB q4_0 @262K. MTP mantido @262K (o heretic-cafe
# perdeu MTP @262K por parallel 2 — draft KV x 2 slots; com 1 slot cabe).
#
# Fallback ik: ornith-1.5-35b (131K). Cenário alvo: agentic coding @262K.
# Binario: cafe f8982d690 (fix CUDA MoE top-k 1a679828f, preserve_reasoning).
# -------------------------------------------
"ornith-1.5-35b-cafe":
  name: "Ornith 1.5 35B Cafe"
  description: "Ornith 1.5 35B (APEX-I-MiniPlus V2.1, qwen35moe hibrida SSM+atencao) no cafe-llama.cpp f8982d690. Deploy espelhado no heretic-cafe: -hmoe, template embutido, MTP mantido. 262K nativo com parallel 1 (KV so nas 10 layers full: ~1.5 GB q4_0). Fallback ik: ornith-1.5-35b."
  cmd: |
    env LD_LIBRARY_PATH=${env.HOME}/git/cafe-llama.cpp/build/bin ${cafe_server} --port ${PORT}
    --model ${models_dir}/ornith-1.5-35b-nano/Ornith-1.5-35B-A3B.APEX-I-MiniPlus-V2.1.gguf
    --mmproj ${models_dir}/ornith-1.5-35b-nano/mmproj-Q8_0.gguf
    --no-mmproj-offload
    --ctx-size 262144
    --jinja
    --parallel 1
    --cache-type-k q4_0
    --cache-type-v q4_0
    --flash-attn on
    -hmoe
    -ngl 99
    -b 512
    -ub 128
    --temp ${code_temp}
    --top-p ${code_top_p}
    --top-k ${code_top_k}
    --min-p ${code_min_p}
    --repeat-penalty ${code_repeat_penalty}
    --reasoning on
    --reasoning-budget 8192
    --spec-type mtp:n_max=1,p_min=0.0
    --metrics
  filters:
    stripParams: "temperature, top_p"
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.6
        top_p: 0.95
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true
        temperature: 0.6
        top_p: 0.95
  ttl: 900
  health_check_timeout: 900
  capabilities:
    in: ['text', 'image']
    out: ['text']
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: "~15.23 GB (APEX-I-MiniPlus V2.1) + 610 MB mmproj Q8"
    context: "1K-262K (nativo, parallel 1)"
    vram_usage: "a medir no smoke (esperado ~6-8 GB VRAM + ~15 GB RAM pinned -hmoe)"
    source: "IsValorum/Ornith-1.5-35B-A3B-APEX-I-NanoPlus-GGUF (APEX-I-MiniPlus V2.1)"
    kv_cache: "q4_0 nas 10 layers full-attention (~1.5 GB @262K); 31 layers gdn = estado constante"
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 35000000000
    context_length: 262144
    embedding_length: 2048
    quantization: "APEX-I-MiniPlus V2.1 (routers F32, head Q6_K, MTP embutido)"
    note: "Deploy planejado Sep 28 (aguardando GPU livre — usuario no laguna). MTP @262K com parallel 1. Sem --fit no cafe: loader valida no load."