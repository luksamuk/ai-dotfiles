laya:
  name: Laya (decision)
  description: System One decision model (ModernBERT 421M BF16). Serves POST /v1/systemone
    for laya-snake judge. Not a chat model.
  cmd: '${llama_server} --port ${PORT}

    --model ${models_dir}/decision-models/Laya-GGUF/Laya-BF16.gguf

    --ctx-size 8192

    --batch-size 512

    --ubatch-size 512

    --parallel 1

    --no-webui

    --metrics

    '
  filters:
    stripParams: temperature, top_p, top_k, min_p, repeat_penalty
  ttl: 3600
  health_check_timeout: 60
  capabilities:
    in:
    - text
    out:
    - text
    tools: false
    reranker: false
    context: 8192
  metadata:
    size: ~844 MB (BF16)
    context: 8192
    vram_usage: ~0.9 GB VRAM (model 0.8GB + compute)
    source: 'ggml-org/Laya-GGUF (BF16, official #29818 conversion)'
    kv_cache: n/a
    features:
      decision: true
      completion: false
      tools: false
      thinking: false
      vision: false
      image: false
      embedding: false
      insert: false
      audio: false
    architecture: modern-bert
    parameters: 421000000
    context_length: 8192
    embedding_length: 1024
    quantization: BF16
    note: 'Decision model (/v1/systemone: noul/choice/score). llama-swap v262+ roteia
      /v1/systemone nativo (issue #1195 fechada). Judge for laya-snake: noul risk
      questions, frame-relative state, answers.noul >= 0.15 margin gates the verdict.'
