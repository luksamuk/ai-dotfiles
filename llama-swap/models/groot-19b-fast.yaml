# -------------------------------------------
# GROOT-19B (fast) - ik_llama.cpp — lane fast proposital do cafe lane (mesmo modelo).
# Revival 15/nov: MiniPlus IsValorum (8.42 GB vs Q4_K_M ~12) libera o espaco que o
# antigo nao tinha: o UD-Q4_K_M morria @262K ("pico 5.22 GB e o draft estoura no
# prefill longo, 502/exit"); o MiniPlus + -cmoe (vs -ncmoe 34 do antigo) devolve
# os 14 layers de experts que ficavam no GPU. ALVO: 262144 NATIVO (escada descendo
# se o boot/estourar no prefill: 200000 -> 131072).
# MTP EMBED (blk.40.nextn): --spec-type mtp:n_max=1,p_min=0.0; o autor nao benchmarkou
# o spec — medir aceitacao no smoke (o antigo rodava mtp:n_max=1).
# KV q4_0 + hadamard (proven na familia qwen35moe/ik). defer/prefetch = estrategia mmap.
# Vision mmproj q8_0 (0.61) + --no-mmproj-offload = custo zero.
# Always-think (classe Fara): SEM reasoningEfforts; template enable_thinking.
# Samplers: card "precise coding" 0.6/0.95/20/min-p 0.0/rep 1.0 (espelho do cafe lane).
# -------------------------------------------
groot-19b-fast:
  name: Groot-19B-A3B (fast)
  description: The same Groot-19B-A3B lane served intentionally by ik_llama.cpp — aiming native 262K context with the lighter MiniPlus quant.
  cmd: '${ik_llama_server} --port ${PORT}

    --model ${models_dir}/groot-19b/Groot-19B-A3B-261023.APEX-I-MiniPlus-V2.1.gguf

    --mmproj ${models_dir}/groot-19b/mmproj-GrootTeam_Groot-19B-A3B-261023-q8_0.gguf

    --no-mmproj-offload

    --jinja

    -ngl 99

    -cmoe

    --spec-type mtp:n_max=1,p_min=0.0

    --ctx-size 262144

    --temp 0.6

    --top-p 0.95

    --top-k 20

    --min-p 0.0

    --repeat-penalty 1.0

    --reasoning-budget 8192

    --parallel 1

    --parallel-tool-calls

    --cache-type-k ${large_cache_k}

    --cache-type-v ${large_cache_v}

    --k-cache-hadamard

    --v-cache-hadamard

    --flash-attn auto

    --defer-experts

    --prefetch-experts

    -b 512

    -ub 128

    --metrics

    '
  filters:
    stripParams: temperature, top_p
    setParamsByID:
      ${MODEL_ID}:
        chat_template_kwargs:
          enable_thinking: true
  ttl: 0
  health_check_timeout: 900
  capabilities:
    in:
    - text
    - image
    out:
    - text
    tools: true
    reranker: false
    context: 262144
  metadata:
    size: ~8.42 GB + 0.61 GiB mmproj q8_0 (mesmos arquivos do cafe lane)
    context: 262144
    vram_usage: ~4 GB VRAM estimado @262K (a medir; o antigo estourava 5.22)
    source: IsValorum/Groot-19B-A3B-261023-APEX-I-MiniPlus-V2.1-GGUF (base GrootTeam/Groot-19B-A3B-261023)
    kv_cache: q4_0/q4_0 + hadamard
    features:
      completion: true
      tools: true
      thinking: true
      vision: true
      embedding: false
      insert: false
      audio: false
      image: false
    architecture: qwen35moe
    parameters: 19000000000
    context_length: 262144
    embedding_length: 2048
    quantization: APEX-I-MiniPlus
    note: 'Sem reasoningEfforts (always-think). MTP embed: card nao benchmarka spec — medir no fio. Escada: 262144 alvo; antigo UD estourava o DRAFT no prefill longo (502/exit) — se reproduzir, escada 200000/131072 no fragment + probe de prefill longo antes de qualquer redeclarar vitoria.'
