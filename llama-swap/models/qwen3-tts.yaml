qwen3-tts:
  name: Qwen3-TTS 0.6B
  description: Text-to-speech native (audio.cpp server, GGUF Q8_0 1.9GB) com voice cloning - biblioteca da casa via voice_presets. Voice library da casa (Lucas, Hermes, Drácula, Alucard, Batman, Bolso, Jarvis, Francisca, Thalita, Finch) via voice_presets. OpenAI-compatible /v1/audio/speech. Language codes por nome (portuguese, english...).
  tags:
  - tts
  proxy: http://127.0.0.1:${PORT}
  checkEndpoint: /health
  cmd: '${env.HOME}/git/audio.cpp/build/linux-cuda-release/bin/audiocpp_server

    --config ${env.HOME}/git/audio.cpp/server-qwen3tts.json

    --model-spec-override ${env.HOME}/git/audio.cpp/model_specs

    --port ${PORT} --host 127.0.0.1

    '
  cmdStop: pkill -f server-qwen3tts.json
  health_check_timeout: 300
  ttl: 300
  capabilities:
    in:
    - text
    out:
    - audio
    tools: false
    reranker: false
    context: 0
  metadata:
    size: 1.9 GB (qwen3-tts-12hz-0.6b-base-q8_0.gguf + config/tokenizer)
    context: 0
    vram_usage: ~1.1 GB VRAM (CUDA, q8_0)
    source: Qwen/Qwen3-TTS-12Hz-0.6B-Base via audio-cpp/audio.cpp-gguf
    kv_cache: n/a
    features:
      completion: false
      tools: false
      thinking: false
      vision: false
      embedding: false
      insert: false
      audio: true
      image: false
    architecture: qwen3-tts
    parameters: 600000000
    context_length: 0
    embedding_length: 0
    quantization: q8_0
    note: 'Aposentado o stack torch-direct/FastAPI (port 8880). 10 voice presets da casa (voice_ref + reference_text). Clone nativo ok via presets — o --voice-ref CLI puro travou (bug p/ reportar). Language por nome: portuguese/english/etc.'
    caveats:
    - Language codes por nome (portuguese) — NÃO pt-br (o pt-br é do kokoro)
    - server-fleet.json obsoleto (o multi-model num server só não roteia via swap)
    - Voz preset não-existente = fallback do modelo (voz default) — o UI lista só os válidos agora