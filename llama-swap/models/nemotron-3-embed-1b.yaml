nemotron-3-embed-1b:
  name: Nemotron 3 Embed 1B
  description: NVIDIA multilingual text embedding model optimized for retrieval and
    semantic similarity. 2048-dim mean-pooled vectors. SOTA at 1B scale across 34
    languages.
  env:
  - CUDA_VISIBLE_DEVICES=
  cmd: "${llama_server} --port ${PORT}\n--model ${models_dir}/nemotron-3-embed-1b/nemotron-3-embed-1b-Q8_0.gguf\n\
    --embeddings\n--pooling mean\n--ctx-size 4096\n--cont-batching\n--parallel 2\n\
    --cache-type-k f16\n--cache-type-v f16\n-ngl 0\n  --metrics\n"
  ttl: 300
  capabilities:
    in:
    - text
    out: []
    tools: false
    reranker: false
    context: 4096
  metadata:
    architecture: ministral3
    parameters: 1140000000
    context_length: 4096
    embedding_length: 2048
    quantization: Q8_0
    size: ~1.2 GB (Q8_0)
    vram_usage: CPU-only
    source: nvidia/Nemotron-3-Embed-1B-BF16 (converted Q8_0)
    kv_cache: f16
    features:
      completion: false
      tools: false
      thinking: false
      vision: false
      embedding: true
      insert: false
      audio: false
      image: false
    note: 'vram detalhe: ~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only) | -ngl
      0, ~0.1GB CUDA ctx overhead apenas Embedding-only model. Use /v1/embeddings
      endpoint. Prefix inputs with ''query: '' for queries and ''passage: '' for documents.
      34 languages. 2048-dim L2-normalized vectors. Supports dimension slicing (1024/512)
      with re-normalization. SOTA at 1B scale on MMTEB.'
