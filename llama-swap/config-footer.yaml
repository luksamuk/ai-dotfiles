    nbe4: nemotron-bolt-e4b  # NVIDIA Bolt E4B (Gemma 4 E4B pos-treino), 64K em Q4 por escolha do dono

  sets:
    # LLM pequeno + Vision + Embedding (gpt2 desativado 17/09, disk)
    small_vision: "(twp | lfm24) & (lfmcol | eg2)"

    # LLM pequeno + Embedding (sem vision)
    # +qpoll: FIM completion sobrevive ao ping-pong small_embed<->heavy (CPU-only,
    # custo zero de VRAM — sem isso, cada troca de lane despeja ele por nao ser membro)
    small_embed: "(twp | lfm24 | sp26 | nbe4) & (lfmcol | eg2) & qpfim"

    # LLM pequeno sozinho (sem vision, sem embedding obrigatório)
    small_only: "twp | lfm24 | sp26 | nbe4"  # 21/out 2026: neo4 + lfm26 aposentados (GGUFs deletados); twp + lfm24 restam

    # GPT-2 XL sozinho ou com embedding/reranker (~3.75GB, sem space pros médios)
    # gpt2xl_embed: "gpt2xl & (nemb | lfmcol)"  # DISABLED Oct 3 2026 - gpt2xl removido

    # Vision models (sozinhos ou com embedding/reranker)
    vision_only: "ocr | lfmvl3 | mcv35"
    vision_embed: "(ocr | lfmvl3 | mcv35) & (lfmcol | eg2)"

    # Modelos médios + Embedding/Reranker
    # g12: gemma4-12b  # REMOVED Sep 10 2026 — era o "ouvido" do m3 --ref-audio; Music 3 pausado, ref-audio não usado; fragment em _removed/
    # medium: REMOVIDO 21/out 2026 — a lane existia só para o laguna; com ele fora, o heavy cobre (lfm24 é MoE 24B/2.45B ativo, não precisa de lane "média"). Para ressuscitar: descomentar
    # medium: "(lfm24) & (lfmcol | eg2)" # k2 _disabled 16/out (pesos deletados); q36 REMOVED Oct 8 2026 — aposentado (user decision); qc30 REMOVED Oct 6 2026 — coder aposentado; g12p REMOVED Oct 1 — disk

    # Modelos pesados (offload) + Embedding/Reranker + CPU completion
    # qw38 removed Aug 2026 — model disabled
    # bonsai1 removed Aug 2026 — user request (reactivated as bonsai, Sep 2026)
    # bonsai/bonsai2 removed Sep 20 2026 — fragments em _disabled/, GGUFs deleted
    # glm removed Sep 09 2026 — see vars note
    # q38g removed Sep 20 2026 — 27B dense e estruturalmente offload-bound na 3050
    heavy: "(lfm24 | mcv35 | orn35 | q36) & (lfmcol | eg2) & qpfim"  # 21/out: os 4 pesados declarados juntos (pedido do dono) — laguna fora | 25/out: +qpfim (regressão: o rewrite derrubou o FIM do heavy; ping-pong coder<->35B medido no journal — restauro da intenção 16/out documentada no small_embed) | 25/out tarde: +qw38d (5º pesado, dense 27B) | 25/out fim: qw38d retirado (volto pra 4)

    # Papel query do sprach: sem set o solver trata bonsai2-9b como exclusivo e ele
    # evicta o embedding a cada request de RAG (ping-pong → HTTP 500).
    bs2_embed: "bs2 & (lfmcol | eg2)" # k2/k2p/k2fim _disabled 16/out (pesos deletados); q36 REMOVED Oct 8 2026 — aposentado; orn15 merged no heretic

    # Tradução (leve, cabe com embedding/reranker)
    # translate_embed removed (hmt uninstalled)
    translate_only: "tg"

    # External TTS (separate process, same GPU)
    tts_external: "ttsext"

    # Embedding/Reranker sozinho (RAG indexing, semantic search, reranking)
    # AND entre todos os CPU-only: coexistem (zero VRAM) — OR evitaria em ping-pong
    embed_only: "lfmemb & lfmcol & eg2"

    # Reranker sozinho (late-interaction reranking, CPU-only)
    rerank_only: "lfmcol"

    # Reranker + Embedding (two-stage retrieval: dense → rerank)
    rerank_embed: "lfmcol & (lfmemb | eg2)"

  # Custo de eviction (modelos mais caros pra recarregar = prioridade pra ficar)
  evict_costs:
    # MiniCPM-V 4.7: barato de recarregar (1B 2.2GB GPU; 35B MoE ~11GB RAM, page cache)
