    # matrix (fora de sets); judge do laya-snake; routing #1195 pending
    laya: laya
    julia: julia-1

  sets:
    # LLM pequeno + Vision + Embedding (gpt2 desativado 17/09, disk)
    small_vision: "(neo4 | lfm26 | twp | lfm24) & (nemb | lfmcol | eg2)"

    # LLM pequeno + Embedding (sem vision)
    # +qpoll: FIM completion sobrevive ao ping-pong small_embed<->heavy (CPU-only,
    # custo zero de VRAM — sem isso, cada troca de lane despeja ele por nao ser membro)
    small_embed: "(neo4 | lfm26 | twp | lfm24) & (nemb | lfmcol | eg2) & qpfim"

    # LLM pequeno sozinho (sem vision, sem embedding obrigatório)
    small_only: "neo4 | lfm26 | twp | lfm24"  # a1→neo4 Oct 12 2026 (a1 disk 124.4, neohorse 137.8 retoma)  # gpt2xl+man1 REMOVED Oct 3 2026 (disk); lfm24 entra Oct 13

    # GPT-2 XL sozinho ou com embedding/reranker (~3.75GB, sem space pros médios)
    # gpt2xl_embed: "gpt2xl & (nemb | lfmcol)"  # DISABLED Oct 3 2026 - gpt2xl removido

    # Vision models (sozinhos ou com embedding/reranker)
    vision_only: "ocr | lfmvl3 | mcv1 | mcv35"
    vision_embed: "(ocr | lfmvl3 | mcv1 | mcv35) & (nemb | lfmcol | eg2)"

    # Modelos médios + Embedding/Reranker
    # g12: gemma4-12b  # REMOVED Sep 10 2026 — era o "ouvido" do m3 --ref-audio; Music 3 pausado, ref-audio não usado; fragment em _removed/
    medium: "(lag) & (nemb | lfmcol | eg2)" # k2 _disabled 16/out (pesos deletados); q36 REMOVED Oct 8 2026 — aposentado (user decision); qc30 REMOVED Oct 6 2026 — coder aposentado; g12p REMOVED Oct 1 — disk

    # Modelos pesados (offload) + Embedding/Reranker + CPU completion
    # qw38 removed Aug 2026 — model disabled
    # bonsai1 removed Aug 2026 — user request (reactivated as bonsai, Sep 2026)
    # bonsai/bonsai2 removed Sep 20 2026 — fragments em _disabled/, GGUFs deleted
    # glm removed Sep 09 2026 — see vars note
    # q38g removed Sep 20 2026 — 27B dense e estruturalmente offload-bound na 3050
    heavy: "(lag) & (nemb | lfmcol | eg2)" # k2/k2p/k2fim _disabled 16/out (pesos deletados); q36 REMOVED Oct 8 2026 — aposentado; orn15 merged no heretic

    # Tradução (leve, cabe com embedding/reranker)
    # translate_embed removed (hmt uninstalled)
    translate_only: "tg"

    # External TTS (separate process, same GPU)
    tts_external: "ttsext"

    # Embedding/Reranker sozinho (RAG indexing, semantic search, reranking)
    # AND entre todos os CPU-only: coexistem (zero VRAM) — OR evitaria em ping-pong
    embed_only: "lfmemb & nemb & lfmcol & eg2"

    # Reranker sozinho (late-interaction reranking, CPU-only)
    rerank_only: "lfmcol"

    # Reranker + Embedding (two-stage retrieval: dense → rerank)
    rerank_embed: "lfmcol & (lfmemb | nemb | eg2)"

  # Custo de eviction (modelos mais caros pra recarregar = prioridade pra ficar)
  evict_costs:
    # MiniCPM-V 4.7: barato de recarregar (1B 2.2GB GPU; 35B MoE ~11GB RAM, page cache)
    mcv1: 2
    mcv35: 4
    # orn15: 9  # merged no heretic 05/10
    # glm: 9  # REMOVED Sep 09 2026 — model deleted
    q36: 9  # REATIVADO 20/out 2026
    # k2: 9  # _disabled 16/out (pesos deletados)
    # qc30: 7  # REMOVED Oct 06 2026
    # occ: 9  # REMOVED Sep 27 2026 — model deleted
    lag: 9
    # nex25: 9  # REMOVED Sep 10 2026
    # qw38: 7  # disabled Aug 2026 — Qwen3.8-27B removed
    # qw38p: 7  # removed Aug 30 2026 — Pollard superseded by bonsai-27b
    # q38g: 8  # removed Sep 20 2026
    # bonsai: 8  # removed Sep 20 2026
    # bonsai2: 9  # re-instalado Oct 10 2026 — handle inativo até bench; 27B denso denso = caro de recarregar
    neo4: 2  # DE VOLTA Oct 12 2026 — neohorse retomou (o assento e o custo)
    # a1: 2  # OUTDO Oct 12 2026 (régua disk fechada 124.4)
    # g4: 3  # REMOVED Sep 10 2026 — model deleted
    ttsext: 4
    ocr: 3
    # qwvl: 3  # REMOVED Sep 10 2026
    lfmvl3: 3
    # q4: 2  # removed Oct 11 2026 junto do modelo (aposentadoria qwen3.5-4b)
    # a1: 2  # OUTDO Oct 12 2026 — régua disk 124.4 fechada; neohorse retomou
    # q4x: 2  # disabled Sep 20 2026
    # lfm8: 2  # REMOVED Sep 10 2026
    lfm26: 2
    lfm24: 6  # LFM 24B: experts ~13.7GB RAM no -cmoe = reload caro (q4_k_xl lento de remmap); acima do k2p(7) abaixo do heavy 9? medio-alto
    # lfm24f: 6  # (o fast/challenger ik — mesmo custo de reload; fora dos sets, vivendo só no A/B)
    twp: 2
    # eq2: 2  # REMOVED Sep 10 2026
    # eq4: 3  # REMOVED Sep 10 2026
    qpfim: 1
    # g12p: 3  # REMOVED Oct 1 2026 — GGUF Pollard deletado (disk 95%)
    # gpt2: 1  # desativado 17/09 (disk; restore: _disabled)
    # gpt2xl: 3  # DISABLED Oct 3 2026 - gpt2xl removido
    # nomic: 1  # REMOVED Sep 10 2026
    lfmemb: 1
    nemb: 1
    eg2: 1
    lfmcol: 1
    tg: 2
    # Decision models (juizes /v1/systemone) - recarregam em ~2s, evictam primeiro
    laya: 1
    julia: 1
