    # Bonsai 1-bit disabled Aug 2026 — user request
    # bonsai1: bonsai-27b-1bit
    # neo4: neohorse-1-4b  # removed Oct 11 2026 — neohorse aposentado + GGUF fora; handle órfão crasha o config (matrix refs unknown model)
