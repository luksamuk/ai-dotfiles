# Hooks: ações na inicialização do llama-swap
# preload: carrega modelos síncronamente antes de aceitar requests
# Ideal para vLLM (startup lento = 30-90s sem warm-up)
# NOTA: preloads desabilitados temporariamente — ocupam GPU e bloqueiam swap pra SGLang
# Para reabilitar: descomente as linhas preload abaixo
hooks:
  on_startup:
    preload: []
      # - "qwen3.5-0.8b-vllm"
      # - "lfm2.5-1.2b-vllm"

# ============================================
# SWAP MATRIX (v202+)
# ============================================
# O solver determina automaticamente qual combinação de modelos
# pode rodar simultaneamente e quais descarregar quando necessário.
#
# ⚠️ REGRA CRÍTICA DE COEXISTÊNCIA:
# Embedding e reranker (nomic, lfmemb, lfmcol) são CPU-only (~0.5GB total)
# e NÃO consomem VRAM. Devem coexistir com QUALQUER LLM — leve ou pesado.
# Todos os sets que agrupam LLMs DEVEM incluir as vars de embedding/reranker
# no & (AND). Se uma var de embedding falta de um set, o solver trata
# o embedding e o LLM como mutuamente exclusivos, causando ping-pong
# de eviction (embedding evicta LLM cost 9+, LLM evicta embedding cost 1).
#
# Exemplo: heavy: "(qw36 | orn35) & (nomic | lfmemb | lfmcol)"
# Veja references/new-model-workflow.md §6 para detalhes completos.
# ============================================

matrix:
  vars:
    # Modelos pequenos
    q4: qwen3.5-4b
    q4a: qwen3.5-4b-abliterated
    # m5a: minicpm5-1b-agentic  # disabled
    lfm8: lfm2.5-8b-a1b
    lfm26: lfm2.5-2.6b
    # nb42: nanbeige4.2-3b  # disabled Aug 2026 — poor Portuguese
    # Empero Qwen3.8 distillations (upstream llama.cpp, qwen35 arch)
    eq2: empero-qwen3.8-2b
    eq4: empero-qwen3.8-4b
    # Pollard memory-fit Qwen2.5-Coder-1.5B (FIM, imatrix, CPU-only)
    qpoll: qwen2.5-coder-1.5b-pollard
    # Portal 2 personality cores (conversational, Q8_0, LFM2.5-350M)
    spc: portal-core-space
    fct: portal-core-fact
    adv: portal-core-adventure
    # inst: instella-moe-16b  # disabled
    # Vision
    ocr: glm-ocr
    # uocr: unlimited-ocr  # disabled Aug 2026 — unused
    qwvl: qwen3-vl-4b
    lfmvl3: lfm2.5-vl-3b
    # Modelos médios
    q9: qwen3.5-9b
    g4: gemma4-e2b
    # ling: ling-3.0-tiny  # disabled Aug 2026 — doom loop in Pi agentic bench
    # Pesados (offload)
    # aw: agentworld-35b  # disabled Aug 2026
    orn15: ornith-1.5-35b
    glm: glm-4.7-flash
    # Bonsai 1-bit disabled Aug 2026 — user request
    # bonsai1: bonsai-27b-1bit
    # Qwen3.8-27B dense 1-bit disabled Aug 2026 — too slow, user never uses
    # qw38: qwen3.8-27b
    # qw38p: qwen3.8-27b-pollard  # removed Aug 30 2026 — 2.75 tok/s, superseded by bonsai-27b (10x faster, same class)
    bonsai: bonsai-27b
    # Tradução
    tg: translategemma-4b
    # Português jurídico (Qwen3.5-9B LoRA, instruct)
    # athenas: athenas-symbiote-9b  # disabled
    # Audio
    # asr: qwen3-asr-0.6b  # disabled
    ttsext: qwen3-tts
    # Embedding
    nomic: nomic-embed-text-v2-moe
    lfmemb: lfm2.5-embedding-350m
    nemb: nemotron-3-embed-1b
    # Reranker (late-interaction, CPU-only)
    lfmcol: lfm2.5-colbert-350m

  sets:
    # LLM pequeno + Vision + Embedding
    small_vision: "(q4 | q4a | lfm8 | lfm26 | eq2 | eq4 | spc | fct | adv) & (nomic | lfmemb | nemb | lfmcol)"

    # LLM pequeno + Embedding (sem vision)
    small_embed: "(q4 | q4a | lfm8 | lfm26 | eq2 | eq4 | spc | fct | adv) & (nomic | lfmemb | nemb | lfmcol)"

    # LLM pequeno sozinho (sem vision, sem embedding obrigatório)
    small_only: "q4 | q4a | lfm8 | lfm26 | eq2 | eq4 | spc | fct | adv"

    # Vision models (sozinhos ou com embedding/reranker)
    vision_only: "ocr | qwvl | lfmvl3"
    vision_embed: "(ocr | qwvl | lfmvl3) & (nomic | lfmemb | nemb | lfmcol)"

    # Modelos médios + Embedding/Reranker
    medium: "(q9 | g4) & (nomic | lfmemb | nemb | lfmcol)"

    # Modelos pesados (offload) + Embedding/Reranker + CPU completion
    # qw38 removed Aug 2026 — model disabled
    # bonsai1 removed Aug 2026 — user request (reactivated as bonsai, Sep 2026)
    heavy: "(orn15 | glm | bonsai) & (nomic | lfmemb | nemb | lfmcol) & qpoll"

    # Tradução (leve, cabe com embedding/reranker)
    # translate_embed removed (hmt uninstalled)
    translate_only: "tg"

    # External TTS (separate process, same GPU)
    tts_external: "ttsext"

    # Embedding/Reranker sozinho (RAG indexing, semantic search, reranking)
    embed_only: "nomic & lfmemb & nemb & lfmcol"

    # Reranker sozinho (late-interaction reranking, CPU-only)
    rerank_only: "lfmcol"

    # Reranker + Embedding (two-stage retrieval: dense → rerank)
    rerank_embed: "lfmcol & (nomic | lfmemb | nemb)"

  # Custo de eviction (modelos mais caros pra recarregar = prioridade pra ficar)
  evict_costs:
    orn15: 9
    glm: 9
    # qw38: 7  # disabled Aug 2026 — Qwen3.8-27B removed
    # qw38p: 7  # removed Aug 30 2026 — Pollard superseded by bonsai-27b
    bonsai: 8
    q9: 4
    g4: 3
    ttsext: 4
    ocr: 3
    qwvl: 3
    lfmvl3: 3
    q4: 2
    q4a: 2
    lfm8: 2
    lfm26: 2
    eq2: 2
    eq4: 3
    qpoll: 1
    spc: 1
    fct: 2
    adv: 2
    nomic: 1
    lfmemb: 1
    nemb: 1
    lfmcol: 1
    tg: 2
