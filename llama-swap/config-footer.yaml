    orn35: 9  # 35B-A3B MoE (17GB) — recarregar é caro
    orn35f: 9  # o fast/challenger ik — mesmo GGUF, mesmo custo de reload
    flintf: 9  # 40B-A2.5B MoE 18.4GB, 16.1GB pinned no load — reload carissimo
    # qw38d: 7  # RETIRADO 25/out/2026
