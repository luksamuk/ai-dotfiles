    # k2fim: k2-horizon-3.7b-pollard-fim  # _disabled 16/out — pesos deletados (aperto SSD)
    # k2p: k2-horizon-3.7b-pollard  # _disabled 16/out — idem
    # k2: k2-horizon-36b  # _disabled 16/out — pasta k2-horizon-36b deletada
    # g12p: gemma4-12b-pollard  # REMOVED Oct 1 2026 — GGUF Pollard deletado (disk 95%); restore: mv _disabled/ → models/
    # GPT-2 124M — museum piece (2019 original, completion-only, ctx 1024)
    # gpt2: gpt-2-124m  # desativado 17/09 (disk; restore: _disabled)
    # gpt2xl: gpt-2-xl  # DISABLED Oct 3 2026 - GGUF deleted (pedido user); fragment em _disabled/; restore: descomentar + mv fragment
    # Manacá 1B Instruct — PT-BR do zero (LNCC × NII/LLM-jp), pesquisa experimental
    # man1: manaca-1b-instruct  # DISABLED Oct 3 2026 - GGUF deleted (pedido user); fragment em _disabled/; restore: descomentar + mv fragment
    # inst: instella-moe-16b  # disabled
    # Vision
    ocr: glm-ocr
    # uocr: unlimited-ocr  # disabled Aug 2026 — unused
    # qwvl: qwen3-vl-4b  # REMOVED Sep 10 2026 — GGUF deleted (A/B lfm2.5-vl-3b pendente pro enhance do H3); fragment em _removed/
